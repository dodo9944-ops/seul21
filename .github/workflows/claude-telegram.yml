name: Claude Code Telegram Notification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Telegram on push
        if: github.event_name == 'push'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=[seul21] Push to ${{ github.ref_name }} by ${{ github.actor }}: ${{ github.event.head_commit.message }}"

      - name: Send Telegram on PR
        if: github.event_name == 'pull_request'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=[seul21] PR: ${{ github.event.pull_request.title }} by ${{ github.actor }}"
