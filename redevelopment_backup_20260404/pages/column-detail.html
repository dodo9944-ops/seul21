<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칼럼 상세 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 전문가 칼럼 상세 내용을 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260901b">
    <style>
        .detail-wrap { max-width: 800px; margin: 0 auto; }
        .detail-header { margin-bottom: 32px; }
        .detail-header h1 {
            font-size: 28px; font-weight: 800; color: var(--gray-900);
            line-height: 1.4; margin-bottom: 16px; letter-spacing: -0.3px;
        }
        .detail-meta {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            font-size: 13px; color: var(--gray-500);
        }
        .detail-meta i { font-size: 12px; margin-right: 4px; color: var(--gray-400); }

        .author-card {
            display: flex; align-items: center; gap: 16px;
            padding: 20px 24px; background: var(--gray-50);
            border-radius: var(--radius); margin-bottom: 32px;
            border: 1px solid var(--gray-200);
        }
        .author-card .avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--accent-light); display: flex;
            align-items: center; justify-content: center;
            color: var(--accent); font-size: 22px; flex-shrink: 0;
        }
        .author-card .info { }
        .author-card .name { font-size: 16px; font-weight: 700; color: var(--gray-900); margin-bottom: 2px; }
        .author-card .role { font-size: 13px; color: var(--gray-500); }

        .detail-body { margin-bottom: 40px; }
        .detail-body p {
            font-size: 15px; line-height: 1.85; color: var(--gray-800);
            margin-bottom: 20px;
        }
        .detail-body p:last-child { margin-bottom: 0; }
        .detail-body strong { color: var(--gray-900); font-weight: 700; }

        .share-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 20px 0; border-top: 1px solid var(--gray-200);
            border-bottom: 1px solid var(--gray-200);
            margin-bottom: 48px;
        }
        .share-bar span { font-size: 13px; font-weight: 600; color: var(--gray-600); margin-right: 4px; }
        .share-btn {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--gray-200); background: var(--white);
            color: var(--gray-600); font-size: 16px; cursor: pointer;
            transition: all var(--transition);
        }
        .share-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

        .related-section h2 {
            font-size: 20px; font-weight: 800; margin-bottom: 20px;
            color: var(--gray-900);
        }
        .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .related-card {
            border: 1px solid var(--gray-200); border-radius: var(--radius);
            padding: 20px; cursor: pointer; transition: all 0.25s ease;
        }
        .related-card:hover { border-color: var(--gray-300); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .related-card h4 {
            font-size: 14px; font-weight: 700; color: var(--gray-900);
            margin-bottom: 8px; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .related-card .rc-author { font-size: 12px; color: var(--gray-500); }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 32px; font-size: 14px; font-weight: 600;
            color: var(--accent);
        }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .detail-header h1 { font-size: 22px; }
            .related-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-body">
    <div class="inner">
        <div class="detail-wrap" id="detailWrap">
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js"></script>
<script src="../assets/js/data-service.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(function() {
    function renderMarkdown(text) {
        // **bold** → <strong>bold</strong>
        return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    document.addEventListener('DOMContentLoaded', function() {
        const id = App.getParam('id');
        if (!id) { location.href = 'columns.html'; return; }

        const col = DataService.getById('columns', id);
        if (!col) {
            document.getElementById('detailWrap').innerHTML = `<div class="empty-state"><i class="fa-solid fa-exclamation-circle"></i><h3>칼럼을 찾을 수 없습니다</h3><p>삭제되었거나 존재하지 않는 칼럼입니다.</p><a href="columns.html" class="btn btn-outline btn-sm">목록으로 돌아가기</a></div>`;
            return;
        }

        // 조회수 증가
        DataService.update('columns', id, { views: (col.views || 0) + 1 });

        App.headTags(col.title, col.summary);

        // 본문 렌더링 (마크다운 bold 변환)
        const paragraphs = col.content.split('\n\n').map(p =>
            `<p>${renderMarkdown(p.replace(/\n/g, '<br>'))}</p>`
        ).join('');

        // 관련 칼럼 (같은 태그가 겹치는 칼럼)
        const allCols = DataService.getAll('columns').filter(c => c.id !== col.id);
        let related = [];
        if (col.tags && col.tags.length > 0) {
            related = allCols.filter(c =>
                c.tags && c.tags.some(t => col.tags.includes(t))
            ).slice(0, 3);
        }
        if (related.length === 0) {
            related = allCols.slice(0, 3);
        }

        const relatedHTML = related.length > 0 ? `
            <div class="related-section">
                <h2>관련 칼럼</h2>
                <div class="related-grid">
                    ${related.map(c => `
                        <div class="related-card" onclick="location.href='column-detail.html?id=${c.id}'">
                            <h4>${c.title}</h4>
                            <span class="rc-author">${c.author} · ${c.date}</span>
                        </div>
                    `).join('')}
                </div>
            </div>` : '';

        document.getElementById('detailWrap').innerHTML = `
            <div class="breadcrumb">
                <a href="../index.html">홈</a> <i class="fa-solid fa-chevron-right"></i>
                <a href="columns.html">전문가 칼럼</a> <i class="fa-solid fa-chevron-right"></i>
                <span>${col.title}</span>
            </div>
            <div class="detail-header">
                <h1>${col.title}</h1>
                <div class="detail-meta">
                    <span><i class="fa-regular fa-calendar"></i>${col.date}</span>
                    <span><i class="fa-regular fa-eye"></i>${App.comma(col.views + 1)}</span>
                </div>
            </div>
            <div class="author-card">
                <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
                <div class="info">
                    <div class="name">${col.author}</div>
                    <div class="role">${col.authorRole || ''}</div>
                </div>
            </div>
            <div class="detail-body">${paragraphs}</div>
            <div class="share-bar">
                <span>공유하기</span>
                <button class="share-btn" title="링크 복사" id="copyLink"><i class="fa-solid fa-link"></i></button>
                <button class="share-btn" title="카카오톡" id="shareKakao"><i class="fa-solid fa-comment"></i></button>
                <button class="share-btn" title="페이스북" id="shareFb"><i class="fa-brands fa-facebook-f"></i></button>
            </div>
            ${relatedHTML}
            <a href="columns.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> 칼럼 목록으로</a>
        `;

        // 공유 버튼
        document.getElementById('copyLink').addEventListener('click', function() {
            navigator.clipboard.writeText(location.href).then(() => App.toast('링크가 복사되었습니다.', 'success'));
        });
        document.getElementById('shareKakao').addEventListener('click', function() {
            App.toast('카카오톡 공유 기능은 준비 중입니다.', 'info');
        });
        document.getElementById('shareFb').addEventListener('click', function() {
            App.toast('페이스북 공유 기능은 준비 중입니다.', 'info');
        });
    });
})();
</script>
</body>
</html>
