<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매물 상세 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 매물 상세 정보를 확인하고 문의하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260901b">
    <style>
    .listing-hero { padding: 40px 0 0; }
    .listing-hero .type-badge { display: inline-flex; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
    .listing-hero h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--gray-900); }
    .listing-hero .price-big { font-size: 36px; font-weight: 900; color: var(--gray-900); margin-bottom: 4px; }
    .listing-hero .sub-info { font-size: 14px; color: var(--gray-500); }
    .section-block { margin-bottom: 40px; }
    .section-block h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--gray-900); }
    .listing-desc { font-size: 15px; color: var(--gray-700); line-height: 1.85; margin: 24px 0 32px; padding: 24px; background: var(--gray-50); border-radius: var(--radius); }
    .area-link-card { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border: 1px solid var(--gray-200); border-radius: var(--radius); margin-top: 16px; cursor: pointer; transition: all var(--transition); }
    .area-link-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
    .area-link-card .al-info h4 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .area-link-card .al-info span { font-size: 13px; color: var(--gray-500); }
    .area-link-card .al-arrow { font-size: 18px; color: var(--gray-400); }
    .inquiry-form { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 28px 24px; }
    .inquiry-form h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .inquiry-form .submit-btn { width: 100%; margin-top: 8px; }
    .related-section { margin-top: 48px; padding-top: 40px; border-top: 1px solid var(--gray-200); }
    .related-section h3 { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="inner">
    <div class="breadcrumb" id="breadcrumb"></div>
</div>

<div class="page-body">
    <div class="inner" id="detailContent"></div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js"></script>
<script src="../assets/js/data-service.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(function() {
    const id = App.getParam('id');
    if (!id) { location.href = 'listings.html'; return; }

    const listing = DataService.getById('listings', id);
    if (!listing) {
        document.getElementById('detailContent').innerHTML = '<div class="empty-state"><i class="fa-solid fa-exclamation-circle"></i><h3>매물 정보를 찾을 수 없습니다</h3><p>올바른 경로로 접속해주세요</p><a href="listings.html" class="btn btn-primary btn-md">매물 목록으로</a></div>';
        return;
    }

    // Breadcrumb
    document.getElementById('breadcrumb').innerHTML = `
        <a href="../index.html">홈</a>
        <i class="fa-solid fa-chevron-right"></i>
        <a href="listings.html">매물정보</a>
        <i class="fa-solid fa-chevron-right"></i>
        <span>${listing.areaName} ${listing.sizeType}</span>`;

    document.title = listing.areaName + ' ' + listing.sizeType + ' — 세울';

    const typeColors = {
        '입주권': 'background:var(--accent);color:#fff;',
        '분양권': 'background:var(--green);color:#fff;',
        '토지': 'background:var(--orange);color:#fff;',
        '매매': 'background:var(--gray-700);color:#fff;'
    };
    const typeStyle = typeColors[listing.type] || 'background:var(--accent);color:#fff;';

    // 구역 정보
    const area = DataService.getById('areas', listing.areaId);

    // 관련 매물 (같은 구역 or 같은 유형)
    const allListings = DataService.getAll('listings');
    const relatedListings = allListings.filter(l =>
        l.id !== listing.id && (l.areaId === listing.areaId || l.type === listing.type)
    ).slice(0, 3);

    document.getElementById('detailContent').innerHTML = `
        <div class="listing-hero">
            <span class="type-badge" style="${typeStyle}">${listing.type}</span>
            <h1>${listing.areaName} ${listing.sizeType}</h1>
            <div class="price-big">${listing.priceText}</div>
            <div class="sub-info">${listing.district} · ${listing.sizeType}${listing.floor ? ' · ' + listing.floor : ''}</div>
        </div>

        <div class="two-col-layout" style="margin-top:40px">
            <div class="detail-main">
                <div class="section-block">
                    <h3>매물 정보</h3>
                    <div class="tbl-wrap">
                        <table class="info-table">
                            <tr><th>구역명</th><td>${listing.areaName}</td></tr>
                            <tr><th>매물유형</th><td><span class="badge" style="${typeStyle}">${listing.type}</span></td></tr>
                            <tr><th>매매가</th><td style="font-weight:700;font-size:16px;color:var(--gray-900)">${listing.priceText}</td></tr>
                            <tr><th>면적</th><td>${listing.sizeType}</td></tr>
                            ${listing.floor ? '<tr><th>층수</th><td>' + listing.floor + '</td></tr>' : ''}
                            <tr><th>소재지</th><td>${listing.district}</td></tr>
                            <tr><th>상태</th><td><span class="badge badge-success">${listing.status}</span></td></tr>
                            <tr><th>등록일</th><td>${listing.createdAt}</td></tr>
                        </table>
                    </div>
                </div>

                <div class="section-block">
                    <h3>상세 설명</h3>
                    <div class="listing-desc">${listing.description}</div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                        ${(listing.tags || []).map(t => '<span class="tag">' + t + '</span>').join('')}
                    </div>
                </div>

                ${area ? `
                <div class="section-block">
                    <h3>구역 정보</h3>
                    <div class="area-link-card" onclick="location.href='area-detail.html?id=${area.id}'">
                        <div class="al-info">
                            <h4>${area.name}</h4>
                            <span>${area.district} ${area.dong} · ${area.stage} · 프리미엄 ${App.comma(area.premium)}만원</span>
                        </div>
                        <div class="al-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                </div>` : ''}
            </div>

            <aside class="detail-side">
                <div class="inquiry-form">
                    <h3><i class="fa-solid fa-envelope"></i> 매물 문의하기</h3>
                    <div class="form-group">
                        <label class="form-label">이름</label>
                        <input type="text" class="form-input" id="inqName" placeholder="이름을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label class="form-label">연락처</label>
                        <input type="tel" class="form-input" id="inqPhone" placeholder="010-0000-0000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">문의 내용</label>
                        <textarea class="form-textarea" id="inqContent" placeholder="매물에 대해 궁금한 점을 남겨주세요"></textarea>
                    </div>
                    <button class="btn btn-accent btn-lg submit-btn" id="submitInquiry">
                        <i class="fa-solid fa-paper-plane"></i> 문의 전송
                    </button>
                </div>
            </aside>
        </div>

        ${relatedListings.length > 0 ? `
        <div class="related-section">
            <h3>관련 매물 추천</h3>
            <div class="listing-grid">
                ${relatedListings.map(l => {
                    const tc = {
                        '입주권': 'var(--accent)',
                        '분양권': 'var(--green)',
                        '토지': 'var(--orange)',
                        '매매': 'var(--gray-700)'
                    };
                    return `
                    <div class="listing-card" style="cursor:pointer" onclick="location.href='listing-detail.html?id=${l.id}'">
                        <div class="listing-thumb">
                            <i class="fa-solid fa-building"></i>
                            <span class="lt-badge" style="background:${tc[l.type] || 'var(--accent)'}">${l.type}</span>
                        </div>
                        <div class="listing-body">
                            <div class="area">${l.areaName} · ${l.district}</div>
                            <h4>${l.sizeType}</h4>
                            <div class="price">${l.priceText}</div>
                            <div class="desc">${l.description.slice(0, 40)}...</div>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>` : ''}`;

    // 문의 전송
    document.getElementById('submitInquiry').addEventListener('click', function() {
        const name = document.getElementById('inqName').value.trim();
        const phone = document.getElementById('inqPhone').value.trim();
        const content = document.getElementById('inqContent').value.trim();

        if (!name || !phone || !content) {
            App.toast('모든 항목을 입력해주세요', 'error');
            return;
        }

        DataService.create('inquiries', {
            name,
            phone,
            email: '',
            type: '매물문의',
            title: listing.areaName + ' ' + listing.sizeType + ' 매물 문의',
            content: content,
            status: '접수',
            answer: '',
            date: new Date().toISOString().slice(0, 10),
            answeredAt: ''
        });

        App.toast('문의가 접수되었습니다. 빠른 시일 내 연락드리겠습니다.', 'success');
        document.getElementById('inqName').value = '';
        document.getElementById('inqPhone').value = '';
        document.getElementById('inqContent').value = '';
    });
})();
</script>
</body>
</html>
