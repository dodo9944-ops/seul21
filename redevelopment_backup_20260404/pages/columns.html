<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전문가 칼럼 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 분야 전문가들의 심층 분석 칼럼을 만나보세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .column-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 28px 24px 24px;
            transition: all 0.25s ease;
            cursor: pointer;
            display: flex; flex-direction: column;
        }
        .column-card:hover {
            border-color: var(--gray-300);
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }
        .column-card .author-row {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 16px;
        }
        .column-card .avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--accent-light); display: flex;
            align-items: center; justify-content: center;
            color: var(--accent); font-size: 18px; flex-shrink: 0;
        }
        .column-card .author-info { min-width: 0; }
        .column-card .author-name { font-size: 14px; font-weight: 700; color: var(--gray-900); }
        .column-card .author-role { font-size: 12px; color: var(--gray-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .column-card h3 {
            font-size: 17px; font-weight: 700; color: var(--gray-900);
            margin-bottom: 10px; line-height: 1.45;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .column-card .summary {
            font-size: 13px; color: var(--gray-500); line-height: 1.6;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
            flex: 1;
        }
        .column-card .card-bottom {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--gray-100);
            font-size: 12px; color: var(--gray-400);
        }
        .column-card .card-bottom i { margin-right: 3px; }
        .column-card .tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .tag-filter-bar {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 16px 0;
        }
        .tag-filter {
            padding: 6px 14px; border-radius: 20px; font-size: 12px;
            font-weight: 500; color: var(--gray-600);
            border: 1px solid var(--gray-200); background: var(--white);
            cursor: pointer; transition: all var(--transition);
            font-family: var(--font);
        }
        .tag-filter:hover { border-color: var(--gray-500); color: var(--gray-900); }
        .tag-filter.on { background: var(--gray-900); color: var(--white); border-color: var(--gray-900); }
        .result-info { font-size: 13px; color: var(--gray-500); margin-bottom: 20px; }
        .result-info strong { color: var(--accent); font-weight: 700; }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a> <i class="fa-solid fa-chevron-right"></i>
            <span>전문가 칼럼</span>
        </div>
        <h1>전문가 칼럼</h1>
        <p>재개발·재건축 분야 전문가들의 심층 분석과 인사이트를 만나보세요.</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">
        <div class="tag-filter-bar" id="tagFilterBar"></div>
        <div class="result-info" id="resultInfo"></div>
        <div class="card-grid-3" id="columnGrid"></div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js"></script>
<script src="../assets/js/data-service.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(function() {
    let currentPage = 1;
    let selectedTag = '전체';
    const pageSize = 6;

    function getAllTags() {
        const all = DataService.getAll('columns');
        const tagSet = new Set();
        all.forEach(c => { if (c.tags) c.tags.forEach(t => tagSet.add(t)); });
        return ['전체', ...Array.from(tagSet)];
    }

    function renderTagFilters() {
        const tags = getAllTags();
        const bar = document.getElementById('tagFilterBar');
        bar.innerHTML = tags.map(t =>
            `<button class="tag-filter${t === selectedTag ? ' on' : ''}" data-tag="${t}">${t}</button>`
        ).join('');
        bar.querySelectorAll('.tag-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                selectedTag = this.dataset.tag;
                currentPage = 1;
                renderTagFilters();
                load();
            });
        });
    }

    function load() {
        const filter = {};
        // 태그 필터링은 수동으로 처리
        let result;
        if (selectedTag === '전체') {
            result = DataService.query('columns', { sort: 'date:desc', page: currentPage, pageSize });
        } else {
            // 전체 불러와서 태그 필터링 후 수동 페이징
            const all = DataService.getAll('columns').filter(c => c.tags && c.tags.includes(selectedTag));
            const total = all.length;
            const totalPages = Math.ceil(total / pageSize);
            const paged = all.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            result = { data: paged, total, page: currentPage, pageSize, totalPages };
        }

        document.getElementById('resultInfo').innerHTML = `총 <strong>${result.total}</strong>건의 칼럼`;

        const grid = document.getElementById('columnGrid');
        if (result.data.length === 0) {
            grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fa-solid fa-pen-fancy"></i><h3>칼럼이 없습니다</h3><p>해당 태그의 칼럼이 없습니다.</p></div>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        grid.innerHTML = result.data.map(c => `
            <div class="column-card" onclick="location.href='column-detail.html?id=${c.id}'">
                <div class="author-row">
                    <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
                    <div class="author-info">
                        <div class="author-name">${c.author}</div>
                        <div class="author-role">${c.authorRole || ''}</div>
                    </div>
                </div>
                <h3>${c.title}</h3>
                <p class="summary">${c.summary}</p>
                <div class="tags-row">
                    ${(c.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
                <div class="card-bottom">
                    <span><i class="fa-regular fa-calendar"></i> ${c.date}</span>
                    <span><i class="fa-regular fa-eye"></i> ${App.comma(c.views)}</span>
                </div>
            </div>
        `).join('');

        App.renderPagination('pagination', result.totalPages, result.page, pg => {
            currentPage = pg;
            load();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        renderTagFilters();
        load();
    });
})();
</script>
</body>
</html>
