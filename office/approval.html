<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전자결재 - 세울엔지니어링 사무자동화시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/office.css">
</head>
<body>

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">SE</div>
      <div>
        <div class="logo-text">세울엔지니어링</div>
        <span class="logo-sub">사무자동화시스템</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-title">메인</div>
        <ul class="sidebar-menu">
          <li><a href="index.html"><i class="fas fa-chart-pie"></i> 대시보드</a></li>
        </ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">업무관리</div>
        <ul class="sidebar-menu">
          <li><a href="approval.html"><i class="fas fa-file-signature"></i> 전자결재 <span class="badge" id="approvalBadge">0</span></a></li>
          <li><a href="documents.html"><i class="fas fa-folder-open"></i> 문서관리</a></li>
          <li><a href="report.html"><i class="fas fa-clipboard-list"></i> 업무보고</a></li>
        </ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">근태/일정</div>
        <ul class="sidebar-menu">
          <li><a href="attendance.html"><i class="fas fa-clock"></i> 근태관리</a></li>
          <li><a href="calendar.html"><i class="fas fa-calendar-alt"></i> 일정관리</a></li>
        </ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">커뮤니티</div>
        <ul class="sidebar-menu">
          <li><a href="board.html"><i class="fas fa-comments"></i> 게시판</a></li>
          <li><a href="contacts.html"><i class="fas fa-address-book"></i> 주소록</a></li>
        </ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">설정</div>
        <ul class="sidebar-menu">
          <li><a href="mypage.html"><i class="fas fa-user-cog"></i> 마이페이지</a></li>
        </ul>
      </div>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="userAvatar">--</div>
      <div class="user-info">
        <div class="user-name" id="userName">-</div>
        <div class="user-role" id="userRole">-</div>
      </div>
      <button class="user-logout" onclick="Office.Auth.logout()" title="로그아웃"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main Content -->
  <div class="main-content">
    <header class="top-header">
      <div class="top-header-left">
        <button class="menu-toggle" onclick="Office.UI.toggleSidebar()"><i class="fas fa-bars"></i></button>
        <div class="breadcrumb">
          <a href="index.html">홈</a><span class="sep">/</span>
          <span>업무관리</span><span class="sep">/</span>
          <span class="current">전자결재</span>
        </div>
      </div>
      <div class="top-header-right">
        <span class="header-clock" id="headerClock">--:--:--</span>
        <button class="header-btn" onclick="Office.UI.toggleFullscreen()" title="전체화면"><i class="fas fa-expand"></i></button>
        <button class="header-btn" title="알림"><i class="fas fa-bell"></i><span class="notif-dot" id="notifDot"></span></button>
      </div>
    </header>

    <div class="page-content">
      <!-- Page Header -->
      <div class="page-header">
        <div class="page-header-actions">
          <h1><i class="fas fa-file-signature" style="color:var(--primary);margin-right:8px"></i>전자결재</h1>
          <a href="approval-write.html" class="btn btn-primary"><i class="fas fa-plus"></i> 새 결재 작성</a>
        </div>
      </div>

      <!-- Stat Cards -->
      <div class="stat-grid" id="statGrid">
        <div class="stat-card" onclick="filterByStatus('')">
          <div class="stat-icon blue"><i class="fas fa-file-alt"></i></div>
          <div class="stat-info"><h4>전체</h4><div class="stat-value" id="statTotal">0</div></div>
        </div>
        <div class="stat-card" onclick="filterByStatus('대기')">
          <div class="stat-icon yellow"><i class="fas fa-hourglass-half"></i></div>
          <div class="stat-info"><h4>대기</h4><div class="stat-value" id="statPending">0</div></div>
        </div>
        <div class="stat-card" onclick="filterByStatus('승인')">
          <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
          <div class="stat-info"><h4>승인</h4><div class="stat-value" id="statApproved">0</div></div>
        </div>
        <div class="stat-card" onclick="filterByStatus('반려')">
          <div class="stat-icon red"><i class="fas fa-times-circle"></i></div>
          <div class="stat-info"><h4>반려</h4><div class="stat-value" id="statRejected">0</div></div>
        </div>
      </div>

      <!-- Tabs & Search -->
      <div class="card">
        <div class="card-header" style="flex-wrap:wrap;gap:12px">
          <div class="tabs" id="statusTabs" style="border-bottom:none;margin-bottom:0">
            <button class="tab-btn active" data-status="">전체</button>
            <button class="tab-btn" data-status="대기">대기</button>
            <button class="tab-btn" data-status="승인">승인</button>
            <button class="tab-btn" data-status="반려">반려</button>
            <button class="tab-btn" data-status="임시저장">임시저장</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" class="form-control" id="searchInput" placeholder="제목, 기안자 검색..." style="width:220px">
            </div>
            <select class="form-control" id="typeFilter" style="width:140px">
              <option value="">전체</option>
              <option value="지출결의서">지출결의서</option>
              <option value="휴가신청서">휴가신청서</option>
              <option value="출장신청서">출장신청서</option>
              <option value="품의서">품의서</option>
              <option value="기안서">기안서</option>
            </select>
          </div>
        </div>

        <div class="card-body" style="padding:0">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="text-center" style="width:50px">번호</th>
                  <th style="width:100px">문서종류</th>
                  <th>제목</th>
                  <th style="width:80px">기안자</th>
                  <th style="width:100px">기안부서</th>
                  <th style="width:100px">기안일</th>
                  <th class="text-center" style="width:80px">상태</th>
                  <th class="text-center" style="width:50px">긴급</th>
                </tr>
              </thead>
              <tbody id="approvalTableBody">
              </tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state" style="display:none">
            <i class="fas fa-inbox"></i>
            <h3>결재 문서가 없습니다</h3>
            <p>조건에 맞는 결재 문서가 없습니다.</p>
          </div>
        </div>

        <div class="card-footer">
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="approvalDetailModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="modalTitle">결재 상세</h3>
      <button class="modal-close" onclick="Office.UI.closeModal('approvalDetailModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody">
    </div>
    <div class="modal-footer" id="modalFooter">
      <button class="btn btn-ghost" onclick="Office.UI.closeModal('approvalDetailModal')">닫기</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="assets/js/office-data.js"></script>
<script src="assets/js/office.js"></script>
<script>
(function() {
  Office.init();

  var currentStatus = '';
  var currentType = '';
  var currentSearch = '';
  var currentPage = 1;
  var pageSize = 10;

  function getStatusClass(status) {
    switch(status) {
      case '대기': return 'pending';
      case '승인': return 'approved';
      case '반려': return 'rejected';
      case '임시저장': return 'draft';
      default: return '';
    }
  }

  function getTypeTagClass(type) {
    switch(type) {
      case '지출결의서': return 'blue';
      case '휴가신청서': return 'green';
      case '출장신청서': return '';
      case '품의서': return 'red';
      case '기안서': return '';
      default: return '';
    }
  }

  function updateStats() {
    var stats = Office.Approval.getStats();
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statPending').textContent = stats.pending;
    document.getElementById('statApproved').textContent = stats.approved;
    document.getElementById('statRejected').textContent = stats.rejected;
  }

  function getFilteredData() {
    var data = Office.Approval.getAll(currentStatus || undefined);
    if (currentType) {
      data = data.filter(function(a) { return a.type === currentType; });
    }
    if (currentSearch) {
      var q = currentSearch.toLowerCase();
      data = data.filter(function(a) {
        return (a.title && a.title.toLowerCase().indexOf(q) !== -1) ||
               (a.requester && a.requester.toLowerCase().indexOf(q) !== -1);
      });
    }
    return data;
  }

  function renderTable() {
    var data = getFilteredData();
    var total = data.length;
    var totalPages = Math.max(1, Math.ceil(total / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * pageSize;
    var pageData = data.slice(start, start + pageSize);

    var tbody = document.getElementById('approvalTableBody');
    var emptyState = document.getElementById('emptyState');

    if (pageData.length === 0) {
      tbody.innerHTML = '';
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      var html = '';
      for (var i = 0; i < pageData.length; i++) {
        var a = pageData[i];
        var num = total - start - i;
        var tagClass = getTypeTagClass(a.type);
        var statusClass = getStatusClass(a.status);
        html += '<tr style="cursor:pointer" onclick="showDetail(\'' + a.id + '\')">' +
          '<td class="text-center">' + num + '</td>' +
          '<td><span class="tag' + (tagClass ? ' ' + tagClass : '') + '">' + (a.type || '-') + '</span></td>' +
          '<td><span class="truncate" style="display:block;max-width:300px">' + (a.title || '-') + '</span></td>' +
          '<td>' + (a.requester || '-') + '</td>' +
          '<td>' + (a.requesterDept || '-') + '</td>' +
          '<td>' + Office.UI.formatDate(a.createdAt) + '</td>' +
          '<td class="text-center"><span class="badge-status ' + statusClass + '">' + (a.status || '-') + '</span></td>' +
          '<td class="text-center">' + (a.priority === '긴급' ? '<span style="color:var(--danger);font-weight:700"><i class="fas fa-exclamation-triangle"></i></span>' : '') + '</td>' +
          '</tr>';
      }
      tbody.innerHTML = html;
    }

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    var el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    var html = '<button' + (currentPage === 1 ? ' disabled' : '') + ' onclick="goPage(' + (currentPage - 1) + ')"><i class="fas fa-chevron-left"></i></button>';
    for (var i = 1; i <= totalPages; i++) {
      html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }
    html += '<button' + (currentPage === totalPages ? ' disabled' : '') + ' onclick="goPage(' + (currentPage + 1) + ')"><i class="fas fa-chevron-right"></i></button>';
    el.innerHTML = html;
  }

  window.goPage = function(p) { currentPage = p; renderTable(); };

  window.filterByStatus = function(status) {
    currentStatus = status;
    currentPage = 1;
    var btns = document.querySelectorAll('#statusTabs .tab-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].getAttribute('data-status') === status);
    }
    renderTable();
  };

  // Tab click
  var tabBtns = document.querySelectorAll('#statusTabs .tab-btn');
  for (var i = 0; i < tabBtns.length; i++) {
    tabBtns[i].addEventListener('click', function() {
      filterByStatus(this.getAttribute('data-status'));
    });
  }

  // Search
  document.getElementById('searchInput').addEventListener('input', function() {
    currentSearch = this.value.trim();
    currentPage = 1;
    renderTable();
  });

  // Type filter
  document.getElementById('typeFilter').addEventListener('change', function() {
    currentType = this.value;
    currentPage = 1;
    renderTable();
  });

  // Show detail modal
  window.showDetail = function(id) {
    var a = Office.Approval.getById(id);
    if (!a) return;

    document.getElementById('modalTitle').textContent = a.title || '결재 상세';

    // Build approval flow
    var flowHtml = '<div class="approval-flow">';
    if (a.approvalLine) {
      for (var i = 0; i < a.approvalLine.length; i++) {
        var step = a.approvalLine[i];
        var stepClass = '';
        if (step.status === '요청' || step.status === '승인') stepClass = 'done';
        else if (step.status === '대기') stepClass = 'current';
        else if (step.status === '반려') stepClass = 'rejected';

        if (i > 0) {
          var arrowClass = (step.status === '승인' || step.status === '요청') ? 'done' : '';
          flowHtml += '<div class="approval-arrow' + (arrowClass ? ' ' + arrowClass : '') + '"></div>';
        }
        var icon = '';
        if (step.status === '승인') icon = '<i class="fas fa-check"></i>';
        else if (step.status === '반려') icon = '<i class="fas fa-times"></i>';
        else if (step.status === '대기') icon = '<i class="fas fa-hourglass-half"></i>';
        else icon = step.name.slice(-2);

        flowHtml += '<div class="approval-step ' + stepClass + '">' +
          '<div class="step-avatar">' + icon + '</div>' +
          '<div class="step-name">' + step.name + '</div>' +
          '<div class="step-role">' + step.position + '</div>' +
          '</div>';
      }
    }
    flowHtml += '</div>';

    var bodyHtml = '<div style="margin-bottom:20px">' +
      '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;font-size:13px">' +
      '<div><span class="text-muted">문서종류</span><div style="margin-top:4px;font-weight:600">' + (a.type || '-') + '</div></div>' +
      '<div><span class="text-muted">상태</span><div style="margin-top:4px"><span class="badge-status ' + getStatusClass(a.status) + '">' + (a.status || '-') + '</span></div></div>' +
      '<div><span class="text-muted">기안자</span><div style="margin-top:4px;font-weight:600">' + (a.requester || '-') + ' (' + (a.requesterDept || '-') + ')</div></div>' +
      '<div><span class="text-muted">기안일</span><div style="margin-top:4px;font-weight:600">' + Office.UI.formatDateTime(a.createdAt) + '</div></div>' +
      (a.amount ? '<div><span class="text-muted">금액</span><div style="margin-top:4px;font-weight:600">' + Office.UI.formatNumber(a.amount) + '원</div></div>' : '') +
      '<div><span class="text-muted">긴급여부</span><div style="margin-top:4px;font-weight:600">' + (a.priority === '긴급' ? '<span style="color:var(--danger)"><i class="fas fa-exclamation-triangle"></i> 긴급</span>' : '일반') + '</div></div>' +
      '</div></div>';

    bodyHtml += '<div style="margin-bottom:20px"><div class="text-muted text-sm mb-8">결재선</div>' + flowHtml + '</div>';

    bodyHtml += '<div style="margin-bottom:20px"><div class="text-muted text-sm mb-8">내용</div>' +
      '<div style="background:var(--gray-50);border-radius:var(--radius);padding:16px;font-size:13.5px;line-height:1.8;white-space:pre-wrap">' + (a.content || '-') + '</div></div>';

    if (a.comment) {
      bodyHtml += '<div style="margin-bottom:20px"><div class="text-muted text-sm mb-8">결재 의견</div>' +
        '<div style="background:var(--gray-50);border-radius:var(--radius);padding:16px;font-size:13.5px;line-height:1.8">' + a.comment + '</div></div>';
    }

    if (a.attachments) {
      bodyHtml += '<div><div class="text-muted text-sm mb-8">첨부파일</div>' +
        '<div style="font-size:13px;color:var(--gray-600)"><i class="fas fa-paperclip" style="margin-right:6px"></i>' + a.attachments + '개 파일</div></div>';
    }

    // If pending, show approve/reject form
    if (a.status === '대기') {
      bodyHtml += '<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--gray-200)">' +
        '<div class="form-group"><label>결재 의견</label>' +
        '<textarea class="form-control" id="approvalComment" placeholder="의견을 입력하세요 (선택사항)" rows="3"></textarea></div>' +
        '</div>';
    }

    document.getElementById('modalBody').innerHTML = bodyHtml;

    // Footer buttons
    var footerHtml = '';
    if (a.status === '대기') {
      footerHtml = '<button class="btn btn-ghost" onclick="Office.UI.closeModal(\'approvalDetailModal\')">닫기</button>' +
        '<button class="btn btn-danger" onclick="rejectApproval(\'' + a.id + '\')"><i class="fas fa-times"></i> 반려</button>' +
        '<button class="btn btn-success" onclick="approveApproval(\'' + a.id + '\')"><i class="fas fa-check"></i> 승인</button>';
    } else {
      footerHtml = '<button class="btn btn-ghost" onclick="Office.UI.closeModal(\'approvalDetailModal\')">닫기</button>';
    }
    document.getElementById('modalFooter').innerHTML = footerHtml;

    Office.UI.showModal('approvalDetailModal');
  };

  window.approveApproval = function(id) {
    var comment = document.getElementById('approvalComment') ? document.getElementById('approvalComment').value.trim() : '';
    Office.Approval.approve(id, comment);
    Office.UI.closeModal('approvalDetailModal');
    Office.UI.showToast('결재가 승인되었습니다.', 'success');
    updateStats();
    renderTable();
    // Update badge
    var badge = document.getElementById('approvalBadge');
    if (badge) { var c = Office.Approval.getStats().pending; badge.textContent = c; if (c === 0) badge.style.display = 'none'; else badge.style.display = ''; }
  };

  window.rejectApproval = function(id) {
    var comment = document.getElementById('approvalComment') ? document.getElementById('approvalComment').value.trim() : '';
    if (!comment) {
      Office.UI.showToast('반려 시 의견을 입력해주세요.', 'error');
      document.getElementById('approvalComment').focus();
      return;
    }
    Office.Approval.reject(id, comment);
    Office.UI.closeModal('approvalDetailModal');
    Office.UI.showToast('결재가 반려되었습니다.', 'error');
    updateStats();
    renderTable();
    var badge = document.getElementById('approvalBadge');
    if (badge) { var c = Office.Approval.getStats().pending; badge.textContent = c; if (c === 0) badge.style.display = 'none'; else badge.style.display = ''; }
  };

  // Close modal on overlay click
  document.getElementById('approvalDetailModal').addEventListener('click', function(e) {
    if (e.target === this) Office.UI.closeModal('approvalDetailModal');
  });

  // Init
  updateStats();
  renderTable();
})();
</script>

</body>
</html>
