<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 세울엔지니어링 사무자동화시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/office.css">
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon"><i class="fas fa-building"></i></div>
      <h1>세울엔지니어링</h1>
      <p>사무자동화시스템 (OA System)</p>
    </div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" class="form-control" placeholder="아이디를 입력하세요" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <div style="position:relative">
          <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required style="padding-right:44px">
          <button type="button" id="togglePw" onclick="togglePassword()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;padding:4px;font-size:15px" title="비밀번호 표시/숨기기"><i class="fas fa-eye"></i></button>
        </div>
      </div>

      <div class="form-check" style="margin-bottom:24px">
        <input type="checkbox" id="keepLogin">
        <label for="keepLogin" style="margin-bottom:0;font-weight:500;cursor:pointer">로그인 상태 유지</label>
      </div>

      <div id="loginError" style="display:none;background:var(--danger-bg);color:#B91C1C;padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:8px">
        <i class="fas fa-exclamation-circle"></i>
        <span id="loginErrorMsg">아이디 또는 비밀번호가 올바르지 않습니다.</span>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> 로그인
      </button>
    </form>

    <div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--gray-200);text-align:center">
      <p style="font-size:12px;color:var(--gray-400);margin-bottom:6px">테스트 계정</p>
      <p style="font-size:13px;color:var(--gray-600);font-weight:600">admin / admin1234</p>
    </div>

    <div style="text-align:center;margin-top:24px">
      <p style="font-size:11px;color:var(--gray-400)">&copy; 2026 세울엔지니어링. All rights reserved.</p>
    </div>
  </div>
</div>

<script src="assets/js/office-data.js"></script>
<script src="assets/js/office.js"></script>
<script>
(function() {
  Office.Storage.init();
  if (Office.Auth.isLoggedIn()) {
    location.href = 'index.html';
    return;
  }
})();

var loginError = document.getElementById('loginError');
loginError.style.display = 'none';

function togglePassword() {
  var pw = document.getElementById('password');
  var icon = document.getElementById('togglePw').querySelector('i');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    pw.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

function handleLogin(e) {
  e.preventDefault();
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var errorEl = document.getElementById('loginError');
  var errorMsg = document.getElementById('loginErrorMsg');

  if (!username || !password) {
    errorEl.style.display = 'flex';
    errorMsg.textContent = '아이디와 비밀번호를 모두 입력하세요.';
    return false;
  }

  var result = Office.Auth.login(username, password);
  if (result.success) {
    errorEl.style.display = 'none';
    location.href = 'index.html';
  } else {
    errorEl.style.display = 'flex';
    errorMsg.textContent = result.message || '아이디 또는 비밀번호가 올바르지 않습니다.';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
  return false;
}
</script>

</body>
</html>
