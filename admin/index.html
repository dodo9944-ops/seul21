<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1a33" />
  <title>관리자 | 세울엔지니어링</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .admin-wrap { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, var(--navy-900), var(--navy-700)); padding: 40px 20px; padding-top: calc(40px + var(--safe-top)); padding-bottom: calc(40px + var(--safe-bottom)); }
    .admin-card { width: 100%; max-width: 420px; background: rgba(255,255,255,0.04); border: 1px solid rgba(200,163,90,0.25); border-radius: 16px; padding: 40px 32px; backdrop-filter: blur(12px); color: var(--ivory); }
    .admin-card h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin: 0 0 6px; color: var(--gold-400); text-align: center; }
    .admin-card p  { text-align: center; color: rgba(246,241,230,0.7); margin: 0 0 28px; font-size: 14px; }
    .admin-form   { display: grid; gap: 14px; }
    .admin-form label { font-size: 12px; letter-spacing: 0.1em; color: var(--gold-300); text-transform: uppercase; }
    .admin-form input { padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(200,163,90,0.3); background: rgba(0,0,0,0.25); color: var(--ivory); font: inherit; }
    .admin-form input:focus { outline: none; border-color: var(--gold-400); }
    .admin-foot { text-align: center; margin-top: 22px; font-size: 12px; color: rgba(246,241,230,0.5); }
    .admin-foot a { color: var(--gold-400); }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-card">
      <h1>SEUL Admin</h1>
      <p>관리자 전용 콘솔입니다.</p>
      <form class="admin-form" onsubmit="event.preventDefault(); alert('데모 환경입니다. 백엔드 연동 후 활성화됩니다.');">
        <div>
          <label>아이디</label>
          <input type="text" name="id" required />
        </div>
        <div>
          <label>비밀번호</label>
          <input type="password" name="pw" required />
        </div>
        <button class="btn btn--gold btn--lg" type="submit">로그인</button>
      </form>
      <div class="admin-foot">
        <a href="../index.html">← 홈으로</a>
      </div>
    </div>
  </div>
</body>
</html>
