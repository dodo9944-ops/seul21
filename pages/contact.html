<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1a33" />
  <title>문의 | 세울엔지니어링</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="nav" id="topNav">
    <div class="nav__inner">
      <a href="../index.html" class="brand">
        <span class="brand__mark">S</span>
        <span class="brand__text"><strong>SEUL</strong><em>ENGINEERING</em></span>
      </a>
      <nav class="nav__menu">
        <a href="about.html">회사소개</a>
        <a href="services.html">서비스</a>
        <a href="projects.html">프로젝트</a>
        <a href="contact.html">문의</a>
      </nav>
      <a href="contact.html" class="btn btn--gold btn--sm">견적 문의</a>
    </div>
  </header>

  <section class="page-hero">
    <span class="eyebrow">Contact</span>
    <h1>프로젝트 상담</h1>
    <p>24시간 내 담당 기술사가 직접 회신드립니다.</p>
  </section>

  <section class="content">
    <div class="container">
      <form class="form" autocomplete="off">
        <div>
          <label for="name">이름 / 회사명</label>
          <input id="name" name="name" required />
        </div>
        <div>
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div>
          <label for="phone">연락처</label>
          <input id="phone" name="phone" type="tel" />
        </div>
        <div>
          <label for="type">문의 유형</label>
          <select id="type" name="type">
            <option>구조 설계</option>
            <option>플랜트 EPC</option>
            <option>감리 · 컨설팅</option>
            <option>스마트 O&amp;M</option>
            <option>기타</option>
          </select>
        </div>
        <div>
          <label for="msg">상세 내용</label>
          <textarea id="msg" name="msg" required></textarea>
        </div>
        <button class="btn btn--gold btn--lg" type="submit">문의 보내기</button>
      </form>
    </div>
  </section>

  <nav class="mobile-nav">
    <a href="../index.html" class="mobile-nav__item"><span class="mobile-nav__ico">⌂</span><span>홈</span></a>
    <a href="services.html" class="mobile-nav__item"><span class="mobile-nav__ico">✦</span><span>서비스</span></a>
    <a href="projects.html" class="mobile-nav__item"><span class="mobile-nav__ico">◧</span><span>프로젝트</span></a>
    <a href="tel:020000000" class="mobile-nav__item"><span class="mobile-nav__ico">☏</span><span>전화</span></a>
    <a href="contact.html" class="mobile-nav__item mobile-nav__item--accent is-active"><span class="mobile-nav__ico">✉</span><span>문의</span></a>
  </nav>
  <script src="../assets/js/main.js"></script>
</body>
</html>
