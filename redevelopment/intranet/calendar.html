<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정관리 — (주)빛세움</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F5F6F8; --white:#fff; --dark:#0A0F1C; --navy:#142644; --gold:#B8860B;
  --gray-50:#F9F9F9; --gray-100:#F3F3F3; --gray-200:#E5E5E5; --gray-300:#D1D1D1;
  --gray-400:#AAA; --gray-500:#888; --gray-600:#666; --gray-700:#444; --gray-900:#1A1A1A;
  --font:'Noto Sans KR',-apple-system,sans-serif; --radius:12px; --radius-sm:8px;
  --shadow:0 1px 4px rgba(0,0,0,0.06); --shadow-hover:0 8px 24px rgba(0,0,0,0.08);
  --transition:0.2s ease;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--gray-900);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
button,input,select,textarea{font-family:inherit}

/* ══════════ SIDEBAR ══════════ */
.sidebar{
  width:260px; min-height:100vh; background:var(--dark); padding:0;
  display:flex; flex-direction:column; flex-shrink:0; position:fixed; left:0; top:0; bottom:0; z-index:100;
}
.sidebar-logo{
  padding:24px 24px 20px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.sidebar-logo svg{width:32px;height:32px;flex-shrink:0}
.sidebar-logo-text{display:flex;flex-direction:column}
.sidebar-logo-company{font-size:14px;font-weight:800;color:#fff}
.sidebar-logo-sub{font-size:8px;font-weight:500;color:rgba(255,255,255,0.35);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.sidebar-badge{
  margin:16px 20px 12px; padding:6px 12px; border-radius:4px;
  background:rgba(184,134,11,0.1); color:var(--gold);
  font-size:10px; font-weight:700; letter-spacing:1px; text-align:center;
}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-group{margin-bottom:8px}
.nav-group-label{
  padding:8px 24px 6px; font-size:10px; font-weight:700; color:rgba(255,255,255,0.25);
  letter-spacing:1.5px; text-transform:uppercase;
}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 24px;
  font-size:13px; font-weight:500; color:rgba(255,255,255,0.5);
  transition:all var(--transition); cursor:pointer; border-left:3px solid transparent;
}
.nav-item:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.04)}
.nav-item.active{color:#fff;background:rgba(255,255,255,0.06);border-left-color:var(--gold)}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item .nav-badge{
  margin-left:auto; font-size:10px; font-weight:700; padding:2px 7px;
  border-radius:10px; background:var(--gold); color:var(--dark);
}
.sidebar-footer{
  padding:16px 24px; border-top:1px solid rgba(255,255,255,0.06);
  display:flex; align-items:center; gap:10px;
}
.sidebar-footer .avatar{
  width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold);
}
.sidebar-footer .user-info{flex:1;min-width:0}
.sidebar-footer .user-name{font-size:12px;font-weight:700;color:#fff}
.sidebar-footer .user-role{font-size:10px;color:rgba(255,255,255,0.35)}
.sidebar-footer .logout-btn{
  width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:rgba(255,255,255,0.3);font-size:13px;cursor:pointer;transition:all var(--transition);
}
.sidebar-footer .logout-btn:hover{color:#fff;background:rgba(255,255,255,0.06)}

/* ══════════ MAIN ══════════ */
.main{margin-left:260px;flex:1;min-width:0}
.topbar{
  height:60px; background:var(--white); border-bottom:1px solid var(--gray-200);
  display:flex; align-items:center; padding:0 32px; gap:16px; position:sticky; top:0; z-index:50;
}
.topbar-title{font-size:18px;font-weight:800;letter-spacing:-0.3px;flex:1}
.topbar-search{
  display:flex; align-items:center; gap:8px; padding:8px 16px;
  background:var(--gray-50); border:1px solid var(--gray-200); border-radius:var(--radius-sm);
  width:280px; transition:border-color var(--transition);
}
.topbar-search:focus-within{border-color:var(--gold)}
.topbar-search i{color:var(--gray-400);font-size:13px}
.topbar-search input{border:none;outline:none;background:none;font-size:13px;color:var(--gray-900);width:100%}
.topbar-search input::placeholder{color:var(--gray-400)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.topbar-icon{
  width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--gray-600);font-size:16px;cursor:pointer;transition:all var(--transition);position:relative;
}
.topbar-icon:hover{background:var(--gray-100);color:var(--gray-900)}
.topbar-icon .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold);border:2px solid var(--white)}
.topbar-date{font-size:12px;color:var(--gray-400);font-weight:500}

/* ══════════ CONTENT ══════════ */
.content{padding:28px 32px}
.content-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:20px;margin-bottom:28px}

/* KPI */
.kpi{
  background:var(--white);border-radius:var(--radius);padding:22px 24px;
  border:1px solid var(--gray-200);transition:all var(--transition);
}
.kpi:hover{border-color:rgba(184,134,11,0.25);box-shadow:var(--shadow-hover)}
.kpi-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi-icon{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;
}
.kpi-icon.navy{background:var(--dark);color:var(--gold)}
.kpi-icon.gold{background:rgba(184,134,11,0.1);color:var(--gold)}
.kpi-icon.green{background:rgba(30,140,94,0.08);color:#1E8C5E}
.kpi-icon.blue{background:rgba(184,134,11,0.08);color:#B8860B}
.kpi-change{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px}
.kpi-change.up{background:rgba(30,140,94,0.08);color:#1E8C5E}
.kpi-change.down{background:rgba(214,66,58,0.08);color:#D6423A}
.kpi-value{font-size:28px;font-weight:900;letter-spacing:-0.5px;margin-bottom:2px}
.kpi-label{font-size:12px;color:var(--gray-500);font-weight:500}

/* CARDS ROW */
.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.card{
  background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);
  overflow:hidden;transition:all var(--transition);
}
.card:hover{border-color:rgba(184,134,11,0.2);box-shadow:var(--shadow-hover)}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;border-bottom:1px solid var(--gray-100);
}
.card-title{font-size:15px;font-weight:700}
.card-more{font-size:12px;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:4px}
.card-body{padding:0}

/* PROJECT TABLE */
.proj-row{
  display:flex;align-items:center;gap:14px;padding:14px 24px;
  border-bottom:1px solid var(--gray-100);transition:background var(--transition);
}
.proj-row:last-child{border-bottom:none}
.proj-row:hover{background:var(--gray-50)}
.proj-icon{
  width:36px;height:36px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.proj-icon.dev{background:var(--dark);color:var(--gold)}
.proj-icon.recon{background:rgba(184,134,11,0.1);color:var(--gold)}
.proj-icon.small{background:rgba(184,134,11,0.08);color:#B8860B}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:13px;font-weight:700;margin-bottom:1px}
.proj-meta{font-size:11px;color:var(--gray-400)}
.proj-status{
  font-size:10px;font-weight:700;padding:3px 10px;border-radius:4px;flex-shrink:0;
}
.proj-status.active{background:rgba(184,134,11,0.1);color:var(--gold)}
.proj-status.done{background:var(--dark);color:var(--white)}
.proj-status.pending{background:var(--gray-100);color:var(--gray-500)}

/* SCHEDULE */
.schedule-item{
  display:flex;align-items:flex-start;gap:14px;padding:14px 24px;
  border-bottom:1px solid var(--gray-100);
}
.schedule-item:last-child{border-bottom:none}
.sched-date{
  width:44px;height:44px;border-radius:10px;background:var(--dark);color:var(--white);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
}
.sched-date .sd-month{font-size:9px;font-weight:500;color:var(--gold);letter-spacing:0.5px}
.sched-date .sd-day{font-size:16px;font-weight:800;line-height:1.1}
.sched-info{flex:1}
.sched-title{font-size:13px;font-weight:700;margin-bottom:2px}
.sched-desc{font-size:11px;color:var(--gray-400)}
.sched-time{font-size:10px;color:var(--gold);font-weight:600;margin-top:3px}

/* NOTICE */
.notice-item{
  display:flex;align-items:center;gap:10px;padding:12px 24px;
  border-bottom:1px solid var(--gray-100);transition:background var(--transition);
}
.notice-item:last-child{border-bottom:none}
.notice-item:hover{background:var(--gray-50)}
.notice-badge{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;flex-shrink:0;
}
.notice-badge.important{background:rgba(184,134,11,0.12);color:var(--gold)}
.notice-badge.normal{background:var(--gray-100);color:var(--gray-500)}
.notice-title{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice-date{font-size:11px;color:var(--gray-400);flex-shrink:0}

/* QUICK ACTIONS */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.quick-btn{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);
  cursor:pointer;transition:all var(--transition);text-align:center;
}
.quick-btn:hover{border-color:rgba(184,134,11,0.3);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.quick-btn i{font-size:20px;color:var(--gold)}
.quick-btn span{font-size:12px;font-weight:600;color:var(--gray-700)}

/* BOTTOM ROW */
.bottom-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}

/* MEMBERS */
.member-row{
  display:flex;align-items:center;gap:12px;padding:12px 24px;
  border-bottom:1px solid var(--gray-100);
}
.member-row:last-child{border-bottom:none}
.member-avatar{
  width:32px;height:32px;border-radius:8px;background:var(--gray-100);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gray-400);flex-shrink:0;
}
.member-name{font-size:13px;font-weight:600;flex:1}
.member-dept{font-size:11px;color:var(--gray-400)}
.member-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.member-status.online{background:#1E8C5E}
.member-status.away{background:var(--gold)}
.member-status.offline{background:var(--gray-300)}

/* RESPONSIVE */
@media(max-width:1280px){
  .content-grid{grid-template-columns:1fr 1fr}
  .quick-grid{grid-template-columns:repeat(4,1fr)}
  .bottom-row{grid-template-columns:1fr 1fr}
}
@media(max-width:1024px){
  .sidebar{display:none}
  .main{margin-left:0}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .content{padding:20px 16px}
  .content-grid{grid-template-columns:1fr}
  .cards-row{grid-template-columns:1fr}
  .bottom-row{grid-template-columns:1fr}
  .topbar-search{display:none}
  .topbar{padding:0 16px}
}

/* ══════════ CALENDAR PAGE ══════════ */
.cal-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;
}
.cal-nav{display:flex;align-items:center;gap:16px}
.cal-nav-btn{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--gray-200);
  background:var(--white);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--gray-600);font-size:14px;transition:all var(--transition);
}
.cal-nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.cal-month-title{font-size:20px;font-weight:800;letter-spacing:-0.3px}
.cal-today-btn{
  padding:6px 16px;border-radius:var(--radius-sm);background:var(--dark);color:var(--white);
  font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all var(--transition);
}
.cal-today-btn:hover{background:var(--navy)}

.cal-grid{
  background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);
  overflow:hidden;margin-bottom:28px;
}
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  border-bottom:1px solid var(--gray-200);background:var(--gray-50);
}
.cal-weekday{
  padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--gray-500);
}
.cal-weekday:first-child{color:#D6423A}
.cal-weekday:last-child{color:#B8860B}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day{
  min-height:80px;padding:8px;border-right:1px solid var(--gray-100);
  border-bottom:1px solid var(--gray-100);transition:background var(--transition);position:relative;
}
.cal-day:nth-child(7n){border-right:none}
.cal-day:hover{background:var(--gray-50)}
.cal-day.other-month{opacity:0.3}
.cal-day.today{background:rgba(184,134,11,0.06)}
.cal-day.today .cal-day-num{
  background:var(--gold);color:var(--white);border-radius:50%;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
}
.cal-day-num{font-size:13px;font-weight:600;margin-bottom:4px;display:inline-block}
.cal-day:nth-child(7n+1) .cal-day-num{color:#D6423A}
.cal-day:nth-child(7n) .cal-day-num{color:#B8860B}
.cal-dot{
  width:6px;height:6px;border-radius:50%;display:inline-block;margin:1px 1px;
}
.cal-dot.chonghoe{background:var(--gold)}
.cal-dot.admin{background:var(--navy)}
.cal-dot.internal{background:#1E8C5E}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}

/* Legend */
.cal-legend{
  display:flex;align-items:center;gap:20px;padding:16px 24px;
  background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);margin-bottom:28px;
}
.cal-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--gray-600)}
.cal-legend-dot{width:8px;height:8px;border-radius:50%}

/* Upcoming events */
.event-list{margin-top:0}
.event-item{
  display:flex;align-items:center;gap:16px;padding:16px 24px;
  border-bottom:1px solid var(--gray-100);transition:background var(--transition);
}
.event-item:last-child{border-bottom:none}
.event-item:hover{background:var(--gray-50)}
.event-date-box{
  width:52px;height:52px;border-radius:10px;background:var(--dark);color:var(--white);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
}
.event-date-box .ev-month{font-size:9px;font-weight:500;color:var(--gold);letter-spacing:0.5px}
.event-date-box .ev-day{font-size:18px;font-weight:800;line-height:1.1}
.event-info{flex:1;min-width:0}
.event-title{font-size:14px;font-weight:700;margin-bottom:2px}
.event-time{font-size:12px;color:var(--gray-400)}
.event-badge{
  font-size:10px;font-weight:700;padding:4px 12px;border-radius:4px;flex-shrink:0;
}
.event-badge.chonghoe{background:rgba(184,134,11,0.12);color:var(--gold)}
.event-badge.admin{background:rgba(20,38,68,0.1);color:var(--navy)}
.event-badge.internal{background:rgba(30,140,94,0.08);color:#1E8C5E}

@media(max-width:768px){
  .cal-day{min-height:56px;padding:4px}
  .cal-day-num{font-size:11px}
  .cal-header{flex-direction:column;gap:12px;align-items:flex-start}
}
</style>
</head>
<body style="visibility:hidden">

<div id="intra-sidebar"></div>

<div class="main">
  <div id="intra-topbar"></div>

  <div class="content">

    <!-- Calendar Navigation -->
    <div class="cal-header">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="calPrev"><i class="fa-solid fa-chevron-left"></i></button>
        <span class="cal-month-title" id="calMonthTitle"></span>
        <button class="cal-nav-btn" id="calNext"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <button class="cal-today-btn" id="calToday"><i class="fa-solid fa-calendar-day"></i> 오늘</button>
    </div>

    <!-- Legend -->
    <div class="cal-legend">
      <span style="font-size:12px;font-weight:700;color:var(--gray-700)">범례</span>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--gold)"></span> 총회</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--navy)"></span> 행정</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#1E8C5E"></span> 내부</div>
    </div>

    <!-- Calendar Grid -->
    <div class="cal-grid">
      <div class="cal-weekdays">
        <div class="cal-weekday">일</div>
        <div class="cal-weekday">월</div>
        <div class="cal-weekday">화</div>
        <div class="cal-weekday">수</div>
        <div class="cal-weekday">목</div>
        <div class="cal-weekday">금</div>
        <div class="cal-weekday">토</div>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>

    <!-- Upcoming Events -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">다가오는 일정</div>
        <span class="card-more"><i class="fa-solid fa-plus" style="font-size:11px"></i> 일정 추가</span>
      </div>
      <div class="card-body event-list" id="calEventList"></div>
    </div>

  </div>
</div>

<script src="intranet.js"></script>

  /* ── 상태 ── */

    { date:'2026-04-08', title:'이문1구역 관리처분 공람', time:'09:00', place:'동대문구청', type:'admin', label:'행정' },
    { date:'2026-04-12', title:'서울시 정비사업 설명회', time:'14:00', place:'시청 대강당', type:'admin', label:'행정' },
    { date:'2026-04-15', title:'흑석9구역 시공사 선정', time:'10:00', place:'조합 사무실', type:'chonghoe', label:'총회' },
    { date:'2026-04-22', title:'사내 월례회의', time:'09:30', place:'본사 회의실', type:'internal', label:'내부' },
    { date:'2026-04-26', title:'신길1구역 착공식', time:'11:00', place:'현장', type:'chonghoe', label:'총회' },
    { date:'2026-05-10', title:'이문1구역 총회', time:'14:00', place:'동대문구민회관', type:'chonghoe', label:'총회' },
    { date:'2026-05-20', title:'5월 월례회의', time:'09:30', place:'본사 회의실', type:'internal', label:'내부' },
    { date:'2026-03-25', title:'흑석9구역 진행보고', time:'10:00', place:'본사 회의실', type:'admin', label:'행정' },
    { date:'2026-03-30', title:'3월 월례회의', time:'09:30', place:'본사 회의실', type:'internal', label:'내부' },
  ];

  /* ── DOM ── */
  const $title = document.getElementById('calMonthTitle');
  const $days  = document.getElementById('calDays');
  const $list  = document.getElementById('calEventList');

  /* ── 렌더: 캘린더 그리드 ── */
  function renderCalendar(year, month) {
    $title.textContent = year + '년 ' + (month + 1) + '월';

    const firstDay = new Date(year, month, 1).getDay(); // 0=일
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    // 이벤트를 "YYYY-MM-DD" 키로 인덱싱
    const eventMap = {};
    events.forEach(function(ev) {
      if (!eventMap[ev.date]) eventMap[ev.date] = [];
      eventMap[ev.date].push(ev);
    });

    const todayStr = today.getFullYear() + '-' +
      String(today.getMonth() + 1).padStart(2, '0') + '-' +
      String(today.getDate()).padStart(2, '0');

    let html = '';

    // 이전 달 빈 칸
    for (let i = firstDay - 1; i >= 0; i--) {
      const d = prevLastDate - i;
      html += '<div class="cal-day other-month"><span class="cal-day-num">' + d + '</span></div>';
    }

    // 현재 달
    for (let d = 1; d <= lastDate; d++) {
      const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const isToday = dateStr === todayStr;
      let cls = 'cal-day';
      if (isToday) cls += ' today';

      let dots = '';
      if (eventMap[dateStr]) {
        dots = '<div class="cal-dots">';
        eventMap[dateStr].forEach(function(ev) {
          dots += '<span class="cal-dot ' + ev.type + '"></span>';
        });
        dots += '</div>';
      }

      html += '<div class="' + cls + '"><span class="cal-day-num">' + d + '</span>' + dots + '</div>';
    }

    // 다음 달 빈 칸 (6주 = 42칸 채우기)
    const totalCells = firstDay + lastDate;
    const remaining = (totalCells % 7 === 0) ? 0 : 7 - (totalCells % 7);
    for (let d = 1; d <= remaining; d++) {
      html += '<div class="cal-day other-month"><span class="cal-day-num">' + d + '</span></div>';
    }

    $days.innerHTML = html;
  }

  /* ── 렌더: 이벤트 목록 ── */
  function renderEvents(year, month) {
    // 현재 표시 월의 이벤트를 날짜순으로
    const prefix = year + '-' + String(month + 1).padStart(2, '0');
    const monthEvents = events
      .filter(function(ev) { return ev.date.substring(0, 7) === prefix; })
      .sort(function(a, b) { return a.date.localeCompare(b.date); });

    if (monthEvents.length === 0) {
      $list.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gray-400);font-size:13px">이 달에는 등록된 일정이 없습니다.</div>';
      return;
    }

    let html = '';
    monthEvents.forEach(function(ev) {
      const day = parseInt(ev.date.substring(8), 10);
      const monthLabel = (month + 1) + '월';
      html += '<div class="event-item">' +
        '<div class="event-date-box"><span class="ev-month">' + monthLabel + '</span><span class="ev-day">' + String(day).padStart(2, '0') + '</span></div>' +
        '<div class="event-info"><div class="event-title">' + ev.title + '</div>' +
        '<div class="event-time"><i class="fa-regular fa-clock"></i> ' + ev.time + ' · ' + ev.place + '</div></div>' +
        '<span class="event-badge ' + ev.type + '">' + ev.label + '</span></div>';
    });

    $list.innerHTML = html;
  }

  /* ── 전체 렌더 ── */
  function render() {
    renderCalendar(currentYear, currentMonth);
    renderEvents(currentYear, currentMonth);
  }

  /* ── 버튼 이벤트 ── */
  document.getElementById('calPrev').addEventListener('click', function() {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    render();
  });

  document.getElementById('calNext').addEventListener('click', function() {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    render();
  });

  document.getElementById('calToday').addEventListener('click', function() {
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();
    render();
  });

  /* ── 초기 렌더 ── */
  render();
})();
</script>
</body>
</html>
