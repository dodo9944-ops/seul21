<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인트라넷 로그인 — (주)세울엔지니어링</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#0A0F1C;--navy:#142644;--gold:#C3A569;--white:#fff;--gray-50:#F9F9F9;--gray-100:#F3F3F3;--gray-200:#E5E5E5;--gray-400:#AAA;--gray-500:#888;--gray-600:#666;--gray-900:#1A1A1A;--font:'Noto Sans KR',sans-serif;--radius:12px}
body{font-family:var(--font);background:var(--gray-50);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* === Mini Header (보정) === */
.intra-header{height:64px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 36px;flex-shrink:0;border-bottom:1px solid rgba(195,165,105,.1)}
.intra-header .ih-left{display:flex;align-items:center;gap:14px}
.intra-header .ih-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.intra-header .ih-logo svg{width:30px;height:30px;flex-shrink:0}
.intra-header .ih-logo-text{font-size:15px;font-weight:800;color:#fff}
.intra-header .ih-divider{width:1px;height:22px;background:rgba(255,255,255,.12)}
.intra-header .ih-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1.5px}
.intra-header .ih-right{display:flex;align-items:center;gap:16px}
.intra-header .ih-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);transition:color .2s;text-decoration:none}
.intra-header .ih-link:hover{color:var(--gold)}
.intra-header .ih-link i{font-size:12px}
@media(max-width:540px){.intra-header{padding:0 16px;height:56px}.intra-header .ih-logo-text{display:none}}

/* === Main Content (여백 축소) === */
.login-page{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.login-wrap{width:480px;max-width:100%}

/* Logo (카드 위) */
.login-logo{text-align:center;margin-bottom:24px}
.login-logo svg{width:48px;height:48px;margin-bottom:12px}
.login-logo-company{font-size:17px;font-weight:800;color:var(--gray-900)}
.login-logo-sub{font-size:9px;font-weight:500;letter-spacing:3px;color:var(--gray-400);text-transform:uppercase;margin-top:4px}

/* Card (크기 확대) */
.login-card{background:var(--white);border:1.5px solid var(--gray-200);border-radius:16px;padding:40px 36px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.login-card h2{font-size:20px;font-weight:800;text-align:center;margin-bottom:6px;color:var(--gray-900)}
.login-card .sub{font-size:13px;color:var(--gray-500);text-align:center;margin-bottom:8px}

/* Notice for visitors */
.visitor-notice{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;background:rgba(195,165,105,.04);border:1px solid rgba(195,165,105,.1);border-radius:10px;margin-bottom:24px;font-size:12px;color:var(--gray-600);line-height:1.6}
.visitor-notice i{color:var(--gold);margin-top:2px;flex-shrink:0;font-size:13px}
.visitor-notice a{color:var(--gold);font-weight:600;text-decoration:underline}

/* Form */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:6px}
.form-input{width:100%;height:48px;border:1.5px solid var(--gray-200);border-radius:10px;padding:0 16px;font-size:14.5px;font-family:var(--font);color:var(--gray-900);outline:none;transition:all .2s;background:#fff}
.form-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(195,165,105,.1)}
.form-input::placeholder{color:var(--gray-400)}
.remember-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:12px}
.remember-row label{display:flex;align-items:center;gap:6px;color:var(--gray-600);cursor:pointer}
.remember-row span{color:var(--gray-400)}

.login-btn{width:100%;height:52px;border:none;border-radius:11px;background:var(--dark);color:var(--gold);font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px}
.login-btn:hover{background:var(--navy);box-shadow:0 6px 20px rgba(10,15,28,.15)}
.login-btn i{font-size:14px}

.login-error{display:none;background:#FDECEA;color:#D6423A;padding:12px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:16px}
.login-error.show{display:block}

.demo-box{margin-top:18px;padding:14px 16px;background:rgba(195,165,105,.04);border:1px solid rgba(195,165,105,.1);border-radius:10px;font-size:11.5px;color:var(--gray-600);line-height:1.7}
.demo-box strong{color:var(--gray-900)}
.demo-toggle{margin-top:18px;text-align:center}
.demo-toggle button{background:none;border:1px solid rgba(195,165,105,.2);border-radius:8px;padding:8px 18px;font-size:12px;font-weight:600;color:var(--gold);cursor:pointer;font-family:var(--font);transition:all .2s}
.demo-toggle button:hover{background:rgba(195,165,105,.04);border-color:var(--gold)}

/* Footer links */
.login-footer{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:24px;padding-top:20px;border-top:1px solid var(--gray-200);flex-wrap:wrap}
.login-footer a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--gray-500);transition:color .2s;text-decoration:none}
.login-footer a:hover{color:var(--gold)}
.login-footer a i{font-size:11px}
.login-footer .sep{width:1px;height:12px;background:var(--gray-200)}

@media(max-width:480px){.login-card{padding:32px 22px}.login-footer{gap:12px}}
</style>
</head>
<body>

<!-- Mini Header -->
<header class="intra-header">
    <div class="ih-left">
        <a href="../index.html" class="ih-logo">
            <svg viewBox="0 0 120 120" fill="none"><rect x="8" y="8" width="104" height="104" rx="4" stroke="#C3A569" stroke-width="1.5" opacity="0.3"/><rect x="28" y="24" width="52" height="6" rx="1" fill="#C3A569"/><rect x="28" y="24" width="6" height="28" rx="1" fill="#C3A569"/><rect x="40" y="52" width="52" height="6" rx="1" fill="#C3A569" opacity="0.6"/><rect x="86" y="58" width="6" height="28" rx="1" fill="#C3A569"/><rect x="40" y="86" width="52" height="6" rx="1" fill="#C3A569"/></svg>
            <span class="ih-logo-text">(주)세울엔지니어링</span>
        </a>
        <div class="ih-divider"></div>
        <span class="ih-label">INTRANET</span>
    </div>
    <div class="ih-right">
        <a href="../index.html" class="ih-link"><i class="fa-solid fa-house"></i> 홈페이지</a>
        <a href="../pages/contact.html" class="ih-link"><i class="fa-solid fa-headset"></i> 고객센터</a>
    </div>
</header>

<!-- Login Page -->
<div class="login-page">
    <div class="login-wrap">
        <div class="login-logo">
            <svg viewBox="0 0 120 120" fill="none"><rect x="8" y="8" width="104" height="104" rx="4" stroke="#C3A569" stroke-width="1.5" opacity="0.3"/><rect x="28" y="24" width="52" height="6" rx="1" fill="#C3A569"/><rect x="28" y="24" width="6" height="28" rx="1" fill="#C3A569"/><rect x="40" y="52" width="52" height="6" rx="1" fill="#C3A569" opacity="0.6"/><rect x="86" y="58" width="6" height="28" rx="1" fill="#C3A569"/><rect x="40" y="86" width="52" height="6" rx="1" fill="#C3A569"/></svg>
            <div class="login-logo-company">(주)세울엔지니어링</div>
            <div class="login-logo-sub">INTRANET</div>
        </div>

        <div class="login-card">
            <h2>인트라넷 로그인</h2>
            <p class="sub">임직원 전용 업무 포털</p>

            <div class="visitor-notice">
                <i class="fa-solid fa-circle-info"></i>
                <span>본 페이지는 임직원 전용 시스템입니다. 외부 방문자는 <a href="../index.html">메인 홈페이지</a> 또는 <a href="../pages/contact.html">고객센터</a>를 이용해 주세요.</span>
            </div>

            <div class="login-error" id="loginError">아이디 또는 비밀번호가 올바르지 않습니다.</div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">아이디</label>
                    <input type="text" class="form-input" id="loginId" placeholder="아이디를 입력하세요" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">비밀번호</label>
                    <input type="password" class="form-input" id="loginPw" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
                </div>
                <div class="remember-row">
                    <label><input type="checkbox"> 로그인 상태 유지</label>
                    <span>관리자 문의: 내선 101</span>
                </div>
                <button type="submit" class="login-btn"><i class="fa-solid fa-right-to-bracket"></i> 로그인</button>
            </form>

            <div class="demo-toggle">
                <button type="button" id="demoToggleBtn">테스트 계정 보기</button>
            </div>
            <div class="demo-box" id="demoBox" style="display:none">
                <strong>테스트 계정 안내</strong><br>
                관리자: <strong>admin</strong> / admin1234<br>
                실무자: <strong>user1</strong> / user1234<br>
                열람자: <strong>user3</strong> / user1234
            </div>
        </div>

        <div class="login-footer">
            <a href="../index.html"><i class="fa-solid fa-house"></i> 메인 홈페이지</a>
            <div class="sep"></div>
            <a href="../pages/contact.html"><i class="fa-solid fa-headset"></i> 고객센터</a>
            <div class="sep"></div>
            <a href="../pages/library.html"><i class="fa-solid fa-book"></i> 자료실</a>
        </div>
    </div>
</div>

<script src="intranet.js"></script>
<script>
if(Intra.isLoggedIn()) location.replace('index.html');

document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var id = document.getElementById('loginId').value.trim();
    var pw = document.getElementById('loginPw').value;
    if(Intra.login(id, pw)){
        location.href = 'index.html';
    } else {
        document.getElementById('loginError').classList.add('show');
        document.getElementById('loginPw').value = '';
        document.getElementById('loginPw').focus();
    }
});

document.getElementById('demoToggleBtn').addEventListener('click', function(){
    var box = document.getElementById('demoBox');
    if(box.style.display === 'none'){
        box.style.display = '';
        this.textContent = '테스트 계정 숨기기';
    } else {
        box.style.display = 'none';
        this.textContent = '테스트 계정 보기';
    }
});
</script>
</body>
</html>
