<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인트라넷 로그인 — (주)세울엔지니어링</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#0A0F1C;--navy:#142644;--gold:#C3A569;--white:#fff;--gray-50:#F9F9F9;--gray-200:#E5E5E5;--gray-400:#AAA;--gray-500:#888;--gray-600:#666;--gray-900:#1A1A1A;--font:'Noto Sans KR',sans-serif;--radius:12px}
body{font-family:var(--font);background:var(--gray-50);display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}

.login-wrap{width:420px;max-width:92vw}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo svg{width:56px;height:56px;margin-bottom:16px}
.login-logo-company{font-size:20px;font-weight:800;color:var(--gray-900);letter-spacing:-0.3px}
.login-logo-sub{font-size:9px;font-weight:500;letter-spacing:3px;color:var(--gray-400);text-transform:uppercase;margin-top:4px}

.login-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:40px 36px;box-shadow:0 2px 12px rgba(0,0,0,0.04)}
.login-card h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px;color:var(--gray-900)}
.login-card .sub{font-size:13px;color:var(--gray-500);text-align:center;margin-bottom:28px}

.form-group{margin-bottom:18px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:6px}
.form-input{width:100%;height:46px;border:1.5px solid var(--gray-200);border-radius:8px;padding:0 14px;font-size:14px;font-family:var(--font);color:var(--gray-900);outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--gold)}
.form-input::placeholder{color:var(--gray-400)}

.remember-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;font-size:12px}
.remember-row label{display:flex;align-items:center;gap:6px;color:var(--gray-600);cursor:pointer}
.remember-row a{color:var(--gold);font-weight:500}

.login-btn{width:100%;height:48px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--gold),#D4B87A);color:var(--dark);font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all 0.25s}
.login-btn:hover{box-shadow:0 4px 20px rgba(195,165,105,0.3);transform:translateY(-1px)}

.login-error{display:none;background:#FDECEA;color:#D6423A;padding:12px;border-radius:8px;font-size:13px;text-align:center;margin-bottom:16px}
.login-error.show{display:block}

.login-footer{text-align:center;margin-top:24px;font-size:12px;color:var(--gray-400)}
.login-footer a{color:var(--gold)}

.demo-box{margin-top:20px;padding:14px 16px;background:rgba(195,165,105,0.06);border:1px solid rgba(195,165,105,0.12);border-radius:8px;font-size:11px;color:var(--gray-600);line-height:1.7}
.demo-box strong{color:var(--gray-900)}

.login-badge{text-align:center;margin-bottom:20px}
.login-badge span{display:inline-block;padding:4px 14px;border-radius:4px;background:var(--dark);color:var(--gold);font-size:10px;font-weight:700;letter-spacing:1.5px}

@media(max-width:480px){.login-card{padding:28px 20px}}
</style>
</head>
<body>

<div class="login-wrap">
    <div class="login-logo">
        <svg viewBox="0 0 120 120" fill="none"><rect x="8" y="8" width="104" height="104" rx="4" stroke="#C3A569" stroke-width="1.5" opacity="0.3"/><rect x="28" y="24" width="52" height="6" rx="1" fill="#C3A569"/><rect x="28" y="24" width="6" height="28" rx="1" fill="#C3A569"/><rect x="40" y="52" width="52" height="6" rx="1" fill="#C3A569" opacity="0.6"/><rect x="86" y="58" width="6" height="28" rx="1" fill="#C3A569"/><rect x="40" y="86" width="52" height="6" rx="1" fill="#C3A569"/></svg>
        <div class="login-logo-company">(주)세울엔지니어링</div>
        <div class="login-logo-sub">INTRANET</div>
    </div>

    <div class="login-badge"><span>INTERNAL USE ONLY</span></div>

    <div class="login-card">
        <h2>인트라넷 로그인</h2>
        <p class="sub">임직원 전용 업무 포털입니다</p>

        <div class="login-error" id="loginError">아이디 또는 비밀번호가 올바르지 않습니다.</div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">아이디</label>
                <input type="text" class="form-input" id="loginId" placeholder="아이디를 입력하세요" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-input" id="loginPw" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
            </div>
            <div class="remember-row">
                <label><input type="checkbox"> 로그인 상태 유지</label>
                <span style="color:var(--gray-400)">관리자 문의: 내선 101</span>
            </div>
            <button type="submit" class="login-btn">로그인</button>
        </form>

        <div style="margin-top:20px;text-align:center">
            <button type="button" id="demoToggleBtn" onclick="var b=document.getElementById('demoBox');var t=this;if(b.style.display==='none'){b.style.display='';t.textContent='테스트 계정 숨기기';}else{b.style.display='none';t.textContent='테스트 계정 보기';}" style="background:none;border:1px solid rgba(195,165,105,0.25);border-radius:6px;padding:8px 18px;font-size:12px;font-weight:600;color:var(--gold);cursor:pointer;font-family:var(--font);transition:all 0.2s">테스트 계정 보기</button>
        </div>
        <div class="demo-box" id="demoBox" style="display:none">
            <strong>테스트 계정 안내</strong><br>
            관리자: <strong>admin</strong> / admin1234<br>
            실무자: <strong>user1</strong> / user1234<br>
            열람자: <strong>user3</strong> / user1234
        </div>
    </div>

    <div class="login-footer">
        <a href="../index.html">← 세울엔지니어링 홈페이지로 돌아가기</a>
    </div>
</div>

<script src="intranet.js"></script>
<script>
// 이미 로그인 상태면 대시보드로
if(Intra.isLoggedIn()) location.replace('index.html');

document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var id = document.getElementById('loginId').value.trim();
    var pw = document.getElementById('loginPw').value;
    if(Intra.login(id, pw)){
        location.href = 'index.html';
    } else {
        document.getElementById('loginError').classList.add('show');
        document.getElementById('loginPw').value = '';
        document.getElementById('loginPw').focus();
    }
});
</script>
</body>
</html>
