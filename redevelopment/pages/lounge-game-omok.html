<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오목 — 게임 모음 | 세울 쉼터</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260509e">
    <style>
    .lgg-hero{padding:48px 0 36px;background:linear-gradient(135deg,#060A14 0%,#0A0F1C 40%,#142644 100%);text-align:center}
    .lgg-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.5);text-decoration:none;margin-bottom:14px}
    .lgg-back:hover{color:var(--gold)}
    .lgg-cat-tag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:10px;padding:4px 12px;border:1px solid rgba(195,165,105,.35);border-radius:20px}
    .lgg-hero h1{font-size:30px;font-weight:900;color:#fff;margin-bottom:8px}
    .lgg-hero h1 em{font-style:normal;color:var(--gold)}
    .lgg-hero p{font-size:13.5px;color:rgba(255,255,255,.55);margin:0}
    .lgg-body{padding:48px 0 96px;background:linear-gradient(180deg,#fff,#f7f8fb)}

    .om-wrap{max-width:560px;margin:0 auto}
    .om-info{display:flex;justify-content:space-between;margin-bottom:14px;gap:8px}
    .om-stat{flex:1;background:#0F1D35;color:#fff;border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(195,165,105,.2)}
    .om-stat .lbl{font-size:10.5px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
    .om-stat .val{font-size:18px;font-weight:900}
    .om-canvas-wrap{position:relative;background:#dcb47a;border-radius:14px;padding:14px;border:2px solid #8d5a1f;box-shadow:0 12px 32px rgba(0,0,0,.15)}
    canvas#omCanvas{display:block;width:100%;aspect-ratio:1;cursor:crosshair}

    .om-actions{display:flex;gap:8px;margin-top:14px}
    .om-btn{flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-family:var(--font);transition:all .15s}
    .om-btn-primary{background:linear-gradient(135deg,#C3A569,#D4B87A);color:#0A0F1C}
    .om-btn-primary:hover{transform:translateY(-2px)}
    .om-btn-ghost{background:transparent;color:var(--gray-600);border:1px solid var(--gray-300)}
    .om-btn-ghost:hover{background:var(--gray-50)}
    .om-msg{text-align:center;margin-top:14px;min-height:22px;font-size:13.5px;font-weight:700;color:var(--gray-600)}
    .om-msg.win{color:#1E8C5E;font-size:15px}
    .om-msg.lose{color:#D6423A;font-size:15px}
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="lgg-hero">
    <div class="inner">
        <a href="lounge-games.html" class="lgg-back"><i class="fa-solid fa-arrow-left"></i> 게임 모음으로 돌아가기</a>
        <div class="lgg-cat-tag">▣ Board</div>
        <h1>오목 <em>OMOK</em></h1>
        <p>가로·세로·대각선 다섯 개를 먼저 잇는 사람이 승리. 컴퓨터(백) 대전.</p>
    </div>
</div>

<div class="lgg-body">
    <div class="inner">
        <div class="om-wrap">
            <div class="om-info">
                <div class="om-stat"><div class="lbl">Player</div><div class="val">⚫ 흑</div></div>
                <div class="om-stat"><div class="lbl">CPU</div><div class="val">⚪ 백</div></div>
                <div class="om-stat"><div class="lbl">Turn</div><div class="val" id="omTurn">YOU</div></div>
            </div>
            <div class="om-canvas-wrap"><canvas id="omCanvas" width="540" height="540"></canvas></div>
            <div class="om-actions">
                <button class="om-btn om-btn-primary" id="omNew"><i class="fa-solid fa-rotate"></i> 새 게임</button>
                <button class="om-btn om-btn-ghost" id="omUndo"><i class="fa-solid fa-rotate-left"></i> 무르기</button>
            </div>
            <div class="om-msg" id="omMsg">바둑판을 클릭하여 흑돌을 두세요.</div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260606a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260509a"></script>
<script>
(function(){
    const N = 15;
    const cv = document.getElementById('omCanvas');
    const ctx = cv.getContext('2d');
    const elTurn = document.getElementById('omTurn');
    const elMsg = document.getElementById('omMsg');
    let board = [], turn = 1, gameOver = false, history = []; // 1=흑(player), 2=백(cpu)

    function reset(){
        board = new Array(N*N).fill(0);
        turn = 1; gameOver = false; history = [];
        elTurn.textContent = 'YOU';
        elMsg.textContent = '바둑판을 클릭하여 흑돌을 두세요.';
        elMsg.className = 'om-msg';
        draw();
    }

    function draw(){
        const W = cv.width;
        const cell = W / (N+1);
        ctx.fillStyle = '#dcb47a';
        ctx.fillRect(0,0,W,W);
        ctx.strokeStyle = '#3a2811'; ctx.lineWidth = 1.2;
        for(let i=0;i<N;i++){
            ctx.beginPath();ctx.moveTo(cell+i*cell, cell);ctx.lineTo(cell+i*cell, W-cell);ctx.stroke();
            ctx.beginPath();ctx.moveTo(cell, cell+i*cell);ctx.lineTo(W-cell, cell+i*cell);ctx.stroke();
        }
        // 화점
        const dots = [[3,3],[3,11],[11,3],[11,11],[7,7]];
        ctx.fillStyle = '#3a2811';
        dots.forEach(([r,c]) => {ctx.beginPath();ctx.arc(cell+c*cell,cell+r*cell,3,0,Math.PI*2);ctx.fill()});
        // 돌
        for(let i=0;i<board.length;i++){
            const v = board[i]; if(!v) continue;
            const r = Math.floor(i/N), c = i%N;
            const x = cell+c*cell, y = cell+r*cell;
            const grad = ctx.createRadialGradient(x-cell*0.18, y-cell*0.18, cell*0.05, x, y, cell*0.42);
            if(v===1){grad.addColorStop(0,'#5a5a5a');grad.addColorStop(1,'#0a0a0a')}
            else{grad.addColorStop(0,'#fff');grad.addColorStop(1,'#bbb')}
            ctx.fillStyle = grad;
            ctx.beginPath();ctx.arc(x,y,cell*0.42,0,Math.PI*2);ctx.fill();
            ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.stroke();
        }
        // 마지막 수 표시
        if(history.length){
            const last = history[history.length-1];
            const r = Math.floor(last/N), c = last%N;
            const x = cell+c*cell, y = cell+r*cell;
            ctx.strokeStyle = '#D6423A'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(x,y,cell*0.18,0,Math.PI*2); ctx.stroke();
        }
    }

    function checkWin(p){
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
            if(board[r*N+c]!==p) continue;
            for(const [dr,dc] of dirs){
                let cnt = 1;
                for(let k=1;k<5;k++){const nr=r+dr*k, nc=c+dc*k; if(nr<0||nr>=N||nc<0||nc>=N||board[nr*N+nc]!==p) break; cnt++}
                if(cnt>=5) return true;
            }
        }
        return false;
    }

    // 단순 AI: 휴리스틱 점수
    function score(p, opp){
        // 각 빈 칸에 대해 placing 시 자신/상대 라인 점수
        const counts = (player, r, c) => {
            const dirs = [[1,0],[0,1],[1,1],[1,-1]];
            let total = 0;
            for(const [dr,dc] of dirs){
                let f=0,b=0,fOpen=true,bOpen=true;
                for(let k=1;k<5;k++){const nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>=N||nc<0||nc>=N){fOpen=false;break}if(board[nr*N+nc]===player)f++;else if(board[nr*N+nc]!==0){fOpen=false;break}else break}
                for(let k=1;k<5;k++){const nr=r-dr*k,nc=c-dc*k;if(nr<0||nr>=N||nc<0||nc>=N){bOpen=false;break}if(board[nr*N+nc]===player)b++;else if(board[nr*N+nc]!==0){bOpen=false;break}else break}
                const len = f+b+1;
                if(len>=5) total += 100000;
                else{
                    const open = (fOpen?1:0)+(bOpen?1:0);
                    total += [0,1,10,100,1000,10000][len] * (open===2?2.5:open===1?1:0.3);
                }
            }
            return total;
        };
        let bestScore = -1, bestI = -1;
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
            if(board[r*N+c]!==0) continue;
            // 인접 돌 없으면 무시 (탐색 절감)
            let near=false;
            for(let dr=-2;dr<=2&&!near;dr++)for(let dc=-2;dc<=2&&!near;dc++){
                const nr=r+dr,nc=c+dc;if(nr<0||nr>=N||nc<0||nc>=N) continue;
                if(board[nr*N+nc]!==0) near=true;
            }
            if(!near) continue;
            const sP = counts(p, r, c);
            const sO = counts(opp, r, c);
            const s = sP * 1.0 + sO * 1.05; // 상대 위협 살짝 우선
            if(s>bestScore){bestScore=s;bestI=r*N+c}
        }
        if(bestI<0){ // 첫 수: 중앙
            return Math.floor(N/2)*N + Math.floor(N/2);
        }
        return bestI;
    }

    function place(idx, p){
        board[idx] = p;
        history.push(idx);
        draw();
        if(checkWin(p)){
            gameOver = true;
            elMsg.textContent = p===1 ? '🎉 흑(YOU) 승리!' : '컴퓨터(백) 승리';
            elMsg.className = 'om-msg ' + (p===1?'win':'lose');
            return true;
        }
        return false;
    }

    cv.addEventListener('click', e => {
        if(gameOver || turn!==1) return;
        const rect = cv.getBoundingClientRect();
        const W = cv.width;
        const cell = W / (N+1);
        const x = (e.clientX - rect.left) * (W/rect.width);
        const y = (e.clientY - rect.top) * (W/rect.height);
        const c = Math.round((x - cell) / cell);
        const r = Math.round((y - cell) / cell);
        if(r<0||r>=N||c<0||c>=N) return;
        const idx = r*N+c;
        if(board[idx]!==0) return;
        if(place(idx, 1)) return;
        turn = 2; elTurn.textContent = 'CPU';
        setTimeout(() => {
            if(gameOver) return;
            const ai = score(2, 1);
            place(ai, 2);
            turn = 1; elTurn.textContent = 'YOU';
        }, 250);
    });

    document.getElementById('omNew').addEventListener('click', reset);
    document.getElementById('omUndo').addEventListener('click', () => {
        if(gameOver || history.length<2) return;
        // 마지막 두 수(CPU + 플레이어) 무르기
        for(let i=0;i<2 && history.length;i++){const idx=history.pop();board[idx]=0}
        turn = 1; elTurn.textContent='YOU'; gameOver=false;
        elMsg.textContent='무르기 — 다시 두세요'; elMsg.className='om-msg';
        draw();
    });

    reset();
})();
</script>
</body>
</html>
