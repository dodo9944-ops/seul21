<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 커뮤니티에 새 글을 작성합니다.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260614c">
    <style>
        .write-wrap { max-width: 800px; margin: 0 auto; }
        .write-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 40px 36px;
        }
        .write-card h2 {
            font-size: 22px; font-weight: 800; color: var(--gray-900);
            margin-bottom: 32px; padding-bottom: 16px;
            border-bottom: 2px solid var(--gray-900);
        }
        .form-group { margin-bottom: 24px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; color: var(--gray-700); margin-bottom: 8px; }
        .form-label .required { color: var(--red); margin-left: 2px; }
        .write-textarea {
            width: 100%; min-height: 300px; padding: 16px;
            border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
            font-size: 14px; font-family: var(--font); color: var(--gray-900);
            outline: none; resize: vertical; line-height: 1.7; background: var(--white);
            transition: border-color var(--transition);
        }
        .write-textarea:focus { border-color: var(--accent); }
        .write-textarea::placeholder { color: var(--gray-400); }
        .char-count { font-size: 12px; color: var(--gray-400); text-align: right; margin-top: 4px; }
        .form-actions {
            display: flex; justify-content: flex-end; gap: 10px;
            margin-top: 32px; padding-top: 24px;
            border-top: 1px solid var(--gray-200);
        }
        .validation-msg {
            font-size: 12px; color: var(--red); margin-top: 4px;
            display: none;
        }
        .validation-msg.show { display: block; }

        /* 이미지 업로드 */
        .img-upload-area {
            border: 2px dashed var(--gray-300); border-radius: var(--radius-sm);
            padding: 20px; text-align: center; cursor: pointer;
            transition: all .2s; background: var(--gray-50);
        }
        .img-upload-area:hover, .img-upload-area.dragover {
            border-color: var(--accent); background: rgba(195,165,105,.05);
        }
        .img-upload-area i { font-size: 24px; color: var(--gray-400); margin-bottom: 8px; }
        .img-upload-area .up-text { font-size: 13px; color: var(--gray-500); }
        .img-upload-area .up-hint { font-size: 11px; color: var(--gray-400); margin-top: 4px; }
        .img-preview-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
        .img-preview-item {
            position: relative; width: 120px; height: 120px;
            border-radius: 8px; overflow: hidden; border: 1px solid var(--gray-200);
        }
        .img-preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .img-preview-item .img-del {
            position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
            border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: none;
            font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .img-preview-item .img-status {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 3px; font-size: 10px; font-weight: 600; text-align: center;
        }
        .img-status.uploading { background: rgba(195,165,105,.9); color: #fff; }
        .img-status.done { background: rgba(5,150,105,.9); color: #fff; }
        .img-status.fail { background: rgba(239,68,68,.9); color: #fff; }

        /* 첨부파일 업로드 */
        .file-upload-area {
            border: 2px dashed var(--gray-300); border-radius: var(--radius-sm);
            padding: 20px; text-align: center; cursor: pointer;
            transition: all .2s; background: var(--gray-50);
        }
        .file-upload-area:hover, .file-upload-area.dragover {
            border-color: var(--accent); background: rgba(195,165,105,.05);
        }
        .file-upload-area i { font-size: 24px; color: var(--gray-400); margin-bottom: 8px; }
        .file-upload-area .up-text { font-size: 13px; color: var(--gray-500); }
        .file-upload-area .up-hint { font-size: 11px; color: var(--gray-400); margin-top: 4px; }
        .file-preview-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .file-preview-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-radius: 8px;
            border: 1px solid var(--gray-200); background: var(--white);
        }
        .file-preview-item .file-icon {
            width: 40px; height: 40px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .file-icon.pdf { background: #FEE2E2; color: #DC2626; }
        .file-icon.hwp { background: #DBEAFE; color: #2563EB; }
        .file-icon.doc { background: #DBEAFE; color: #2563EB; }
        .file-icon.xls { background: #D1FAE5; color: #059669; }
        .file-icon.ppt { background: #FFE4C4; color: #EA580C; }
        .file-icon.zip { background: #F3E8FF; color: #7C3AED; }
        .file-icon.default { background: var(--gray-100); color: var(--gray-500); }
        .file-preview-item .file-info { flex: 1; min-width: 0; }
        .file-preview-item .file-name {
            font-size: 13px; font-weight: 600; color: var(--gray-800);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .file-preview-item .file-size { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
        .file-preview-item .file-status {
            font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px;
            flex-shrink: 0;
        }
        .file-status.uploading { background: rgba(195,165,105,.15); color: #B8860B; }
        .file-status.done { background: rgba(5,150,105,.1); color: #059669; }
        .file-status.fail { background: rgba(239,68,68,.1); color: #DC2626; }
        .file-preview-item .file-del {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--gray-100); color: var(--gray-500); border: none;
            font-size: 12px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; flex-shrink: 0;
            transition: all .2s;
        }
        .file-preview-item .file-del:hover { background: #FEE2E2; color: #DC2626; }

        @media (max-width: 540px) {
            .write-card { padding: 24px 20px; }
            .write-card h2 { font-size: 19px; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-body">
    <div class="inner">
        <div class="write-wrap">
            <div class="breadcrumb">
                <a href="../index.html">홈</a> <i class="fa-solid fa-chevron-right"></i>
                <a href="community.html">커뮤니티</a> <i class="fa-solid fa-chevron-right"></i>
                <span>글쓰기</span>
            </div>
            <div class="write-card">
                <h2 id="writeHeading">새 글 작성</h2>
                <form id="writeForm" novalidate>
                    <div class="form-group">
                        <label class="form-label">카테고리 <span class="required">*</span></label>
                        <select class="form-select" id="postCategory" required>
                            <option value="">카테고리를 선택해주세요</option>
                            <option value="질문">질문</option>
                            <option value="정보">정보</option>
                            <option value="후기">후기</option>
                            <option value="분석">분석</option>
                            <option value="칼럼">칼럼</option>
                        </select>
                        <div class="validation-msg" id="catError">카테고리를 선택해주세요.</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">제목 <span class="required">*</span></label>
                        <input type="text" class="form-input" id="postTitle" placeholder="제목을 입력해주세요" maxlength="100" required>
                        <div class="validation-msg" id="titleError">제목을 입력해주세요.</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">이미지 첨부</label>
                        <div class="img-upload-area" id="imgUploadArea">
                            <i class="fa-solid fa-image"></i>
                            <div class="up-text">이미지를 드래그하거나 클릭하여 첨부</div>
                            <div class="up-hint">JPG · PNG · GIF · WEBP (최대 5MB, 5장)</div>
                            <input type="file" id="imgInput" multiple accept="image/*" style="display:none">
                        </div>
                        <div class="img-preview-list" id="imgPreviewList"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">첨부파일</label>
                        <div class="file-upload-area" id="fileUploadArea">
                            <i class="fa-solid fa-paperclip"></i>
                            <div class="up-text">파일을 드래그하거나 클릭하여 첨부</div>
                            <div class="up-hint">PDF · HWP · DOC · XLS · PPT · ZIP 등 (최대 10MB, 3개)</div>
                            <input type="file" id="fileInput" multiple style="display:none" accept=".pdf,.hwp,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.7z,.txt,.csv">
                        </div>
                        <div class="file-preview-list" id="filePreviewList"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">내용 <span class="required">*</span></label>
                        <textarea class="write-textarea" id="postContent" placeholder="내용을 입력해주세요. 재개발·재건축에 대한 질문, 정보, 후기 등을 자유롭게 작성하세요." maxlength="5000" required></textarea>
                        <div class="char-count"><span id="charCount">0</span> / 5,000</div>
                        <div class="validation-msg" id="contentError">내용을 입력해주세요.</div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline btn-md" id="cancelBtn">취소</button>
                        <button type="submit" class="btn btn-accent btn-md" id="submitBtn"><i class="fa-solid fa-check"></i> 등록</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260702a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260614f"></script>
<script>
(function() {
    document.addEventListener('DOMContentLoaded', function() {
        // 로그인 체크
        if (!DataService.isUserLoggedIn()) {
            App.toast('로그인이 필요합니다.', 'info');
            setTimeout(function() { location.href = 'login.html'; }, 1000);
            return;
        }

        const form = document.getElementById('writeForm');
        const categoryEl = document.getElementById('postCategory');
        const titleEl = document.getElementById('postTitle');
        const contentEl = document.getElementById('postContent');
        const charCount = document.getElementById('charCount');
        const headingEl = document.getElementById('writeHeading');
        const submitBtn = document.getElementById('submitBtn');

        // 수정 모드: ?id=xxx 가 있으면 기존 글 로드
        const editId = App.getParam('id');
        let editingPost = null;
        let editMode = false;

        // 글자수 카운트
        contentEl.addEventListener('input', function() {
            charCount.textContent = this.value.length;
        });

        // 취소
        document.getElementById('cancelBtn').addEventListener('click', function() {
            location.href = 'community.html';
        });

        /* ── 이미지 업로드 ── */
        var uploadedImages = []; // {file, url, status}
        var imgArea = document.getElementById('imgUploadArea');
        var imgInput = document.getElementById('imgInput');
        var imgList = document.getElementById('imgPreviewList');

        imgArea.addEventListener('click', function() { imgInput.click(); });
        imgArea.addEventListener('dragover', function(e) { e.preventDefault(); imgArea.classList.add('dragover'); });
        imgArea.addEventListener('dragleave', function() { imgArea.classList.remove('dragover'); });
        imgArea.addEventListener('drop', function(e) { e.preventDefault(); imgArea.classList.remove('dragover'); handleImages(e.dataTransfer.files); });
        imgInput.addEventListener('change', function() { handleImages(this.files); this.value = ''; });

        function handleImages(files) {
            Array.from(files).forEach(function(f) {
                if (!f.type.startsWith('image/')) { App.toast(f.name + ': 이미지 파일만 가능', 'error'); return; }
                if (f.size > 5 * 1024 * 1024) { App.toast(f.name + ': 5MB 초과', 'error'); return; }
                if (uploadedImages.length >= 5) { App.toast('최대 5장까지 첨부 가능', 'error'); return; }
                var img = { file: f, url: '', status: 'uploading' };
                uploadedImages.push(img);
                renderImages();
                uploadImage(img, uploadedImages.length - 1);
            });
        }

        function uploadImage(img, idx) {
            var reader = new FileReader();
            reader.onload = function() {
                var base64 = reader.result.split(',')[1];
                var ext = img.file.name.split('.').pop().toLowerCase();
                var filename = 'community_' + Date.now() + '_' + idx + '.' + ext;
                fetch('/api/upload-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: filename, content: base64 })
                })
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.url) { img.url = res.url; img.status = 'done'; }
                    else { img.status = 'fail'; }
                    renderImages();
                })
                .catch(function() { img.status = 'fail'; renderImages(); });
            };
            reader.readAsDataURL(img.file);
        }

        function renderImages() {
            imgList.innerHTML = uploadedImages.map(function(img, i) {
                var src = img.url || (img.file ? URL.createObjectURL(img.file) : '');
                var statusText = img.status === 'uploading' ? '업로드 중...' : img.status === 'done' ? '완료' : '실패';
                return '<div class="img-preview-item">' +
                    '<img src="' + src + '">' +
                    '<button type="button" class="img-del" onclick="removeImg(' + i + ')"><i class="fa-solid fa-xmark"></i></button>' +
                    '<div class="img-status ' + img.status + '">' + statusText + '</div>' +
                '</div>';
            }).join('');
        }
        window.removeImg = function(i) { uploadedImages.splice(i, 1); renderImages(); };

        /* ── 첨부파일 업로드 ── */
        var uploadedFiles = []; // {file, url, name, size, status}
        var fileArea = document.getElementById('fileUploadArea');
        var fileInput = document.getElementById('fileInput');
        var fileList = document.getElementById('filePreviewList');

        fileArea.addEventListener('click', function() { fileInput.click(); });
        fileArea.addEventListener('dragover', function(e) { e.preventDefault(); fileArea.classList.add('dragover'); });
        fileArea.addEventListener('dragleave', function() { fileArea.classList.remove('dragover'); });
        fileArea.addEventListener('drop', function(e) { e.preventDefault(); fileArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', function() { handleFiles(this.files); this.value = ''; });

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
        }

        function getFileIconClass(ext) {
            if (ext === 'pdf') return 'pdf';
            if (ext === 'hwp' || ext === 'hwpx') return 'hwp';
            if (ext === 'doc' || ext === 'docx') return 'doc';
            if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return 'xls';
            if (ext === 'ppt' || ext === 'pptx') return 'ppt';
            if (ext === 'zip' || ext === 'rar' || ext === '7z') return 'zip';
            return 'default';
        }

        function getFileIcon(ext) {
            if (ext === 'pdf') return 'fa-file-pdf';
            if (ext === 'hwp' || ext === 'hwpx') return 'fa-file-lines';
            if (ext === 'doc' || ext === 'docx') return 'fa-file-word';
            if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return 'fa-file-excel';
            if (ext === 'ppt' || ext === 'pptx') return 'fa-file-powerpoint';
            if (ext === 'zip' || ext === 'rar' || ext === '7z') return 'fa-file-zipper';
            return 'fa-file';
        }

        function handleFiles(files) {
            Array.from(files).forEach(function(f) {
                if (f.size > 10 * 1024 * 1024) { App.toast(f.name + ': 10MB 초과', 'error'); return; }
                if (uploadedFiles.length >= 3) { App.toast('첨부파일은 최대 3개까지 가능합니다.', 'error'); return; }
                var item = { file: f, url: '', name: f.name, size: formatFileSize(f.size), status: 'uploading' };
                uploadedFiles.push(item);
                renderFiles();
                uploadFile(item, uploadedFiles.length - 1);
            });
        }

        function uploadFile(item, idx) {
            var reader = new FileReader();
            reader.onload = function() {
                var base64 = reader.result.split(',')[1];
                var ext = item.file.name.split('.').pop().toLowerCase();
                var filename = 'file_' + Date.now() + '_' + idx + '.' + ext;
                fetch('/api/upload-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: filename, content: base64, originalName: item.file.name })
                })
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.url) { item.url = res.url; item.status = 'done'; }
                    else { item.status = 'fail'; }
                    renderFiles();
                })
                .catch(function() { item.status = 'fail'; renderFiles(); });
            };
            reader.readAsDataURL(item.file);
        }

        function renderFiles() {
            fileList.innerHTML = uploadedFiles.map(function(item, i) {
                var ext = item.name.split('.').pop().toLowerCase();
                var iconCls = getFileIconClass(ext);
                var icon = getFileIcon(ext);
                var statusText = item.status === 'uploading' ? '업로드 중...' : item.status === 'done' ? '완료' : '실패';
                return '<div class="file-preview-item">' +
                    '<div class="file-icon ' + iconCls + '"><i class="fa-solid ' + icon + '"></i></div>' +
                    '<div class="file-info"><div class="file-name">' + item.name + '</div><div class="file-size">' + item.size + '</div></div>' +
                    '<span class="file-status ' + item.status + '">' + statusText + '</span>' +
                    '<button type="button" class="file-del" onclick="removeFile(' + i + ')"><i class="fa-solid fa-xmark"></i></button>' +
                '</div>';
            }).join('');
        }
        window.removeFile = function(i) { uploadedFiles.splice(i, 1); renderFiles(); };

        function applyEditPrefill(post) {
            editingPost = post;
            editMode = true;
            headingEl.textContent = '글 수정';
            submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> 수정';
            categoryEl.value = post.category || '';
            titleEl.value = post.title || '';
            contentEl.value = post.content || '';
            charCount.textContent = (post.content || '').length;
            (post.images || []).forEach(function(u) {
                uploadedImages.push({ file: null, url: u, status: 'done', existing: true });
            });
            (post.attachments || []).forEach(function(a) {
                uploadedFiles.push({ file: null, url: a.url, name: a.name, size: a.size || '', status: 'done', existing: true });
            });
            renderImages();
            renderFiles();
        }

        if (editId) {
            var local = DataService.getById('community', editId);
            var currentUser = DataService.getCurrentUser();
            function checkOwner(p) {
                if (!p) return false;
                if (!p.ownerId || !currentUser || !currentUser.id) return false;
                return String(p.ownerId) === String(currentUser.id);
            }
            if (local && checkOwner(local)) {
                applyEditPrefill(local);
            } else {
                fetch('/api/community').then(function(r){return r.json()}).then(function(res){
                    var found = (res.posts || []).find(function(p){return p.id === editId});
                    if (found && checkOwner(found)) {
                        applyEditPrefill(found);
                    } else {
                        App.toast('수정 권한이 없거나 게시글을 찾을 수 없습니다.', 'error');
                        setTimeout(function(){ location.href = 'community.html'; }, 1000);
                    }
                }).catch(function(){
                    App.toast('게시글을 불러올 수 없습니다.', 'error');
                    setTimeout(function(){ location.href = 'community.html'; }, 1000);
                });
            }
        }

        // 유효성 검사
        function validate() {
            let valid = true;

            const catError = document.getElementById('catError');
            const titleError = document.getElementById('titleError');
            const contentError = document.getElementById('contentError');

            if (!categoryEl.value) {
                catError.classList.add('show');
                valid = false;
            } else {
                catError.classList.remove('show');
            }

            if (!titleEl.value.trim()) {
                titleError.classList.add('show');
                valid = false;
            } else {
                titleError.classList.remove('show');
            }

            if (!contentEl.value.trim()) {
                contentError.classList.add('show');
                valid = false;
            } else {
                contentError.classList.remove('show');
            }

            return valid;
        }

        // 등록 / 수정
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!validate()) {
                App.toast('필수 항목을 모두 입력해주세요.', 'error');
                return;
            }

            const user = DataService.getCurrentUser();
            var images = uploadedImages.filter(function(img) { return img.status === 'done' && img.url; }).map(function(img) { return img.url; });
            var attachments = uploadedFiles.filter(function(f) { return f.status === 'done' && f.url; }).map(function(f) { return { name: f.name, url: f.url, size: f.size }; });

            if (editMode && editingPost) {
                // 수정 모드
                var updates = {
                    title: titleEl.value.trim(),
                    category: categoryEl.value,
                    content: contentEl.value.trim(),
                    images: images,
                    attachments: attachments
                };
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 수정 중...';
                fetch('/api/community', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-owner-id': user && user.id ? String(user.id) : ''
                    },
                    body: JSON.stringify(Object.assign({ id: editingPost.id }, updates))
                })
                .then(function(r) { return r.json().then(function(j){ return { ok: r.ok, body: j }; }); })
                .then(function(out) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> 수정';
                    if (!out.ok) {
                        App.toast(out.body.error || '수정 실패', 'error');
                        return;
                    }
                    DataService.update('community', editingPost.id, updates);
                    App.toast('게시글이 수정되었습니다.', 'success');
                    setTimeout(function() { location.href = 'community-detail.html?id=' + editingPost.id; }, 700);
                })
                .catch(function() {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> 수정';
                    App.toast('수정 중 오류가 발생했습니다.', 'error');
                });
                return;
            }

            // 신규 등록
            const now = new Date();
            const dateStr = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0');

            const newPost = {
                title: titleEl.value.trim(),
                category: categoryEl.value,
                content: contentEl.value.trim(),
                images: images,
                attachments: attachments,
                author: user.name,
                ownerId: user && user.id ? user.id : '',
                ownerEmail: user && user.email ? user.email : '',
                date: dateStr,
                views: 0,
                comments: 0,
                likes: 0
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 등록 중...';

            fetch('/api/community', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPost)
            })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> 등록';
                /* API 성공 시 로컬에도 저장하여 즉시 반영 */
                newPost.id = res.id || Date.now().toString(36);
                DataService.create('community', newPost);
                App.toast('게시글이 등록되었습니다.', 'success');
                setTimeout(function() { location.href = 'community.html'; }, 800);
            })
            .catch(function() {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> 등록';
                newPost.id = Date.now().toString(36);
                DataService.create('community', newPost);
                App.toast('게시글이 등록되었습니다.', 'success');
                setTimeout(function() { location.href = 'community.html'; }, 800);
            });
        });

        // 입력 시 에러 제거
        categoryEl.addEventListener('change', function() { document.getElementById('catError').classList.remove('show'); });
        titleEl.addEventListener('input', function() { document.getElementById('titleError').classList.remove('show'); });
        contentEl.addEventListener('input', function() { document.getElementById('contentError').classList.remove('show'); });
    });
})();
</script>
</body>
</html>
