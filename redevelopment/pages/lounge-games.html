<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 모음 — 세울 쉼터 | (주)세울엔지니어링</title>
    <meta name="description" content="세울 쉼터 게임 모음 허브. 슬롯·카드·퍼즐·아케이드·보드 카테고리의 가벼운 미니게임을 즐겨보세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260509e">
    <style>
    /* === Hub Hero === */
    .lgh-hero{padding:56px 0 40px;background:linear-gradient(135deg,#060A14 0%,#0A0F1C 40%,#142644 100%);position:relative;overflow:hidden}
    .lgh-hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(195,165,105,.1) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(195,165,105,.06) 0%,transparent 50%);pointer-events:none}
    .lgh-hero .inner{position:relative;z-index:1;text-align:center}
    .lgh-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.5);text-decoration:none;margin-bottom:14px;letter-spacing:.5px}
    .lgh-back:hover{color:var(--gold)}
    .lgh-back i{font-size:11px}
    .lgh-label{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
    .lgh-label::before,.lgh-label::after{content:'';width:24px;height:1px;background:var(--gold);opacity:.6}
    .lgh-hero h1{font-size:32px;font-weight:900;color:#fff;line-height:1.3;margin-bottom:10px;letter-spacing:-.6px}
    .lgh-hero h1 em{font-style:normal;color:var(--gold)}
    .lgh-hero p{font-size:14px;line-height:1.7;color:rgba(255,255,255,.6);max-width:520px;margin:0 auto}

    /* === Body === */
    .lgh-body{padding:48px 0 96px;background:linear-gradient(180deg,#fff,#f7f8fb)}

    /* === Category Tabs === */
    .lgh-cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px;padding:0 16px}
    .lgh-cat-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;background:#fff;border:1.5px solid var(--gray-200);border-radius:30px;cursor:pointer;font-size:13px;font-weight:700;color:var(--gray-600);font-family:var(--font);transition:all .2s;letter-spacing:-.2px}
    .lgh-cat-btn i{font-size:11px;opacity:.7}
    .lgh-cat-btn:hover{border-color:rgba(195,165,105,.45);color:var(--brand-dark)}
    .lgh-cat-btn.on{background:var(--brand-dark);color:var(--gold);border-color:var(--brand-dark);box-shadow:0 6px 18px rgba(10,15,28,.18)}
    .lgh-cat-btn.on i{opacity:1}
    .lgh-cat-btn .lgh-cat-cnt{display:inline-block;min-width:18px;padding:1px 6px;background:rgba(195,165,105,.15);color:var(--gold);border-radius:9px;font-size:10.5px;font-weight:800;text-align:center;margin-left:2px}
    .lgh-cat-btn.on .lgh-cat-cnt{background:rgba(195,165,105,.25);color:var(--gold)}

    /* === Game Card Grid === */
    .lgh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;max-width:1080px;margin:0 auto}
    .lgh-game{background:#fff;border:1px solid var(--gray-200);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:all .25s;text-decoration:none;color:inherit;position:relative}
    .lgh-game.playable{cursor:pointer}
    .lgh-game.playable:hover{transform:translateY(-4px);border-color:rgba(195,165,105,.4);box-shadow:0 16px 36px rgba(10,15,28,.08)}
    .lgh-game.soon{opacity:.65;cursor:default}
    .lgh-game-thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#0F1D35,#1a2d50);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .lgh-game-thumb::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 30% 30%,rgba(195,165,105,.18),transparent 60%);pointer-events:none}
    .lgh-game-thumb i{font-size:54px;color:rgba(195,165,105,.7);position:relative;z-index:1}
    .lgh-game.playable:hover .lgh-game-thumb i{color:var(--gold);transform:scale(1.08);transition:all .3s}
    .lgh-game-cat{position:absolute;top:12px;left:12px;font-size:9.5px;font-weight:800;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;background:rgba(10,15,28,.7);padding:4px 9px;border-radius:6px;border:1px solid rgba(195,165,105,.3);z-index:2}
    .lgh-game-soon-badge{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:800;color:rgba(255,255,255,.8);letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.12);padding:4px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.2);z-index:2}
    .lgh-game-body{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column}
    .lgh-game-title{font-size:16px;font-weight:800;color:var(--brand-dark);margin-bottom:6px;letter-spacing:-.2px}
    .lgh-game-desc{font-size:12.5px;color:var(--gray-500);line-height:1.65;margin-bottom:14px;flex:1}
    .lgh-game-cta{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.8px}
    .lgh-game-cta i{font-size:10px;transition:transform .2s}
    .lgh-game.playable:hover .lgh-game-cta i{transform:translateX(3px)}
    .lgh-game.soon .lgh-game-cta{color:var(--gray-400)}

    .lgh-empty{text-align:center;padding:48px 20px;color:var(--gray-400);font-size:14px}
    .lgh-empty i{display:block;font-size:32px;color:var(--gray-300);margin-bottom:10px}

    @media(max-width:540px){
        .lgh-hero{padding:40px 0 28px}
        .lgh-hero h1{font-size:24px}
        .lgh-cat-btn{font-size:12px;padding:8px 14px}
        .lgh-grid{grid-template-columns:1fr;gap:14px}
    }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="lgh-hero">
    <div class="inner">
        <a href="lounge.html" class="lgh-back"><i class="fa-solid fa-arrow-left"></i> 쉼터로 돌아가기</a>
        <div class="lgh-label">Game Lounge</div>
        <h1>게임 <em>모음</em></h1>
        <p>잠시 쉬어가는 가벼운 미니게임. 카테고리로 골라 즐겨보세요.</p>
    </div>
</div>

<div class="lgh-body">
    <div class="inner">
        <div class="lgh-cats" id="lghCats"></div>
        <div class="lgh-grid" id="lghGrid"></div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=form0614a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260614a"></script>
<script>
(function(){
    /* === Game Catalog (확장 시 이 배열에 항목 추가) ===
       cat: 카테고리 키 (CATS의 key와 일치)
       status: 'play' | 'soon'  ('play'면 url로 이동, 'soon'은 비활성)
    */
    const CATS = [
        { key:'all',     label:'전체',     icon:'fa-th' },
        { key:'slot',    label:'슬롯',     icon:'fa-dice' },
        { key:'card',    label:'카드',     icon:'fa-clone' },
        { key:'puzzle',  label:'퍼즐',     icon:'fa-puzzle-piece' },
        { key:'arcade',  label:'아케이드', icon:'fa-gamepad' },
        { key:'board',   label:'보드',     icon:'fa-chess-board' },
        { key:'lottery', label:'추첨',     icon:'fa-stairs' },
        { key:'quiz',    label:'퀴즈',     icon:'fa-circle-question' }
    ];
    const GAMES = [
        { id:'slot777', cat:'slot', title:'Lucky 777 슬롯',
          desc:'세 개의 7을 맞추면 잭팟! SEUL 보너스로 크레딧 ×3.',
          icon:'fa-dice', url:'lounge-game-slot777.html', status:'play' },
        { id:'memory',  cat:'card', title:'기억력 카드',
          desc:'4×4 16장에서 8쌍 짝 맞추기. 적은 횟수·짧은 시간 도전.',
          icon:'fa-clone', url:'lounge-game-memory.html', status:'play' },
        { id:'2048',    cat:'puzzle', title:'2048',
          desc:'4×4 그리드에서 같은 숫자 합쳐 2048 만들기. 베스트 점수 저장.',
          icon:'fa-puzzle-piece', url:'lounge-game-2048.html', status:'play' },
        { id:'omok',    cat:'board', title:'오목',
          desc:'15×15 바둑판에서 컴퓨터(백) 대전. 흑돌로 5목 완성.',
          icon:'fa-chess-board', url:'lounge-game-omok.html', status:'play' },
        { id:'baduk',   cat:'board', title:'바둑 (9×9 미니)',
          desc:'9×9 미니 바둑판. 따냄·자살수·패 룰 + 양쪽 패스 시 영역 계산(덤 6.5).',
          icon:'fa-circle-dot', url:'lounge-game-baduk.html', status:'play' },
        { id:'tetris',  cat:'arcade', title:'테트리스 라이트',
          desc:'10×18 보드 7종 블록. 한 번에 4줄(테트리스) 보너스. Next 미리보기.',
          icon:'fa-gamepad', url:'lounge-game-tetris.html', status:'play' },
        { id:'sudoku',  cat:'puzzle', title:'스도쿠',
          desc:'9×9 논리 퍼즐. 쉬움·보통·어려움 난이도 + 검증/힌트.',
          icon:'fa-table-cells', url:'lounge-game-sudoku.html', status:'play' },
        { id:'ladder',  cat:'lottery', title:'사다리타기',
          desc:'밥값 내기·용돈 주기·쓰레기 버리기 등. 인원 2~10명, 결과 자유 입력.',
          icon:'fa-stairs', url:'lounge-game-ladder.html', status:'play' },
        { id:'quiz',    cat:'quiz', title:'재개발 OX 퀴즈',
          desc:'도시정비법·실무 절차 12문항 중 10문항 무작위. 정답·해설 즉시 표시.',
          icon:'fa-circle-question', url:'lounge-game-quiz.html', status:'play' }
    ];

    const elCats = document.getElementById('lghCats');
    const elGrid = document.getElementById('lghGrid');
    let curCat = 'all';

    function countByCat(key){
        return key === 'all' ? GAMES.length : GAMES.filter(g => g.cat === key).length;
    }

    function renderCats(){
        elCats.innerHTML = CATS.filter(c => c.key === 'all' || countByCat(c.key) > 0).map(c => {
            const cnt = countByCat(c.key);
            return '<button class="lgh-cat-btn'+(curCat===c.key?' on':'')+'" data-cat="'+c.key+'">'
                + '<i class="fa-solid '+c.icon+'"></i>'+c.label
                + '<span class="lgh-cat-cnt">'+cnt+'</span></button>';
        }).join('');
    }

    function catLabel(key){
        const c = CATS.find(x => x.key === key);
        return c ? c.label : key;
    }

    function renderGrid(){
        const list = curCat === 'all' ? GAMES : GAMES.filter(g => g.cat === curCat);
        if(!list.length){
            elGrid.innerHTML = '<div class="lgh-empty"><i class="fa-solid fa-ghost"></i>해당 카테고리에 등록된 게임이 없습니다.</div>';
            return;
        }
        elGrid.innerHTML = list.map(g => {
            const playable = g.status === 'play';
            const tag = playable
                ? '<a href="'+g.url+'" class="lgh-game playable">'
                : '<div class="lgh-game soon" role="button" aria-disabled="true">';
            const close = playable ? '</a>' : '</div>';
            const soonBadge = playable ? '' : '<span class="lgh-game-soon-badge">Coming Soon</span>';
            const cta = playable
                ? '<span class="lgh-game-cta">▶ Play Now <i class="fa-solid fa-arrow-right"></i></span>'
                : '<span class="lgh-game-cta">준비 중</span>';
            return tag
                + '<div class="lgh-game-thumb">'
                +   '<span class="lgh-game-cat">'+catLabel(g.cat)+'</span>'
                +   soonBadge
                +   '<i class="fa-solid '+g.icon+'"></i>'
                + '</div>'
                + '<div class="lgh-game-body">'
                +   '<div class="lgh-game-title">'+g.title+'</div>'
                +   '<div class="lgh-game-desc">'+g.desc+'</div>'
                +   cta
                + '</div>'
                + close;
        }).join('');
    }

    elCats.addEventListener('click', function(e){
        const btn = e.target.closest('.lgh-cat-btn');
        if(!btn) return;
        curCat = btn.dataset.cat;
        renderCats();
        renderGrid();
    });

    renderCats();
    renderGrid();
})();
</script>
</body>
</html>
