<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시세·분석 — (주)세울엔지니어링</title>
    <meta name="description" content="전국 재개발·재건축 구역의 프리미엄 시세, 변동률, 비례율을 한눈에 비교 분석하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
    .market-tabs { margin-bottom: 24px; }
    .market-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
    @media (max-width: 1024px) { .market-summary { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 540px) { .market-summary { grid-template-columns: 1fr; } }
    .summary-card { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 24px; }
    .summary-card .sc-label { font-size: 13px; color: var(--gray-500); margin-bottom: 8px; }
    .summary-card .sc-value { font-size: 28px; font-weight: 800; color: var(--gray-900); }
    .summary-card .sc-sub { font-size: 12px; color: var(--gray-400); margin-top: 4px; }
    .tbl tbody tr { cursor: pointer; }
    .tbl .area-name-cell { font-weight: 600; color: var(--accent); }
    .chart-section { margin-top: 48px; }
    .chart-section h3 { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .bar-chart { display: flex; flex-direction: column; gap: 16px; }
    .bar-row { display: flex; align-items: center; gap: 16px; }
    .bar-label { width: 80px; font-size: 14px; font-weight: 600; color: var(--gray-700); text-align: right; flex-shrink: 0; }
    .bar-track { flex: 1; height: 36px; background: var(--gray-100); border-radius: 6px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; transition: width 0.8s ease; }
    .bar-fill span { font-size: 13px; font-weight: 700; color: var(--white); white-space: nowrap; }
    .top5-section { margin-top: 48px; }
    .top5-section h3 { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .top5-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
    @media (max-width: 1024px) { .top5-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 540px) { .top5-grid { grid-template-columns: 1fr; } }
    .top5-card { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 24px 20px; text-align: center; position: relative; transition: all 0.25s ease; cursor: pointer; }
    .top5-card:hover { border-color: var(--gray-300); box-shadow: var(--shadow-hover); transform: translateY(-4px); }
    .top5-rank { position: absolute; top: 12px; left: 12px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
    .top5-card .t5-name { font-size: 16px; font-weight: 700; margin-bottom: 8px; margin-top: 8px; }
    .top5-card .t5-change { font-size: 20px; font-weight: 800; }
    .top5-card .t5-premium { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>시세·분석</span>
        </div>
        <h1>시세·분석</h1>
        <p>재개발·재건축 구역의 프리미엄 시세와 변동 추이를 분석합니다</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">
        <!-- 탭 -->
        <div class="tabs market-tabs" id="regionTabs">
            <button class="on" data-region="전체">전체</button>
            <button data-region="서울">서울</button>
            <button data-region="경기">경기</button>
            <button data-region="인천">인천</button>
            <button data-region="부산">부산</button>
        </div>

        <!-- 요약 -->
        <div class="market-summary" id="summaryCards"></div>

        <!-- 테이블 -->
        <div class="tbl-wrap">
            <table class="tbl" id="marketTable">
                <thead>
                    <tr>
                        <th>구역명</th>
                        <th>유형</th>
                        <th>진행단계</th>
                        <th>프리미엄 (만원/3.3㎡)</th>
                        <th>변동</th>
                        <th>비례율</th>
                    </tr>
                </thead>
                <tbody id="marketBody"></tbody>
            </table>
        </div>

        <!-- 지역별 평균 프리미엄 차트 -->
        <div class="chart-section">
            <h3>지역별 평균 프리미엄</h3>
            <div class="bar-chart" id="barChart"></div>
        </div>

        <!-- TOP 5 -->
        <div class="top5-section">
            <h3>프리미엄 상승률 TOP 5</h3>
            <div class="top5-grid" id="top5Grid"></div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js"></script>
<script src="../assets/js/data-service.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(function() {
    let currentRegion = '전체';

    function render() {
        const allAreas = DataService.getAll('areas');
        let filtered = allAreas;

        // 서울 지역 기본 포함 (mock 데이터가 서울 위주)
        if (currentRegion !== '전체') {
            // 간단 매핑: district 기반
            if (currentRegion === '서울') {
                const seoulDistricts = ['용산구','동작구','영등포구','동대문구','성북구','은평구','강동구','강남구','송파구'];
                filtered = allAreas.filter(a => seoulDistricts.includes(a.district));
            } else {
                // 다른 지역은 데이터 없으므로 빈 배열
                filtered = [];
            }
        }

        // 요약 카드
        const totalAreas = filtered.length;
        const avgPremium = totalAreas > 0 ? Math.round(filtered.reduce((s, a) => s + a.premium, 0) / totalAreas) : 0;
        const avgRatio = totalAreas > 0 ? Math.round(filtered.filter(a => a.ratio > 0).reduce((s, a) => s + a.ratio, 0) / (filtered.filter(a => a.ratio > 0).length || 1)) : 0;
        const upCount = filtered.filter(a => a.changeDir === 'up').length;

        document.getElementById('summaryCards').innerHTML = `
            <div class="summary-card">
                <div class="sc-label">총 구역 수</div>
                <div class="sc-value">${totalAreas}</div>
                <div class="sc-sub">현재 진행 중인 구역</div>
            </div>
            <div class="summary-card">
                <div class="sc-label">평균 프리미엄</div>
                <div class="sc-value">${App.comma(avgPremium)}<small style="font-size:14px;font-weight:400;color:var(--gray-500)"> 만원</small></div>
                <div class="sc-sub">3.3㎡ 기준</div>
            </div>
            <div class="summary-card">
                <div class="sc-label">평균 비례율</div>
                <div class="sc-value">${avgRatio}%</div>
                <div class="sc-sub">산정 완료 구역 기준</div>
            </div>
            <div class="summary-card">
                <div class="sc-label">상승 구역</div>
                <div class="sc-value" style="color:var(--red)">${upCount}<small style="font-size:14px;font-weight:400;color:var(--gray-500)"> / ${totalAreas}</small></div>
                <div class="sc-sub">전월 대비 상승</div>
            </div>`;

        // 테이블
        const tbody = document.getElementById('marketBody');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--gray-400)">해당 지역의 데이터가 없습니다</td></tr>';
        } else {
            tbody.innerHTML = filtered.sort((a, b) => b.premium - a.premium).map(a => {
                const changeClass = a.changeDir === 'up' ? 'val-up' : a.changeDir === 'down' ? 'val-down' : 'val-flat';
                const changeIcon = a.changeDir === 'up' ? '▲' : a.changeDir === 'down' ? '▼' : '-';
                const detailPage = a.type === '재건축' ? 'reconstruction-detail.html' : 'area-detail.html';
                return `
                <tr onclick="location.href='${detailPage}?id=${a.id}'">
                    <td class="area-name-cell">${a.name}</td>
                    <td>${a.type}</td>
                    <td><span class="stage">${a.stage}</span></td>
                    <td style="font-weight:700">${App.comma(a.premium)}</td>
                    <td class="${changeClass}">${changeIcon} ${App.comma(Math.abs(a.change))}</td>
                    <td>${a.ratio ? a.ratio + '%' : '-'}</td>
                </tr>`;
            }).join('');
        }

        // 지역별 평균 프리미엄 차트
        renderBarChart(allAreas);

        // TOP 5
        renderTop5(allAreas);
    }

    function renderBarChart(allAreas) {
        const districtMap = {};
        allAreas.forEach(a => {
            if (!districtMap[a.district]) districtMap[a.district] = [];
            districtMap[a.district].push(a.premium);
        });

        const chartData = Object.entries(districtMap).map(([district, premiums]) => ({
            district,
            avg: Math.round(premiums.reduce((s, p) => s + p, 0) / premiums.length)
        })).sort((a, b) => b.avg - a.avg);

        const maxVal = chartData.length > 0 ? chartData[0].avg : 1;

        document.getElementById('barChart').innerHTML = chartData.map(d => {
            const pct = Math.round((d.avg / maxVal) * 100);
            return `
            <div class="bar-row">
                <div class="bar-label">${d.district}</div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${pct}%">
                        <span>${App.comma(d.avg)}만원</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function renderTop5(allAreas) {
        const sorted = [...allAreas]
            .filter(a => a.change > 0 && a.premium > 0)
            .sort((a, b) => {
                const rateA = (a.change / (a.premium - a.change)) * 100;
                const rateB = (b.change / (b.premium - b.change)) * 100;
                return rateB - rateA;
            })
            .slice(0, 5);

        document.getElementById('top5Grid').innerHTML = sorted.map((a, i) => {
            const rate = ((a.change / (a.premium - a.change)) * 100).toFixed(1);
            const detailPage = a.type === '재건축' ? 'reconstruction-detail.html' : 'area-detail.html';
            return `
            <div class="top5-card" onclick="location.href='${detailPage}?id=${a.id}'">
                <div class="top5-rank">${i + 1}</div>
                <div class="t5-name">${a.name}</div>
                <div class="t5-change val-up">+${rate}%</div>
                <div class="t5-premium">프리미엄 ${App.comma(a.premium)}만원</div>
            </div>`;
        }).join('');
    }

    // 탭 이벤트
    document.getElementById('regionTabs').addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        if (!btn) return;
        this.querySelectorAll('button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        currentRegion = btn.dataset.region;
        render();
    });

    render();
})();
</script>
</body>
</html>
