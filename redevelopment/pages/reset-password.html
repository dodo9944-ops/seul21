<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 — (주)세울엔지니어링</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260614c">
    <style>
    .auth-container { max-width: 440px; margin: 0 auto; padding: 60px 20px 80px; }
    .auth-logo { text-align: center; margin-bottom: 8px; }
    .auth-logo a { font-size: 28px; font-weight: 900; color: var(--gray-900); letter-spacing: -0.5px; }
    .auth-subtitle { text-align: center; font-size: 14px; color: var(--gray-500); margin-bottom: 36px; }
    .auth-box { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 40px 32px; }
    .auth-box h2 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 12px; }
    .auth-box .desc { font-size: 14px; color: var(--gray-500); text-align: center; margin-bottom: 32px; line-height: 1.6; }
    .step { display: none; }
    .step.active { display: block; }
    .step-indicator {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin-bottom: 32px;
    }
    .step-dot {
        width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700;
        background: var(--gray-100); color: var(--gray-400);
        transition: all var(--transition);
    }
    .step-dot.active { background: var(--accent); color: var(--white); }
    .step-dot.done { background: var(--green); color: var(--white); }
    .step-line { width: 40px; height: 2px; background: var(--gray-200); }
    .step-line.active { background: var(--accent); }
    .verify-row { display: flex; gap: 8px; }
    .verify-row .form-input { flex: 1; }
    .verify-timer { font-size: 13px; color: var(--red); margin-top: 6px; }
    .code-sent-msg {
        display: none; background: var(--accent-light); color: var(--accent);
        padding: 12px 16px; border-radius: var(--radius-sm);
        font-size: 13px; margin-bottom: 16px; text-align: center;
    }
    .success-box {
        text-align: center; padding: 20px 0;
    }
    .success-box .success-icon { font-size: 56px; color: var(--green); margin-bottom: 16px; }
    .success-box h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .success-box p { font-size: 14px; color: var(--gray-500); margin-bottom: 28px; line-height: 1.6; }
    .field-error { font-size: 12px; color: var(--red); margin-top: 4px; display: none; }
    .auth-links { display: flex; justify-content: center; gap: 16px; margin-top: 20px; font-size: 13px; }
    .auth-links a { color: var(--gray-500); transition: color var(--transition); }
    .auth-links a:hover { color: var(--gray-900); }
    .auth-links .sep { color: var(--gray-300); }
    @media (max-width: 540px) {
        .auth-box { padding: 32px 20px; }
    }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="auth-container">
    <div class="auth-logo"><a href="../index.html">세울</a></div>
    <p class="auth-subtitle">비밀번호를 안전하게 재설정하세요</p>

    <div class="auth-box">
        <h2>비밀번호 재설정</h2>

        <div class="step-indicator">
            <div class="step-dot active" id="dot1">1</div>
            <div class="step-line" id="line1"></div>
            <div class="step-dot" id="dot2">2</div>
            <div class="step-line" id="line2"></div>
            <div class="step-dot" id="dot3">3</div>
        </div>

        <!-- Step 1: 이메일 입력 -->
        <div class="step active" id="step1">
            <p class="desc">가입 시 등록한 이메일을 입력하면<br>인증코드를 발송합니다.</p>
            <form id="emailForm">
                <div class="form-group">
                    <label class="form-label" for="email">이메일</label>
                    <input type="email" class="form-input" id="email" placeholder="가입한 이메일 주소를 입력하세요">
                    <div class="field-error" id="emailError"></div>
                </div>
                <button type="submit" class="btn btn-accent btn-lg" style="width:100%;">
                    <i class="fa-solid fa-paper-plane"></i> 인증코드 발송
                </button>
            </form>
        </div>

        <!-- Step 2: 인증코드 입력 -->
        <div class="step" id="step2">
            <div class="code-sent-msg" id="codeSentMsg" style="display:block;">
                <i class="fa-solid fa-check-circle"></i> <span id="sentEmail"></span>(으)로 인증코드를 발송했습니다.
            </div>
            <form id="codeForm">
                <div class="form-group">
                    <label class="form-label" for="verifyCode">인증코드</label>
                    <div class="verify-row">
                        <input type="text" class="form-input" id="verifyCode" placeholder="6자리 인증코드" maxlength="6">
                        <button type="button" class="btn btn-outline btn-md" id="resendBtn">재발송</button>
                    </div>
                    <div class="verify-timer" id="timer"></div>
                    <div class="form-hint">데모: 아무 숫자 6자리를 입력하세요.</div>
                    <div class="field-error" id="codeError"></div>
                </div>
                <button type="submit" class="btn btn-accent btn-lg" style="width:100%;">
                    <i class="fa-solid fa-shield-check"></i> 인증 확인
                </button>
            </form>
        </div>

        <!-- Step 3: 새 비밀번호 입력 -->
        <div class="step" id="step3">
            <p class="desc">새로운 비밀번호를 입력해주세요.</p>
            <form id="resetForm">
                <div class="form-group">
                    <label class="form-label" for="newPassword">새 비밀번호</label>
                    <input type="password" class="form-input" id="newPassword" placeholder="새 비밀번호 (8자 이상)">
                    <div class="field-error" id="newPasswordError"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">비밀번호 확인</label>
                    <input type="password" class="form-input" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요">
                    <div class="field-error" id="confirmPasswordError"></div>
                </div>
                <button type="submit" class="btn btn-accent btn-lg" style="width:100%;">
                    <i class="fa-solid fa-lock"></i> 비밀번호 변경
                </button>
            </form>
        </div>

        <!-- Step Complete -->
        <div class="step" id="stepComplete">
            <div class="success-box">
                <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
                <h3>비밀번호가 변경되었습니다</h3>
                <p>새 비밀번호로 로그인해주세요.<br>보안을 위해 정기적으로 비밀번호를 변경해주세요.</p>
                <a href="login.html" class="btn btn-accent btn-lg" style="width:100%;">
                    <i class="fa-solid fa-right-to-bracket"></i> 로그인하기
                </a>
            </div>
        </div>

        <div class="auth-links" id="authLinks">
            <a href="login.html">로그인</a>
            <span class="sep">|</span>
            <a href="find-id.html">아이디(이메일) 찾기</a>
            <span class="sep">|</span>
            <a href="register.html">회원가입</a>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=form0614a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260614a"></script>
<script>
(function() {
    var currentStep = 1;
    var timerInterval = null;
    var timerSeconds = 180;

    function goToStep(step) {
        currentStep = step;
        document.querySelectorAll('.step').forEach(function(s) { s.classList.remove('active'); });

        if (step <= 3) {
            document.getElementById('step' + step).classList.add('active');
        } else {
            document.getElementById('stepComplete').classList.add('active');
        }

        // 스텝 인디케이터 업데이트
        for (var i = 1; i <= 3; i++) {
            var dot = document.getElementById('dot' + i);
            dot.className = 'step-dot';
            if (i < step) dot.classList.add('done');
            else if (i === step) dot.classList.add('active');
        }
        for (var j = 1; j <= 2; j++) {
            var line = document.getElementById('line' + j);
            line.className = 'step-line';
            if (j < step) line.classList.add('active');
        }

        if (step > 3) {
            document.getElementById('authLinks').style.display = 'none';
        }
    }

    function startTimer() {
        timerSeconds = 180;
        var timerEl = document.getElementById('timer');
        clearInterval(timerInterval);
        timerInterval = setInterval(function() {
            timerSeconds--;
            var min = Math.floor(timerSeconds / 60);
            var sec = timerSeconds % 60;
            timerEl.textContent = '남은 시간: ' + min + ':' + (sec < 10 ? '0' : '') + sec;
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                timerEl.textContent = '인증시간이 만료되었습니다. 인증코드를 재발송해주세요.';
            }
        }, 1000);
    }

    // Step 1: 이메일 입력
    document.getElementById('emailForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var errEl = document.getElementById('emailError');
        errEl.style.display = 'none';

        if (!email) {
            errEl.textContent = '이메일을 입력해주세요.';
            errEl.style.display = 'block';
            return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            errEl.textContent = '올바른 이메일 형식이 아닙니다.';
            errEl.style.display = 'block';
            return;
        }

        // 데모: 이메일 존재 여부와 무관하게 진행
        document.getElementById('sentEmail').textContent = email;
        App.toast('인증코드가 발송되었습니다 (데모)', 'success');
        goToStep(2);
        startTimer();
    });

    // 재발송 버튼
    document.getElementById('resendBtn').addEventListener('click', function() {
        App.toast('인증코드가 재발송되었습니다 (데모)', 'success');
        startTimer();
    });

    // Step 2: 인증코드 확인
    document.getElementById('codeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var code = document.getElementById('verifyCode').value.trim();
        var errEl = document.getElementById('codeError');
        errEl.style.display = 'none';

        if (!code) {
            errEl.textContent = '인증코드를 입력해주세요.';
            errEl.style.display = 'block';
            return;
        }
        if (code.length < 6) {
            errEl.textContent = '6자리 인증코드를 입력해주세요.';
            errEl.style.display = 'block';
            return;
        }

        if (timerSeconds <= 0) {
            errEl.textContent = '인증시간이 만료되었습니다. 인증코드를 재발송해주세요.';
            errEl.style.display = 'block';
            return;
        }

        // 데모: 아무 6자리 코드 허용
        clearInterval(timerInterval);
        App.toast('인증이 완료되었습니다', 'success');
        goToStep(3);
    });

    // Step 3: 새 비밀번호
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var newPw = document.getElementById('newPassword').value;
        var confirmPw = document.getElementById('confirmPassword').value;
        var newPwErr = document.getElementById('newPasswordError');
        var confirmPwErr = document.getElementById('confirmPasswordError');
        newPwErr.style.display = 'none';
        confirmPwErr.style.display = 'none';

        var hasError = false;

        if (!newPw) {
            newPwErr.textContent = '새 비밀번호를 입력해주세요.';
            newPwErr.style.display = 'block';
            hasError = true;
        } else if (newPw.length < 8) {
            newPwErr.textContent = '비밀번호는 8자 이상이어야 합니다.';
            newPwErr.style.display = 'block';
            hasError = true;
        }

        if (newPw !== confirmPw) {
            confirmPwErr.textContent = '비밀번호가 일치하지 않습니다.';
            confirmPwErr.style.display = 'block';
            hasError = true;
        }

        if (hasError) return;

        // 데모: 성공 처리
        App.toast('비밀번호가 성공적으로 변경되었습니다!', 'success');
        goToStep(4);
    });
})();
</script>
</body>
</html>
