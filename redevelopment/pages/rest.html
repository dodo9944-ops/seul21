<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쉼터 — 슬롯 777 | 세울엔지니어링</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#3a1a4a,#0a0010);font-family:"Malgun Gothic","맑은 고딕",sans-serif;color:#fff;overflow:hidden;user-select:none}
  #stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:14px;padding:14px}
  h1{margin:0;font-size:32px;letter-spacing:6px;color:#ffd84d;text-shadow:0 0 18px #ffae00,0 0 36px #ff5500;font-weight:900}
  h1 span{display:inline-block;animation:bounce 1.2s infinite alternate}
  h1 span:nth-child(2){animation-delay:.15s}
  h1 span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-6px)}}
  #cabinet{
    background:linear-gradient(#ffcf3a,#b8810a);
    padding:14px;border-radius:20px;
    box-shadow:0 0 0 5px #6b3e0a, 0 0 50px #ffae0066, inset 0 0 25px #00000055;
    border:3px solid #fff8d6;
  }
  #screen{
    background:#0a0010;border-radius:12px;padding:10px;
    box-shadow:inset 0 0 22px #ff990044;
    display:flex;gap:8px;
  }
  .reel{
    width:90px;height:120px;overflow:hidden;
    background:linear-gradient(#fff,#ddd);
    border:3px solid #6b3e0a;border-radius:8px;
    position:relative;
  }
  .reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:24px;z-index:2;pointer-events:none}
  .reel::before{top:0;background:linear-gradient(#000a,transparent)}
  .reel::after{bottom:0;background:linear-gradient(transparent,#000a)}
  .strip{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
  .sym{height:120px;display:flex;align-items:center;justify-content:center;font-size:64px;width:100%}
  .sym.s7{color:#e30}.sym.bar{color:#222;font-size:28px;font-weight:900;letter-spacing:2px}
  #payline{position:relative;height:0}
  #payline div{position:absolute;left:14px;right:14px;top:-72px;height:3px;background:#ff3355;box-shadow:0 0 10px #ff3355;border-radius:2px}
  #hud{display:flex;gap:18px;font-size:15px;background:#0008;padding:8px 16px;border-radius:10px;border:1px solid #ffd84d44;flex-wrap:wrap;justify-content:center}
  #hud b{color:#ffd84d;font-size:18px}
  #ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{
    background:linear-gradient(#ff3355,#a30022);color:#fff;border:0;
    padding:11px 22px;border-radius:50px;font-weight:900;font-size:15px;
    cursor:pointer;letter-spacing:1.5px;
    box-shadow:0 5px 0 #5a000f, 0 0 18px #ff335588;
    transition:transform .05s;
  }
  button:active{transform:translateY(2px);box-shadow:0 3px 0 #5a000f}
  button:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
  #betbox{display:flex;gap:5px;align-items:center;background:#0008;padding:6px 10px;border-radius:8px;font-size:13px}
  #betbox button{padding:3px 10px;font-size:12px;background:#444;box-shadow:none}
  #message{height:24px;font-size:16px;font-weight:900;color:#ffd84d;text-shadow:0 0 8px #ff8800;letter-spacing:1.5px;text-align:center}
  .win{animation:flash .4s 4}
  @keyframes flash{50%{filter:brightness(2) hue-rotate(30deg)}}
  #info{font-size:11px;color:#aaa;max-width:420px;text-align:center;line-height:1.6}
  #back{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:12px;border:1px solid rgba(255,255,255,.2)}
  #back:hover{background:rgba(0,0,0,.8)}
</style>
</head>
<body>
<a id="back" href="../index.html">← 홈으로</a>
<div id="stage">
  <h1><span>7</span><span>7</span><span>7</span></h1>
  <div id="message">스핀 버튼을 누르세요</div>
  <div id="cabinet">
    <div id="screen">
      <div class="reel"><div class="strip" id="r0"></div></div>
      <div class="reel"><div class="strip" id="r1"></div></div>
      <div class="reel"><div class="strip" id="r2"></div></div>
    </div>
    <div id="payline"><div></div></div>
  </div>
  <div id="hud">
    <div>크레딧 <b id="credit">100</b></div>
    <div>베팅 <b id="bet">1</b></div>
    <div>최근당첨 <b id="lastwin">0</b></div>
  </div>
  <div id="ctrl">
    <div id="betbox">
      <button id="betDown">-</button>
      <span>BET</span>
      <button id="betUp">+</button>
      <button id="betMax">MAX</button>
    </div>
    <button id="spin">SPIN</button>
  </div>
  <div id="info">
    777=잭팟(베팅×100) · 같은심볼3=베팅×10 · BAR3개=베팅×20 · 7 두개=베팅×3 · 체리 1개라도=베팅×1
  </div>
</div>
<script>
const SYMBOLS = [
  {key:'7',  ch:'7',  cls:'s7',  weight:1},
  {key:'BAR',ch:'BAR',cls:'bar', weight:2},
  {key:'🍒',ch:'🍒', cls:'',    weight:5},
  {key:'🍋',ch:'🍋', cls:'',    weight:4},
  {key:'🔔',ch:'🔔', cls:'',    weight:3},
  {key:'⭐',ch:'⭐', cls:'',    weight:3},
  {key:'💎',ch:'💎', cls:'',    weight:2},
];
const ITEM_H = 120;
const POOL = [];
SYMBOLS.forEach(s=>{ for(let i=0;i<s.weight;i++) POOL.push(s); });
function pickSymbol(){ return POOL[Math.floor(Math.random()*POOL.length)]; }
const reels = [];
for(let i=0;i<3;i++){
  const el = document.getElementById('r'+i);
  const items = [];
  for(let k=0;k<50;k++){
    const s = pickSymbol();
    items.push(s);
    const div = document.createElement('div');
    div.className = 'sym ' + s.cls;
    div.textContent = s.ch;
    el.appendChild(div);
  }
  reels.push({el, items, pos:0, spinning:false});
}
let credit = 100, bet = 1;
const $credit=document.getElementById('credit');
const $bet=document.getElementById('bet');
const $lastwin=document.getElementById('lastwin');
const $msg=document.getElementById('message');
const $spin=document.getElementById('spin');
function setReelPos(reel, idx, animate, dur){
  const y = -idx * ITEM_H;
  reel.el.style.transition = animate ? `transform ${dur}ms cubic-bezier(.2,.7,.2,1)` : 'none';
  reel.el.style.transform = `translateY(${y}px)`;
  reel.pos = idx;
}
reels.forEach((r,i)=>setReelPos(r, 5+i, false));
function spin(){
  if(reels.some(r=>r.spinning)) return;
  if(credit < bet){ $msg.textContent = '크레딧 부족'; return; }
  credit -= bet; $credit.textContent = credit;
  $msg.textContent = '🎰 돌아가는 중...';
  $spin.disabled = true;
  reels.forEach((r,i)=>{
    r.spinning = true;
    const target = r.pos + 20 + i*10 + Math.floor(Math.random()*7);
    const dur = 1100 + i*550;
    setReelPos(r, target, true, dur);
    setTimeout(()=>{
      r.spinning = false;
      r.pos = target;
      if(reels.every(rr=>!rr.spinning)){
        evaluate();
        reels.forEach(rr=>{
          const visualIdx = rr.pos % rr.items.length;
          setReelPos(rr, visualIdx, false);
        });
        $spin.disabled = false;
      }
    }, dur + 30);
  });
}
function getCenterSymbol(r){
  const i = ((r.pos) % r.items.length + r.items.length) % r.items.length;
  return r.items[i];
}
function evaluate(){
  const s = reels.map(getCenterSymbol);
  const keys = s.map(x=>x.key);
  let win = 0, msg = '꽝!';
  if(keys[0]==='7' && keys[1]==='7' && keys[2]==='7'){ win = bet * 100; msg = '🎉 777 잭팟!! 🎉'; }
  else if(keys[0]==='BAR' && keys[1]==='BAR' && keys[2]==='BAR'){ win = bet * 20; msg = 'BAR BAR BAR!'; }
  else if(keys[0]===keys[1] && keys[1]===keys[2]){ win = bet * 10; msg = '쓰리 매치!'; }
  else if(keys.filter(k=>k==='7').length === 2){ win = bet * 3; msg = '7 두 개!'; }
  else if(keys.includes('🍒')){ win = bet * 1; msg = '체리!'; }
  credit += win;
  $credit.textContent = credit;
  $lastwin.textContent = win;
  $msg.textContent = msg + (win>0?` (+${win})`:'');
  if(win>0){
    document.getElementById('cabinet').classList.remove('win');
    void document.getElementById('cabinet').offsetWidth;
    document.getElementById('cabinet').classList.add('win');
  }
  if(credit<=0 && win===0){ $msg.textContent = '크레딧 0! 새로고침으로 재시작'; }
}
document.getElementById('spin').onclick = spin;
document.getElementById('betUp').onclick = ()=>{ if(bet<10){ bet++; $bet.textContent=bet; } };
document.getElementById('betDown').onclick = ()=>{ if(bet>1){ bet--; $bet.textContent=bet; } };
document.getElementById('betMax').onclick = ()=>{ bet=Math.min(10,credit); $bet.textContent=bet; };
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); spin(); }});
</script>
</body>
</html>
