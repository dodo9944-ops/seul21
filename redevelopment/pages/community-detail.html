<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 상세 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 커뮤니티 게시글 상세 내용을 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260509e">
    <style>
        .detail-wrap { max-width: 800px; margin: 0 auto; }
        .detail-header { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--gray-200); }
        .detail-header .top-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        }
        .detail-header h1 {
            font-size: 26px; font-weight: 800; color: var(--gray-900);
            line-height: 1.4; margin-bottom: 14px; letter-spacing: -0.3px;
        }
        .detail-meta {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            font-size: 13px; color: var(--gray-500);
        }
        .detail-meta i { font-size: 12px; margin-right: 4px; color: var(--gray-400); }

        .detail-body { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--gray-200); }
        .detail-body p {
            font-size: 15px; line-height: 1.85; color: var(--gray-800);
            margin-bottom: 20px;
        }
        .detail-body p:last-child { margin-bottom: 0; }

        .like-section {
            display: flex; align-items: center; justify-content: center;
            padding: 24px 0; margin-bottom: 32px;
        }
        .like-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 28px; border-radius: 24px;
            border: 1.5px solid var(--gray-200); background: var(--white);
            font-size: 15px; font-weight: 600; color: var(--gray-600);
            cursor: pointer; transition: all var(--transition);
            font-family: var(--font);
        }
        .like-btn:hover { border-color: var(--red); color: var(--red); background: #FFF5F5; }
        .like-btn.liked { border-color: var(--red); color: var(--red); background: #FFF5F5; }
        .like-btn i { font-size: 16px; }

        /* 댓글 영역 */
        .comments-section { margin-bottom: 40px; }
        .comments-section h2 {
            font-size: 18px; font-weight: 700; margin-bottom: 20px;
            color: var(--gray-900);
        }
        .comment-list { display: flex; flex-direction: column; gap: 0; }
        .comment-item {
            padding: 18px 0; border-bottom: 1px solid var(--gray-100);
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 8px;
        }
        .comment-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--gray-100); display: flex;
            align-items: center; justify-content: center;
            color: var(--gray-400); font-size: 14px;
        }
        .comment-author { font-size: 13px; font-weight: 700; color: var(--gray-800); }
        .comment-date { font-size: 12px; color: var(--gray-400); }
        .comment-body { font-size: 14px; line-height: 1.7; color: var(--gray-700); padding-left: 42px; }

        .comment-form {
            margin-top: 24px; padding: 20px; background: var(--gray-50);
            border-radius: var(--radius); border: 1px solid var(--gray-200);
        }
        .comment-form textarea {
            width: 100%; min-height: 80px; padding: 12px 16px;
            border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
            font-size: 14px; font-family: var(--font); color: var(--gray-900);
            outline: none; resize: vertical; background: var(--white);
            transition: border-color var(--transition);
        }
        .comment-form textarea:focus { border-color: var(--accent); }
        .comment-form textarea::placeholder { color: var(--gray-400); }
        .comment-form-actions {
            display: flex; justify-content: flex-end; margin-top: 10px;
        }

        /* 첨부파일 */
        .attachments-section {
            margin-bottom: 24px; padding: 20px;
            background: var(--gray-50); border-radius: var(--radius);
            border: 1px solid var(--gray-200);
        }
        .attachments-section h3 {
            font-size: 14px; font-weight: 700; color: var(--gray-700);
            margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
        }
        .attachments-section h3 i { color: var(--gray-400); }
        .attach-list { display: flex; flex-direction: column; gap: 8px; }
        .attach-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; background: var(--white);
            border-radius: 8px; border: 1px solid var(--gray-200);
            text-decoration: none; transition: all .2s; cursor: pointer;
        }
        .attach-item:hover { border-color: var(--accent); background: rgba(195,165,105,.03); }
        .attach-item .att-icon {
            width: 38px; height: 38px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .att-icon.pdf { background: #FEE2E2; color: #DC2626; }
        .att-icon.hwp { background: #DBEAFE; color: #2563EB; }
        .att-icon.doc { background: #DBEAFE; color: #2563EB; }
        .att-icon.xls { background: #D1FAE5; color: #059669; }
        .att-icon.ppt { background: #FFE4C4; color: #EA580C; }
        .att-icon.zip { background: #F3E8FF; color: #7C3AED; }
        .att-icon.default { background: var(--gray-100); color: var(--gray-500); }
        .attach-item .att-info { flex: 1; min-width: 0; }
        .attach-item .att-name {
            font-size: 13px; font-weight: 600; color: var(--gray-800);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .attach-item .att-size { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
        .attach-item .att-download {
            font-size: 13px; color: var(--accent); font-weight: 600;
            display: flex; align-items: center; gap: 4px; flex-shrink: 0;
        }

        .back-btn-area { margin-top: 32px; }

        .category-badge {
            display: inline-flex; align-items: center;
            padding: 4px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 700;
        }
        .cat-질문 { background: #FFF4E5; color: var(--orange); }
        .cat-정보 { background: var(--accent-light); color: var(--accent); }
        .cat-후기 { background: #E6F9F0; color: var(--green); }
        .cat-분석 { background: #F3E8FF; color: #7C3AED; }
        .cat-칼럼 { background: var(--gray-100); color: var(--gray-600); }

        /* 작성자 액션 (수정/삭제) */
        .owner-actions { display: flex; gap: 8px; margin-top: 14px; }
        .owner-actions .btn-mini {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 14px; border-radius: 8px;
            border: 1.5px solid var(--gray-200); background: var(--white);
            font-size: 12.5px; font-weight: 600; color: var(--gray-700);
            cursor: pointer; transition: all .2s; font-family: var(--font);
        }
        .owner-actions .btn-mini i { font-size: 11px; }
        .owner-actions .btn-edit:hover { border-color: var(--accent); color: var(--accent); background: rgba(195,165,105,.05); }
        .owner-actions .btn-del { color: var(--red); border-color: rgba(239,68,68,.2); }
        .owner-actions .btn-del:hover { background: #FEE2E2; border-color: var(--red); }

        @media (max-width: 768px) {
            .detail-header h1 { font-size: 21px; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-body">
    <div class="inner">
        <div class="detail-wrap" id="detailWrap">
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260527a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260509a"></script>
<script>
(function() {
    document.addEventListener('DOMContentLoaded', function() {
        const id = App.getParam('id');
        if (!id) { location.href = 'community.html'; return; }

        var post = DataService.getById('community', id);

        function renderPost(post) {
        /* 조회수: 세션당 1회만 증가 */
        var viewKey = 'rdc_viewed_' + id;
        var viewCount = post.views || 0;
        if (!sessionStorage.getItem(viewKey)) {
            viewCount++;
            DataService.update('community', id, { views: viewCount });
            sessionStorage.setItem(viewKey, '1');
        }

        App.headTags(post.title, post.content.substring(0, 100));

        /* 좋아요: 로그인 필수 + 세션당 1회 */
        var likeKey = 'rdc_like_' + id;
        var liked = localStorage.getItem(likeKey) === '1';
        var likeCount = post.likes || 0;

        // 첨부파일 아이콘 헬퍼
        function getAttIconClass(ext) {
            if (ext === 'pdf') return 'pdf';
            if (ext === 'hwp' || ext === 'hwpx') return 'hwp';
            if (ext === 'doc' || ext === 'docx') return 'doc';
            if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return 'xls';
            if (ext === 'ppt' || ext === 'pptx') return 'ppt';
            if (ext === 'zip' || ext === 'rar' || ext === '7z') return 'zip';
            return 'default';
        }
        function getAttIcon(ext) {
            if (ext === 'pdf') return 'fa-file-pdf';
            if (ext === 'hwp' || ext === 'hwpx') return 'fa-file-lines';
            if (ext === 'doc' || ext === 'docx') return 'fa-file-word';
            if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return 'fa-file-excel';
            if (ext === 'ppt' || ext === 'pptx') return 'fa-file-powerpoint';
            if (ext === 'zip' || ext === 'rar' || ext === '7z') return 'fa-file-zipper';
            return 'fa-file';
        }

        // 본문
        const paragraphs = post.content.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
        const imagesHTML = (post.images && post.images.length) ? '<div class="post-images" style="display:flex;flex-wrap:wrap;gap:12px;margin:20px 0">' + post.images.map(u => '<a href="' + u + '" target="_blank" style="flex:0 0 auto"><img src="' + u + '" style="max-width:100%;max-height:400px;border-radius:10px;border:1px solid #e5e7eb;cursor:pointer" loading="lazy"></a>').join('') + '</div>' : '';

        // 첨부파일
        var attachHTML = '';
        if (post.attachments && post.attachments.length) {
            attachHTML = '<div class="attachments-section"><h3><i class="fa-solid fa-paperclip"></i> 첨부파일 (' + post.attachments.length + ')</h3><div class="attach-list">' +
                post.attachments.map(function(att) {
                    var ext = (att.name || '').split('.').pop().toLowerCase();
                    return '<a class="attach-item" href="' + att.url + '" download="' + att.name + '">' +
                        '<div class="att-icon ' + getAttIconClass(ext) + '"><i class="fa-solid ' + getAttIcon(ext) + '"></i></div>' +
                        '<div class="att-info"><div class="att-name">' + att.name + '</div><div class="att-size">' + (att.size || '') + '</div></div>' +
                        '<span class="att-download"><i class="fa-solid fa-download"></i> 다운로드</span>' +
                    '</a>';
                }).join('') +
            '</div></div>';
        }

        document.getElementById('detailWrap').innerHTML = `
            <div class="breadcrumb">
                <a href="../index.html">홈</a> <i class="fa-solid fa-chevron-right"></i>
                <a href="community.html">커뮤니티</a> <i class="fa-solid fa-chevron-right"></i>
                <span>${post.title}</span>
            </div>
            <div class="detail-header">
                <div class="top-row">
                    <span class="category-badge cat-${post.category}">${post.category}</span>
                </div>
                <h1>${post.title}</h1>
                <div class="detail-meta">
                    <span><i class="fa-regular fa-user"></i>${post.author}</span>
                    <span><i class="fa-regular fa-calendar"></i>${App.timeAgo(post.date)}</span>
                    <span><i class="fa-regular fa-eye"></i>${App.comma(viewCount)}</span>
                </div>
                <div class="owner-actions" id="ownerActions" style="display:none">
                    <button type="button" class="btn-mini btn-edit" id="editPostBtn"><i class="fa-solid fa-pen"></i> 수정</button>
                    <button type="button" class="btn-mini btn-del" id="deletePostBtn"><i class="fa-solid fa-trash"></i> 삭제</button>
                </div>
            </div>
            <div class="detail-body">${paragraphs}${imagesHTML}</div>
            ${attachHTML}
            <div class="like-section">
                <button class="like-btn${liked ? ' liked' : ''}" id="likeBtn">
                    <i class="fa-${liked ? 'solid' : 'regular'} fa-heart"></i>
                    <span>좋아요</span>
                    <strong id="likeCount">${likeCount}</strong>
                </button>
            </div>
            <div class="comments-section">
                <h2>댓글</h2>
                <div class="comment-list"></div>
                <div class="comment-form">
                    <textarea id="commentInput" placeholder="댓글을 작성해주세요."></textarea>
                    <div class="comment-form-actions">
                        <button class="btn btn-accent btn-sm" id="commentSubmit">댓글 등록</button>
                    </div>
                </div>
            </div>
            <div class="back-btn-area">
                <a href="community.html" class="btn btn-outline btn-md"><i class="fa-solid fa-list"></i> 목록으로 돌아가기</a>
            </div>
        `;

        // 작성자 본인이면 수정/삭제 버튼 노출
        var currentUser = DataService.getCurrentUser();
        var isOwner = !!(currentUser && currentUser.id && post.ownerId && String(currentUser.id) === String(post.ownerId));
        if (isOwner) {
            var actions = document.getElementById('ownerActions');
            if (actions) actions.style.display = 'flex';
            document.getElementById('editPostBtn').addEventListener('click', function() {
                location.href = 'community-write.html?id=' + encodeURIComponent(id);
            });
            document.getElementById('deletePostBtn').addEventListener('click', function() {
                if (!confirm('이 게시글을 삭제하시겠습니까?')) return;
                var btn = this;
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 삭제 중...';
                fetch('/api/community', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-owner-id': String(currentUser.id)
                    },
                    body: JSON.stringify({ id: id })
                })
                .then(function(r) { return r.json().then(function(j){ return { ok: r.ok, body: j }; }); })
                .then(function(out) {
                    if (!out.ok) {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fa-solid fa-trash"></i> 삭제';
                        App.toast(out.body.error || '삭제 실패', 'error');
                        return;
                    }
                    DataService.remove('community', id);
                    App.toast('게시글이 삭제되었습니다.', 'success');
                    setTimeout(function() { location.href = 'community.html'; }, 700);
                })
                .catch(function() {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-trash"></i> 삭제';
                    App.toast('삭제 중 오류가 발생했습니다.', 'error');
                });
            });
        }

        // 좋아요: 로그인 필수 + 1회 제한
        document.getElementById('likeBtn').addEventListener('click', function() {
            if (!DataService.isUserLoggedIn()) {
                App.toast('로그인 후 이용 가능합니다.', 'info');
                return;
            }
            if (liked) {
                App.toast('이미 좋아요를 누르셨습니다.', 'info');
                return;
            }
            liked = true;
            likeCount++;
            localStorage.setItem(likeKey, '1');
            DataService.update('community', id, { likes: likeCount });
            document.getElementById('likeCount').textContent = likeCount;
            this.classList.add('liked');
            this.querySelector('i').className = 'fa-solid fa-heart';
            App.toast('좋아요를 눌렀습니다.', 'success');
        });

        // 댓글 등록
        document.getElementById('commentSubmit').addEventListener('click', function() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) {
                App.toast('댓글 내용을 입력해주세요.', 'error');
                return;
            }
            if (!DataService.isUserLoggedIn()) {
                App.toast('로그인이 필요합니다.', 'info');
                return;
            }
            const user = DataService.getCurrentUser();
            const commentEl = document.createElement('div');
            commentEl.className = 'comment-item';
            commentEl.innerHTML = `
                <div class="comment-header">
                    <div class="comment-avatar"><i class="fa-solid fa-user"></i></div>
                    <span class="comment-author">${user.name}</span>
                    <span class="comment-date">방금 전</span>
                </div>
                <div class="comment-body">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
            `;
            document.querySelector('.comment-list').appendChild(commentEl);
            input.value = '';
            App.toast('댓글이 등록되었습니다.', 'success');
        });
        } /* end renderPost */

        if (post) {
            renderPost(post);
        } else {
            /* 로컬에 없으면 API에서 조회 */
            fetch('/api/community').then(function(r){return r.json()}).then(function(res){
                if(res.posts){
                    var found=res.posts.find(function(p){return p.id===id});
                    if(found){DataService.create('community',found);renderPost(found);return}
                }
                document.getElementById('detailWrap').innerHTML='<div class="empty-state"><i class="fa-solid fa-exclamation-circle"></i><h3>게시글을 찾을 수 없습니다</h3><p>삭제되었거나 존재하지 않는 게시글입니다.</p><a href="community.html" class="btn btn-outline btn-sm">목록으로 돌아가기</a></div>';
            }).catch(function(){
                document.getElementById('detailWrap').innerHTML='<div class="empty-state"><i class="fa-solid fa-exclamation-circle"></i><h3>게시글을 찾을 수 없습니다</h3><p>삭제되었거나 존재하지 않는 게시글입니다.</p><a href="community.html" class="btn btn-outline btn-sm">목록으로 돌아가기</a></div>';
            });
        }
    });
})();
</script>
</body>
</html>
