<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 2 — 주요뉴스 — (주)세울엔지니어링</title>
    <meta name="description" content="정비사업 주요뉴스 — 재개발·재건축·소규모정비·신통기획 최신 뉴스 아카이브.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260418o">
    <style>
    /* === 자료실 2 — 주요뉴스 전용 === */
    .uni-hero{background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand-navy) 100%);color:#fff;padding:48px 0 36px;position:relative;overflow:hidden}
    .uni-hero::before{content:'';position:absolute;inset:0;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><circle cx="30" cy="30" r="1" fill="rgba(195,165,105,0.08)"/></svg>');opacity:.5}
    .uni-hero .inner{position:relative;z-index:1}
    .uh-bc{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:14px}
    .uh-bc a{color:rgba(255,255,255,.55);transition:color .2s}
    .uh-bc a:hover{color:var(--gold)}
    .uh-bc i{font-size:9px;opacity:.5}
    .uh-bc .cur{color:var(--gold)}
    .uh-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
    .uni-hero h1{font-size:32px;font-weight:800;margin-bottom:12px;letter-spacing:-.5px}
    .uh-sub{font-size:14px;color:rgba(255,255,255,.65);max-width:620px;line-height:1.7}
    @media(max-width:768px){.uni-hero{padding:32px 0 28px}.uni-hero h1{font-size:24px}.uh-sub{font-size:13px}}

    /* 소식받기 버튼 */
    .lib-alimtalk-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:11px 24px;background:rgba(195,165,105,.1);border:1.5px solid rgba(195,165,105,.35);border-radius:10px;color:#C3A569;font-size:13.5px;font-weight:700;text-decoration:none;transition:all .2s;font-family:var(--font)}
    .lib-alimtalk-btn:hover{background:rgba(195,165,105,.2);border-color:rgba(195,165,105,.5)}
    .lib-alimtalk-btn i{font-size:15px}
    @media(max-width:600px){.lib-alimtalk-btn{font-size:12px;padding:9px 18px}}

    /* 섹션 헤더 */
    .sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin:40px 0 18px;gap:14px;flex-wrap:wrap}
    .sec-head h2{font-size:22px;font-weight:800;color:var(--gray-900);letter-spacing:-.4px}
    .sec-head .sub{font-size:13px;color:var(--gray-500);margin-top:4px}
    .sec-head .more{font-size:12px;color:var(--brand-dark);font-weight:700;text-decoration:none}
    .sec-head .more:hover{color:var(--gold)}

    /* 주요뉴스 리스트 */
    .news-list{background:#fff;border:1px solid var(--gray-200);border-radius:14px;overflow:hidden}
    .news-row{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--gray-100);transition:background .2s;cursor:pointer;text-decoration:none;color:inherit}
    .news-row:last-child{border-bottom:none}
    .news-row:hover{background:var(--gray-50)}
    .news-row .nb{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--brand-dark),var(--brand-navy));color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
    .news-row .nm{flex:1;min-width:0}
    .news-row .nt{font-size:14px;font-weight:600;color:var(--gray-800);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .news-row .nd{font-size:12px;color:var(--gray-500)}
    .news-row .new-badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:4px;background:#D6423A;color:#fff;font-size:9px;font-weight:700;letter-spacing:.5px;vertical-align:middle}
    .news-row .nx{font-size:11px;color:var(--gray-400)}
    @media(max-width:600px){.news-row{padding:14px 16px;gap:10px}.news-row .nb{width:28px;height:28px;font-size:11px}.news-row .nt{font-size:13px}.news-row .nd{font-size:11px}}

    .empty-state{text-align:center;padding:60px 20px;color:var(--gray-400)}
    .empty-state i{font-size:48px;color:var(--gray-200);margin-bottom:16px;display:block}
    .empty-state h3{font-size:16px;color:var(--gray-600);margin-bottom:6px}
    .empty-state p{font-size:13px}

    /* CTA 배너 */
    .lib2-cta{background:linear-gradient(135deg,#1a2238 0%,#0A0F1C 100%);color:#fff;border-radius:16px;padding:32px 28px;margin:40px 0 0;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .lib2-cta-text h3{font-size:18px;font-weight:800;margin-bottom:6px;color:var(--gold)}
    .lib2-cta-text p{font-size:13px;color:rgba(255,255,255,.65);line-height:1.6}
    .lib2-cta-btn{padding:12px 24px;background:var(--gold);color:var(--brand-dark);border-radius:10px;font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap;transition:all .2s}
    .lib2-cta-btn:hover{background:#d4b577;transform:translateY(-1px)}
    @media(max-width:600px){.lib2-cta{padding:24px 20px;flex-direction:column;align-items:stretch;text-align:center}.lib2-cta-btn{justify-content:center;display:inline-flex}}
    </style>
</head>
<body>
<div id="site-header"></div>

<section class="uni-hero">
    <div class="inner">
        <div class="uh-bc">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span class="cur">자료실 2</span>
        </div>
        <div class="uh-label">NEWS ARCHIVE</div>
        <h1>정비사업 주요뉴스</h1>
        <p class="uh-sub">재개발·재건축·소규모정비·신통기획 등 정비사업 최신 뉴스를 한곳에서 확인하세요. 시장 동향 파악과 사업 의사결정에 필수 정보를 제공합니다.</p>
        <a href="alimtalk.html" class="lib-alimtalk-btn"><i class="fa-regular fa-comment-dots"></i> 소식받기 신청</a>
    </div>
</section>

<div class="page-body">
    <div class="inner">

        <div class="sec-head">
            <div>
                <h2>주요뉴스</h2>
                <div class="sub">최근 1년간의 정비사업 관련 뉴스</div>
            </div>
            <a href="alimtalk.html" class="more"><i class="fa-regular fa-bell" style="margin-right:4px"></i>새 뉴스 알림 받기</a>
        </div>
        <div class="news-list" id="newsList"></div>

        <div class="lib2-cta">
            <div class="lib2-cta-text">
                <h3>정비사업 관련 상담이 필요하신가요?</h3>
                <p>해당 뉴스와 관련한 사업장 맞춤 컨설팅을 제공합니다.</p>
            </div>
            <a href="contact.html" class="lib2-cta-btn"><i class="fa-solid fa-comments" style="margin-right:6px"></i>컨설팅 상담 신청</a>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260418p"></script>
<script src="../assets/js/data-service.js?v=20260418p"></script>
<script src="../assets/js/common.js?v=20260418p"></script>
<script>
(function(){
    var now = new Date();
    var oneYearAgo = new Date(now.getTime() - 365*864e5);
    var libAll = (typeof MOCK !== 'undefined' && MOCK.library) ? MOCK.library : [];
    var newsItems = libAll.filter(function(i){
        return i.category==='주요뉴스' && i.date && new Date(i.date) >= oneYearAgo;
    }).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});

    var newsEl = document.getElementById('newsList');
    function isNew(d){return d && (now - new Date(d)) < 7*864e5}
    function newsUrl(item){
        var d = (item.date||'').replace(/-/g,'');
        var suffix = (item.id||'').replace(/^news/,'');
        var letter = suffix.match(/[a-z]$/) ? suffix.slice(-1) : '';
        return '../downloads/news_' + d + letter + '.html';
    }

    if (newsItems.length === 0) {
        newsEl.innerHTML = '<div class="empty-state"><i class="fa-regular fa-newspaper"></i><h3>최근 1년간의 뉴스가 없습니다</h3></div>';
    } else {
        newsEl.innerHTML = newsItems.map(function(it){
            return '<a class="news-row" href="'+newsUrl(it)+'">'
                + '<div class="nb"><i class="fa-solid fa-newspaper"></i></div>'
                + '<div class="nm"><div class="nt">'+it.title+(isNew(it.date)?'<span class="new-badge">NEW</span>':'')+'</div>'
                + '<div class="nd">'+it.date+(it.tags&&it.tags.length?' · '+it.tags.slice(0,2).join(', '):'')+'</div></div>'
                + '<i class="fa-solid fa-chevron-right nx"></i></a>';
        }).join('');
    }
})();
</script>
</body>
</html>
