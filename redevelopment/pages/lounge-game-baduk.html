<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바둑 (9×9 미니) — 게임 모음 | 세울 쉼터</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260509e">
    <style>
    .lgg-hero{padding:48px 0 36px;background:linear-gradient(135deg,#060A14 0%,#0A0F1C 40%,#142644 100%);text-align:center}
    .lgg-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.5);text-decoration:none;margin-bottom:14px}
    .lgg-back:hover{color:var(--gold)}
    .lgg-cat-tag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:10px;padding:4px 12px;border:1px solid rgba(195,165,105,.35);border-radius:20px}
    .lgg-hero h1{font-size:30px;font-weight:900;color:#fff;margin-bottom:8px}
    .lgg-hero h1 em{font-style:normal;color:var(--gold)}
    .lgg-hero p{font-size:13.5px;color:rgba(255,255,255,.55);margin:0}
    .lgg-body{padding:48px 0 96px;background:linear-gradient(180deg,#fff,#f7f8fb)}

    .bd-wrap{max-width:520px;margin:0 auto}
    .bd-info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
    .bd-stat{background:#0F1D35;color:#fff;border-radius:10px;padding:10px 6px;text-align:center;border:1px solid rgba(195,165,105,.2)}
    .bd-stat .lbl{font-size:9.5px;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:3px}
    .bd-stat .val{font-size:16px;font-weight:900}
    .bd-canvas-wrap{position:relative;background:#dcb47a;border-radius:14px;padding:14px;border:2px solid #8d5a1f;box-shadow:0 12px 32px rgba(0,0,0,.15)}
    canvas#bdCanvas{display:block;width:100%;aspect-ratio:1;cursor:crosshair}

    .bd-actions{display:flex;gap:8px;margin-top:14px}
    .bd-btn{flex:1;padding:11px;border-radius:10px;border:none;cursor:pointer;font-size:12.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-family:var(--font);transition:all .15s}
    .bd-btn-primary{background:linear-gradient(135deg,#C3A569,#D4B87A);color:#0A0F1C}
    .bd-btn-pass{background:#1e3a5f;color:#fff}
    .bd-btn-pass:hover{background:#2a4a75}
    .bd-btn-ghost{background:transparent;color:var(--gray-600);border:1px solid var(--gray-300)}
    .bd-btn-ghost:hover{background:var(--gray-50)}
    .bd-msg{text-align:center;margin-top:14px;min-height:22px;font-size:13.5px;font-weight:700;color:var(--gray-600)}
    .bd-msg.win{color:#1E8C5E;font-size:15px}
    .bd-msg.lose{color:#D6423A;font-size:15px}
    .bd-help{margin-top:10px;padding:10px 14px;background:rgba(0,0,0,.04);border-radius:10px;font-size:12px;color:var(--gray-500);text-align:center;line-height:1.6}
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="lgg-hero">
    <div class="inner">
        <a href="lounge-games.html" class="lgg-back"><i class="fa-solid fa-arrow-left"></i> 게임 모음으로 돌아가기</a>
        <div class="lgg-cat-tag">▣ Board · 9×9 미니</div>
        <h1>바둑 <em>BADUK</em></h1>
        <p>9×9 미니 바둑판. 자유도 0 그룹은 따냄. 양쪽 패스 시 종료(영역 + 따낸 돌).</p>
    </div>
</div>

<div class="lgg-body">
    <div class="inner">
        <div class="bd-wrap">
            <div class="bd-info">
                <div class="bd-stat"><div class="lbl">Turn</div><div class="val" id="bdTurn">⚫ 흑</div></div>
                <div class="bd-stat"><div class="lbl">흑 따냄</div><div class="val" id="bdCapB">0</div></div>
                <div class="bd-stat"><div class="lbl">백 따냄</div><div class="val" id="bdCapW">0</div></div>
                <div class="bd-stat"><div class="lbl">Move</div><div class="val" id="bdMove">0</div></div>
            </div>
            <div class="bd-canvas-wrap"><canvas id="bdCanvas" width="540" height="540"></canvas></div>
            <div class="bd-actions">
                <button class="bd-btn bd-btn-primary" id="bdNew"><i class="fa-solid fa-rotate"></i> 새 게임</button>
                <button class="bd-btn bd-btn-pass" id="bdPass"><i class="fa-solid fa-forward"></i> 패스</button>
                <button class="bd-btn bd-btn-ghost" id="bdUndo"><i class="fa-solid fa-rotate-left"></i> 무르기</button>
            </div>
            <div class="bd-msg" id="bdMsg">바둑판을 클릭하여 흑돌을 두세요.</div>
            <div class="bd-help">자살수 금지 · 패(같은 모양 즉시 반복) 금지 · 양쪽 연속 패스 시 종료 → 영역 + 따낸 돌 합산 승자</div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260510b"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260509a"></script>
<script>
(function(){
    const N = 9;
    const cv = document.getElementById('bdCanvas');
    const ctx = cv.getContext('2d');
    const elTurn=document.getElementById('bdTurn'),elCB=document.getElementById('bdCapB'),elCW=document.getElementById('bdCapW'),elMv=document.getElementById('bdMove'),elMsg=document.getElementById('bdMsg');
    let board, turn, captured, moveCnt, history, lastBoardKey, passCount, gameOver;

    function reset(){
        board = new Array(N*N).fill(0); // 0 빈, 1 흑, 2 백
        turn = 1; captured = {1:0, 2:0}; moveCnt = 0; history = []; lastBoardKey = null; passCount = 0; gameOver = false;
        elTurn.textContent='⚫ 흑';elCB.textContent=0;elCW.textContent=0;elMv.textContent=0;
        elMsg.textContent='바둑판을 클릭하여 흑돌을 두세요.';elMsg.className='bd-msg';
        draw();
    }

    function neighbors(idx){
        const r=Math.floor(idx/N),c=idx%N,a=[];
        if(r>0)a.push((r-1)*N+c);
        if(r<N-1)a.push((r+1)*N+c);
        if(c>0)a.push(r*N+c-1);
        if(c<N-1)a.push(r*N+c+1);
        return a;
    }

    function group(b, idx){
        const color = b[idx]; if(!color) return null;
        const stack=[idx], visited=new Set([idx]), libs=new Set();
        while(stack.length){
            const cur = stack.pop();
            for(const n of neighbors(cur)){
                if(b[n]===0){libs.add(n)}
                else if(b[n]===color && !visited.has(n)){visited.add(n);stack.push(n)}
            }
        }
        return {stones: visited, libs};
    }

    function move(idx){
        if(gameOver || turn !== 1 || board[idx] !== 0) return false;
        const result = doMove(idx, 1);
        if(!result){elMsg.textContent='둘 수 없습니다 (자살수 또는 패)';return false}
        applyMove(result, 1);
        return true;
    }

    function doMove(idx, color){
        const b = board.slice();
        b[idx] = color;
        const opp = color === 1 ? 2 : 1;
        let cap = [];
        for(const n of neighbors(idx)){
            if(b[n] === opp){
                const g = group(b, n);
                if(g.libs.size === 0){g.stones.forEach(s => {b[s] = 0; cap.push(s)})}
            }
        }
        const own = group(b, idx);
        if(own.libs.size === 0) return null; // 자살수
        const key = b.join('');
        if(key === lastBoardKey) return null; // 단순 패 금지
        return {b, cap, key};
    }

    function applyMove(result, color){
        history.push({board: board.slice(), turn, lastBoardKey, captured: {...captured}, passCount});
        board = result.b;
        captured[color] += result.cap.length;
        elCB.textContent = captured[1]; elCW.textContent = captured[2];
        lastBoardKey = result.key;
        moveCnt++; elMv.textContent = moveCnt;
        passCount = 0;
        turn = color === 1 ? 2 : 1;
        elTurn.textContent = turn === 1 ? '⚫ 흑' : '⚪ 백';
        elMsg.textContent = '';
        draw();
        if(turn === 2 && !gameOver) setTimeout(cpuMove, 350);
    }

    function cpuMove(){
        if(gameOver) return;
        // 자유도/따냄 가치를 평가하여 가장 좋은 자리 선택, 없으면 패스
        let best = -1, bestScore = -Infinity;
        for(let i=0;i<N*N;i++){
            if(board[i] !== 0) continue;
            const r = doMove(i, 2);
            if(!r) continue;
            // 점수: 따냄 수 ×10 + 인접 빈자리(내 자유도) ×1 - 인접 적 그룹 자유도 위협
            let s = r.cap.length * 12;
            const own = group(r.b, i);
            s += own.libs.size * 1.2;
            // 중앙 가중
            const cx=Math.floor(i%N), cy=Math.floor(i/N);
            s += (4 - Math.abs(cx-4)) + (4 - Math.abs(cy-4));
            // 작은 랜덤성
            s += Math.random()*2;
            if(s > bestScore){bestScore = s; best = i}
        }
        if(best < 0 || bestScore < 1){
            doPass(2);
            return;
        }
        const r = doMove(best, 2);
        if(!r){doPass(2);return}
        applyMove(r, 2);
    }

    function doPass(color){
        history.push({board: board.slice(), turn, lastBoardKey, captured: {...captured}, passCount});
        passCount++;
        moveCnt++; elMv.textContent = moveCnt;
        if(passCount >= 2){endGame(); return}
        turn = color === 1 ? 2 : 1;
        elTurn.textContent = turn === 1 ? '⚫ 흑' : '⚪ 백';
        elMsg.textContent = (color === 1 ? '흑(YOU)' : 'CPU') + ' 패스';
        if(turn === 2 && !gameOver) setTimeout(cpuMove, 350);
    }

    function endGame(){
        gameOver = true;
        // 단순 영역 계산: 빈 점이 한 색에만 인접하는 연결영역은 그 색의 영역
        const visited = new Set();
        const territory = {1:0, 2:0};
        for(let i=0;i<N*N;i++){
            if(board[i] !== 0 || visited.has(i)) continue;
            const stack=[i], region=new Set([i]); const adj={1:false,2:false};
            visited.add(i);
            while(stack.length){
                const cur = stack.pop();
                for(const n of neighbors(cur)){
                    if(board[n] !== 0){adj[board[n]] = true}
                    else if(!visited.has(n)){visited.add(n);region.add(n);stack.push(n)}
                }
            }
            if(adj[1] && !adj[2]) territory[1] += region.size;
            else if(adj[2] && !adj[1]) territory[2] += region.size;
        }
        const black = territory[1] + captured[1];
        const white = territory[2] + captured[2] + 6.5; // 덤 6.5
        let msg;
        if(black > white){msg = '🎉 흑(YOU) '+black+' vs '+white+' 백 — 승리!'; elMsg.className='bd-msg win'}
        else if(white > black){msg = '백 '+white+' vs '+black+' 흑 — 패배 (덤 6.5 포함)'; elMsg.className='bd-msg lose'}
        else{msg = '동점! '+black+' : '+white; elMsg.className='bd-msg'}
        elMsg.textContent = msg;
    }

    function draw(){
        const W = cv.width;
        const cell = W / (N+1);
        ctx.fillStyle = '#dcb47a'; ctx.fillRect(0,0,W,W);
        ctx.strokeStyle = '#3a2811'; ctx.lineWidth = 1.4;
        for(let i=0;i<N;i++){
            ctx.beginPath();ctx.moveTo(cell+i*cell, cell);ctx.lineTo(cell+i*cell, W-cell);ctx.stroke();
            ctx.beginPath();ctx.moveTo(cell, cell+i*cell);ctx.lineTo(W-cell, cell+i*cell);ctx.stroke();
        }
        // 화점 (9x9): 2,4,6 좌표 5점
        const dots = [[2,2],[2,6],[4,4],[6,2],[6,6]];
        ctx.fillStyle = '#3a2811';
        dots.forEach(([r,c]) => {ctx.beginPath();ctx.arc(cell+c*cell,cell+r*cell,3.5,0,Math.PI*2);ctx.fill()});
        for(let i=0;i<board.length;i++){
            const v = board[i]; if(!v) continue;
            const r = Math.floor(i/N), c = i%N;
            const x = cell+c*cell, y = cell+r*cell;
            const grad = ctx.createRadialGradient(x-cell*0.18, y-cell*0.18, cell*0.05, x, y, cell*0.42);
            if(v===1){grad.addColorStop(0,'#5a5a5a');grad.addColorStop(1,'#0a0a0a')}
            else{grad.addColorStop(0,'#fff');grad.addColorStop(1,'#bbb')}
            ctx.fillStyle = grad;
            ctx.beginPath();ctx.arc(x,y,cell*0.43,0,Math.PI*2);ctx.fill();
            ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();
        }
    }

    cv.addEventListener('click', e => {
        if(gameOver || turn !== 1) return;
        const rect = cv.getBoundingClientRect();
        const W = cv.width;
        const cell = W / (N+1);
        const x = (e.clientX - rect.left) * (W/rect.width);
        const y = (e.clientY - rect.top) * (W/rect.height);
        const c = Math.round((x - cell) / cell);
        const r = Math.round((y - cell) / cell);
        if(r<0||r>=N||c<0||c>=N) return;
        move(r*N+c);
    });

    document.getElementById('bdNew').addEventListener('click', reset);
    document.getElementById('bdPass').addEventListener('click', () => {
        if(gameOver || turn !== 1) return;
        doPass(1);
    });
    document.getElementById('bdUndo').addEventListener('click', () => {
        if(gameOver || history.length < 2) return;
        // 마지막 두 수 (CPU + 플레이어) 무르기
        for(let i=0;i<2 && history.length;i++){
            const h = history.pop();
            board = h.board; turn = h.turn; lastBoardKey = h.lastBoardKey;
            captured = h.captured; passCount = h.passCount;
        }
        moveCnt = Math.max(0, moveCnt - 2); elMv.textContent = moveCnt;
        elCB.textContent = captured[1]; elCW.textContent = captured[2];
        elTurn.textContent = turn === 1 ? '⚫ 흑' : '⚪ 백';
        elMsg.textContent = '무르기 — 다시 두세요'; elMsg.className = 'bd-msg';
        draw();
    });

    reset();
})();
</script>
</body>
</html>
