<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤러리 — (주)빛세움</title>
    <meta name="description" content="(주)빛세움 주민총회·봉사활동·워크숍·현장스케치·기타행사 소식과 사진을 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260901a">
    <style>
    /* 히어로 바로 아래 탭 메뉴와의 여백 축소 (공통 .page-body 상단 여백 갤러리 페이지 한정 축소) */
    .page-body{padding-top:28px}
    @media(max-width:768px){.page-body{padding-top:20px}}

    .gl-section{margin-bottom:40px}
    .gl-section-head{margin-bottom:16px}
    .gl-section-sub{font-size:12px;color:var(--gray-400);font-weight:500}
    /* 자료실 "전체자료" 제목과 동일한 규격(영문 라벨+골드 세로바)으로 통일 */
    .gl-section-head #glGridTitle{font-size:24px;font-weight:800;color:var(--gray-900);padding-left:16px;letter-spacing:normal;font-family:var(--font);position:relative}
    .gl-section-head #glGridTitle::before{content:'';position:absolute;left:0;top:4px;width:3px;height:22px;border-radius:2px;background:linear-gradient(to bottom,var(--gold),rgba(184,134,11,.3))}

    /* 탭 메뉴 — 히어로 바로 아래 (업무실적 .pf-tabs-wrap과 동일한 규격으로 통일) */
    .gl-tabs-wrap{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding:16px 24px;background:#fff;border-radius:14px;border:1px solid var(--gray-200);box-shadow:0 2px 8px rgba(0,0,0,.03);flex-wrap:wrap;box-sizing:border-box}
    #glTabs{gap:0}
    #glTabs button{padding:6px 14px;border-right:1px solid var(--gray-200);position:relative;display:inline-flex;align-items:center;gap:6px}
    #glTabs button:first-child{padding-left:0}
    #glTabs button:last-child{border-right:none}
    /* 탭별 게시물 건수 — 업무실적(.pf-tab-count)과 동일한 표기 */
    .gl-tab-count{font-size:11px;font-weight:600;color:#111}
    /* 자료실(#ctrlNav)과 동일한 언더바 인디케이터로 통일 */
    #glTabs button.on{background:none;color:var(--gold);font-weight:700}
    #glTabs button.on::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:20px;height:2px;border-radius:1px;background:var(--gold)}
    /* 우측 건수 표시 — 공지사항(.notice-result)과 동일하게 탭바 우측에 배치 */
    .gl-result{font-size:14px;color:var(--gray-500);font-weight:500;white-space:nowrap;margin-left:auto}
    .gl-result strong{color:var(--brand-dark);font-weight:700}
    @media(max-width:640px){
      .gl-tabs-wrap{padding:14px 16px}
      #glTabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
      #glTabs::-webkit-scrollbar{display:none}
      #glTabs button{flex-shrink:0}
    }

    /* 게시물 카드 */
    .gl-row5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
    @media(max-width:1024px){.gl-row5{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:600px){.gl-row5{grid-template-columns:repeat(2,1fr);gap:10px}}

    .gp-card{display:flex;flex-direction:column;text-align:left;background:#fff;border:1.5px solid var(--gray-200);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .25s;padding:0;font-family:inherit}
    .gp-card:hover{border-color:var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
    .gp-card.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,11,.25)}
    .gp-img{aspect-ratio:4/3;background:linear-gradient(135deg,#FFF7DF,#FFFDF7);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:26px;overflow:hidden;position:relative}
    .gp-img img{width:100%;height:100%;object-fit:cover;display:block}
    .gp-body{padding:12px 13px 14px}
    .gp-cat{font-size:10.5px;font-weight:700;color:var(--gold);margin-bottom:4px}
    .gp-title{font-size:13.5px;font-weight:800;color:var(--gray-900);line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .gp-meta{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--gray-400)}
    .gp-meta .views{display:flex;align-items:center;gap:3px}
    @media(max-width:600px){.gp-body{padding:9px 10px 11px}.gp-title{font-size:12.5px}}

    .gl-empty{padding:56px 20px;text-align:center;color:var(--gray-400);grid-column:1/-1}
    .gl-empty i{font-size:36px;color:var(--gray-300);margin-bottom:12px;display:block}
    .gl-empty p{font-size:13.5px}

    /* 페이지네이션 */
    .pager-wrap{display:flex;align-items:center;justify-content:center;margin-top:32px}
    .pager{display:flex;align-items:center;gap:4px}
    .pager button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gray-200);border-radius:9px;background:#fff;color:var(--gray-600);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .pager button:hover{border-color:var(--gold);color:var(--brand-dark);background:rgba(184,134,11,.04)}
    .pager button.active{color:var(--gold);border-color:var(--brand-dark);box-shadow:0 2px 8px rgba(10,15,28,.12)}
    .pager button.arr{color:var(--gray-400);font-size:12px}
    .pager button:disabled{opacity:.25;cursor:default;pointer-events:none}

    /* 상세 보기 패널 — 클릭 시 아래에 자연스럽게 펼쳐짐 */
    .gl-detail{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s ease,opacity .3s ease;margin-top:0}
    .gl-detail.show{max-height:2400px;opacity:1;margin-top:32px}
    .gl-detail-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;padding:28px;position:relative}
    .gl-detail-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-500);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .gl-detail-close:hover{border-color:var(--gold);color:var(--gold)}
    .gl-detail-cat{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px}
    .gl-detail-title{font-size:20px;font-weight:800;color:var(--gray-900);line-height:1.4;margin-bottom:10px;padding-right:40px}
    .gl-detail-meta{display:flex;gap:14px;font-size:12.5px;color:var(--gray-400);margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--gray-100)}
    .gl-detail-meta span{display:flex;align-items:center;gap:5px}
    .gl-detail-photo{width:100%;border-radius:12px;overflow:hidden;margin-bottom:20px;background:var(--gray-50)}
    .gl-detail-photo img{width:100%;display:block;max-height:520px;object-fit:cover}
    .gl-detail-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
    .gl-detail-photos button{display:block;width:100%;border:none;padding:0;background:none;border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in;font:inherit}
    .gl-detail-photos img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
    .gl-detail-photos button:hover img{transform:scale(1.04)}
    .gl-detail-content{font-size:14.5px;line-height:1.85;color:var(--gray-700);white-space:pre-line}
    .gl-detail-content p{margin:0 0 14px}
    .gl-detail-content p:last-child{margin-bottom:0}

    /* === 게시물 본문 — 공지사항(nt-*)과 동일한 디자인 시스템 재사용 === */
    .nt-lead{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
    .nt-stats{display:flex;gap:12px;margin:4px 0 22px;flex-wrap:wrap}
    .nt-stat-card{flex:1;min-width:130px;background:linear-gradient(160deg,#FFFFFF,#FFF6D6);border:1px solid rgba(184,134,11,.22);border-radius:14px;padding:18px 16px;text-align:center}
    .nt-stat-num{font-size:22px;font-weight:800;color:var(--brand-dark);line-height:1.25}
    .nt-stat-label{font-size:11.5px;color:var(--gray-500);margin-top:6px;font-weight:600}
    .nt-divider{height:1px;background:var(--gray-100);margin:26px 0}
    .nt-source-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    .nt-source-card{border:1px solid var(--gray-150,#eaedf0);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04)}
    .nt-source-card .gl-lb-trigger{display:block;width:100%;border:none;padding:0;background:none;cursor:zoom-in;font:inherit}
    .nt-source-card .gl-lb-trigger img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform .3s ease}
    .nt-source-card .gl-lb-trigger:hover img{transform:scale(1.04)}
    .nt-source-cap{padding:10px 14px;font-size:11.5px;color:var(--gray-500);line-height:1.5;border-top:1px solid var(--gray-100)}
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>갤러리</span>
        </div>
        <h1>갤러리</h1>
        <p>㈜빛세움의 정비사업 현장, 주민총회, 봉사활동, 워크숍 등 다양한 활동과 기록을 만나보세요.</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">

        <!-- 탭 메뉴 (히어로 바로 아래) -->
        <div class="gl-tabs-wrap">
            <div class="tabs" id="glTabs">
                <button class="on" data-cat="전체">전체<span class="gl-tab-count"></span></button>
                <button data-cat="주민총회">주민총회<span class="gl-tab-count"></span></button>
                <button data-cat="봉사활동">봉사활동<span class="gl-tab-count"></span></button>
                <button data-cat="워크숍">워크숍<span class="gl-tab-count"></span></button>
                <button data-cat="현장스케치">현장스케치<span class="gl-tab-count"></span></button>
                <button data-cat="기타행사">기타행사<span class="gl-tab-count"></span></button>
            </div>
            <div class="gl-result" id="glResult"></div>
        </div>

        <!-- 전체 게시물 (5×3 그리드 + 페이지네이션) -->
        <div class="gl-section">
            <div class="gl-section-head">
                <div class="section-label">Gallery Posts</div>
                <h2 id="glGridTitle">전체 게시물</h2>
            </div>
            <div class="gl-row5" id="glGrid"></div>
            <div class="pager-wrap"><div class="pager" id="glPager"></div></div>
        </div>

        <!-- 상세 보기 -->
        <div class="gl-detail" id="glDetail">
            <div class="gl-detail-card">
                <button class="gl-detail-close" id="glDetailClose"><i class="fa-solid fa-xmark"></i></button>
                <div class="gl-detail-cat" id="glDCat"></div>
                <div class="gl-detail-title" id="glDTitle"></div>
                <div class="gl-detail-meta">
                    <span><i class="fa-regular fa-calendar"></i> <span id="glDDate"></span></span>
                    <span><i class="fa-regular fa-eye"></i> <span id="glDViews"></span></span>
                </div>
                <div class="gl-detail-photo" id="glDPhoto"></div>
                <div class="gl-detail-content" id="glDContent"></div>
            </div>
        </div>

    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260902b"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260902c"></script>
<script>
(function(){
    var ICONS={ '주민총회':'fa-solid fa-people-group', '봉사활동':'fa-solid fa-hand-holding-heart',
                '워크숍':'fa-solid fa-chalkboard-user', '현장스케치':'fa-solid fa-camera-retro', '기타행사':'fa-solid fa-calendar-days' };
    var items=(MOCK.gallery||[]).slice();
    var curCat='전체';
    var curPage=1;
    var PER=15; /* 가로 5 × 세로 3 */
    var PAGE_WIN=8;

    /* 브라우저 로컬 조회수 (자료실과 동일 방식) */
    function getViews(){ try{ return JSON.parse(localStorage.getItem('seul_gallery_views')||'{}') }catch(e){ return {} } }
    function addView(id){ var v=getViews(); v[id]=(v[id]||0)+1; try{ localStorage.setItem('seul_gallery_views',JSON.stringify(v)) }catch(e){} return v[id]; }
    function viewsOf(it){ return (it.views||0) + (getViews()[it.id]||0); }

    function listOf(cat){ return cat==='전체' ? items : items.filter(function(it){ return it.category===cat }); }

    function coverOf(it){ return (it.images&&it.images.length) ? it.images[0] : (it.src?{src:it.src,alt:it.alt}:null); }

    function cardHTML(it,num){
        var icon=ICONS[it.category]||'fa-solid fa-image';
        var cover=coverOf(it);
        return '<button class="gp-card" data-id="'+it.id+'">'+
               '<div class="gp-img">'+(cover?'<img src="'+cover.src+'" alt="'+(cover.alt||it.title||'')+'" loading="lazy">':'<i class="'+icon+'"></i>')+'</div>'+
               '<div class="gp-body">'+
               '<div class="gp-cat">'+it.category+'</div>'+
               '<div class="gp-title">'+(it.title||'')+'</div>'+
               '<div class="gp-meta"><span>'+(it.date||'')+'</span><span class="views"><i class="fa-regular fa-eye"></i> '+viewsOf(it)+'</span></div>'+
               '</div></button>';
    }

    function renderPager(totalPages){
        var el=document.getElementById('glPager');
        if(totalPages<=1){ el.innerHTML=''; return; }
        var winStart=Math.floor((curPage-1)/PAGE_WIN)*PAGE_WIN+1;
        var winEnd=Math.min(winStart+PAGE_WIN-1, totalPages);
        var winPrev=Math.max(1,winStart-PAGE_WIN),winNext=winEnd+1;
        var h='<button class="arr" data-p="'+winPrev+'" '+(winStart===1?'disabled':'')+'><i class="fa-solid fa-chevron-left"></i></button>';
        for(var i=winStart;i<=winEnd;i++){ h+='<button'+(i===curPage?' class="active"':'')+' data-p="'+i+'">'+i+'</button>'; }
        h+='<button class="arr" data-p="'+winNext+'" '+(winEnd===totalPages?'disabled':'')+'><i class="fa-solid fa-chevron-right"></i></button>';
        el.innerHTML=h;
    }

    function renderTabCounts(){
        document.querySelectorAll('#glTabs button[data-cat]').forEach(function(b){
            var cat=b.dataset.cat;
            var n=listOf(cat).length;
            var span=b.querySelector('.gl-tab-count');
            if(span)span.textContent=n+'건';
        });
    }

    function renderGrid(){
        document.getElementById('glGridTitle').textContent=curCat==='전체'?'전체 게시물':curCat;
        var list=listOf(curCat);
        document.getElementById('glResult').innerHTML='총 <strong>'+list.length+'</strong>건';
        var totalPages=Math.max(1, Math.ceil(list.length/PER));
        if(curPage>totalPages) curPage=totalPages;
        var gridEl=document.getElementById('glGrid');
        if(!list.length){
            gridEl.innerHTML='<div class="gl-empty"><i class="fa-regular fa-images"></i><p>등록된 게시물이 없습니다.</p></div>';
        }else{
            var start=(curPage-1)*PER;
            gridEl.innerHTML=list.slice(start,start+PER).map(function(it,i){ return cardHTML(it, list.length-(start+i)); }).join('');
        }
        renderPager(totalPages);
    }

    function openDetail(id){
        var it=items.find(function(x){ return x.id===id });
        if(!it) return;
        addView(id);
        document.getElementById('glDCat').textContent=it.category;
        document.getElementById('glDTitle').textContent=it.title||'';
        document.getElementById('glDDate').textContent=it.date||'';
        document.getElementById('glDViews').textContent='조회 '+viewsOf(it);
        var photoEl=document.getElementById('glDPhoto');
        if(it.images&&it.images.length){
            photoEl.innerHTML='<div class="nt-source-gallery">'+it.images.map(function(im){
                return '<div class="nt-source-card"><button type="button" class="gl-lb-trigger" data-src="'+im.src+'" data-alt="'+(im.alt||it.title||'')+'" title="확대 보기"><img src="'+im.src+'" alt="'+(im.alt||it.title||'')+'"></button>'+(im.alt?'<div class="nt-source-cap">'+im.alt+'</div>':'')+'</div>';
            }).join('')+'</div>';
            photoEl.style.display='';
        }else if(it.src){
            photoEl.innerHTML='<button type="button" class="gl-lb-trigger" data-src="'+it.src+'" data-alt="'+(it.alt||it.title||'')+'" title="확대 보기" style="border:none;padding:0;background:none;width:100%;cursor:zoom-in"><img src="'+it.src+'" alt="'+(it.alt||it.title||'')+'" style="width:100%;display:block"></button>';
            photoEl.style.display='';
        }else{
            photoEl.innerHTML=''; photoEl.style.display='none';
        }
        document.getElementById('glDContent').innerHTML=it.content||'';
        var detail=document.getElementById('glDetail');
        detail.classList.add('show');
        renderGrid();
        detail.scrollIntoView({behavior:'smooth',block:'nearest'});
    }

    function closeDetail(){
        document.getElementById('glDetail').classList.remove('show');
    }

    /* 사진 확대창 — 페이지에 갇힌 오버레이가 아닌 진짜 별도 브라우저 창(window.open)으로 분리 */
    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function openPhotoWindow(src,alt){
        var title=alt||'사진 보기';
        var probe=new Image();
        probe.onload=function(){
            var availW=screen.availWidth||window.innerWidth, availH=screen.availHeight||window.innerHeight;
            var w=Math.min(probe.naturalWidth, availW-80);
            var h=Math.min(probe.naturalHeight, availH-140);
            if(w<360) w=360; if(h<280) h=280;
            var left=Math.max(0, Math.round((availW-w)/2));
            var top=Math.max(0, Math.round((availH-h)/2));
            var features='width='+Math.round(w)+',height='+Math.round(h)+',left='+left+',top='+top+
                ',resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no,location=no';
            var win=window.open('','glPhotoWin',features);
            if(!win){ window.open(src,'_blank'); return; }
            win.document.open();
            win.document.write(
                '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+escapeHtml(title)+'</title>'+
                '<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#0A0F1C;overflow:hidden}'+
                'img{width:100%;height:100%;object-fit:cover;display:block}</style></head><body>'+
                '<img src="'+src+'" alt="'+escapeHtml(alt||'')+'"></body></html>'
            );
            win.document.close();
            win.focus();
        };
        probe.src=src;
    }
    document.getElementById('glDetail').addEventListener('click', function(e){
        var trig=e.target.closest('.gl-lb-trigger'); if(!trig) return;
        openPhotoWindow(trig.dataset.src, trig.dataset.alt);
    });

    document.getElementById('glTabs').addEventListener('click', function(e){
        var btn=e.target.closest('button'); if(!btn) return;
        document.querySelectorAll('#glTabs button').forEach(function(b){ b.classList.remove('on') });
        btn.classList.add('on');
        curCat=btn.dataset.cat; curPage=1;
        closeDetail();
        renderGrid();
    });

    document.getElementById('glGrid').addEventListener('click', function(e){
        var btn=e.target.closest('.gp-card'); if(!btn) return;
        openDetail(btn.dataset.id);
    });
    document.getElementById('glPager').addEventListener('click', function(e){
        var btn=e.target.closest('button[data-p]'); if(!btn || btn.disabled) return;
        curPage=parseInt(btn.dataset.p,10);
        renderGrid();
        document.getElementById('glGridTitle').scrollIntoView({behavior:'smooth',block:'start'});
    });
    document.getElementById('glDetailClose').addEventListener('click', closeDetail);

    renderTabCounts();
    renderGrid();

    var qcat=new URLSearchParams(location.search).get('cat');
    if(qcat){
        var qtab=document.querySelector('#glTabs button[data-cat="'+qcat+'"]');
        if(qtab){
            document.querySelectorAll('#glTabs button').forEach(function(b){ b.classList.remove('on') });
            qtab.classList.add('on');
            curCat=qcat; curPage=1;
            renderGrid();
        }
    }

    var qid=new URLSearchParams(location.search).get('id');
    if(qid && items.some(function(it){ return it.id===qid })){
        openDetail(qid);
        /* 메인화면 등 외부에서 특정 게시물로 바로 들어온 경우, 목록이 먼저 보이지 않도록
           펼침 애니메이션 + 전역 scroll-behavior:smooth 를 모두 일시적으로 끄고
           즉시(behavior:auto) 해당 게시물 위치로 점프한 뒤 원상 복구 */
        var dEl=document.getElementById('glDetail');
        var htmlEl=document.documentElement;
        var prevScrollBehavior=htmlEl.style.scrollBehavior;
        var prevTransition=dEl.style.transition;
        htmlEl.style.scrollBehavior='auto';
        dEl.style.transition='none';
        void dEl.offsetHeight; /* 강제 리플로우 — max-height 즉시 반영 */
        dEl.scrollIntoView({block:'start', behavior:'auto'});
        requestAnimationFrame(function(){
            htmlEl.style.scrollBehavior=prevScrollBehavior;
            dEl.style.transition=prevTransition;
        });
    }
})();
</script>
</body>
</html>
