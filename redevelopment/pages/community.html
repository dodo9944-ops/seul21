<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 커뮤니티에서 질문, 정보, 후기, 분석을 공유하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
    /* === Hero === */
    .cm-hero{padding:56px 0 48px;background:linear-gradient(135deg,#070B15 0%,var(--brand-dark) 40%,var(--brand-navy) 100%);position:relative;overflow:hidden}
    .cm-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(195,165,105,.3),transparent)}
    .cm-hero h1{font-size:32px;font-weight:900;color:#fff;margin-bottom:10px;padding-left:18px;border-left:3px solid var(--gold)}
    .cm-hero .hero-sub{font-size:15px;color:rgba(255,255,255,.5);line-height:1.6}
    .cm-hero .hero-stats{display:flex;gap:28px;margin-top:20px}
    .cm-hero .hs{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.4)}
    .cm-hero .hs strong{font-size:17px;font-weight:800;color:var(--gold)}
    @media(max-width:768px){.cm-hero{padding:40px 0 32px}.cm-hero h1{font-size:26px}.cm-hero .hero-stats{gap:18px;flex-wrap:wrap}}

    /* === Tabs + Write === */
    .cm-toolbar{position:sticky;top:104px;z-index:100;background:#fff;padding:10px 0;margin-bottom:0;border-bottom:1px solid var(--gray-100);transition:box-shadow .2s}
    .cm-toolbar.stuck{box-shadow:0 2px 12px rgba(0,0,0,.05)}
    @media(max-width:768px){.cm-toolbar{top:72px}}
    .cm-toolbar .inner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:2px;padding-bottom:2px}
    .cm-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:3px;background:var(--gray-50);border-radius:10px;border:1px solid var(--gray-100)}
    .cm-tab{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--gray-500);transition:all .2s;font-family:var(--font)}
    .cm-tab i{font-size:12px;opacity:.4}
    .cm-tab .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:10px;font-weight:700;background:var(--gray-200);color:var(--gray-500);display:inline-flex;align-items:center;justify-content:center}
    .cm-tab.on{background:var(--brand-dark);color:var(--gold);box-shadow:0 2px 6px rgba(10,15,28,.12)}
    .cm-tab.on i{opacity:1}
    .cm-tab.on .cnt{background:rgba(195,165,105,.2);color:var(--gold)}
    .cm-tab:not(.on):hover{background:#fff;color:var(--gray-800)}
    .cm-write-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;background:var(--brand-dark);color:var(--gold);border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
    .cm-write-btn:hover{background:var(--brand-navy);box-shadow:0 4px 12px rgba(10,15,28,.15)}
    .cm-write-btn i{font-size:12px}

    /* === Featured Posts (강화) === */
    .cm-featured{margin:24px 0 28px}
    .cm-featured .cf-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .cm-featured .cf-head .cf-icon{width:28px;height:28px;border-radius:7px;background:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold)}
    .cm-featured .cf-head h3{font-size:15px;font-weight:800;color:var(--gray-900)}
    .cf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:900px){.cf-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:540px){.cf-grid{grid-template-columns:1fr}}
    .cf-card{display:flex;flex-direction:column;padding:18px 20px;background:#fff;border:1.5px solid var(--gray-200);border-radius:13px;cursor:pointer;transition:all .3s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.03)}
    .cf-card:hover{border-color:var(--gold);box-shadow:0 10px 28px rgba(195,165,105,.12);transform:translateY(-4px)}
    .cf-card:hover .cf-title{color:var(--gold)}
    .cf-card .cf-cat{margin-bottom:8px}
    .cf-card .cf-title{font-size:14.5px;font-weight:800;color:var(--gray-900);line-height:1.45;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;transition:color .2s}
    .cf-card .cf-meta{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--gray-500);font-weight:500}
    .cf-card .cf-meta i{font-size:10px;color:var(--gold);opacity:.7}
    .cf-card .cf-hot{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:7px;background:rgba(195,165,105,.12);border:1px solid rgba(195,165,105,.15);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold)}

    /* === Post List === */
    .cm-list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .cm-list-head .count{font-size:13px;color:var(--gray-500)}
    .cm-list-head .count strong{color:var(--brand-dark);font-weight:700}

    .cm-list{display:flex;flex-direction:column;gap:6px}
    .cm-post{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border:1.5px solid var(--gray-150,#eaedf0);border-radius:11px;cursor:pointer;transition:all .25s}
    .cm-post:hover{border-color:rgba(195,165,105,.3);box-shadow:0 4px 16px rgba(0,0,0,.04);transform:translateY(-1px)}
    .cm-post.is-hot{border-left:3px solid var(--gold);background:linear-gradient(90deg,rgba(195,165,105,.015),#fff 40%)}

    /* Category badge */
    .cb{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;flex-shrink:0}
    .cb-질문{background:rgba(245,166,35,.08);color:#D48806;border:1px solid rgba(245,166,35,.12)}
    .cb-정보{background:rgba(59,130,246,.06);color:#2563EB;border:1px solid rgba(59,130,246,.1)}
    .cb-후기{background:rgba(16,185,129,.06);color:#059669;border:1px solid rgba(16,185,129,.1)}
    .cb-분석{background:rgba(139,92,246,.06);color:#7C3AED;border:1px solid rgba(139,92,246,.1)}
    .cb-칼럼{background:rgba(10,15,28,.04);color:var(--gray-600);border:1px solid rgba(10,15,28,.06)}

    /* Post content */
    .cm-post-body{flex:1;min-width:0}
    .cm-post-title{font-size:14.5px;font-weight:700;color:var(--gray-900);line-height:1.4;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
    .cm-post:hover .cm-post-title{color:var(--gold)}
    .cm-post-title .cmt-cnt{font-size:11.5px;font-weight:700;color:var(--gold);margin-left:5px}
    .cm-post-title .new-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#EF4444;margin-left:5px;vertical-align:middle}
    .cm-post-title .hot-tag{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:1px 6px;border-radius:4px;background:rgba(195,165,105,.1);font-size:9px;font-weight:700;color:var(--gold);vertical-align:middle}
    .cm-post-preview{font-size:12px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Post meta (강화) */
    .cm-post-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;min-width:120px}
    .cm-post-meta .pm-author{font-size:12.5px;font-weight:700;color:var(--gray-800)}
    .cm-post-meta .pm-stats{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--gray-500);font-weight:500}
    .cm-post-meta .pm-stats i{font-size:10px;margin-right:1px}
    .cm-post-meta .pm-stats .likes{color:var(--gold);font-weight:600}
    .cm-post-meta .pm-stats .likes i{color:var(--gold)}

    /* Mobile post */
    @media(max-width:768px){
        .cm-post{flex-direction:column;align-items:flex-start;gap:10px;padding:16px 18px}
        .cm-post-meta{flex-direction:row;width:100%;justify-content:space-between;min-width:0}
    }

    /* Empty */
    .cm-empty{text-align:center;padding:56px 20px}
    .cm-empty i{font-size:48px;color:var(--gray-200);margin-bottom:16px}
    .cm-empty h3{font-size:17px;font-weight:700;color:var(--gray-600);margin-bottom:6px}

    /* Pagination */
    .cm-pager{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:36px;padding-top:20px;border-top:1px solid var(--gray-100)}
    .cm-pager button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gray-200);border-radius:9px;background:#fff;color:var(--gray-600);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .cm-pager button:hover{border-color:var(--gold);color:var(--brand-dark)}
    .cm-pager button.active{background:var(--brand-dark);color:var(--gold);border-color:var(--brand-dark)}
    .cm-pager button:disabled{opacity:.25;pointer-events:none}
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="cm-hero">
    <div class="inner">
        <div class="breadcrumb"><a href="../index.html">홈</a><i class="fa-solid fa-chevron-right"></i><span>커뮤니티</span></div>
        <h1>커뮤니티</h1>
        <p class="hero-sub">재개발·재건축·소규모정비 분야 전문가와 조합원이 함께하는 정보 공유 공간</p>
        <div class="hero-stats" id="heroStats"></div>
    </div>
</div>

<div class="cm-toolbar" id="cmToolbar">
    <div class="inner">
        <div class="cm-tabs" id="cmTabs"></div>
        <button class="cm-write-btn" id="writeBtn"><i class="fa-solid fa-pen"></i> 글쓰기</button>
    </div>
</div>

<div class="page-body"><div class="inner">
    <div class="cm-featured" id="cmFeatured"></div>
    <div class="cm-list-head"><div class="count" id="cmCount"></div></div>
    <div class="cm-list" id="cmList"></div>
    <div class="cm-empty" id="cmEmpty" style="display:none"><i class="fa-solid fa-comments"></i><h3>게시글이 없습니다</h3></div>
    <div class="cm-pager" id="cmPager"></div>
</div></div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260406"></script>
<script src="../assets/js/data-service.js?v=20260406"></script>
<script src="../assets/js/common.js?v=20260406"></script>
<script>
(function(){
var PER=10,curPage=1,curCat='전체';
var catIcons={'질문':'fa-circle-question','정보':'fa-circle-info','후기':'fa-comment-dots','분석':'fa-chart-line','칼럼':'fa-feather'};
var catDefs=[{key:'전체',label:'전체'},{key:'질문',label:'질문'},{key:'정보',label:'정보'},{key:'후기',label:'후기'},{key:'분석',label:'분석'},{key:'칼럼',label:'칼럼'}];

function getAllPosts(){
    var r=DataService.query('community',{sort:'date:desc',page:1,pageSize:999});
    return r.data||[];
}
var allPosts=getAllPosts();

/* Hero stats */
!function(){
    var total=allPosts.length;
    var totalViews=0,totalLikes=0,totalComments=0;
    allPosts.forEach(function(p){totalViews+=p.views||0;totalLikes+=p.likes||0;totalComments+=p.comments||0});
    document.getElementById('heroStats').innerHTML=
        '<div class="hs"><strong>'+total+'</strong>게시글</div>'+
        '<div class="hs"><strong>'+App.comma(totalViews)+'</strong>조회</div>'+
        '<div class="hs"><strong>'+App.comma(totalComments)+'</strong>댓글</div>'+
        '<div class="hs"><strong>'+App.comma(totalLikes)+'</strong>좋아요</div>';
}();

/* Tabs with count */
function renderTabs(){
    var counts={'전체':allPosts.length};
    catDefs.forEach(function(d){if(d.key!=='전체')counts[d.key]=0});
    allPosts.forEach(function(p){counts[p.category]=(counts[p.category]||0)+1});
    document.getElementById('cmTabs').innerHTML=catDefs.map(function(d){
        var ic=catIcons[d.key]?'<i class="fa-solid '+catIcons[d.key]+'"></i> ':'';
        return'<button class="cm-tab'+(curCat===d.key?' on':'')+'" data-cat="'+d.key+'">'+ic+d.label+'<span class="cnt">'+counts[d.key]+'</span></button>';
    }).join('');
}

/* Featured posts (top 3 by likes) */
function renderFeatured(){
    var top=allPosts.slice().sort(function(a,b){return(b.likes||0)-(a.likes||0)}).slice(0,3);
    if(!top.length){document.getElementById('cmFeatured').style.display='none';return}
    var html='<div class="cf-head"><div class="cf-icon"><i class="fa-solid fa-fire"></i></div><h3>인기글</h3></div><div class="cf-grid">';
    top.forEach(function(p){
        html+='<div class="cf-card" onclick="location.href=\'community-detail.html?id='+p.id+'\'">'+
            '<div class="cf-hot"><i class="fa-solid fa-fire"></i></div>'+
            '<div class="cf-cat"><span class="cb cb-'+p.category+'">'+p.category+'</span></div>'+
            '<div class="cf-title">'+p.title+'</div>'+
            '<div class="cf-meta">'+
                '<span>'+p.author+'</span>'+
                '<span><i class="fa-solid fa-eye"></i> '+App.comma(p.views)+'</span>'+
                '<span><i class="fa-solid fa-heart" style="color:var(--gold)"></i> '+(p.likes||0)+'</span>'+
                '<span><i class="fa-solid fa-comment"></i> '+(p.comments||0)+'</span>'+
            '</div></div>';
    });
    html+='</div>';
    document.getElementById('cmFeatured').innerHTML=html;
}

/* Post list */
function render(){
    var filtered=curCat==='전체'?allPosts:allPosts.filter(function(p){return p.category===curCat});
    var total=filtered.length,pages=Math.ceil(total/PER);
    if(curPage>pages)curPage=1;
    var start=(curPage-1)*PER,slice=filtered.slice(start,start+PER);

    document.getElementById('cmCount').innerHTML='총 <strong>'+total+'</strong>건';
    var list=document.getElementById('cmList'),empty=document.getElementById('cmEmpty');

    if(!slice.length){list.innerHTML='';empty.style.display='flex';document.getElementById('cmPager').innerHTML='';return}
    empty.style.display='none';

    var now=new Date();
    list.innerHTML=slice.map(function(p){
        var isNew=(now-new Date(p.date))<2*864e5;
        var isHot=(p.likes||0)>=50;
        var preview=(p.content||'').replace(/\n/g,' ').substring(0,80);

        return'<div class="cm-post'+(isHot?' is-hot':'')+'" onclick="location.href=\'community-detail.html?id='+p.id+'\'">'+
            '<span class="cb cb-'+p.category+'">'+p.category+'</span>'+
            '<div class="cm-post-body">'+
                '<div class="cm-post-title">'+p.title+
                    (p.comments>0?'<span class="cmt-cnt">['+p.comments+']</span>':'')+
                    (isHot?'<span class="hot-tag"><i class="fa-solid fa-fire"></i>HOT</span>':'')+
                    (isNew?'<span class="new-dot"></span>':'')+
                '</div>'+
                '<div class="cm-post-preview">'+preview+'</div>'+
            '</div>'+
            '<div class="cm-post-meta">'+
                '<span class="pm-author">'+p.author+'</span>'+
                '<div class="pm-stats">'+
                    '<span>'+App.timeAgo(p.date)+'</span>'+
                    '<span><i class="fa-solid fa-eye"></i> '+App.comma(p.views)+'</span>'+
                    '<span class="likes"><i class="fa-solid fa-heart"></i> '+(p.likes||0)+'</span>'+
                '</div>'+
            '</div>'+
        '</div>';
    }).join('');

    /* Pager */
    var pg=document.getElementById('cmPager');
    if(pages<=1){pg.innerHTML='';return}
    var h='<button '+(curPage===1?'disabled':'')+' onclick="CM.page('+(curPage-1)+')"><i class="fa-solid fa-chevron-left"></i></button>';
    for(var i=1;i<=pages;i++)h+='<button'+(i===curPage?' class="active"':'')+' onclick="CM.page('+i+')">'+i+'</button>';
    h+='<button '+(curPage===pages?'disabled':'')+' onclick="CM.page('+(curPage+1)+')"><i class="fa-solid fa-chevron-right"></i></button>';
    pg.innerHTML=h;
}

/* Events */
document.getElementById('cmTabs').addEventListener('click',function(e){
    var btn=e.target.closest('.cm-tab');if(!btn)return;
    curCat=btn.dataset.cat;curPage=1;renderTabs();render();
});
document.getElementById('writeBtn').addEventListener('click',function(){
    if(!DataService.isUserLoggedIn()){App.toast('로그인이 필요합니다.','info');setTimeout(function(){location.href='login.html'},1000);return}
    location.href='community-write.html';
});

/* Sticky shadow */
var toolbar=document.getElementById('cmToolbar');
window.addEventListener('scroll',function(){
    toolbar.classList.toggle('stuck',toolbar.getBoundingClientRect().top<=(parseInt(getComputedStyle(toolbar).top)||104)+1);
},{passive:true});

/* Global */
window.CM={page:function(n){curPage=n;render();window.scrollTo({top:toolbar.offsetTop-80,behavior:'smooth'})}};

renderTabs();renderFeatured();render();
})();
</script>
</body>
</html>
