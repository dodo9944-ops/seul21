<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 — (주)빛세움</title>
    <meta name="description" content="재개발·재건축 커뮤니티 — 현장 갤러리에서 사진과 이야기를 공유하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260901a">
    <style>
    /* === Hero === */
    .cm-hero{padding:56px 0 48px;background:linear-gradient(135deg,#FFFFFF 0%,#FFFFFF 40%,#FFF3C4 100%);position:relative;overflow:hidden}
    .cm-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(184,134,11,.3),transparent)}
    .cm-hero h1{font-size:32px;font-weight:900;color:#0A0F1C;margin-bottom:10px;padding-left:18px;border-left:3px solid var(--gold)}
    .cm-hero .hero-sub{font-size:15px;color:rgba(10,15,28,.5);line-height:1.6}
    .cm-hero .hero-stats{display:flex;gap:28px;margin-top:20px}
    .cm-hero .hs{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(10,15,28,.4)}
    .cm-hero .hs strong{font-size:17px;font-weight:800;color:var(--gold)}
    @media(max-width:768px){.cm-hero{padding:40px 0 32px}.cm-hero h1{font-size:26px}.cm-hero .hero-stats{gap:18px;flex-wrap:wrap}}

    /* === Tabs + Write === */
    .cm-toolbar{position:sticky;top:104px;z-index:9997;background:#fff;padding:8px 0;margin-top:28px;margin-bottom:-8px;border-bottom:1px solid var(--gray-100);transition:box-shadow .2s}
    .cm-toolbar.stuck{box-shadow:0 2px 12px rgba(0,0,0,.05)}
    @media(max-width:1024px) and (min-width:769px){.cm-toolbar{top:136px}}
    @media(max-width:768px){.cm-toolbar{top:82px}}
    .cm-toolbar .inner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .cm-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:3px;background:var(--gray-50);border-radius:10px;border:1px solid var(--gray-100)}
    .cm-tab{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--gray-500);transition:all .2s;font-family:var(--font)}
    .cm-tab i{font-size:12px;opacity:.4}
    .cm-tab .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:10px;font-weight:700;background:var(--gray-200);color:var(--gray-500);display:inline-flex;align-items:center;justify-content:center}
    .cm-tab.on{background:#FFFFFF;color:var(--gold);box-shadow:0 2px 6px rgba(10,15,28,.12)}
    .cm-tab.on i{opacity:1}
    .cm-tab.on .cnt{background:rgba(184,134,11,.2);color:var(--gold)}
    .cm-tab:not(.on):hover{background:#fff;color:var(--gray-800)}
    .cm-write-btn{display:inline-flex;align-items:center;gap:7px;padding:11px 26px;background:#FFFFFF;color:var(--gold);border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
    .cm-write-btn:hover{background:#FFF3C4;box-shadow:0 4px 12px rgba(10,15,28,.15)}
    .cm-write-btn i{font-size:12px}

    /* === Featured Posts (강화) === */
    .cm-featured{margin:8px 0 20px}
    .cm-featured .cf-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .cm-featured .cf-head .cf-icon{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,#FFFFFF,#FFF3C4);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold)}
    .cm-featured .cf-head h3{font-size:15px;font-weight:800;color:var(--gray-900)}
    .cf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:900px){.cf-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:540px){.cf-grid{grid-template-columns:1fr}}
    .cf-card{display:flex;flex-direction:column;padding:12px 16px;background:#fff;border:1.5px solid var(--gray-200);border-radius:13px;cursor:pointer;transition:all .3s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.03)}
    .cf-card:hover{border-color:var(--gold);box-shadow:0 10px 28px rgba(184,134,11,.12);transform:translateY(-4px)}
    .cf-card:hover .cf-title{color:var(--gold)}
    .cf-card .cf-cat{margin-bottom:5px}
    .cf-card .cf-title{font-size:14.5px;font-weight:800;color:var(--gray-900);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;transition:color .2s}
    .cf-card .cf-meta{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--gray-500);font-weight:500}
    .cf-card .cf-meta i{font-size:10px;color:var(--gold);opacity:.7}
    .cf-card .cf-hot{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:7px;background:rgba(184,134,11,.12);border:1px solid rgba(184,134,11,.15);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold)}

    /* === Post List === */
    .cm-list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .cm-list-head .count{font-size:13px;color:var(--gray-500)}
    .cm-list-head .count strong{color:var(--brand-dark);font-weight:700}

    .cm-list{display:flex;flex-direction:column;gap:6px}
    .cm-post{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border:1.5px solid var(--gray-150,#eaedf0);border-radius:11px;cursor:pointer;transition:all .25s}
    .cm-post:hover{border-color:rgba(184,134,11,.3);box-shadow:0 4px 16px rgba(0,0,0,.04);transform:translateY(-1px)}
    .cm-post.is-hot{border-left:3px solid var(--gold);background:linear-gradient(90deg,rgba(184,134,11,.015),#fff 40%)}

    /* 갤러리 — 대표사진 카드형 */
    .cm-list.is-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .cm-gallery-card{background:#fff;border:1.5px solid var(--gray-150,#eaedf0);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .25s}
    .cm-gallery-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08);border-color:rgba(184,134,11,.3)}
    .cm-gallery-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--gray-100,#f3f4f6)}
    .cm-gallery-thumb-empty{width:100%;aspect-ratio:4/3;background:var(--gray-100,#f3f4f6);display:flex;align-items:center;justify-content:center;color:var(--gray-300,#d1d5db);font-size:26px}
    .cm-gallery-body{padding:12px 14px}
    .cm-gallery-title{font-size:14px;font-weight:700;color:var(--gray-900);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cm-gallery-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--gray-500)}

    /* Category badge */
    .cb{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;flex-shrink:0}
    .cb-갤러리{background:rgba(245,166,35,.08);color:#D48806;border:1px solid rgba(245,166,35,.12)}

    /* Post content */
    .cm-post-body{flex:1;min-width:0}
    .cm-post-title{font-size:14.5px;font-weight:700;color:var(--gray-900);line-height:1.4;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
    .cm-post:hover .cm-post-title{color:var(--gold)}
    .cm-post-title .cmt-cnt{font-size:11.5px;font-weight:700;color:var(--gold);margin-left:5px}
    .cm-post-title .new-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#EF4444;margin-left:5px;vertical-align:middle}
    .cm-post-title .hot-tag{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:1px 6px;border-radius:4px;background:rgba(184,134,11,.1);font-size:9px;font-weight:700;color:var(--gold);vertical-align:middle}
    .cm-post-preview{font-size:12px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Post meta (강화) */
    .cm-post-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;min-width:120px}
    .cm-post-meta .pm-author{font-size:12.5px;font-weight:700;color:var(--gray-800)}
    .cm-post-meta .pm-stats{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--gray-500);font-weight:500}
    .cm-post-meta .pm-stats i{font-size:10px;margin-right:1px}
    .cm-post-meta .pm-stats .likes{color:var(--gold);font-weight:600}
    .cm-post-meta .pm-stats .likes i{color:var(--gold)}

    /* Mobile post */
    @media(max-width:768px){
        .cm-post{flex-direction:column;align-items:flex-start;gap:10px;padding:16px 18px}
        .cm-post-meta{flex-direction:row;width:100%;justify-content:space-between;min-width:0}
    }

    /* Empty */
    .cm-empty{text-align:center;padding:56px 20px}
    .cm-empty i{font-size:48px;color:var(--gray-200);margin-bottom:16px}
    .cm-empty h3{font-size:17px;font-weight:700;color:var(--gray-600);margin-bottom:6px}

    /* Pagination */
    .cm-pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:40px;padding-top:24px;border-top:1px solid var(--gray-100)}
    .cm-pager-btns{display:flex;align-items:center;gap:4px}
    .cm-pager button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gray-200);border-radius:10px;background:#fff;color:var(--gray-600);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .cm-pager button:hover{border-color:var(--gold);color:var(--brand-dark);background:rgba(184,134,11,.04)}
    .cm-pager button.active{background:#FFFFFF;color:var(--gold);border-color:var(--brand-dark);box-shadow:0 2px 8px rgba(10,15,28,.12)}
    .cm-pager button.arr{color:var(--gray-400);font-size:13px}
    .cm-pager button:disabled{opacity:.25;cursor:default;pointer-events:none}
    .cm-pager-per{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-400)}
    .cm-pager-per select{height:32px;padding:0 24px 0 8px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px;font-family:var(--font);color:var(--gray-600);cursor:pointer;appearance:auto}
    @media(max-width:768px){.cm-pager{flex-direction:column;gap:12px}}
    
    /* === Unified Hero (3안 패밀리) === */
    .uni-hero {
        background: linear-gradient(135deg, #FFFFFF 0%, #FFF3C4 40%, #FFFFFF 100%);
        position: relative; overflow: hidden; padding: 32px 0 36px;
    }
    .uni-hero .hero-bg-photo { position: absolute; top: 0; right: 0; width: 58%; height: 100%; z-index: 0; }
    .uni-hero .hero-bg-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; filter: contrast(1.03) saturate(0.95); }
    .uni-hero .hero-bg-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,253,247,1.00) 0%, rgba(255,253,247,0.99) 18%, rgba(255,249,232,0.96) 28%, rgba(255,247,225,0.88) 36%, rgba(255,247,225,0.70) 43%, rgba(255,247,225,0.48) 49%, rgba(255,247,225,0.28) 55%, rgba(255,247,225,0.12) 61%, rgba(255,247,225,0.04) 66%, rgba(255,247,225,0.00) 72%); z-index: 1; }
    .uni-hero .hero-light-wave { position: absolute; left: 0; bottom: -14%; width: 50%; height: 58%; overflow: hidden; pointer-events: none; z-index: 1; opacity: 1; -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 62%, transparent 100%); mask-image: linear-gradient(90deg, #000 0%, #000 62%, transparent 100%); }
    .uni-hero .hero-light-wave::before { content: ''; position: absolute; left: 0; bottom: 0; width: 70%; height: 70%; background: radial-gradient(ellipse at 12% 100%, rgba(255,196,0,.40) 0%, rgba(255,196,0,.18) 30%, rgba(255,196,0,.07) 52%, transparent 74%); filter: blur(2px); }
    .uni-hero .hero-light-wave .wave-line { position: absolute; border-radius: 50%; border-top: 1.2px solid transparent; transform-origin: center; filter: drop-shadow(0 0 5px rgba(255,196,0,.5)) drop-shadow(0 0 14px rgba(255,196,0,.26)); -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 10%, #000 28%, rgba(0,0,0,.55) 46%, #000 62%, rgba(0,0,0,.30) 82%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 10%, #000 28%, rgba(0,0,0,.55) 46%, #000 62%, rgba(0,0,0,.30) 82%, transparent 100%); }
    .uni-hero .hero-light-wave .wave-line:nth-child(1) { left:-20%; bottom:-12%; width:820px; height:250px; transform:rotate(-14deg);            border-top-width: 1.5px; border-top-color: rgba(255,196,0,.60); }
    .uni-hero .hero-light-wave .wave-line:nth-child(2) { left:-10%; bottom:-2%;  width:740px; height:220px; transform:rotate(-11deg);            border-top-width: 1.3px; border-top-color: rgba(255,210,55,.52); }
    .uni-hero .hero-light-wave .wave-line:nth-child(3) { left:-24%; bottom:-18%; width:670px; height:200px; transform:rotate(-7deg);             border-top-width: 1.15px;border-top-color: rgba(255,220,85,.44); }
    .uni-hero .hero-light-wave .wave-line:nth-child(4) { left:-6%;  bottom:6%;   width:600px; height:180px; transform:rotate(-4deg) scaleY(.92); border-top-width: 1px;   border-top-color: rgba(255,196,0,.36); }
    .uni-hero .hero-light-wave .wave-line:nth-child(5) { left:-16%; bottom:-8%;  width:530px; height:160px; transform:rotate(-2deg);             border-top-width: .9px;  border-top-color: rgba(255,232,140,.28); }
    .uni-hero .hero-light-wave .wave-line:nth-child(6) { left:-2%;  bottom:2%;   width:460px; height:140px; transform:rotate(-9deg);             border-top-width: .8px;  border-top-color: rgba(255,242,175,.20); }
    @media (max-width: 1024px) { .uni-hero .hero-light-wave .wave-line:nth-child(n+5) { display: none; } }
    @media (max-width: 600px) { .uni-hero .hero-light-wave { opacity: .40; } .uni-hero .hero-light-wave .wave-line:nth-child(n+3) { display: none; } }
    .uni-hero .hero-bg-photo::before { content: ''; position: absolute; top: 0; bottom: 0; left: 22%; width: 56%; pointer-events: none; background: linear-gradient(90deg, rgba(255,253,247,0) 0%, rgba(255,246,216,0.24) 25%, rgba(255,231,160,0.34) 52%, rgba(255,231,160,0.28) 62%, rgba(255,246,216,0.14) 80%, rgba(255,253,247,0) 100%); filter: blur(28px); z-index: 2; }
    .uni-hero::before {
        content: ''; position: absolute; inset: 0;
        background-image:
            radial-gradient(circle at 20% 50%, rgba(184,134,11,0.04) 0%, transparent 50%),
            radial-gradient(circle at 80% 30%, rgba(184,134,11,0.03) 0%, transparent 40%);
        pointer-events: none; z-index: 1;
    }
    .uni-hero::after {
        content: ''; position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(184,134,11,0.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(184,134,11,0.015) 1px, transparent 1px);
        background-size: 60px 60px; pointer-events: none; z-index: 1;
    }
    .uni-hero .inner { position: relative; z-index: 2; display: flex; align-items: center; gap: 56px; }
    .uni-hero .uh-text { flex: 1; min-width: 0; }
    .uni-hero .uh-bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(10,15,28,0.4); margin-bottom: 13px; }
    .uni-hero .uh-bc a { color: rgba(10,15,28,0.4); transition: color 0.2s; }
    .uni-hero .uh-bc a:hover { color: #B8860B; }
    .uni-hero .uh-bc span { color: #B8860B; font-weight: 600; }
    .uni-hero .uh-bc i { font-size: 10px; }
    .uni-hero .uh-label { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: #B8860B; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
    .uni-hero .uh-label::before { content: ''; width: 24px; height: 1px; background: #B8860B; }
    .uni-hero .uh-text h1 { font-size: 36px; font-weight: 900; color: #171C26; line-height: 1.35; letter-spacing: -1px; margin-bottom: 14px; }
    .uni-hero .uh-text h1 em { font-style: normal; color: #C58B00; }
    .uni-hero .uh-sub { font-size: 15px; color: #565C66; line-height: 1.8; max-width: 500px; }
    .uni-hero .uh-stats { display: flex; gap: 24px; }
    .uni-hero .uh-stat { display: flex; align-items: center; gap: 5px; font-size: 12px; color: rgba(10,15,28,0.4); }
    .uni-hero .uh-stat strong { font-size: 17px; font-weight: 800; color: #B8860B; }
    .uni-hero .uh-visual { flex-shrink: 0; width: 360px; position: relative; z-index: 2; }
    .uni-hero .uh-photo { display: none; }
    .uni-hero .uh-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .uni-hero .uh-card { width: 174px; height: 130px; box-sizing: border-box; overflow: hidden; background: rgba(24,28,34,.78); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 22px 18px; transition: all 0.3s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,.10); display: block; text-decoration: none; color: inherit; cursor: pointer; position: relative; z-index: 5; }
    .uni-hero .uh-card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.16); }
    .uni-hero .uh-ci { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,196,0,.15); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
    .uni-hero .uh-ci i { font-size: 15px; color: #FFC400; }
    .uni-hero .uh-card h4 { font-size: 14px; font-weight: 800; color: #FFFFFF; margin-bottom: 4px; }
    .uni-hero .uh-card p { font-size: 11.5px; color: rgba(255,255,255,.65); line-height: 1.5; }
    @media (max-width: 1024px) { .uni-hero .inner { flex-direction: column; gap: 16px; } .uni-hero .uh-visual { width: 100%; max-width: 420px; } .uni-hero .hero-bg-photo { width: 100%; opacity: 0.25; } .uni-hero .hero-bg-photo::after { background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.7) 100%); } }
    @media (max-width: 600px) { .uni-hero { padding: 28px 0 28px; } .uni-hero .uh-text h1 { font-size: 26px; } .uni-hero .uh-sub { font-size: 13px; } .uni-hero .uh-cards { grid-template-columns: 1fr; width: 100%; } .uni-hero .hero-bg-photo { opacity: 0.15; } }

    </style>
</head>
<body>
<div id="site-header"></div>

<div class="uni-hero">
    <div class="hero-light-wave" aria-hidden="true">
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
    </div>
    <div class="hero-bg-photo"><img src="../jpg/hero_library.jpg?v=20260825a" alt="빛세움 자료실"></div>
    <div class="inner">
        <div class="uh-text">
            <div class="uh-bc"><a href="../index.html">홈</a><i class="fa-solid fa-chevron-right"></i><span>자료실</span></div>
            <div class="uh-label">PROFESSIONAL ARCHIVE</div>
            <h1>정비사업 <em>실무 자료</em>를<br>한곳에 모았습니다</h1>
            <p class="uh-sub">관계법령부터 서식·매뉴얼, 주요뉴스, 커뮤니티까지<br>정비사업 실무에 필요한 자료를 체계적으로 제공합니다</p>
        </div>
        <div class="uh-visual">
            <div class="uh-photo"><img src="../jpg/hero_library.jpg?v=20260825a" alt="빛세움 자료실"></div>
            <div class="uh-cards"><a class="uh-card" href="javascript:void(0)" onclick="cmSwitch('갤러리')"><div class="uh-ci"><i class="fa-solid fa-images"></i></div><h4>갤러리</h4><p>현장 사진·소식</p></a><a class="uh-card" href="library.html?cat=주요뉴스"><div class="uh-ci"><i class="fa-solid fa-feather"></i></div><h4>칼럼</h4><p>자료실에서 모아보기</p></a><a class="uh-card" href="library.html"><div class="uh-ci"><i class="fa-solid fa-folder-open"></i></div><h4>자료실</h4><p>법령·서식·뉴스 모음</p></a></div>
        </div>
    </div>
</div>

<div class="cm-toolbar" id="cmToolbar">
    <div class="inner">
        <div class="cm-tabs" id="cmTabs"></div>
    </div>
</div>

<div class="page-body"><div class="inner">
    <div class="cm-featured" id="cmFeatured"></div>
    <div class="cm-list-head"><div class="count" id="cmCount"></div></div>
    <div class="cm-list" id="cmList"></div>
    <div class="cm-empty" id="cmEmpty" style="display:none"><i class="fa-solid fa-comments"></i><h3>게시글이 없습니다</h3></div>
    <div class="cm-pager" id="cmPager">
        <div class="cm-pager-btns" id="cmPagerBtns"></div>
        <div class="cm-pager-per"><span>페이지당</span><select id="cmPerSelect"><option value="10">10개</option><option value="20">20개</option><option value="50">50개</option></select></div>
    </div>
</div></div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260901a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260901c"></script>
<script>
(function(){
if(typeof MOCK!=='undefined'&&MOCK.community){var s=JSON.parse(localStorage.getItem('rdc_community')||'[]');if(s.length!==MOCK.community.length)localStorage.setItem('rdc_community',JSON.stringify(MOCK.community))}
var PER=10,curPage=1,curCat='전체';
var catIcons={'갤러리':'fa-images'};
var catDefs=[{key:'전체',label:'전체'},{key:'갤러리',label:'갤러리'}];

function getAllPosts(){
    var r=DataService.query('community',{sort:'date:desc',page:1,pageSize:999});
    return r.data||[];
}
var allPosts=getAllPosts();

/* API에서 최신 데이터 가져와 병합 후 재렌더링 */
fetch('/api/community').then(function(r){return r.json()}).then(function(res){
    if(res.posts&&res.posts.length){
        var localIds={};allPosts.forEach(function(p){localIds[p.id]=true});
        var merged=false;
        res.posts.forEach(function(p){
            if(!localIds[p.id]){allPosts.unshift(p);merged=true;
                DataService.create('community',p);
            }
        });
        if(merged){allPosts.sort(function(a,b){return new Date(b.date)-new Date(a.date)});renderTabs();renderFeatured();render()}
    }
}).catch(function(){});

/* Tabs with count */
function renderTabs(){
    var counts={'전체':allPosts.length};
    catDefs.forEach(function(d){if(d.key!=='전체')counts[d.key]=0});
    allPosts.forEach(function(p){counts[p.category]=(counts[p.category]||0)+1});
    document.getElementById('cmTabs').innerHTML=catDefs.map(function(d){
        var ic=catIcons[d.key]?'<i class="fa-solid '+catIcons[d.key]+'"></i> ':'';
        return'<button class="cm-tab'+(curCat===d.key?' on':'')+'" data-cat="'+d.key+'">'+ic+d.label+'<span class="cnt">'+counts[d.key]+'</span></button>';
    }).join('');
}

/* Featured posts (top 3 by likes) */
function renderFeatured(){
    var top=allPosts.slice().sort(function(a,b){var va=a.views||0,vb=b.views||0;if(vb!==va)return vb-va;return(a.date||'').localeCompare(b.date||'')}).slice(0,3);
    if(!top.length){document.getElementById('cmFeatured').style.display='none';return}
    var html='<div class="cf-head"><div class="cf-icon"><i class="fa-solid fa-comments"></i></div><h3>커뮤니티</h3><span style="font-size:12px;color:var(--gray-400);font-weight:500">열람순 · 인기순</span></div><div class="cf-grid">';
    top.forEach(function(p){
        html+='<div class="cf-card" onclick="location.href=\'community-detail.html?id='+p.id+'\'">'+
            '<div class="cf-hot"><i class="fa-solid fa-fire"></i></div>'+
            '<div class="cf-cat"><span class="cb cb-'+p.category+'">'+p.category+'</span></div>'+
            '<div class="cf-title">'+p.title+'</div>'+
            '<div class="cf-meta">'+
                '<span>'+p.author+'</span>'+
                '<span><i class="fa-solid fa-eye"></i> '+App.comma(p.views)+'</span>'+
                '<span><i class="fa-solid fa-heart" style="color:var(--gold)"></i> '+(p.likes||0)+'</span>'+
                '<span><i class="fa-solid fa-comment"></i> '+(p.comments||0)+'</span>'+
            '</div></div>';
    });
    html+='</div>';
    document.getElementById('cmFeatured').innerHTML=html;
}

/* Post list */
function render(){
    var filtered=curCat==='전체'?allPosts:allPosts.filter(function(p){return p.category===curCat});
    var total=filtered.length,pages=Math.ceil(total/PER);
    if(curPage>pages)curPage=1;
    var start=(curPage-1)*PER,slice=filtered.slice(start,start+PER);

    document.getElementById('cmCount').innerHTML='총 <strong>'+total+'</strong>건';
    var list=document.getElementById('cmList'),empty=document.getElementById('cmEmpty');

    if(!slice.length){list.innerHTML='';empty.style.display='flex';document.getElementById('cmPager').innerHTML='';return}
    empty.style.display='none';

    var now=new Date();
    var isGalleryView=curCat==='갤러리';
    list.classList.toggle('is-gallery',isGalleryView);

    if(isGalleryView){
        list.innerHTML=slice.map(function(p){
            var cover=(p.images&&p.images[0])?'<img class="cm-gallery-thumb" src="'+p.images[0]+'" alt="'+p.title+'" loading="lazy">':'<div class="cm-gallery-thumb-empty"><i class="fa-solid fa-image"></i></div>';
            return'<div class="cm-gallery-card" onclick="location.href=\'community-detail.html?id='+p.id+'\'">'+
                cover+
                '<div class="cm-gallery-body">'+
                    '<div class="cm-gallery-title">'+p.title+'</div>'+
                    '<div class="cm-gallery-meta">'+
                        '<span>'+p.author+'</span>'+
                        '<span><i class="fa-solid fa-eye"></i> '+App.comma(p.views)+' &nbsp;<i class="fa-solid fa-heart" style="color:var(--gold)"></i> '+(p.likes||0)+'</span>'+
                    '</div>'+
                '</div>'+
            '</div>';
        }).join('');
    }else{
    list.innerHTML=slice.map(function(p){
        var isNew=(now-new Date(p.date))<2*864e5;
        var isHot=(p.likes||0)>=50;
        var preview=(p.content||'').replace(/\n/g,' ').substring(0,80);

        return'<div class="cm-post'+(isHot?' is-hot':'')+'" onclick="location.href=\'community-detail.html?id='+p.id+'\'">'+
            '<span class="cb cb-'+p.category+'">'+p.category+'</span>'+
            '<div class="cm-post-body">'+
                '<div class="cm-post-title">'+p.title+
                    (p.comments>0?'<span class="cmt-cnt">['+p.comments+']</span>':'')+
                    (isHot?'<span class="hot-tag"><i class="fa-solid fa-fire"></i>HOT</span>':'')+
                    (isNew?'<span class="new-dot"></span>':'')+
                '</div>'+
                '<div class="cm-post-preview">'+preview+'</div>'+
            '</div>'+
            '<div class="cm-post-meta">'+
                '<span class="pm-author">'+p.author+'</span>'+
                '<div class="pm-stats">'+
                    '<span>'+App.timeAgo(p.date)+'</span>'+
                    '<span><i class="fa-solid fa-eye"></i> '+App.comma(p.views)+'</span>'+
                    '<span class="likes"><i class="fa-solid fa-heart"></i> '+(p.likes||0)+'</span>'+
                '</div>'+
            '</div>'+
        '</div>';
    }).join('');
    }

    /* Pager */
    var pg=document.getElementById('cmPagerBtns');
    if(pages<=1){pg.innerHTML='';return}
    var h='<button class="arr" '+(curPage===1?'disabled':'')+' onclick="CM.page('+(curPage-1)+')"><i class="fa-solid fa-chevron-left"></i></button>';
    for(var i=1;i<=pages;i++)h+='<button'+(i===curPage?' class="active"':'')+' onclick="CM.page('+i+')">'+i+'</button>';
    h+='<button class="arr" '+(curPage===pages?'disabled':'')+' onclick="CM.page('+(curPage+1)+')"><i class="fa-solid fa-chevron-right"></i></button>';
    pg.innerHTML=h;
}

/* Events */
window.cmSwitch=function(cat){curCat=cat;curPage=1;renderTabs();render();var t=document.getElementById('cmTabs');if(t)window.scrollTo({top:t.offsetTop-80,behavior:'smooth'})};

document.getElementById('cmTabs').addEventListener('click',function(e){
    var btn=e.target.closest('.cm-tab');if(!btn)return;
    curCat=btn.dataset.cat;curPage=1;renderTabs();render();
});
document.getElementById('cmPerSelect').addEventListener('change',function(){PER=parseInt(this.value);curPage=1;render()});

/* Sticky shadow */
var toolbar=document.getElementById('cmToolbar');
window.addEventListener('scroll',function(){
    toolbar.classList.toggle('stuck',toolbar.getBoundingClientRect().top<=(parseInt(getComputedStyle(toolbar).top)||104)+1);
},{passive:true});

/* Global */
window.CM={page:function(n){curPage=n;render();window.scrollTo({top:toolbar.offsetTop-80,behavior:'smooth'})}};

renderTabs();renderFeatured();render();
})();
</script>
</body>
</html>
