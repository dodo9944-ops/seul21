<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사업타당성 분석 — (주)세울엔지니어링</title>
    <meta name="description" content="사업타당성 분석">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260614c">
</head>
<body>
<div id="site-header"></div>
<div class="page-body"><div class="inner">
    <!-- 사업타당성 분석기 (한국부동산원 소규모·빈집정보 연계 / 리버스 프록시 임베드) -->
    <!-- 대장 명시 지시: 2026-06-14 "사업타당성 검토 메뉴에 분석기 업로드" + "전체 프록시" 선택 -->
    <style>
      .fz-wrap{max-width:980px;margin:0 auto;padding:40px 16px 60px}
      .fz-head{text-align:center;margin-bottom:28px}
      .fz-head .fz-eyebrow{font-size:13px;letter-spacing:.18em;color:#3b82f6;font-weight:700}
      .fz-head h1{font-size:28px;font-weight:800;margin:8px 0 10px}
      .fz-head p{color:#64748b;font-size:15px;line-height:1.6}
      .fz-search{display:flex;gap:8px;margin:0 auto 6px;max-width:640px}
      .fz-search input{flex:1;height:52px;padding:0 18px;border:1px solid #d1d9e6;border-radius:10px;font-size:16px;outline:none}
      .fz-search input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
      .fz-search button{height:52px;padding:0 24px;border:0;border-radius:10px;background:#1d4ed8;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
      .fz-search button:hover{background:#1e40af}
      .fz-hint{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:18px}
      .fz-list{max-width:640px;margin:0 auto;list-style:none;padding:0}
      .fz-list li{border:1px solid #e6ebf2;border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
      .fz-list li:hover{border-color:#3b82f6;background:#f8fbff}
      .fz-list .fz-road{font-weight:700;font-size:15px;color:#0f172a}
      .fz-list .fz-jibun{font-size:13px;color:#64748b;margin-top:4px}
      .fz-list .fz-zip{display:inline-block;font-size:12px;color:#1d4ed8;background:#eef4ff;border-radius:6px;padding:2px 8px;margin-top:6px}
      .fz-msg{max-width:640px;margin:14px auto;text-align:center;color:#94a3b8;font-size:14px}
      .fz-result{display:none;margin-top:10px}
      .fz-result .fz-bar{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto 12px;gap:10px}
      .fz-result .fz-addr{font-size:14px;color:#334155;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .fz-result .fz-reset{flex:none;border:1px solid #d1d9e6;background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;color:#334155}
      .fz-result .fz-reset:hover{border-color:#3b82f6;color:#1d4ed8}
      .fz-frame-box{position:relative;width:100%;height:85vh;min-height:720px;border:1px solid #e6ebf2;border-radius:12px;overflow:hidden;background:#fff}
      .fz-frame-box iframe{width:100%;height:100%;border:0;display:block}
      .fz-note{max-width:1200px;margin:14px auto 0;color:#94a3b8;font-size:12px;line-height:1.6}
      @media (max-width:640px){.fz-head h1{font-size:22px}.fz-frame-box{height:80vh}}
    </style>

    <div class="fz-wrap" id="fzApp">
      <div class="fz-head">
        <div class="fz-eyebrow">FEASIBILITY</div>
        <h1>사업타당성 분석</h1>
        <p>분석을 원하는 <strong>주소나 건물명</strong>을 입력하세요.<br>한국부동산원 소규모·빈집정보 데이터를 연계해 입지·사업성을 검토합니다.</p>
      </div>

      <div class="fz-search">
        <input type="text" id="fzKeyword" placeholder="예) 서울특별시 중구 세종대로 110, 또는 건물명" autocomplete="off">
        <button type="button" id="fzSearchBtn">검색</button>
      </div>
      <div class="fz-hint">도로명·지번 주소 또는 건물명으로 검색할 수 있습니다.</div>

      <div class="fz-msg" id="fzMsg" style="display:none"></div>
      <ul class="fz-list" id="fzList"></ul>

      <div class="fz-result" id="fzResult">
        <div class="fz-bar">
          <div class="fz-addr" id="fzSelectedAddr"></div>
          <button type="button" class="fz-reset" id="fzResetBtn"><i class="fa-solid fa-magnifying-glass"></i> 다시 검색</button>
        </div>
        <div class="fz-frame-box">
          <iframe id="fzFrame" title="사업타당성 분석 결과" referrerpolicy="no-referrer"></iframe>
        </div>
        <div class="fz-note">※ 분석 데이터 출처: 한국부동산원(REB) 소규모·빈집정보 알림e. 본 결과는 참고용이며 실제 사업 추진 시 전문가 검토가 필요합니다.</div>
      </div>
    </div>

    <script>
    (function(){
      var kw=document.getElementById('fzKeyword');
      var btn=document.getElementById('fzSearchBtn');
      var list=document.getElementById('fzList');
      var msg=document.getElementById('fzMsg');
      var result=document.getElementById('fzResult');
      var frame=document.getElementById('fzFrame');
      var selAddr=document.getElementById('fzSelectedAddr');
      var resetBtn=document.getElementById('fzResetBtn');

      function showMsg(t){ msg.textContent=t; msg.style.display=t?'block':'none'; }
      function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

      function search(){
        var q=(kw.value||'').trim();
        if(!q){ showMsg('검색어를 입력하세요.'); return; }
        list.innerHTML=''; result.style.display='none';
        showMsg('검색 중…');
        fetch('/api/juso?keyword='+encodeURIComponent(q)+'&countPerPage=20&currentPage=1')
          .then(function(r){return r.json();})
          .then(function(d){
            var c=d&&d.results&&d.results.common;
            var arr=(d&&d.results&&d.results.juso)||[];
            if(c&&c.errorCode&&c.errorCode!=='0'){ showMsg('검색 오류: '+(c.errorMessage||c.errorCode)); return; }
            if(!arr.length){ showMsg('검색 결과가 없습니다. 도로명/지번 주소나 건물명을 다시 확인해 주세요.'); return; }
            showMsg('');
            arr.forEach(function(a){
              var li=document.createElement('li');
              li.innerHTML='<div class="fz-road">'+esc(a.roadAddr||a.roadAddrPart1||'')+'</div>'+
                           '<div class="fz-jibun">[지번] '+esc(a.jibunAddr||'')+(a.bdNm?(' · '+esc(a.bdNm)):'')+'</div>'+
                           (a.zipNo?'<span class="fz-zip">우편번호 '+esc(a.zipNo)+'</span>':'');
              li.addEventListener('click',function(){ openAnalysis(a); });
              list.appendChild(li);
            });
          })
          .catch(function(e){ showMsg('검색에 실패했습니다. 잠시 후 다시 시도해 주세요.'); });
      }

      function openAnalysis(a){
        // 한국부동산원 분석 페이지(.do)를 우리 도메인 리버스 프록시(/sotong)로 임베드
        var base='/sotong/binzibplatform/bisSupport/binzibLocalStateProcessPop.do';
        var p=[
          'jibunAddr='+encodeURIComponent(a.jibunAddr||''),
          'siNm='+encodeURIComponent(a.siNm||''),
          'sggNm='+encodeURIComponent(a.sggNm||''),
          'emdNm='+encodeURIComponent(a.emdNm||''),
          'lnbrMnnm='+encodeURIComponent(a.lnbrMnnm||''),
          'lnbrSlno='+encodeURIComponent(a.lnbrSlno||''),
          'mtYn='+encodeURIComponent(a.mtYn||'')
        ].join('&');
        frame.src=base+'?'+p;
        selAddr.textContent=a.roadAddr||a.jibunAddr||'';
        list.innerHTML=''; showMsg('');
        result.style.display='block';
        result.scrollIntoView({behavior:'smooth',block:'start'});
      }

      function reset(){
        result.style.display='none'; frame.src='about:blank';
        kw.focus();
        window.scrollTo({top:0,behavior:'smooth'});
      }

      btn.addEventListener('click',search);
      kw.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); search(); } });
      resetBtn.addEventListener('click',reset);
    })();
    </script>
</div></div>
<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=feat0614b"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260614f"></script>
</body>
</html>
