<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사업타당성 분석 — (주)빛세움</title>
    <meta name="description" content="사업타당성 분석">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260831m">
</head>
<body>
<div id="site-header"></div>
<div class="page-body"><div class="inner">
    <!-- 사업타당성 분석기 (한국부동산원 소규모·빈집정보 오프라인 분석기 / 제1호 PC + Cloudflare Tunnel 임베드) -->
    <!-- 대장 지시: 2026-06-14 "사업타당성 검토 메뉴에 분석기 업로드", 터널 연동·오프라인·자동처리 선택 -->
    <!-- 엔드포인트(터널 URL)는 /data/feasibility-endpoint.json 에서 자동 로드(자가갱신) -->
    <style>
      /* 대장 지시(2026-06-15): 화면 좌우 확대 + 상단 메뉴~지도 여백 최소화 (본 페이지 한정 오버라이드) */
      .page-body{padding-top:16px}
      .page-body .inner{max-width:1780px}
      .fz-wrap{max-width:1760px;margin:0 auto;padding:6px 12px 28px}
      .fz-head{text-align:center;margin:6px 0 16px}
      .fz-head .fz-eyebrow{display:block;font-size:12px;letter-spacing:.3em;color:var(--gold,#B8860B);font-weight:700;text-transform:uppercase}
      .fz-head h1{font-size:28px;font-weight:800;color:var(--brand-dark,#0A0F1C);margin:6px 0 0;letter-spacing:-.5px}
      .fz-head p{color:#64748b;font-size:15px;line-height:1.6}
      .fz-frame-box{position:relative;width:100%;height:88vh;min-height:760px;border:1px solid #e6ebf2;border-radius:12px;overflow:hidden;background:#fff}
      .fz-frame-box iframe{width:100%;height:100%;border:0;display:block}
      .fz-state{max-width:560px;margin:30px auto;text-align:center;color:#475569}
      .fz-state h2{font-size:20px;font-weight:800;margin-bottom:10px;color:#0f172a}
      .fz-state p{font-size:14px;line-height:1.7;color:#64748b}
      .fz-spin{width:34px;height:34px;border:3px solid #e2e8f0;border-top-color:#1d4ed8;border-radius:50%;margin:0 auto 16px;animation:fzspin 1s linear infinite}
      @keyframes fzspin{to{transform:rotate(360deg)}}
      .fz-note{max-width:1200px;margin:14px auto 0;color:#94a3b8;font-size:12px;line-height:1.6;text-align:center}
      .fz-desc{max-width:1000px;margin:18px auto 0;color:#64748b;font-size:15px;line-height:1.7;text-align:center}
      @media (max-width:640px){.fz-head h1{font-size:22px}.fz-frame-box{height:82vh}}
    </style>

    <div class="fz-wrap">
      <div id="fzLoading" class="fz-state">
        <div class="fz-spin"></div>
        <p>분석기를 불러오는 중입니다…</p>
      </div>

      <div id="fzDown" class="fz-state" style="display:none">
        <h2>분석기 준비 중</h2>
        <p>현재 사업타당성 분석 서버에 연결할 수 없습니다.<br>잠시 후 다시 시도해 주세요. 문제가 지속되면 관리자에게 문의 바랍니다.</p>
      </div>

      <div id="fzFrameWrap" class="fz-frame-box" style="display:none">
        <iframe id="fzFrame" title="사업타당성 분석기" referrerpolicy="no-referrer" allow="clipboard-write; geolocation"></iframe>
      </div>
      <div id="fzNote" class="fz-note" style="display:none">
        <a id="fzOpenNew" href="#" target="_blank" rel="noopener">새 창에서 크게 보기</a>
      </div>

      <p class="fz-desc"><strong>(주)빛세움</strong>은 정비사업(재개발·재건축) 전 과정의 풍부한 실무 경험과 전문성을 바탕으로 정확한 사업타당성 분석과 맞춤형 컨설팅을 제공합니다.</p>
    </div>

    <script>
    (function(){
      var loading=document.getElementById('fzLoading');
      var down=document.getElementById('fzDown');
      var wrap=document.getElementById('fzFrameWrap');
      var frame=document.getElementById('fzFrame');
      var note=document.getElementById('fzNote');
      var openNew=document.getElementById('fzOpenNew');
      function showDown(){ loading.style.display='none'; wrap.style.display='none'; note.style.display='none'; down.style.display='block'; }
      function showFrame(target){
        frame.src=target; openNew.href=target;
        loading.style.display='none'; down.style.display='none';
        wrap.style.display='block'; note.style.display='block';
      }
      fetch('/data/feasibility-endpoint.json?_='+Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          var base=d&&d.url;
          if(!base){ showDown(); return; }
          base=String(base).replace(/\/+$/,'');
          showFrame(base+'/index_offline.html');
        })
        .catch(function(){ showDown(); });
    })();
    </script>
    <!-- (이전) Vercel /sotong 리버스 프록시 + /api/juso 방식은 정부서버 IP-바인딩 세션 문제로 폐기, 검증된 run_local 터널로 전환 -->
</div></div>
<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260831l"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260831n"></script>
</body>
</html>
