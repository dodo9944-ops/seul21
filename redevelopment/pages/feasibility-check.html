<script>
/* 동일 출처 iframe 높이 자동조정 (외부 호출 없음) */
(function(){
    var f=document.getElementById('feasFrame');
    function fit(){
        try{
            var d=f.contentWindow;
            var doc=d&&d.document;
            if(doc&&doc.body){
                var h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);
                if(h>200) f.style.height=(h+24)+'px';
            }
        }catch(e){}
    }
    f.addEventListener('load',function(){ fit(); setTimeout(fit,300); });
    setInterval(fit,500);
})();
</script>
