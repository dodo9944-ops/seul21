<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쉼터 — (주)세울엔지니어링</title>
    <meta name="description" content="세울엔지니어링 임직원과 조합원을 위한 쉼터. 잠시 쉬어가는 공간입니다.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260509e">
    <style>
    .lg-hero{padding:80px 0 60px;background:linear-gradient(135deg,#060A14 0%,#0A0F1C 40%,#142644 100%);position:relative;overflow:hidden}
    .lg-hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(195,165,105,0.08) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(195,165,105,0.05) 0%,transparent 50%);pointer-events:none}
    .lg-hero .inner{position:relative;z-index:1;text-align:center}
    .lg-label{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
    .lg-label::before,.lg-label::after{content:'';width:24px;height:1px;background:var(--gold);opacity:.6}
    .lg-hero h1{font-size:38px;font-weight:900;color:#fff;line-height:1.3;margin-bottom:14px;letter-spacing:-1px}
    .lg-hero h1 em{font-style:normal;color:var(--gold)}
    .lg-hero p{font-size:15.5px;line-height:1.85;color:rgba(255,255,255,.62);max-width:560px;margin:0 auto}
    @media(max-width:640px){.lg-hero{padding:56px 0 44px}.lg-hero h1{font-size:26px}.lg-hero p{font-size:14px}}

    .lg-body{padding:64px 0 96px}
    .lg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:960px;margin:0 auto}
    .lg-card{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:28px 24px;text-align:center;transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:200px;justify-content:center}
    .lg-card:hover{border-color:rgba(195,165,105,.4);box-shadow:0 12px 32px rgba(10,15,28,.08);transform:translateY(-4px)}
    .lg-card .lg-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#0F1D35,#1a2d50);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
    .lg-card .lg-icon i{color:var(--gold);font-size:20px}
    .lg-card h3{font-size:15.5px;font-weight:800;color:var(--brand-dark);letter-spacing:-.2px}
    .lg-card p{font-size:12.5px;color:var(--gray-500);line-height:1.65;margin:0}
    .lg-card .lg-soon{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
    @media(max-width:768px){.lg-grid{grid-template-columns:1fr;gap:14px}.lg-body{padding:44px 0 64px}}

    .lg-quote{max-width:680px;margin:64px auto 0;padding:32px 28px;background:linear-gradient(135deg,#0F1D35,#142644);border-radius:16px;border:1px solid rgba(195,165,105,.18);text-align:center;position:relative}
    .lg-quote::before{content:'\201C';position:absolute;top:-8px;left:24px;font-size:64px;font-family:Georgia,serif;color:var(--gold);opacity:.35;line-height:1}
    .lg-quote p{font-size:15px;line-height:1.85;color:rgba(255,255,255,.78);font-style:italic;margin:0 0 12px}
    .lg-quote .lg-quote-by{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
    @media(max-width:640px){.lg-quote{padding:24px 20px;margin-top:48px}.lg-quote p{font-size:14px}}
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="lg-hero">
    <div class="inner">
        <div class="lg-label">Seul Lounge</div>
        <h1>잠시 쉬어가는 <em>공간</em></h1>
        <p>도시정비라는 긴 여정 속에서, 조합원·임직원·파트너가<br>잠시 숨을 고를 수 있는 작은 휴식의 자리입니다.</p>
    </div>
</div>

<div class="lg-body">
    <div class="inner">
        <div class="lg-grid">
            <a class="lg-card" href="lounge-games.html" style="text-decoration:none;color:inherit">
                <div class="lg-icon"><i class="fa-solid fa-dice"></i></div>
                <h3>게임 모음</h3>
                <p>777 슬롯 등 잠시 즐기는<br>가벼운 미니게임 한 판</p>
                <div class="lg-soon" style="color:var(--gold)">▶ Play Now</div>
            </a>
            <div class="lg-card">
                <div class="lg-icon"><i class="fa-solid fa-music"></i></div>
                <h3>오늘의 음악</h3>
                <p>업무 집중·휴식·산책에<br>어울리는 큐레이션</p>
                <div class="lg-soon">Coming Soon</div>
            </div>
            <div class="lg-card">
                <div class="lg-icon"><i class="fa-solid fa-book-open"></i></div>
                <h3>한 줄 글귀</h3>
                <p>도시·건축·삶에 대한<br>짧은 단상과 글귀</p>
                <div class="lg-soon">Coming Soon</div>
            </div>
        </div>

        <div class="lg-quote">
            <p>도시는 건물의 집합이 아니라, 그 안에 사는 사람들의 시간이다.<br>천천히 잘 짓는 것이 결국 가장 빠른 길이다.</p>
            <div class="lg-quote-by">— 세울엔지니어링</div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260520e"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260509a"></script>
</body>
</html>
