<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 — (주)세울엔지니어링</title>
    <meta name="description" content="세울엔지니어링의 공지사항 및 서비스 안내를 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260901a">
    <style>
    .notice-row { cursor: pointer; }
    .notice-row:hover td:nth-child(2) { color: var(--accent); }
    .notice-row td:nth-child(2) { font-weight: 500; transition: color var(--transition); }
    .notice-detail { display: none; }
    .notice-detail.open { display: table-row; }
    .notice-detail td { background: var(--gray-50); padding: 24px 20px !important; }
    .notice-detail-content { font-size: 14px; line-height: 1.85; color: var(--gray-700); white-space: pre-line; }
    .badge-important { background: var(--red); color: var(--white); }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>공지사항</span>
        </div>
        <h1>공지사항</h1>
        <p>세울엔지니어링의 소식과 주요 안내사항을 확인하세요</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">
        <div class="tbl-wrap">
            <table class="tbl">
                <thead>
                    <tr>
                        <th style="width:60px;text-align:center;">번호</th>
                        <th>제목</th>
                        <th style="width:120px;">날짜</th>
                    </tr>
                </thead>
                <tbody id="noticeBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260831f"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260901a"></script>
<script>
(function() {
    const notices = DataService.getAll('notices');
    const PER = 10;
    let openId = null;
    let curPage = 1;

    function render() {
        const total = notices.length;
        const pages = Math.max(1, Math.ceil(total / PER));
        if (curPage > pages) curPage = pages;
        const start = (curPage - 1) * PER;
        const slice = notices.slice(start, start + PER);

        const tbody = document.getElementById('noticeBody');
        tbody.innerHTML = slice.map((n, i) => {
            const num = total - (start + i);
            const importantBadge = n.important ? '<span class="badge badge-important" style="margin-right:8px;">중요</span>' : '';
            const isOpen = openId === n.id;
            return `
                <tr class="notice-row" data-id="${n.id}">
                    <td style="text-align:center;color:var(--gray-400);font-size:13px;">${num}</td>
                    <td>${importantBadge}${n.title}</td>
                    <td style="color:var(--gray-400);font-size:13px;">${n.date}</td>
                </tr>
                <tr class="notice-detail ${isOpen ? 'open' : ''}" id="detail-${n.id}">
                    <td colspan="3">
                        <div class="notice-detail-content">${n.content}</div>
                    </td>
                </tr>`;
        }).join('');

        tbody.querySelectorAll('.notice-row').forEach(row => {
            row.addEventListener('click', () => {
                const id = row.dataset.id;
                if (openId === id) {
                    openId = null;
                } else {
                    openId = id;
                }
                // 모든 상세를 닫고 해당 항목만 열기
                document.querySelectorAll('.notice-detail').forEach(d => d.classList.remove('open'));
                if (openId) {
                    document.getElementById('detail-' + openId).classList.add('open');
                }
            });
        });

        renderPager(pages);
    }

    function renderPager(pages) {
        const pg = document.getElementById('pagination');
        if (pages <= 1) { pg.innerHTML = ''; return; }
        const groupStart = Math.floor((curPage - 1) / 10) * 10 + 1;
        const groupEnd = Math.min(groupStart + 9, pages);
        let h = `<button class="arr" ${curPage === 1 ? 'disabled' : ''} onclick="NoticePage.go(${curPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
        for (let i = groupStart; i <= groupEnd; i++) {
            h += `<button${i === curPage ? ' class="active"' : ''} onclick="NoticePage.go(${i})">${i}</button>`;
        }
        h += `<button class="arr" ${curPage === pages ? 'disabled' : ''} onclick="NoticePage.go(${curPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
        pg.innerHTML = h;
    }

    window.NoticePage = {
        go(p) {
            curPage = p;
            openId = null;
            render();
            window.scrollTo({ top: document.querySelector('.tbl-wrap').offsetTop - 100, behavior: 'smooth' });
        }
    };

    render();
})();
</script>
</body>
</html>
