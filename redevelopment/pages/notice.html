<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 — (주)빛세움</title>
    <meta name="description" content="빛세움의 공지사항 및 서비스 안내를 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260830j">
    <link rel="stylesheet" href="../assets/css/download-view.css?v=20260830b">
    <style>
    .notice-row { cursor: pointer; }
    .notice-row:hover td:nth-child(2) { color: var(--accent); }
    .notice-row td:nth-child(2) { font-weight: 500; transition: color var(--transition); }
    /* 상세 본문(.notice-detail-content, .nt-*) 및 .badge-important 스타일은
       common.css로 이동 — NoticeDetailModal(팝업)과 공유 */

    /* 카테고리 탭바 — 업무실적/갤러리 탭바와 동일한 규격으로 통일 */
    #noticeTabs{display:flex;align-items:center;gap:0;margin-bottom:24px;padding:16px 24px;background:#fff;border-radius:14px;border:1px solid var(--gray-200);box-shadow:0 2px 8px rgba(0,0,0,.03);flex-wrap:wrap;box-sizing:border-box}
    #noticeTabs button{padding:6px 14px;border-right:1px solid var(--gray-200)}
    #noticeTabs button:first-child{padding-left:0}
    #noticeTabs button:last-child{border-right:none}
    @media(max-width:640px){
      #noticeTabs{padding:14px 16px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
      #noticeTabs::-webkit-scrollbar{display:none}
      #noticeTabs button{flex-shrink:0}
    }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>공지사항</span>
        </div>
        <h1>공지사항</h1>
        <p>빛세움의 소식과 주요 안내사항을 확인하세요</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">
        <div class="tabs" id="noticeTabs">
            <button data-cat="전체">전체</button>
            <button data-cat="수주소식">수주소식</button>
            <button data-cat="회사소식">회사소식</button>
            <button data-cat="기타소식">기타소식</button>
        </div>
        <div class="tbl-wrap">
            <table class="tbl">
                <thead>
                    <tr>
                        <th style="width:60px;text-align:center;">번호</th>
                        <th>제목</th>
                        <th style="width:120px;">날짜</th>
                    </tr>
                </thead>
                <tbody id="noticeBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260830b"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260830g"></script>
<script>
(function() {
    const notices = DataService.getAll('notices');

    const validCats = ['수주소식', '회사소식', '기타소식'];
    const params = new URLSearchParams(location.search);
    const catParam = params.get('cat');
    let currentCat = validCats.includes(catParam) ? catParam : '전체';

    function noticeCat(n) {
        return validCats.includes(n.category) ? n.category : '기타소식';
    }

    const idParam = params.get('id');
    let openId = null;
    if (idParam) {
        const target = notices.find(n => n.id === idParam);
        if (target) {
            currentCat = validCats.includes(catParam) ? catParam : noticeCat(target);
            openId = idParam;
        }
    }

    function render() {
        const filtered = currentCat === '전체' ? notices : notices.filter(n => noticeCat(n) === currentCat);
        const tbody = document.getElementById('noticeBody');
        if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--gray-400);padding:40px 0;">등록된 공지사항이 없습니다.</td></tr>';
            return;
        }
        tbody.innerHTML = filtered.map((n, i) => {
            const num = filtered.length - i;
            const importantBadge = n.important ? '<span class="badge badge-important" style="margin-right:8px;">중요</span>' : '';
            return `
                <tr class="notice-row" data-id="${n.id}">
                    <td style="text-align:center;color:var(--gray-400);font-size:13px;">${num}</td>
                    <td>${importantBadge}${n.title}</td>
                    <td style="color:var(--gray-400);font-size:13px;">${n.date}</td>
                </tr>`;
        }).join('');

        tbody.querySelectorAll('.notice-row').forEach(row => {
            row.addEventListener('click', () => {
                const n = notices.find(x => x.id === row.dataset.id);
                if (n) NoticeDetailModal.open(n);
            });
        });
    }

    const tabsEl = document.getElementById('noticeTabs');
    tabsEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.cat === currentCat));
    tabsEl.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        tabsEl.querySelectorAll('button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        currentCat = btn.dataset.cat;
        render();
    });

    render();
    if (openId) {
        const target = notices.find(n => n.id === openId);
        if (target) NoticeDetailModal.open(target);
    }
})();
</script>
</body>
</html>
