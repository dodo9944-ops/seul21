<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 — (주)빛세움</title>
    <meta name="description" content="빛세움의 공지사항 및 서비스 안내를 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260906c">
    <link rel="stylesheet" href="../assets/css/download-view.css?v=20260905a">
    <style>
    /* 히어로→탭메뉴 간격 — 세로 간격 표준 §1 통일 (2026-09-05), 기존 28px/20px 충돌 규칙 제거 */
    .page-body{padding-top:var(--space-hero-to-title)}
    .notice-row { cursor: pointer; }
    .notice-row:hover td:nth-child(2) { color: var(--accent); }
    .notice-row td:nth-child(2) { font-weight: 500; transition: color var(--transition); }
    /* 상세 본문(.notice-detail-content, .nt-*) 및 .badge-important 스타일은
       common.css로 이동 — NoticeDetailModal(팝업)과 공유 */

    /* 카테고리 탭바 — 업무실적/갤러리 탭바와 동일한 규격으로 통일 */
    #noticeTabs{display:flex;align-items:center;gap:0;margin-bottom:24px;padding:16px 24px;background:#fff;border-radius:14px;border:1px solid #cecece;box-shadow:0 2px 8px rgba(0,0,0,.03);flex-wrap:wrap;box-sizing:border-box}
    #noticeTabs button{padding:6px 14px;border-right:1px solid #cecece;position:relative}
    #noticeTabs button:first-of-type{padding-left:0}
    #noticeTabs button:last-of-type{border-right:none}
    /* 자료실(#ctrlNav)과 동일한 언더바 인디케이터로 통일 */
    #noticeTabs button.on{background:none;color:var(--gold);font-weight:700}
    #noticeTabs button.on::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:20px;height:2px;border-radius:1px;background:var(--gold)}
    /* 우측 건수 표시 — 자료실 .ctrl-count와 동일하게 탭바 우측에 배치 */
    .notice-result{font-size:14px;color:var(--gray-500);font-weight:500;white-space:nowrap;margin-left:auto}
    .notice-result strong{color:var(--brand-dark);font-weight:700}
    /* 탭별 공지 건수 — 업무실적(.pf-tab-count)과 동일한 표기 */
    .notice-tab-count{font-size:11px;font-weight:600;color:#111;margin-left:6px}
    #noticeTabs button.on .notice-tab-count{color:var(--gold)}
    /* 공지 유형 배지 — 수주소식/회사소식/기타소식 구분 (레드 미사용) */
    .badge-order{background:rgba(0,104,183,.12);color:#0068B7}
    .badge-company{background:rgba(0,154,68,.12);color:#009A44}
    .badge-etc{background:var(--gray-100);color:var(--gray-600)}
    .badge-union{background:rgba(197,139,0,.12);color:#C58B00}
    .badge-press{background:rgba(71,85,105,.12);color:#475569}
    @media(max-width:640px){
      #noticeTabs{padding:14px 16px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
      #noticeTabs::-webkit-scrollbar{display:none}
      #noticeTabs button{flex-shrink:0}
    }

    /* 페이지네이션 — 자료실(library.html) 주요뉴스 하단 번호표와 동일 규격·프로그래밍 (대장 지시 2026-09-05) */
    .pager-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:40px;padding-top:24px;border-top:1px solid #dbdbdb}
    .pager{display:flex;align-items:center;gap:4px}
    .pager button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1.5px solid #cecece;border-radius:10px;background:#fff;color:var(--gray-600);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .pager button:hover{border-color:#a6790a;color:var(--brand-dark);background:rgba(184,134,11,.04)}
    .pager button.active{background:#FFFFFF;color:var(--gold);border-color:var(--brand-dark);box-shadow:0 2px 8px rgba(10,15,28,.12)}
    .pager button.arr{color:var(--gray-400);font-size:13px}
    .pager button:disabled{opacity:.25;cursor:default;pointer-events:none}
    .pager-per{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-400)}
    .pager-per select{height:32px;padding:0 24px 0 8px;border:1px solid #cecece;border-radius:6px;font-size:12px;font-family:var(--font);color:var(--gray-600);cursor:pointer;appearance:auto}
    @media(max-width:768px){.pager-wrap{flex-direction:column;gap:12px}}
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>공지사항</span>
        </div>
        <h1>공지사항</h1>
        <p>빛세움의 소식과 주요 안내사항을 확인하세요</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">
        <div class="tabs" id="noticeTabs">
            <button data-cat="전체">전체<span class="notice-tab-count"></span></button>
            <button data-cat="수주소식">수주소식<span class="notice-tab-count"></span></button>
            <button data-cat="회사소식">회사소식<span class="notice-tab-count"></span></button>
            <button data-cat="조합소식">조합소식<span class="notice-tab-count"></span></button>
            <button data-cat="기사소식">기사소식<span class="notice-tab-count"></span></button>
            <div class="notice-result" id="noticeResult"></div>
        </div>
        <div class="tbl-wrap">
            <table class="tbl">
                <thead>
                    <tr>
                        <th style="width:60px;text-align:center;">번호</th>
                        <th>제목</th>
                        <th style="width:120px;">날짜</th>
                    </tr>
                </thead>
                <tbody id="noticeBody"></tbody>
            </table>
        </div>
        <div class="pager-wrap" id="pagerWrap">
            <div class="pager" id="pager"></div>
            <div class="pager-per">
                <span>페이지당</span>
                <select id="perSelect"><option value="6">6개</option><option value="10" selected>10개</option><option value="20">20개</option></select>
            </div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260906a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260906i"></script>
<script>
(function() {
    const notices = DataService.getAll('notices');

    const validCats = ['수주소식', '회사소식', '조합소식', '기사소식'];
    const params = new URLSearchParams(location.search);
    const catParam = params.get('cat');
    let currentCat = validCats.includes(catParam) ? catParam : '전체';
    let PER = 10, curPage = 1; /* 공지사항 기본 10줄 (대장 지시 2026-09-05) */

    function noticeCat(n) {
        return validCats.includes(n.category) ? n.category : '기사소식';
    }

    const idParam = params.get('id');
    let openId = null;
    if (idParam) {
        const target = notices.find(n => n.id === idParam);
        if (target) {
            currentCat = validCats.includes(catParam) ? catParam : noticeCat(target);
            openId = idParam;
        }
    }

    const catBadgeCls = { '수주소식': 'badge-order', '회사소식': 'badge-company', '조합소식': 'badge-union', '기사소식': 'badge-press' };

    function renderTabCounts() {
        document.querySelectorAll('#noticeTabs button[data-cat]').forEach(b => {
            const cat = b.dataset.cat;
            const count = cat === '전체' ? notices.length : notices.filter(x => noticeCat(x) === cat).length;
            const span = b.querySelector('.notice-tab-count');
            if (span) span.textContent = count + '건';
        });
    }

    function renderPager(pages) {
        const pg = document.getElementById('pager');
        if (pages <= 1) { pg.innerHTML = ''; return; }
        const blk = 5; /* 페이지 번호 5개까지만 표시, 화살표로 다음 묶음(6번~) 이동 (대장 지시 2026-09-05) */
        const bStart = Math.floor((curPage - 1) / blk) * blk + 1;
        const bEnd = Math.min(bStart + blk - 1, pages);
        const bPrev = Math.max(1, bStart - blk), bNext = bEnd + 1;
        let h = '<button class="arr" ' + (curPage === 1 ? 'disabled' : '') + ' data-p="1"><i class="fa-solid fa-angles-left"></i></button>';
        h += '<button class="arr" ' + (bStart === 1 ? 'disabled' : '') + ' data-p="' + bPrev + '"><i class="fa-solid fa-chevron-left"></i></button>';
        for (let i = bStart; i <= bEnd; i++) h += '<button' + (i === curPage ? ' class="active"' : '') + ' data-p="' + i + '">' + i + '</button>';
        h += '<button class="arr" ' + (bEnd === pages ? 'disabled' : '') + ' data-p="' + bNext + '"><i class="fa-solid fa-chevron-right"></i></button>';
        h += '<button class="arr" ' + (curPage === pages ? 'disabled' : '') + ' data-p="' + pages + '"><i class="fa-solid fa-angles-right"></i></button>';
        pg.innerHTML = h;
    }

    function render() {
        const filtered = currentCat === '전체' ? notices : notices.filter(n => noticeCat(n) === currentCat);
        document.getElementById('noticeResult').innerHTML = '총 <strong>' + filtered.length + '</strong>건';
        const tbody = document.getElementById('noticeBody');
        const pagerWrap = document.getElementById('pagerWrap');
        if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--gray-400);padding:40px 0;">등록된 공지사항이 없습니다.</td></tr>';
            pagerWrap.style.display = 'none';
            return;
        }
        pagerWrap.style.display = '';
        const pages = Math.ceil(filtered.length / PER);
        if (curPage > pages) curPage = 1;
        const start = (curPage - 1) * PER;
        const slice = filtered.slice(start, start + PER);
        tbody.innerHTML = slice.map((n, i) => {
            const num = filtered.length - (start + i);
            const cat = noticeCat(n);
            const catBadge = `<span class="badge ${catBadgeCls[cat]}" style="margin-right:6px;">${cat}</span>`;
            const importantBadge = n.important ? '<span class="badge badge-important" style="margin-right:8px;">중요</span>' : '';
            return `
                <tr class="notice-row" data-id="${n.id}">
                    <td style="text-align:center;color:var(--gray-400);font-size:13px;">${num}</td>
                    <td>${catBadge}${importantBadge}${n.title}</td>
                    <td style="color:var(--gray-400);font-size:13px;">${n.date}</td>
                </tr>`;
        }).join('');

        tbody.querySelectorAll('.notice-row').forEach(row => {
            row.addEventListener('click', () => {
                const n = notices.find(x => x.id === row.dataset.id);
                if (n) NoticeDetailModal.open(n);
            });
        });

        renderPager(pages);
    }

    const tabsEl = document.getElementById('noticeTabs');
    tabsEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.cat === currentCat));
    tabsEl.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        tabsEl.querySelectorAll('button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        currentCat = btn.dataset.cat;
        curPage = 1;
        render();
    });

    document.getElementById('pager').addEventListener('click', e => {
        const btn = e.target.closest('button[data-p]');
        if (!btn || btn.disabled) return;
        curPage = parseInt(btn.dataset.p, 10);
        render();
        document.querySelector('.tbl-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('perSelect').addEventListener('change', function () {
        PER = parseInt(this.value, 10);
        curPage = 1;
        render();
    });

    renderTabCounts();
    render();
    if (openId) {
        const target = notices.find(n => n.id === openId);
        if (target) NoticeDetailModal.open(target);
    }
})();
</script>
</body>
</html>
