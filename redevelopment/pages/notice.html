<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 — (주)빛세움</title>
    <meta name="description" content="빛세움의 공지사항 및 서비스 안내를 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260829i">
    <style>
    .notice-row { cursor: pointer; }
    .notice-row:hover td:nth-child(2) { color: var(--accent); }
    .notice-row td:nth-child(2) { font-weight: 500; transition: color var(--transition); }
    .notice-detail { display: none; }
    .notice-detail.open { display: table-row; }
    .notice-detail td { background: var(--gray-50); padding: 24px 20px !important; }
    .notice-detail-content { font-size: 14px; line-height: 1.85; color: var(--gray-700); white-space: pre-line; }
    .notice-detail-content p { margin: 0 0 14px; }
    .notice-detail-content p:last-child { margin-bottom: 0; }
    .badge-important { background: var(--red); color: var(--white); }

    /* === 공지 본문 — 통계 강조 / 표 디자인 === */
    .nt-lead { font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .nt-stats { display: flex; gap: 12px; margin: 4px 0 22px; flex-wrap: wrap; }
    .nt-stat-card { flex: 1; min-width: 130px; background: linear-gradient(160deg, #FFFFFF, #FFF6D6); border: 1px solid rgba(184,134,11,.22); border-radius: 14px; padding: 18px 16px; text-align: center; }
    .nt-stat-num { font-size: 28px; font-weight: 800; color: var(--brand-dark); line-height: 1.1; }
    .nt-stat-num span { font-size: 14px; font-weight: 700; color: var(--gold); margin-left: 2px; }
    .nt-stat-label { font-size: 11.5px; color: var(--gray-500); margin-top: 6px; font-weight: 600; }
    .nt-divider { height: 1px; background: var(--gray-100); margin: 26px 0; }
    .nt-table-title { font-size: 14px; font-weight: 800; color: var(--gray-900); margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
    .nt-table-title i { color: var(--gold); font-size: 12px; }
    .nt-table-wrap { overflow-x: auto; border: 1px solid var(--gray-150,#eaedf0); border-radius: 12px; margin-bottom: 8px; }
    .nt-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 380px; }
    .nt-table th { background: var(--gray-900); color: #fff; font-weight: 700; padding: 10px 12px; text-align: left; white-space: nowrap; }
    .nt-table th:first-child, .nt-table td:first-child { text-align: center; width: 44px; }
    .nt-table th:last-child, .nt-table td:last-child { text-align: right; }
    .nt-table td { padding: 9px 12px; border-top: 1px solid var(--gray-100); color: var(--gray-600); }
    .nt-table tr.hl td { background: rgba(184,134,11,.09); color: var(--brand-dark); font-weight: 800; }
    .nt-table tr.hl td:first-child { color: var(--gold); }
    .nt-source { display: flex; align-items: flex-start; gap: 6px; font-size: 11.5px; color: var(--gray-400); line-height: 1.5; margin: 6px 0 4px; }
    .nt-source i { color: var(--gray-300); margin-top: 2px; }
    .nt-source-title { font-size: 14px; font-weight: 800; color: var(--gray-900); margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }
    .nt-source-title i { color: var(--gold); font-size: 12px; }
    .nt-source-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .nt-source-card { border: 1px solid var(--gray-150,#eaedf0); border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .nt-source-card img { width: 100%; display: block; }
    .nt-source-cap { padding: 10px 14px; font-size: 11.5px; color: var(--gray-500); line-height: 1.5; border-top: 1px solid var(--gray-100); }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>공지사항</span>
        </div>
        <h1>공지사항</h1>
        <p>빛세움의 소식과 주요 안내사항을 확인하세요</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">
        <div class="tbl-wrap">
            <table class="tbl">
                <thead>
                    <tr>
                        <th style="width:60px;text-align:center;">번호</th>
                        <th>제목</th>
                        <th style="width:120px;">날짜</th>
                    </tr>
                </thead>
                <tbody id="noticeBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260829r"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260829q"></script>
<script>
(function() {
    const notices = DataService.getAll('notices');
    let openId = null;

    function render() {
        const tbody = document.getElementById('noticeBody');
        tbody.innerHTML = notices.map((n, i) => {
            const num = notices.length - i;
            const importantBadge = n.important ? '<span class="badge badge-important" style="margin-right:8px;">중요</span>' : '';
            const isOpen = openId === n.id;
            return `
                <tr class="notice-row" data-id="${n.id}">
                    <td style="text-align:center;color:var(--gray-400);font-size:13px;">${num}</td>
                    <td>${importantBadge}${n.title}</td>
                    <td style="color:var(--gray-400);font-size:13px;">${n.date}</td>
                </tr>
                <tr class="notice-detail ${isOpen ? 'open' : ''}" id="detail-${n.id}">
                    <td colspan="3">
                        <div class="notice-detail-content">${n.content}</div>
                    </td>
                </tr>`;
        }).join('');

        tbody.querySelectorAll('.notice-row').forEach(row => {
            row.addEventListener('click', () => {
                const id = row.dataset.id;
                if (openId === id) {
                    openId = null;
                } else {
                    openId = id;
                }
                // 모든 상세를 닫고 해당 항목만 열기
                document.querySelectorAll('.notice-detail').forEach(d => d.classList.remove('open'));
                if (openId) {
                    document.getElementById('detail-' + openId).classList.add('open');
                }
            });
        });
    }

    render();
})();
</script>
</body>
</html>
