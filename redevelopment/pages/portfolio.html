<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무실적 — (주)세울엔지니어링</title>
    <meta name="description" content="(주)세울엔지니어링의 재개발·재건축·소규모정비 업무 수행실적을 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
    /* ============================================================
       Portfolio Page — Photo-First Premium Design
       ============================================================ */

    /* ── Hero ── */
    .portfolio-hero {
        padding: 64px 0 56px;
        background: linear-gradient(135deg, #070B15 0%, var(--brand-dark) 40%, var(--brand-navy) 100%);
        border-bottom: none;
        position: relative;
        overflow: hidden;
    }
    .portfolio-hero::before {
        content: '';
        position: absolute;
        top: -50%; right: -20%;
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(195,165,105,0.06) 0%, transparent 70%);
        pointer-events: none;
    }
    .portfolio-hero::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(195,165,105,0.3), transparent);
    }
    .portfolio-hero .breadcrumb { margin-bottom: 20px; }
    .portfolio-hero h1 {
        font-size: 36px; font-weight: 900; letter-spacing: -0.5px;
        color: var(--white); margin-bottom: 14px;
        padding-left: 18px; border-left: 3px solid var(--gold);
    }
    .portfolio-hero .hero-tagline {
        font-size: 17px; font-weight: 600; color: var(--gold);
        margin-bottom: 8px; letter-spacing: -0.2px;
    }
    .portfolio-hero .hero-subtitle {
        font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.6;
    }
    @media (max-width: 768px) {
        .portfolio-hero { padding: 40px 0 32px; }
        .portfolio-hero h1 { font-size: 26px; }
    }

    /* ── KPI Stats ── */
    .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px; margin-bottom: 56px;
    }
    @media (max-width: 1024px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; } }
    @media (max-width: 540px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    .kpi-card {
        background: var(--brand-dark); border-radius: 14px; padding: 28px 24px;
        text-align: center; position: relative; overflow: hidden;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    .kpi-card::after {
        content: ''; position: absolute; bottom: 0; left: 50%;
        transform: translateX(-50%); width: 40px; height: 3px;
        background: var(--gold); border-radius: 2px;
    }
    .kpi-card .kpi-icon { font-size: 22px; color: var(--gold); margin-bottom: 14px; }
    .kpi-card .kpi-value { font-size: 30px; font-weight: 800; color: var(--gold); line-height: 1.2; margin-bottom: 6px; }
    .kpi-card .kpi-label { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.55); }
    @media (max-width: 540px) {
        .kpi-card { padding: 22px 16px; }
        .kpi-card .kpi-value { font-size: 24px; }
    }

    /* ── Section Title ── */
    .portfolio-section-head {
        display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px;
    }
    .portfolio-section-title {
        font-size: 24px; font-weight: 800; color: var(--gray-900);
        letter-spacing: -0.5px; position: relative; padding-left: 16px;
    }
    .portfolio-section-title::before {
        content: ''; position: absolute; left: 0; top: 4px;
        width: 3px; height: 22px; border-radius: 2px;
        background: linear-gradient(to bottom, var(--gold), rgba(195,165,105,0.3));
    }

    /* ── Badges ── */
    .pf-badge {
        display: inline-flex; align-items: center;
        padding: 5px 12px; border-radius: 6px;
        font-size: 11px; font-weight: 700; line-height: 1;
    }
    .pf-badge-type { background: rgba(10,15,28,0.85); color: #fff; }
    .pf-badge-ing { background: rgba(195,165,105,0.9); color: #0A0F1C; }
    .pf-badge-done { background: rgba(255,255,255,0.9); color: #0A0F1C; }

    /* ════════════════════════════════════════════════════════════
       FEATURED CARDS — 주요 수행실적 (Photo-first)
       ════════════════════════════════════════════════════════════ */
    .featured-grid {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
    }
    @media (max-width: 1024px) { .featured-grid { grid-template-columns: 1fr; gap: 20px; } }

    .feat-card {
        background: var(--white);
        border: 1.5px solid var(--gray-200);
        border-radius: 18px;
        overflow: hidden;
        display: flex; flex-direction: column;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .feat-card:hover {
        border-color: var(--gold);
        box-shadow: 0 20px 48px rgba(195,165,105,0.18);
        transform: translateY(-8px);
    }

    /* Featured Image — larger for prominence */
    .feat-img {
        width: 100%; height: 240px;
        position: relative; overflow: hidden;
        flex-shrink: 0;
    }
    .feat-img img {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
        transition: transform 0.5s ease;
    }
    .feat-card:hover .feat-img img { transform: scale(1.06); }
    .feat-img .img-overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(10,15,28,0.5) 0%, transparent 50%);
        pointer-events: none;
    }
    .feat-img .img-badges {
        position: absolute; top: 14px; left: 14px;
        display: flex; gap: 6px; z-index: 2;
    }

    /* Featured Fallback (no image) */
    .feat-img-fallback {
        width: 100%; height: 240px;
        position: relative; overflow: hidden; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 10px;
    }
    .feat-img-fallback[data-type="redev"] { background: linear-gradient(135deg, #0A0F1C, #1a3055, #2a4a75); }
    .feat-img-fallback[data-type="recon"] { background: linear-gradient(135deg, #142644, #1e3a5f, #0A0F1C); }
    .feat-img-fallback[data-type="small"] { background: linear-gradient(135deg, #1a2a40, #243a55, #C3A569); }
    .feat-img-fallback .fb-icon {
        width: 64px; height: 64px; border-radius: 50%;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
        display: flex; align-items: center; justify-content: center;
    }
    .feat-img-fallback .fb-icon i { font-size: 28px; color: rgba(195,165,105,0.6); }
    .feat-img-fallback .fb-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 1px; }
    .feat-img-fallback .img-badges {
        position: absolute; top: 14px; left: 14px;
        display: flex; gap: 6px; z-index: 2;
    }

    /* Featured Body — more prominent */
    .feat-body { padding: 24px 26px 28px; display: flex; flex-direction: column; flex: 1; }
    .feat-body .feat-name {
        font-size: 19px; font-weight: 800; color: var(--gray-900);
        margin-bottom: 16px; line-height: 1.4; letter-spacing: -0.4px;
    }
    .feat-body .feat-specs {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 6px 12px; margin-bottom: 14px;
        padding: 12px; background: var(--gray-50); border-radius: 10px;
    }
    .feat-body .feat-spec {
        display: flex; align-items: center;
        font-size: 12.5px; color: var(--gray-600);
    }
    .feat-body .feat-spec i { width: 16px; color: var(--gold); margin-right: 6px; font-size: 11px; text-align: center; }
    .feat-body .feat-spec strong { font-weight: 600; color: var(--gray-800); }
    .feat-body .feat-desc {
        font-size: 14px; color: var(--gray-500); line-height: 1.65;
        margin-top: auto; padding-top: 14px;
        border-top: 1px solid var(--gray-100);
    }
    .feat-body .feat-btn {
        display: inline-flex; align-items: center; gap: 6px;
        margin-top: 16px; padding: 8px 16px;
        background: var(--brand-dark); color: var(--gold);
        border: none; border-radius: 8px;
        font-size: 13px; font-weight: 600; font-family: var(--font);
        cursor: pointer; transition: all 0.2s ease; align-self: flex-start;
    }
    .feat-body .feat-btn:hover { background: var(--brand-navy); transform: translateX(2px); }
    .feat-body .feat-btn i { font-size: 11px; transition: transform 0.2s ease; }
    .feat-body .feat-btn:hover i { transform: translateX(3px); }

    /* ════════════════════════════════════════════════════════════
       ALL CARDS — 전체 수행실적 (Thumbnail grid)
       ════════════════════════════════════════════════════════════ */
    .section-divider { margin: 56px 0; border: none; border-top: 1px solid var(--gray-200); }

    .filter-control-bar {
        display: flex; align-items: center; gap: 14px;
        margin-bottom: 24px; padding: 16px 20px;
        background: var(--gray-50); border-radius: 14px;
        border: 1px solid var(--gray-100); flex-wrap: wrap;
    }
    .filter-control-bar .filter-select {
        height: 40px; padding: 0 32px 0 14px;
        border: 1.5px solid var(--gray-200); border-radius: 10px;
        font-size: 13.5px; font-weight: 500; color: var(--gray-800);
        background: var(--white); cursor: pointer; appearance: auto;
        font-family: var(--font); transition: border-color 0.2s ease; min-width: 130px;
    }
    .filter-control-bar .filter-select:focus {
        outline: none; border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(195,165,105,0.1);
    }
    .filter-control-bar .result-count { margin-left: auto; font-size: 14px; color: var(--gray-500); font-weight: 500; }
    .filter-control-bar .result-count strong { color: var(--brand-dark); font-weight: 700; }
    @media (max-width: 540px) {
        .filter-control-bar { flex-direction: column; align-items: stretch; gap: 10px; }
        .filter-control-bar .filter-select { width: 100%; min-width: unset; }
        .filter-control-bar .result-count { margin-left: 0; text-align: center; }
    }

    .portfolio-grid {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    }
    @media (max-width: 1024px) { .portfolio-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
    @media (max-width: 540px) { .portfolio-grid { grid-template-columns: 1fr; gap: 14px; } }

    .pf-card {
        background: var(--white);
        border: 1.5px solid var(--gray-200);
        border-radius: 14px;
        overflow: hidden;
        display: flex; flex-direction: column;
        cursor: pointer;
        transition: all 0.25s ease;
    }
    .pf-card:hover {
        border-color: var(--gold);
        box-shadow: 0 8px 24px rgba(195,165,105,0.12);
        transform: translateY(-4px);
    }

    /* Card Thumbnail — compact for balance */
    .pf-thumb {
        width: 100%; height: 140px;
        position: relative; overflow: hidden; flex-shrink: 0;
    }
    .pf-thumb img {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
        transition: transform 0.4s ease;
    }
    .pf-card:hover .pf-thumb img { transform: scale(1.05); }
    .pf-thumb .img-overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(10,15,28,0.4) 0%, transparent 50%);
        pointer-events: none;
    }
    .pf-thumb .img-badges {
        position: absolute; top: 10px; left: 10px;
        display: flex; gap: 5px; z-index: 2;
    }

    /* Card Thumbnail Fallback */
    .pf-thumb-fallback {
        width: 100%; height: 140px;
        position: relative; overflow: hidden; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 8px;
    }
    .pf-thumb-fallback[data-type="redev"] { background: linear-gradient(135deg, #0A0F1C, #1a3055, #2a4a75); }
    .pf-thumb-fallback[data-type="recon"] { background: linear-gradient(135deg, #142644, #1e3a5f, #0A0F1C); }
    .pf-thumb-fallback[data-type="small"] { background: linear-gradient(135deg, #1a2a40, #243a55, #C3A569); }
    .pf-thumb-fallback .fb-icon {
        width: 52px; height: 52px; border-radius: 50%;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
        display: flex; align-items: center; justify-content: center;
    }
    .pf-thumb-fallback .fb-icon i { font-size: 22px; color: rgba(195,165,105,0.6); }
    .pf-thumb-fallback .fb-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.3); letter-spacing: 0.5px; }
    .pf-thumb-fallback .img-badges {
        position: absolute; top: 10px; left: 10px;
        display: flex; gap: 5px; z-index: 2;
    }

    /* Card Body */
    .pf-body { padding: 18px 20px 22px; display: flex; flex-direction: column; flex: 1; }
    .pf-body .pf-name {
        font-size: 15px; font-weight: 700; color: var(--gray-900);
        margin-bottom: 12px; line-height: 1.4; letter-spacing: -0.2px;
    }
    .pf-body .pf-row {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 13px; color: var(--gray-600); padding: 5px 0;
    }
    .pf-body .pf-row + .pf-row { border-top: 1px solid var(--gray-50); }
    .pf-body .pf-row .pf-label {
        display: flex; align-items: center; gap: 5px;
        font-weight: 500; color: var(--gray-500);
    }
    .pf-body .pf-row .pf-label i { font-size: 11px; color: var(--gold); width: 14px; text-align: center; }
    .pf-body .pf-row .pf-val { font-weight: 600; color: var(--gray-800); }
    .pf-body .pf-detail-btn {
        display: flex; align-items: center; justify-content: center; gap: 6px;
        margin-top: 16px; width: 100%; height: 38px;
        background: transparent; color: var(--brand-dark);
        border: 1.5px solid var(--gray-200); border-radius: 10px;
        font-size: 13px; font-weight: 600; font-family: var(--font);
        cursor: pointer; transition: all 0.2s ease;
    }
    .pf-body .pf-detail-btn:hover {
        background: var(--brand-dark); color: var(--gold); border-color: var(--brand-dark);
    }

    /* ── Empty State ── */
    .portfolio-empty {
        grid-column: 1 / -1; text-align: center; padding: 56px 20px;
    }
    .portfolio-empty i { font-size: 48px; color: var(--gray-300); margin-bottom: 16px; }
    .portfolio-empty h3 { font-size: 18px; font-weight: 700; color: var(--gray-600); margin-bottom: 8px; }
    .portfolio-empty p { font-size: 14px; color: var(--gray-400); }

    /* ════════════════════════════════════════════════════════════
       DETAIL MODAL — 상세보기
       ════════════════════════════════════════════════════════════ */
    .detail-overlay {
        position: fixed; inset: 0;
        background: rgba(10,15,28,0.65);
        backdrop-filter: blur(4px);
        z-index: 500;
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
        opacity: 0; pointer-events: none;
        transition: opacity 0.25s ease;
    }
    .detail-overlay.open { opacity: 1; pointer-events: auto; }
    .detail-modal {
        background: var(--white); border-radius: 16px;
        width: 100%; max-width: 640px; max-height: 90vh;
        overflow: hidden;
        display: flex; flex-direction: column;
        box-shadow: 0 24px 64px rgba(0,0,0,0.3);
        transform: translateY(20px) scale(0.97);
        transition: transform 0.3s ease;
    }
    .detail-overlay.open .detail-modal { transform: translateY(0) scale(1); }

    /* Detail Image */
    .detail-hero-img {
        width: 100%; height: 260px;
        position: relative; overflow: hidden; flex-shrink: 0;
    }
    .detail-hero-img img {
        width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .detail-hero-img .img-overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(10,15,28,0.7) 0%, rgba(10,15,28,0.1) 50%, transparent 100%);
        pointer-events: none;
    }
    .detail-hero-img .detail-hero-title {
        position: absolute; bottom: 0; left: 0; right: 0;
        padding: 20px 28px;
        z-index: 2;
    }
    .detail-hero-img .detail-hero-title .detail-badges {
        display: flex; gap: 6px; margin-bottom: 10px;
    }
    .detail-hero-img .detail-hero-title .detail-name {
        font-size: 20px; font-weight: 800; color: #fff;
        line-height: 1.35; letter-spacing: -0.3px;
    }

    /* Detail Fallback Image */
    .detail-hero-fallback {
        width: 100%; height: 200px;
        position: relative; overflow: hidden; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 10px;
    }
    .detail-hero-fallback[data-type="redev"] { background: linear-gradient(135deg, #0A0F1C, #1a3055, #2a4a75); }
    .detail-hero-fallback[data-type="recon"] { background: linear-gradient(135deg, #142644, #1e3a5f, #0A0F1C); }
    .detail-hero-fallback[data-type="small"] { background: linear-gradient(135deg, #1a2a40, #243a55, #C3A569); }
    .detail-hero-fallback .fb-icon {
        width: 72px; height: 72px; border-radius: 50%;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
        display: flex; align-items: center; justify-content: center;
    }
    .detail-hero-fallback .fb-icon i { font-size: 32px; color: rgba(195,165,105,0.6); }
    .detail-hero-fallback .fb-label { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 1px; }
    .detail-hero-fallback .detail-hero-title {
        position: absolute; bottom: 0; left: 0; right: 0;
        padding: 20px 28px; z-index: 2;
        background: linear-gradient(to top, rgba(10,15,28,0.6), transparent);
    }
    .detail-hero-fallback .detail-hero-title .detail-badges { display: flex; gap: 6px; margin-bottom: 10px; }
    .detail-hero-fallback .detail-hero-title .detail-name {
        font-size: 20px; font-weight: 800; color: #fff; line-height: 1.35;
    }

    .detail-modal-close {
        position: absolute; top: 16px; right: 16px; z-index: 10;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.4); border: none; border-radius: 50%;
        cursor: pointer; font-size: 16px; color: rgba(255,255,255,0.8);
        transition: all 0.2s ease;
    }
    .detail-modal-close:hover { background: rgba(0,0,0,0.7); color: #fff; }

    /* Detail Body */
    .detail-modal-body { padding: 28px; overflow-y: auto; flex: 1; }
    .detail-info-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 0;
        border: 1px solid var(--gray-100); border-radius: 12px; overflow: hidden;
    }
    .detail-info-item {
        display: flex; flex-direction: column;
        padding: 14px 16px;
        border-bottom: 1px solid var(--gray-100);
    }
    .detail-info-item:nth-child(odd) { border-right: 1px solid var(--gray-100); }
    .detail-info-item:nth-last-child(-n+2) { border-bottom: none; }
    .detail-info-item .info-label {
        font-size: 11.5px; font-weight: 600; color: var(--gray-400);
        text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px;
    }
    .detail-info-item .info-value { font-size: 15px; font-weight: 600; color: var(--gray-900); }

    .detail-desc {
        margin-top: 24px; padding: 20px;
        background: var(--gray-50); border-radius: 12px;
        border: 1px solid var(--gray-100);
    }
    .detail-desc-label {
        font-size: 12px; font-weight: 700; color: var(--gold);
        text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
    }
    .detail-desc p { font-size: 14.5px; color: var(--gray-700); line-height: 1.7; }

    .detail-modal-footer {
        padding: 16px 28px; border-top: 1px solid var(--gray-100);
        display: flex; justify-content: flex-end; flex-shrink: 0;
    }
    .detail-close-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 24px; background: var(--brand-dark); color: var(--white);
        border: none; border-radius: 10px;
        font-size: 14px; font-weight: 600; font-family: var(--font);
        cursor: pointer; transition: all 0.2s ease;
    }
    .detail-close-btn:hover { background: var(--brand-navy); }

    @media (max-width: 540px) {
        .detail-hero-img, .detail-hero-fallback { height: 180px; }
        .detail-hero-img .detail-hero-title .detail-name,
        .detail-hero-fallback .detail-hero-title .detail-name { font-size: 17px; }
        .detail-modal-body { padding: 20px; }
        .detail-info-grid { grid-template-columns: 1fr; }
        .detail-info-item:nth-child(odd) { border-right: none; }
        .detail-info-item { border-bottom: 1px solid var(--gray-100); }
        .detail-info-item:last-child { border-bottom: none; }
        .detail-modal-footer { padding: 14px 20px; }
    }
    </style>
</head>
<body>
<div id="site-header"></div>

<!-- ── Hero Banner ── -->
<div class="portfolio-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>업무실적</span>
        </div>
        <h1>업무실적</h1>
        <p class="hero-tagline">재개발·재건축·소규모정비사업의 축적된 수행 경험</p>
        <p class="hero-subtitle">사업성 분석부터 인허가, 시공관리, 준공까지 프로젝트별 실적을 확인하세요</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">

        <!-- ── KPI Stats ── -->
        <div class="kpi-grid" id="kpiGrid"></div>

        <!-- ── 주요 수행실적 ── -->
        <div class="featured-section">
            <div class="portfolio-section-head">
                <h2 class="portfolio-section-title">주요 수행실적</h2>
            </div>
            <div class="featured-grid" id="featuredGrid"></div>
        </div>

        <hr class="section-divider">

        <!-- ── 전체 수행실적 ── -->
        <div class="portfolio-section-head">
            <h2 class="portfolio-section-title">전체 수행실적</h2>
        </div>

        <div class="filter-control-bar">
            <select class="filter-select" id="filterType">
                <option value="전체">유형 전체</option>
                <option value="재개발">재개발</option>
                <option value="재건축">재건축</option>
                <option value="소규모정비">소규모정비</option>
            </select>
            <select class="filter-select" id="filterStatus">
                <option value="전체">상태 전체</option>
                <option value="진행중">진행중</option>
                <option value="완료">완료</option>
            </select>
            <div class="result-count" id="resultCount"></div>
        </div>

        <div class="portfolio-grid" id="portfolioGrid"></div>
    </div>
</div>

<!-- ── Detail Modal ── -->
<div class="detail-overlay" id="detailOverlay">
    <div class="detail-modal">
        <div id="detailHeroArea"></div>
        <button class="detail-modal-close" id="detailCloseTop" aria-label="닫기"><i class="fa-solid fa-xmark"></i></button>
        <div class="detail-modal-body">
            <div class="detail-info-grid" id="detailInfoGrid"></div>
            <div class="detail-desc">
                <div class="detail-desc-label">프로젝트 설명</div>
                <p id="detailDesc"></p>
            </div>
        </div>
        <div class="detail-modal-footer">
            <button class="detail-close-btn" id="detailCloseBottom"><i class="fa-solid fa-xmark"></i> 닫기</button>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js"></script>
<script src="../assets/js/data-service.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(function() {

    var data = MOCK.portfolio;

    /* ── Helpers ── */
    function typeIcon(t) {
        return {'재개발':'fa-building','재건축':'fa-city','소규모정비':'fa-house-chimney'}[t] || 'fa-building-columns';
    }
    function dataType(t) {
        if (t === '재건축') return 'recon';
        if (t === '소규모정비') return 'small';
        return 'redev';
    }
    function statusBadge(s) {
        return s === '완료' ? 'pf-badge-done' : 'pf-badge-ing';
    }
    function badges(p) {
        return '<span class="pf-badge pf-badge-type">' + p.type + '</span>' +
               '<span class="pf-badge ' + statusBadge(p.status) + '">' + p.status + '</span>';
    }
    function imgError(img) {
        var fb = img.parentElement.querySelector('.img-fb-ready');
        if (fb) { fb.style.display = 'flex'; }
        img.style.display = 'none';
    }

    /* ── KPI ── */
    (function renderKPI() {
        var total = data.length;
        var ing = data.filter(function(p){return p.status==='진행중';}).length;
        var done = data.filter(function(p){return p.status==='완료';}).length;
        var units = 0;
        data.forEach(function(p) {
            var n = p.scale.replace(/[^0-9]/g, '');
            units += parseInt(n) || 0;
        });
        document.getElementById('kpiGrid').innerHTML =
            '<div class="kpi-card"><div class="kpi-icon"><i class="fa-solid fa-building"></i></div><div class="kpi-value">' + total + '건</div><div class="kpi-label">총 수행실적</div></div>' +
            '<div class="kpi-card"><div class="kpi-icon"><i class="fa-solid fa-spinner"></i></div><div class="kpi-value">' + ing + '건</div><div class="kpi-label">진행중 사업</div></div>' +
            '<div class="kpi-card"><div class="kpi-icon"><i class="fa-solid fa-circle-check"></i></div><div class="kpi-value">' + done + '건</div><div class="kpi-label">완료 사업</div></div>' +
            '<div class="kpi-card"><div class="kpi-icon"><i class="fa-solid fa-house-chimney"></i></div><div class="kpi-value">약 ' + units.toLocaleString() + '세대</div><div class="kpi-label">총 관리세대</div></div>';
    })();

    /* ── Featured Cards ── */
    function renderFeatured() {
        var items = data.filter(function(p) { return p.featured === true; });
        var grid = document.getElementById('featuredGrid');

        grid.innerHTML = items.map(function(p) {
            var imgArea;
            if (p.featuredImage) {
                imgArea = '<div class="feat-img">' +
                    '<img src="' + p.featuredImage + '" alt="' + (p.imageAlt||p.name) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
                    '<div class="feat-img-fallback" data-type="' + dataType(p.type) + '" style="display:none;position:absolute;inset:0">' +
                        '<div class="fb-icon"><i class="fa-solid ' + typeIcon(p.type) + '"></i></div>' +
                        '<span class="fb-label">' + p.type + '</span>' +
                    '</div>' +
                    '<div class="img-overlay"></div>' +
                    '<div class="img-badges">' + badges(p) + '</div>' +
                '</div>';
            } else {
                imgArea = '<div class="feat-img-fallback" data-type="' + dataType(p.type) + '">' +
                    '<div class="fb-icon"><i class="fa-solid ' + typeIcon(p.type) + '"></i></div>' +
                    '<span class="fb-label">' + p.type + '</span>' +
                    '<div class="img-badges">' + badges(p) + '</div>' +
                '</div>';
            }

            return '<div class="feat-card" onclick="portfolioApp.openDetail(\'' + p.id + '\')">' +
                imgArea +
                '<div class="feat-body">' +
                    '<div class="feat-name">' + p.name + '</div>' +
                    '<div class="feat-specs">' +
                        '<div class="feat-spec"><i class="fa-solid fa-location-dot"></i> <strong>' + p.district + '</strong></div>' +
                        '<div class="feat-spec"><i class="fa-solid fa-building"></i> ' + p.scale + '</div>' +
                        '<div class="feat-spec"><i class="fa-solid fa-layer-group"></i> ' + (p.floorInfo || '') + '</div>' +
                        '<div class="feat-spec"><i class="fa-solid fa-chart-pie"></i> ' + (p.floorAreaRatio || '') + '</div>' +
                        '<div class="feat-spec"><i class="fa-solid fa-user-tie"></i> ' + p.role + '</div>' +
                        '<div class="feat-spec"><i class="fa-solid fa-ruler-combined"></i> ' + (p.grossFloorArea || '') + '</div>' +
                    '</div>' +
                    '<div class="feat-desc">' + p.description + '</div>' +
                    '<button class="feat-btn" onclick="event.stopPropagation(); portfolioApp.openDetail(\'' + p.id + '\')">상세보기 <i class="fa-solid fa-arrow-right"></i></button>' +
                '</div>' +
            '</div>';
        }).join('');
    }

    /* ── All Cards ── */
    function getFilters() {
        return {
            type: document.getElementById('filterType').value,
            status: document.getElementById('filterStatus').value
        };
    }

    function renderAll() {
        var f = getFilters();
        var items = data.filter(function(p) {
            if (f.type !== '전체' && p.type !== f.type) return false;
            if (f.status !== '전체' && p.status !== f.status) return false;
            return true;
        });

        document.getElementById('resultCount').innerHTML = '총 <strong>' + items.length + '</strong>건';
        var grid = document.getElementById('portfolioGrid');

        if (items.length === 0) {
            grid.innerHTML = '<div class="portfolio-empty"><i class="fa-solid fa-search"></i><h3>해당 조건의 실적이 없습니다</h3><p>다른 조건으로 검색해보세요</p></div>';
            return;
        }

        grid.innerHTML = items.map(function(p) {
            var thumbArea;
            if (p.thumbnail) {
                thumbArea = '<div class="pf-thumb">' +
                    '<img src="' + p.thumbnail + '" alt="' + (p.imageAlt||p.name) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
                    '<div class="pf-thumb-fallback" data-type="' + dataType(p.type) + '" style="display:none;position:absolute;inset:0">' +
                        '<div class="fb-icon"><i class="fa-solid ' + typeIcon(p.type) + '"></i></div>' +
                        '<span class="fb-label">' + p.type + '</span>' +
                    '</div>' +
                    '<div class="img-overlay"></div>' +
                    '<div class="img-badges">' + badges(p) + '</div>' +
                '</div>';
            } else {
                thumbArea = '<div class="pf-thumb-fallback" data-type="' + dataType(p.type) + '">' +
                    '<div class="fb-icon"><i class="fa-solid ' + typeIcon(p.type) + '"></i></div>' +
                    '<span class="fb-label">' + p.type + '</span>' +
                    '<div class="img-badges">' + badges(p) + '</div>' +
                '</div>';
            }

            var extraRows = '';
            if (p.floorInfo) {
                extraRows += '<div class="pf-row"><span class="pf-label"><i class="fa-solid fa-layer-group"></i> 층수</span><span class="pf-val">' + p.floorInfo + '</span></div>';
            }
            if (p.floorAreaRatio) {
                extraRows += '<div class="pf-row"><span class="pf-label"><i class="fa-solid fa-chart-pie"></i> 용적률</span><span class="pf-val">' + p.floorAreaRatio + '</span></div>';
            }

            return '<div class="pf-card" onclick="portfolioApp.openDetail(\'' + p.id + '\')">' +
                thumbArea +
                '<div class="pf-body">' +
                    '<div class="pf-name">' + p.name + '</div>' +
                    '<div class="pf-row"><span class="pf-label"><i class="fa-solid fa-location-dot"></i> 위치</span><span class="pf-val">' + p.district + '</span></div>' +
                    '<div class="pf-row"><span class="pf-label"><i class="fa-solid fa-building"></i> 규모</span><span class="pf-val">' + p.scale + '</span></div>' +
                    '<div class="pf-row"><span class="pf-label"><i class="fa-solid fa-user-tie"></i> 역할</span><span class="pf-val">' + p.role + '</span></div>' +
                    extraRows +
                    '<button class="pf-detail-btn" onclick="event.stopPropagation(); portfolioApp.openDetail(\'' + p.id + '\')"><i class="fa-solid fa-eye"></i> 상세보기</button>' +
                '</div>' +
            '</div>';
        }).join('');
    }

    /* ── Detail Modal ── */
    function openDetail(id) {
        var item = null;
        for (var i = 0; i < data.length; i++) {
            if (data[i].id === id) { item = data[i]; break; }
        }
        if (!item) return;

        /* Hero image area */
        var heroArea = document.getElementById('detailHeroArea');
        var dt = dataType(item.type);
        var titleBlock = '<div class="detail-hero-title">' +
            '<div class="detail-badges">' + badges(item) + '</div>' +
            '<div class="detail-name">' + item.name + '</div>' +
        '</div>';

        if (item.detailImage) {
            heroArea.innerHTML = '<div class="detail-hero-img">' +
                '<img src="' + item.detailImage + '" alt="' + (item.imageAlt||item.name) + '" onerror="this.parentElement.style.background=\'linear-gradient(135deg,#0A0F1C,#1a3055)\';this.style.display=\'none\'">' +
                '<div class="img-overlay"></div>' +
                titleBlock +
            '</div>';
        } else {
            heroArea.innerHTML = '<div class="detail-hero-fallback" data-type="' + dt + '">' +
                '<div class="fb-icon"><i class="fa-solid ' + typeIcon(item.type) + '"></i></div>' +
                '<span class="fb-label">' + item.type + '</span>' +
                titleBlock +
            '</div>';
        }

        /* Info grid with extended specs */
        var infoItems =
            '<div class="detail-info-item"><span class="info-label">사업유형</span><span class="info-value">' + item.type + '</span></div>' +
            '<div class="detail-info-item"><span class="info-label">진행상태</span><span class="info-value">' + item.status + '</span></div>' +
            '<div class="detail-info-item"><span class="info-label">위치</span><span class="info-value">' + item.district + '</span></div>' +
            '<div class="detail-info-item"><span class="info-label">규모</span><span class="info-value">' + item.scale + '</span></div>' +
            '<div class="detail-info-item"><span class="info-label">역할</span><span class="info-value">' + item.role + '</span></div>' +
            '<div class="detail-info-item"><span class="info-label">연도</span><span class="info-value">' + item.year + '년</span></div>';

        if (item.floorInfo) {
            infoItems += '<div class="detail-info-item"><span class="info-label">층수</span><span class="info-value">' + item.floorInfo + '</span></div>';
        }
        if (item.floorAreaRatio) {
            infoItems += '<div class="detail-info-item"><span class="info-label">용적률</span><span class="info-value">' + item.floorAreaRatio + '</span></div>';
        }
        if (item.grossFloorArea) {
            infoItems += '<div class="detail-info-item"><span class="info-label">건축연면적</span><span class="info-value">' + item.grossFloorArea + '</span></div>';
        }

        /* Ensure even number of items for grid alignment */
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = infoItems;
        if (tempDiv.children.length % 2 !== 0) {
            infoItems += '<div class="detail-info-item"><span class="info-label">&nbsp;</span><span class="info-value">&nbsp;</span></div>';
        }

        document.getElementById('detailInfoGrid').innerHTML = infoItems;
        document.getElementById('detailDesc').textContent = item.description;

        var overlay = document.getElementById('detailOverlay');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        document.body.style.paddingRight = (window.innerWidth - document.documentElement.clientWidth) + 'px';
    }

    function closeDetail() {
        document.getElementById('detailOverlay').classList.remove('open');
        document.body.style.overflow = '';
        document.body.style.paddingRight = '';
    }

    /* ── Event Bindings ── */
    document.getElementById('filterType').addEventListener('change', renderAll);
    document.getElementById('filterStatus').addEventListener('change', renderAll);
    document.getElementById('detailCloseTop').addEventListener('click', closeDetail);
    document.getElementById('detailCloseBottom').addEventListener('click', closeDetail);
    document.getElementById('detailOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeDetail();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeDetail();
    });

    /* ── Global access ── */
    window.portfolioApp = { openDetail: openDetail, closeDetail: closeDetail };

    /* ── Init ── */
    renderFeatured();
    renderAll();

})();
</script>
</body>
</html>
