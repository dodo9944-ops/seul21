<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무실적 — (주)빛세움 </title>
    <meta name="description" content="(주)빛세움의 재개발·재건축·소규모정비 업무 수행실적을 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260831k">
    <link rel="stylesheet" href="../assets/css/download-view.css?v=20260830b">
    <style>
    /* === Hero === */
    .pf-hero{padding:64px 0 56px;background:linear-gradient(135deg,#FFFFFF 0%,#FFFFFF 40%,#FFF3C4 100%);position:relative;overflow:hidden}
    .pf-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(184,134,11,0.3),transparent)}
    .pf-hero .breadcrumb{margin-bottom:20px}
    .pf-hero h1{font-size:36px;font-weight:900;color:#0A0F1C;margin-bottom:14px;padding-left:18px;border-left:3px solid var(--gold)}
    .pf-hero .hero-tag{font-size:17px;font-weight:600;color:var(--gold);margin-bottom:8px}
    .pf-hero .hero-sub{font-size:14px;color:rgba(10,15,28,.5)}
    @media(max-width:768px){.pf-hero{padding:40px 0 32px}.pf-hero h1{font-size:26px}}

    /* === KPI (좌측 아이콘 + 우측 텍스트, 가로형 카드) === */
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:64px}
    @media(max-width:1024px){.kpi-grid{grid-template-columns:repeat(2,1fr);gap:14px}}
    @media(max-width:420px){.kpi-grid{grid-template-columns:1fr}}
    .kpi-card{background:#FFFFFF;border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;text-align:left;position:relative;overflow:hidden;transition:transform .25s,border-color .25s;border:1px solid var(--gray-200);box-shadow:0 1px 4px rgba(10,15,28,.05)}
    .kpi-card:hover{transform:translateY(-3px);border-color:var(--gold)}
    .kpi-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.3}
    .kpi-card .ki-wrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
    .kpi-card .ki{width:40px;height:40px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(10,15,28,.1);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gold);flex:none}
    .kpi-card .ki.ki-solid{background:var(--gold);color:#FFFFFF;box-shadow:0 2px 6px rgba(184,134,11,.3)}
    .kpi-card .ki-bar{width:16px;height:2px;border-radius:1px;background:var(--gold);opacity:.55}
    .kpi-card .kpi-text{flex:1;min-width:0}
    .kpi-card .kv{font-size:20px;font-weight:800;color:#171C26;margin:0 0 4px;line-height:1.2}
    .kpi-card .kl{font-size:13px;font-weight:600;color:#171C26;margin-bottom:4px;line-height:1.3}
    .kpi-card .ks{font-size:11px;font-weight:500;color:rgba(10,15,28,.45);line-height:1.3}
    /* 카드 3·4(완료 사업·총 관리세대) 골드 크림 강조 */
    .kpi-card.kpi-highlight{background:#FFF9E8;border-color:rgba(184,134,11,.25)}
    .kpi-card.kpi-highlight::after{opacity:.6}
    .kpi-card.kpi-highlight .kv{color:var(--gold)}
    @media(max-width:480px){.kpi-card{padding:14px 16px}.kpi-card .kv{font-size:18px}}

    /* === Section === */
    .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
    .sec-title{font-size:24px;font-weight:800;color:var(--gray-900);letter-spacing:normal;line-height:1.75;padding-left:16px;position:relative}
    .sec-title::before{content:'';position:absolute;left:0;top:4px;width:3px;height:22px;border-radius:2px;background:linear-gradient(to bottom,var(--gold),rgba(184,134,11,.3))}

    /* === Badges === */
    .pb{display:inline-flex;align-items:center;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;line-height:1}
    .pb-type{background:rgba(255,255,255,.85);color:#0A0F1C}
    .pb-type.pb-r{background:rgba(23,28,38,.10);color:#0A0F1C}
    .pb-type.pb-c{background:rgba(0,154,68,.14);color:#0A0F1C}
    .pb-type.pb-s{background:rgba(0,104,183,.14);color:#0A0F1C}
    .pb-type.pb-m{background:rgba(14,124,134,.14);color:#0A0F1C}
    .pb-type.pb-k{background:rgba(107,63,160,.14);color:#0A0F1C}
    .pb-type.pb-e{background:rgba(184,134,11,.14);color:#0A0F1C}
    .pb-ing{background:rgba(184,134,11,.9);color:#0A0F1C}
    .pb-done{background:rgba(255,255,255,.9);color:#0A0F1C}

    /* === Featured Cards === */
    .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:64px}
    @media(max-width:1024px){.feat-grid{grid-template-columns:1fr;gap:20px}}
    .fc{background:#fff;border:2px solid var(--gray-300);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:all .3s;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    .fc:hover{border-color:var(--gold);box-shadow:0 20px 48px rgba(184,134,11,.18);transform:translateY(-8px)}
    .fc-img{width:100%;height:240px;position:relative;overflow:hidden;flex-shrink:0}
    .fc-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
    .fc:hover .fc-img img{transform:scale(1.06)}
    .fc-img .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(255,255,255,.5) 0%,transparent 50%);pointer-events:none}
    .fc-img .badges{position:absolute;top:14px;left:14px;display:flex;gap:6px;z-index:2}
    .fc-fb{width:100%;height:240px;position:relative;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
    .fc-fb[data-t=r]{background:linear-gradient(135deg,#F5F5F6,#DADBDD)}
    .fc-fb[data-t=c]{background:linear-gradient(135deg,#F2FBF6,#DCF3E4)}
    .fc-fb[data-t=s]{background:linear-gradient(135deg,#F0F7FC,#DCEBF7)}
    .fc-fb[data-t=m]{background:linear-gradient(135deg,#EFFCFF,#CFF3F8)}
    .fc-fb[data-t=k]{background:linear-gradient(135deg,#F5F0FF,#E4D4FA)}
    .fc-fb[data-t=e]{background:linear-gradient(135deg,#FFFBEE,#FFF3C4)}
    .fc-fb .fbi{width:64px;height:64px;border-radius:50%;background:rgba(20,28,38,.05);border:1px solid rgba(20,28,38,.08);display:flex;align-items:center;justify-content:center}
    .fc-fb .fbi i{font-size:28px;color:var(--visseum-gold)}
    .fc-fb[data-t=r] .fbi i{color:#171C26}
    .fc-fb[data-t=c] .fbi i{color:#009A44}
    .fc-fb[data-t=s] .fbi i{color:#0068B7}
    .fc-fb[data-t=m] .fbi i{color:#0E7C86}
    .fc-fb[data-t=k] .fbi i{color:#6B3FA0}
    .fc-fb[data-t=e] .fbi i{color:#8a6508}
    .fc-fb .fbl{font-size:13px;font-weight:600;color:var(--visseum-text)}
    .fc-fb .badges{position:absolute;top:14px;left:14px;display:flex;gap:6px;z-index:2}
    .fc-body{padding:22px 24px 24px;display:flex;flex-direction:column;flex:1}
    .fc-body .fn{font-size:18px;font-weight:800;color:var(--gray-900);margin-bottom:12px;line-height:1.4}
    .fc-body .fspecs{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-bottom:12px;padding:10px 12px;background:var(--gray-50);border-radius:9px}
    .fc-body .fsp{display:flex;align-items:center;font-size:12px;color:var(--gray-600)}
    .fc-body .fsp i{width:14px;color:var(--gold);margin-right:5px;font-size:10px;text-align:center}
    .fc-body .fsp strong{font-weight:600;color:var(--gray-800)}
    /* 핵심 3개만 강조, 나머지 보조 */
    .fc-body .fsp.secondary{color:var(--gray-400);font-size:11.5px}
    .fc-body .fdesc{font-size:13px;color:var(--gray-500);line-height:1.6;margin-top:auto;padding-top:12px;border-top:1px solid var(--gray-100);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .fc-body .fbtn{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:10px 20px;background:#FFFFFF;color:var(--gold);border:none;border-radius:9px;font-size:13.5px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .25s;align-self:flex-start}
    .fc-body .fbtn:hover{background:#FFF3C4;box-shadow:0 4px 12px rgba(10,15,28,.15);transform:translateX(3px)}
    .fc-body .fbtn i{font-size:12px;transition:transform .2s}
    .fc-body .fbtn:hover i{transform:translateX(2px)}
    /* 첫 카드 대표 프로젝트 강조 */
    .fc.fc-primary{border-color:rgba(184,134,11,.2);box-shadow:0 6px 20px rgba(184,134,11,.08)}
    .fc.fc-primary .fc-img::after{content:'대표 실적';position:absolute;bottom:14px;right:14px;padding:4px 12px;background:rgba(184,134,11,.9);color:#0A0F1C;font-size:10px;font-weight:700;border-radius:5px;z-index:3;letter-spacing:.3px}

    /* === Top Key-map Tabs (히어로 바로 아래) — 자료실 .ctrl-bar와 크기·외곽선 통일 === */
    /* 히어로 밑 여백 = uni-hero 자체 하단(12px, 히어로 레이아웃이라 유지) + 본문 상단 보정(33px) = 총 45px */
    .page-body{padding-top:33px}
    .pf-tabs-wrap{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding:16px 24px;background:#fff;border-radius:14px;border:1px solid var(--gray-200);box-shadow:0 2px 8px rgba(0,0,0,.03);flex-wrap:wrap;box-sizing:border-box}
    /* html,body{overflow-x:hidden}(전역) 때문에 position:sticky가 무효화되어
       스크롤 감지 후 position:fixed로 직접 전환하는 방식 사용 — 폭/좌표는 JS로 고정 */
    .pf-tabs-wrap.pf-stuck{position:fixed;z-index:50;margin-bottom:0}
    .pf-tabs-wrap .tabs button{display:inline-flex;align-items:center;gap:6px}
    /* 자료실 ctrl-bar 탭과 동일하게 항목 사이 연회색 세로 구분선 (패딩은 기존값 유지 — 폭 증가로 인한 우측 필터 잘림 방지) */
    #pfTabs{gap:0}
    #pfTabs button{padding:6px 14px;border-right:1px solid var(--gray-200);position:relative}
    #pfTabs button:first-child{padding-left:0}
    #pfTabs button:last-child{border-right:none}
    /* 자료실(#ctrlNav)과 동일한 언더바 인디케이터로 통일 */
    #pfTabs button.on{background:none;color:var(--gold);font-weight:700}
    #pfTabs button.on::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:20px;height:2px;border-radius:1px;background:var(--gold)}
    .pf-tab-count{font-size:11px;font-weight:600;color:#111}
    .pf-tabs-wrap .tabs button.on .pf-tab-count{color:var(--gold)}
    /* 기존 중간 필터박스(유형/상태/총건수)를 상단 sticky 바 우측으로 이동 — 디자인 값 그대로 재사용 */
    .pf-tabs-extra{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
    .pf-tabs-extra select{height:40px;padding:0 30px 0 12px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:13px;font-weight:500;color:var(--gray-700);background:#fff;cursor:pointer;appearance:auto;font-family:var(--font);transition:border-color .2s}
    .pf-tabs-extra select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,11,.1)}
    .pf-tabs-extra .rc{font-size:14px;color:var(--gray-500);font-weight:500;white-space:nowrap}
    .pf-tabs-extra .rc strong{color:var(--brand-dark);font-weight:700}
    @media(max-width:640px){
      .pf-tabs-wrap{display:none}
    }

    /* === All Cards Grid === */
    .pg-grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;row-gap:36px}
    @media(max-width:1024px){.pg-grid{grid-template-columns:repeat(2,1fr);gap:18px}}
    @media(max-width:540px){.pg-grid{grid-template-columns:1fr;gap:14px}}
    .pc{background:#fff;border:2px solid var(--gray-300);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:all .25s;box-shadow:0 2px 10px rgba(0,0,0,.07)}
    .pc:hover{border-color:var(--gold);box-shadow:0 8px 24px rgba(184,134,11,.12);transform:translateY(-4px)}
    .pc-img{width:100%;height:140px;position:relative;overflow:hidden;flex-shrink:0}
    .pc-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
    .pc:hover .pc-img img{transform:scale(1.05)}
    .pc-img .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(255,255,255,.4) 0%,transparent 50%);pointer-events:none}
    .pc-img .badges{position:absolute;top:10px;left:10px;display:flex;gap:5px;z-index:2}
    .pc-fb{width:100%;height:140px;position:relative;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
    .pc-fb[data-t=r]{background:linear-gradient(135deg,#F5F5F6,#DADBDD)}
    .pc-fb[data-t=c]{background:linear-gradient(135deg,#F2FBF6,#DCF3E4)}
    .pc-fb[data-t=s]{background:linear-gradient(135deg,#F0F7FC,#DCEBF7)}
    .pc-fb[data-t=m]{background:linear-gradient(135deg,#EFFCFF,#CFF3F8)}
    .pc-fb[data-t=k]{background:linear-gradient(135deg,#F5F0FF,#E4D4FA)}
    .pc-fb[data-t=e]{background:linear-gradient(135deg,#FFFBEE,#FFF3C4)}
    .pc-fb .fbi{width:48px;height:48px;border-radius:50%;background:rgba(20,28,38,.05);border:1px solid rgba(20,28,38,.08);display:flex;align-items:center;justify-content:center}
    .pc-fb .fbi i{font-size:20px;color:var(--visseum-gold)}
    .pc-fb[data-t=r] .fbi i{color:#171C26}
    .pc-fb[data-t=c] .fbi i{color:#009A44}
    .pc-fb[data-t=s] .fbi i{color:#0068B7}
    .pc-fb[data-t=m] .fbi i{color:#0E7C86}
    .pc-fb[data-t=k] .fbi i{color:#6B3FA0}
    .pc-fb[data-t=e] .fbi i{color:#8a6508}
    .pc-fb .badges{position:absolute;top:10px;left:10px;display:flex;gap:5px;z-index:2}
    .pc-body{padding:18px 20px 22px;display:flex;flex-direction:column;flex:1}
    .pc-body .pn{font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:10px;line-height:1.4}
    .pc-body .pr{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--gray-600);padding:4px 0}
    .pc-body .pr+.pr{border-top:1px solid var(--gray-50)}
    .pc-body .pr .pl{display:flex;align-items:center;gap:5px;font-weight:500;color:var(--gray-500)}
    .pc-body .pr .pl i{font-size:10px;color:var(--gold);width:13px;text-align:center}
    .pc-body .pr .pv{font-weight:600;color:var(--gray-800)}
    .pc-body .pbtn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;width:100%;height:36px;background:transparent;color:var(--brand-dark);border:1.5px solid var(--gray-200);border-radius:10px;font-size:12.5px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .pc-body .pbtn:hover{background:#FFFFFF;color:var(--gold);border-color:var(--brand-dark)}

    /* === Empty === */
    .pg-empty{grid-column:1/-1;text-align:center;padding:56px 20px}
    .pg-empty i{font-size:48px;color:var(--gray-300);margin-bottom:16px}
    .pg-empty h3{font-size:18px;font-weight:700;color:var(--gray-600);margin-bottom:8px}

    /* === Pagination === */
    .pager-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:40px;padding-top:24px;border-top:1px solid var(--gray-100)}
    .pager{display:flex;align-items:center;gap:4px}
    .pager button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gray-200);border-radius:10px;background:#fff;color:var(--gray-600);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .pager button:hover{border-color:var(--gold);color:var(--brand-dark);background:rgba(184,134,11,.04)}
    .pager button.active{background:#FFFFFF;color:var(--gold);border-color:var(--brand-dark);box-shadow:0 2px 8px rgba(10,15,28,.12)}
    .pager button.arr{color:var(--gray-400);font-size:13px}
    .pager button:disabled{opacity:.25;cursor:default;pointer-events:none}
    .pager-per{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-400)}
    .pager-per select{height:32px;padding:0 24px 0 8px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px;font-family:var(--font);color:var(--gray-600);cursor:pointer;appearance:auto}
    @media(max-width:768px){.pager-wrap{flex-direction:column;gap:12px}}

    /* DETAIL MODAL(d-overlay, d-modal, d-close, d-hero, d-body, d-sec, d-footer 등)는
       common.css로 이동 — 주요뉴스 상세 모달(NewsDetailModal)과 공유 */

    /* === Unified Hero (3안 패밀리) === */
    .uni-hero {
        background: linear-gradient(135deg, #FFFFFF 0%, #FFF3C4 40%, #FFFFFF 100%);
        position: relative; overflow: hidden; padding: 32px 0 12px; min-height: 360px;
    }
    .uni-hero .hero-bg-photo { position: absolute; top: 0; right: 0; width: 58%; height: 100%; z-index: 0; }
    .uni-hero .hero-bg-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; filter: contrast(1.03) saturate(0.95); }
    .uni-hero .hero-bg-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,253,247,1.00) 0%, rgba(255,253,247,0.99) 18%, rgba(255,249,232,0.96) 28%, rgba(255,247,225,0.88) 36%, rgba(255,247,225,0.70) 43%, rgba(255,247,225,0.48) 49%, rgba(255,247,225,0.28) 55%, rgba(255,247,225,0.12) 61%, rgba(255,247,225,0.04) 66%, rgba(255,247,225,0.00) 72%); z-index: 1; }
    .uni-hero .hero-light-wave { position: absolute; left: 0; bottom: -9%; width: 55%; height: 53%; overflow: hidden; pointer-events: none; z-index: 1; opacity: 1; -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 67%, transparent 100%); mask-image: linear-gradient(90deg, #000 0%, #000 67%, transparent 100%); }
    .uni-hero .hero-light-wave::before { content: ''; position: absolute; left: 0; bottom: 0; width: 73%; height: 73%; background: radial-gradient(ellipse at 17% 100%, rgba(255,196,0,.41) 0%, rgba(255,196,0,.19) 28%, rgba(255,196,0,.07) 50%, transparent 72%); filter: blur(2px); }
    .uni-hero .hero-light-wave .wave-line { position: absolute; border-radius: 50%; border-top: 1.2px solid transparent; transform-origin: center; filter: drop-shadow(0 0 5px rgba(255,196,0,.5)) drop-shadow(0 0 14px rgba(255,196,0,.26)); -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 10%, #000 28%, rgba(0,0,0,.55) 46%, #000 62%, rgba(0,0,0,.30) 82%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 10%, #000 28%, rgba(0,0,0,.55) 46%, #000 62%, rgba(0,0,0,.30) 82%, transparent 100%); }
    .uni-hero .hero-light-wave .wave-line:nth-child(1) { left:-12%; bottom:-8%;  width:900px; height:235px; transform:rotate(-7deg);              border-top-width: 1.55px; border-top-color: rgba(255,196,0,.63); }

<script>
(function(){
var D=MOCK.portfolio, PER=6, curPage=1, curType='전체';

/* helpers */
function ti(t){return{'재개발':'fa-building','재건축':'fa-city','소규모정비':'fa-house-chimney','리모델링':'fa-arrows-rotate','코디네이터':'fa-user-tie','기타':'fa-ellipsis'}[t]||'fa-building-columns'}
function dt(t){return{'재건축':'c','소규모정비':'s','리모델링':'m','코디네이터':'k','기타':'e'}[t]||'r'}
function tc(t){return{c:'#009A44',s:'#0068B7',m:'#0E7C86',k:'#6B3FA0',e:'#8a6508'}[t]||'#171C26'}
function sb(s){return s==='완료'?'pb-done':'pb-ing'}
function bg(p){return'<span class="pb pb-type pb-'+dt(p.type)+'">'+p.type+'</span><span class="pb '+sb(p.status)+'">'+p.status+'</span>'}
function safe(v){return v||'정보 확인중'}
function dn(p){return p.name}

/* KPI */
!function(){var t=D.length,i=0,d=0,u=0;D.forEach(function(p){if(p.status==='진행중')i++;else d++;u+=parseInt(p.scale.replace(/[^0-9]/g,''))||0});
function kpi(icon,val,label,sub,cardCls,iconCls){return '<div class="kpi-card'+(cardCls?' '+cardCls:'')+'"><div class="ki-wrap"><div class="ki'+(iconCls?' '+iconCls:'')+'"><i class="fa-solid '+icon+'"></i></div><div class="ki-bar"></div></div><div class="kpi-text"><div class="kv">'+val+'</div><div class="kl">'+label+'</div><div class="ks">'+sub+'</div></div></div>'}
document.getElementById('kpiGrid').innerHTML=
kpi('fa-building',t+'건','총 수행실적','축적된 수행 경험')+
kpi('fa-spinner',i+'건','진행중 사업','현재 수행 중인 현장')+
kpi('fa-circle-check',d+'건','완료 사업','성공적으로 완료한 사업','kpi-highlight','ki-solid')+
kpi('fa-house-chimney','약 '+u.toLocaleString()+'세대','총 관리세대','축적된 사업관리 규모','kpi-highlight')}();

/* Featured */
function renderFeat(){
var items=D.filter(function(p){return p.featured});
document.getElementById('featGrid').innerHTML=items.map(function(p,idx){
var img=p.featuredImage?
'<div class="fc-img"><div class="fc-fb" data-t="'+dt(p.type)+'" style="position:absolute;inset:0;z-index:0"><div class="fbi"><i class="fa-solid '+ti(p.type)+'"></i></div><span class="fbl">'+p.type+'</span></div><img src="'+p.featuredImage+'" alt="'+(p.imageAlt||p.name)+'" style="position:relative;z-index:1" onerror="this.style.display=\'none\'"><div class="ov" style="z-index:2"></div><div class="badges" style="z-index:3">'+bg(p)+'</div></div>':
'<div class="fc-fb" data-t="'+dt(p.type)+'"><div class="fbi"><i class="fa-solid '+ti(p.type)+'"></i></div><span class="fbl">'+p.type+'</span><div class="badges">'+bg(p)+'</div></div>';
var primary=idx===0?' fc-primary':'';
return'<div class="fc'+primary+'" onclick="PF.open(\''+p.id+'\')">'+img+
'<div class="fc-body"><div class="fn">'+dn(p)+'</div>'+
'<div class="fspecs">'+
'<div class="fsp"><i class="fa-solid fa-location-dot"></i> <strong>'+p.district+'</strong></div>'+
'<div class="fsp"><i class="fa-solid fa-building"></i> '+p.scale+'</div>'+
'<div class="fsp"><i class="fa-solid fa-user-tie"></i> '+p.role+'</div>'+
'<div class="fsp secondary"><i class="fa-solid fa-users"></i> '+safe(p.members)+'</div>'+
'<div class="fsp secondary"><i class="fa-solid fa-layer-group"></i> '+safe(p.floorInfo)+'</div>'+
'<div class="fsp secondary"><i class="fa-solid fa-chart-pie"></i> '+safe(p.floorAreaRatio)+'</div>'+
'</div>'+
'<div class="fdesc">'+p.description+'</div>'+
'<button class="fbtn" onclick="event.stopPropagation();PF.open(\''+p.id+'\')">상세보기 <i class="fa-solid fa-arrow-right"></i></button>'+
'</div></div>'}).join('')}

/* Filtered items — 진행중 최신순 → 완료 최신순 */
function getFiltered(){
var ft=curType,fs=document.getElementById('fStatus').value;
var items=D.filter(function(p){
if(ft!=='전체'&&p.type!==ft)return false;
if(fs!=='전체'&&p.status!==fs)return false;
return true});
items.sort(function(a,b){
var sa=a.status==='완료'?1:0,sb=b.status==='완료'?1:0;
if(sa!==sb)return sa-sb;
return parseInt(b.year||0)-parseInt(a.year||0);
});
return items;}

/* All cards + pagination */
function renderAll(){
var items=getFiltered();
var total=items.length,pages=Math.ceil(total/PER);
if(curPage>pages)curPage=1;
var start=(curPage-1)*PER,slice=items.slice(start,start+PER);
document.getElementById('rc').innerHTML='총 <strong>'+total+'</strong>건';
var grid=document.getElementById('pgGrid');

if(!slice.length){grid.innerHTML='<div class="pg-empty"><i class="fa-solid fa-search"></i><h3>해당 조건의 실적이 없습니다</h3></div>';document.getElementById('pager').innerHTML='';return}

grid.innerHTML=slice.map(function(p){
var img=p.thumbnail?
'<div class="pc-img"><div class="pc-fb" data-t="'+dt(p.type)+'" style="position:absolute;inset:0;z-index:0"><div class="fbi"><i class="fa-solid '+ti(p.type)+'"></i></div></div><img src="'+p.thumbnail+'" alt="'+(p.imageAlt||p.name)+'" style="position:relative;z-index:1" onerror="this.style.display=\'none\'"><div class="ov" style="z-index:2"></div><div class="badges" style="z-index:3">'+bg(p)+'</div></div>':
'<div class="pc-fb" data-t="'+dt(p.type)+'"><div class="fbi"><i class="fa-solid '+ti(p.type)+'"></i></div><div class="badges">'+bg(p)+'</div></div>';
return'<div class="pc" onclick="PF.open(\''+p.id+'\')">'+img+
'<div class="pc-body"><div class="pn">'+dn(p)+'</div>'+
'<div class="pr"><span class="pl"><i class="fa-solid fa-location-dot"></i> 위치</span><span class="pv">'+p.district+'</span></div>'+
'<div class="pr"><span class="pl"><i class="fa-solid fa-building"></i> 규모</span><span class="pv">'+p.scale+'</span></div>'+
'<div class="pr"><span class="pl"><i class="fa-solid fa-users"></i> 조합원</span><span class="pv">'+safe(p.members)+'</span></div>'+
'<div class="pr"><span class="pl"><i class="fa-solid fa-hard-hat"></i> 시공사</span><span class="pv">'+safe(p.constructor)+'</span></div>'+
'<div class="pr"><span class="pl"><i class="fa-solid fa-user-tie"></i> 역할</span><span class="pv">'+p.role+'</span></div>'+
'<div class="pr"><span class="pl"><i class="fa-solid fa-calendar"></i> 연도</span><span class="pv">'+p.year+'년</span></div>'+
'<button class="pbtn" onclick="event.stopPropagation();PF.open(\''+p.id+'\')"><i class="fa-solid fa-eye"></i> 상세보기</button>'+
'</div></div>'}).join('');

/* Pager */
var pg=document.getElementById('pager');
if(pages<=1){pg.innerHTML='';return}
var PAGE_WIN=10;
var winStart=Math.floor((curPage-1)/PAGE_WIN)*PAGE_WIN+1;
var winEnd=Math.min(winStart+PAGE_WIN-1,pages);
var prevTarget=Math.max(1,winStart-PAGE_WIN),nextTarget=winEnd+1;
var h='<button class="arr" '+(winStart===1?'disabled':'')+' onclick="PF.page('+prevTarget+')"><i class="fa-solid fa-chevron-left"></i></button>';
for(var i=winStart;i<=winEnd;i++)h+='<button'+(i===curPage?' class="active"':'')+' onclick="PF.page('+i+')">'+i+'</button>';
h+='<button class="arr" '+(winEnd===pages?'disabled':'')+' onclick="PF.page('+nextTarget+')"><i class="fa-solid fa-chevron-right"></i></button>';
pg.innerHTML=h;}

/* Detail */
function openDetail(id){
var p=null;for(var i=0;i<D.length;i++)if(D[i].id===id){p=D[i];break}
if(!p)return;
var dh=document.getElementById('dHero'),t=dt(p.type);
var mn=p.name;
var titleArea='<div class="d-title-area"><div class="badges">'+bg(p)+'</div><h2>'+mn+'</h2><div class="d-phase"><i class="fa-solid fa-flag"></i> '+(p.phase||p.status)+'</div></div>';
if(p.detailImage){
dh.innerHTML='<div class="d-hero"><img src="'+p.detailImage+'" alt="'+(p.imageAlt||p.name)+'" onerror="this.parentElement.style.background=\'linear-gradient(135deg,#0A0F1C,#1a3055)\';this.style.display=\'none\'"><div class="ov"></div>'+titleArea+'</div>'}
else{dh.innerHTML='<div class="d-hero-fb" data-t="'+t+'"><div class="fbi" style="width:72px;height:72px"><i class="fa-solid '+ti(p.type)+'" style="font-size:32px;color:'+tc(t)+'"></i></div>'+titleArea+'</div>'}

/* Body sections */
var html='';

/* Section 1: 핵심 사업 정보 */
html+='<div class="d-sec"><div class="d-sec-title">핵심 사업 정보</div><div class="d-info-grid">';
var infoItems=[
['사업유형',p.type],['진행상태',p.status],

/* Type tabs (히어로 아래 키맵 메뉴) — 하단 필터바 select#fType과 curType으로 연동 */
function renderTypeTabs(){
document.querySelectorAll('#pfTabs button').forEach(function(b){
var on=b.dataset.cat===curType;
b.classList.toggle('on',on);
if(on)b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
});
document.getElementById('fType').value=curType;
}
/* 메뉴 우측 사업장 수 — D(MOCK.portfolio)에서 실시간 집계, 하드코딩 금지 */
function renderTabCounts(){
document.querySelectorAll('#pfTabs button[data-cat]').forEach(function(b){
var cat=b.dataset.cat;
var n=cat==='전체'?D.length:D.filter(function(p){return p.type===cat}).length;
var span=b.querySelector('.pf-tab-count');
if(span)span.textContent=n+'건';
});
}
function setType(t){curType=t;curPage=1;renderTypeTabs();renderAll()}
/* 상단 메뉴 스크롤 고정 — 전역 html,body{overflow-x:hidden} 때문에 position:sticky가
   무효화되어(Chrome 특성) position:fixed 전환 방식으로 구현. 실제 헤더 높이(.header-wrap)를
   측정해 top을 맞추고, 플레이스홀더로 layout shift를 방지한다. */
(function(){
var pfWrap=document.getElementById('pfTabsWrap'),pfPh=document.getElementById('pfTabsPlaceholder');
if(!pfWrap||!pfPh)return;
var naturalTop=0,leftPx=0,widthPx=0,ticking=false;
function headerHeight(){var hw=document.querySelector('.header-wrap');return hw?hw.offsetHeight:0}
function measure(){
var wasStuck=pfWrap.classList.contains('pf-stuck');
if(wasStuck){pfWrap.classList.remove('pf-stuck');pfWrap.style.top='';pfWrap.style.left='';pfWrap.style.width='';pfPh.style.display='none'}
var rect=pfWrap.getBoundingClientRect();
naturalTop=rect.top+window.scrollY;leftPx=rect.left;widthPx=rect.width;
if(wasStuck)apply(true);
}
function apply(force){
var stick=force||window.scrollY>=naturalTop-headerHeight();
if(stick&&!pfWrap.classList.contains('pf-stuck')){
pfPh.style.height=pfWrap.offsetHeight+'px';
pfPh.style.marginBottom=getComputedStyle(pfWrap).marginBottom;
pfPh.style.display='block';
pfWrap.classList.add('pf-stuck');
pfWrap.style.top=headerHeight()+'px';
pfWrap.style.left=leftPx+'px';
pfWrap.style.width=widthPx+'px';
}else if(!stick&&pfWrap.classList.contains('pf-stuck')){
pfWrap.classList.remove('pf-stuck');
pfWrap.style.top='';pfWrap.style.left='';pfWrap.style.width='';
pfPh.style.display='none';
}else if(stick){
pfWrap.style.top=headerHeight()+'px';
pfWrap.style.left=leftPx+'px';
pfWrap.style.width=widthPx+'px';
}
}
function onScroll(){if(ticking)return;ticking=true;requestAnimationFrame(function(){apply(false);ticking=false})}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){measure();apply(false)});
document.addEventListener('DOMContentLoaded',function(){measure();apply(false)});
window.addEventListener('load',function(){measure();apply(false)});
measure();apply(false);
})();

/* Events */
document.getElementById('pfTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;setType(b.dataset.cat);window.scrollTo({top:document.querySelector('.pg-grid').offsetTop-80,behavior:'smooth'})});
document.getElementById('fType').addEventListener('change',function(){setType(this.value)});
document.getElementById('fStatus').addEventListener('change',function(){curPage=1;renderAll()});
document.getElementById('pfPerSelect').addEventListener('change',function(){PER=parseInt(this.value);curPage=1;renderAll()});
document.getElementById('dCloseTop').addEventListener('click',closeDetail);
document.getElementById('dCloseBot').addEventListener('click',closeDetail);
document.getElementById('dOverlay').addEventListener('click',function(e){if(e.target===this)closeDetail()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail()});

/* Global */
window.PF={open:openDetail,close:closeDetail,page:function(n){curPage=n;renderAll();window.scrollTo({top:document.querySelector('.pg-grid').offsetTop-80,behavior:'smooth'})},filter:function(t){setType(t);window.scrollTo({top:document.querySelector('.pg-grid').offsetTop-80,behavior:'smooth'})}};

renderTabCounts();renderTypeTabs();renderFeat();renderAll();
// URL param ?type= 지원
(function(){var p=new URLSearchParams(location.search).get('type');if(p){setType(p);document.querySelector('.pg-grid').scrollIntoView({behavior:'smooth',block:'start'});}})();
})();
</script>
