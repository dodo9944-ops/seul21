<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 라이트 — 게임 모음 | 세울 쉼터</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260509e">
    <style>
    .lgg-hero{padding:48px 0 36px;background:linear-gradient(135deg,#060A14 0%,#0A0F1C 40%,#142644 100%);text-align:center}
    .lgg-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.5);text-decoration:none;margin-bottom:14px}
    .lgg-back:hover{color:var(--gold)}
    .lgg-cat-tag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:10px;padding:4px 12px;border:1px solid rgba(195,165,105,.35);border-radius:20px}
    .lgg-hero h1{font-size:30px;font-weight:900;color:#fff;margin-bottom:8px}
    .lgg-hero h1 em{font-style:normal;color:var(--gold)}
    .lgg-hero p{font-size:13.5px;color:rgba(255,255,255,.55);margin:0}
    .lgg-body{padding:48px 0 96px;background:linear-gradient(180deg,#fff,#f7f8fb)}

    .tt-wrap{display:grid;grid-template-columns:auto 200px;gap:20px;max-width:560px;margin:0 auto;align-items:start}
    @media(max-width:560px){.tt-wrap{grid-template-columns:1fr;max-width:340px}}

    .tt-board-wrap{background:#0A0F1C;border-radius:14px;padding:8px;border:2px solid rgba(195,165,105,.3)}
    canvas#ttCanvas{display:block;background:#0F1D35;border-radius:8px;width:100%;aspect-ratio:10/18;touch-action:none}

    .tt-side{display:flex;flex-direction:column;gap:12px}
    .tt-info{background:#0F1D35;color:#fff;border-radius:10px;padding:12px;border:1px solid rgba(195,165,105,.2);text-align:center}
    .tt-info .lbl{font-size:10.5px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
    .tt-info .val{font-size:22px;font-weight:900;font-feature-settings:"tnum"}
    .tt-next{background:#0F1D35;border-radius:10px;padding:12px;border:1px solid rgba(195,165,105,.2);text-align:center}
    .tt-next .lbl{font-size:10.5px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
    canvas#ttNext{display:block;margin:0 auto;background:#142644;border-radius:6px}
    .tt-actions{display:flex;flex-direction:column;gap:6px}
    .tt-btn{padding:10px;border-radius:10px;border:none;cursor:pointer;font-size:12.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-family:var(--font);transition:all .15s}
    .tt-btn-primary{background:linear-gradient(135deg,#C3A569,#D4B87A);color:#0A0F1C}
    .tt-btn-ghost{background:transparent;color:var(--gray-600);border:1px solid var(--gray-300)}
    .tt-msg{text-align:center;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--gray-500);grid-column:1/-1}
    .tt-msg.over{color:#D6423A;font-size:14px}
    .tt-help{margin-top:8px;padding:8px 12px;background:rgba(0,0,0,.04);border-radius:8px;font-size:11.5px;color:var(--gray-500);text-align:center;line-height:1.55;grid-column:1/-1}
    .tt-help kbd{display:inline-block;padding:1px 5px;background:#fff;border:1px solid var(--gray-300);border-radius:3px;font-size:10px;font-family:monospace;margin:0 1px}
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="lgg-hero">
    <div class="inner">
        <a href="lounge-games.html" class="lgg-back"><i class="fa-solid fa-arrow-left"></i> 게임 모음으로 돌아가기</a>
        <div class="lgg-cat-tag">▣ Arcade</div>
        <h1>테트리스 <em>라이트</em></h1>
        <p>블록을 쌓아 한 줄을 채워 지우세요. 한 번에 여러 줄 = 보너스 점수!</p>
    </div>
</div>

<div class="lgg-body">
    <div class="inner">
        <div class="tt-wrap">
            <div class="tt-board-wrap"><canvas id="ttCanvas" width="200" height="360"></canvas></div>
            <div class="tt-side">
                <div class="tt-info"><div class="lbl">Score</div><div class="val" id="ttScore">0</div></div>
                <div class="tt-info"><div class="lbl">Lines</div><div class="val" id="ttLines">0</div></div>
                <div class="tt-info"><div class="lbl">Level</div><div class="val" id="ttLevel">1</div></div>
                <div class="tt-next">
                    <div class="lbl">Next</div>
                    <canvas id="ttNext" width="80" height="80"></canvas>
                </div>
                <div class="tt-actions">
                    <button class="tt-btn tt-btn-primary" id="ttStart"><i class="fa-solid fa-play"></i> 시작</button>
                    <button class="tt-btn tt-btn-ghost" id="ttPause"><i class="fa-solid fa-pause"></i> 일시정지</button>
                </div>
            </div>
            <div class="tt-msg" id="ttMsg">시작 버튼 후 화살표로 조작</div>
            <div class="tt-help"><kbd>←→</kbd> 이동 · <kbd>↓</kbd> 부드럽게 낙하 · <kbd>↑</kbd> 회전 · <kbd>Space</kbd> 즉시 낙하</div>
        </div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260529a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script src="../assets/js/common.js?v=20260509a"></script>
<script>
(function(){
    const COLS=10, ROWS=18;
    const cv=document.getElementById('ttCanvas'),ctx=cv.getContext('2d');
    const nx=document.getElementById('ttNext'),nctx=nx.getContext('2d');
    const elS=document.getElementById('ttScore'),elL=document.getElementById('ttLines'),elV=document.getElementById('ttLevel'),elM=document.getElementById('ttMsg');
    const SHAPES={
        I:{c:'#5BC9F5',cells:[[1,1,1,1]]},
        O:{c:'#FFD24A',cells:[[1,1],[1,1]]},
        T:{c:'#A569C9',cells:[[0,1,0],[1,1,1]]},
        S:{c:'#5AC97A',cells:[[0,1,1],[1,1,0]]},
        Z:{c:'#E63E32',cells:[[1,1,0],[0,1,1]]},
        J:{c:'#5BAEF5',cells:[[1,0,0],[1,1,1]]},
        L:{c:'#F4A30B',cells:[[0,0,1],[1,1,1]]}
    };
    const KEYS=Object.keys(SHAPES);
    let board, cur, next, x, y, score, lines, level, over, paused, loop;

    function newPiece(){const k=KEYS[Math.floor(Math.random()*KEYS.length)];return {k,c:SHAPES[k].c,cells:SHAPES[k].cells.map(r=>r.slice())}}
    function rotate(p){const r=p.cells[0].length,c=p.cells.length,n=Array.from({length:r},(_,i)=>Array(c).fill(0));for(let i=0;i<c;i++)for(let j=0;j<r;j++)n[j][c-1-i]=p.cells[i][j];return {k:p.k,c:p.c,cells:n}}
    function valid(p,nx,ny){for(let i=0;i<p.cells.length;i++)for(let j=0;j<p.cells[0].length;j++){if(!p.cells[i][j])continue;const xx=nx+j,yy=ny+i;if(xx<0||xx>=COLS||yy>=ROWS)return false;if(yy>=0&&board[yy][xx])return false}return true}
    function merge(){for(let i=0;i<cur.cells.length;i++)for(let j=0;j<cur.cells[0].length;j++){if(cur.cells[i][j]){const yy=y+i;if(yy<0){over=true;return}board[yy][x+j]=cur.c}}}
    function clearLines(){let n=0;for(let r=ROWS-1;r>=0;r--){if(board[r].every(v=>v)){board.splice(r,1);board.unshift(Array(COLS).fill(0));n++;r++}}if(n){const pts=[0,40,100,300,1200][n]*level;score+=pts;lines+=n;level=1+Math.floor(lines/10);elS.textContent=score;elL.textContent=lines;elV.textContent=level}}
    function spawn(){cur=next||newPiece();next=newPiece();x=Math.floor((COLS-cur.cells[0].length)/2);y=-cur.cells.length;drawNext()}
    function tick(){if(over||paused) return;if(valid(cur,x,y+1))y++;else{merge();if(over){gameOver();return}clearLines();spawn();if(!valid(cur,x,y)){over=true;gameOver();return}}draw()}
    function draw(){
        const cell=cv.width/COLS;
        ctx.fillStyle='#0F1D35';ctx.fillRect(0,0,cv.width,cv.height);
        ctx.strokeStyle='rgba(195,165,105,0.06)';for(let i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,cv.height);ctx.stroke()}
        for(let i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(cv.width,i*cell);ctx.stroke()}
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(board[r][c]){drawBlock(c*cell,r*cell,cell,board[r][c])}}
        for(let i=0;i<cur.cells.length;i++)for(let j=0;j<cur.cells[0].length;j++){if(cur.cells[i][j]&&y+i>=0)drawBlock((x+j)*cell,(y+i)*cell,cell,cur.c)}
    }
    function drawBlock(px,py,s,col){
        ctx.fillStyle=col;ctx.fillRect(px+1,py+1,s-2,s-2);
        ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(px+1,py+1,s-2,4);
        ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(px+1,py+s-5,s-2,4);
    }
    function drawNext(){
        const s=18;nctx.fillStyle='#142644';nctx.fillRect(0,0,nx.width,nx.height);
        if(!next) return;
        const w=next.cells[0].length*s, h=next.cells.length*s;
        const ox=(nx.width-w)/2, oy=(nx.height-h)/2;
        for(let i=0;i<next.cells.length;i++)for(let j=0;j<next.cells[0].length;j++){if(next.cells[i][j])drawBlockOn(nctx,ox+j*s,oy+i*s,s,next.c)}
    }
    function drawBlockOn(c,px,py,s,col){c.fillStyle=col;c.fillRect(px+1,py+1,s-2,s-2);c.fillStyle='rgba(255,255,255,0.25)';c.fillRect(px+1,py+1,s-2,3);c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(px+1,py+s-4,s-2,3)}
    function gameOver(){over=true;if(loop){clearInterval(loop);loop=null}elM.textContent='Game Over · Score '+score;elM.className='tt-msg over'}
    function start(){board=Array.from({length:ROWS},()=>Array(COLS).fill(0));score=0;lines=0;level=1;over=false;paused=false;next=newPiece();spawn();elS.textContent=0;elL.textContent=0;elV.textContent=1;elM.textContent='게임 진행 중';elM.className='tt-msg';if(loop)clearInterval(loop);loop=setInterval(tick,Math.max(120,800-(level-1)*60));draw()}
    function move(dx){if(over||paused)return;if(valid(cur,x+dx,y)){x+=dx;draw()}}
    function softDrop(){if(over||paused)return;if(valid(cur,x,y+1)){y++;score+=1;elS.textContent=score;draw()}else tick()}
    function rotateP(){if(over||paused)return;const r=rotate(cur);if(valid(r,x,y)){cur=r;draw()}else if(valid(r,x-1,y)){cur=r;x--;draw()}else if(valid(r,x+1,y)){cur=r;x++;draw()}}
    function hardDrop(){if(over||paused)return;while(valid(cur,x,y+1)){y++;score+=2}elS.textContent=score;tick()}
    function pause(){if(over)return;paused=!paused;elM.textContent=paused?'일시정지':'게임 진행 중'}
    document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'){move(-1);e.preventDefault()}else if(k==='ArrowRight'){move(1);e.preventDefault()}else if(k==='ArrowDown'){softDrop();e.preventDefault()}else if(k==='ArrowUp'){rotateP();e.preventDefault()}else if(k===' '){hardDrop();e.preventDefault()}else if(k==='p'||k==='P'){pause()}});
    let tx=0,ty=0,tt=0;
    cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();e.preventDefault()},{passive:false});
    cv.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty,dt=Date.now()-tt;if(Math.abs(dx)<15&&Math.abs(dy)<15&&dt<250){rotateP();return}if(Math.abs(dx)>Math.abs(dy)){move(dx>0?1:-1)}else{if(dy>40)hardDrop();else if(dy>15)softDrop()}});
    document.getElementById('ttStart').addEventListener('click',start);
    document.getElementById('ttPause').addEventListener('click',pause);
    // 초기 표시
    board=Array.from({length:ROWS},()=>Array(COLS).fill(0));score=0;lines=0;level=1;next=newPiece();cur=newPiece();x=Math.floor((COLS-cur.cells[0].length)/2);y=0;draw();drawNext();
})();
</script>
</body>
</html>
