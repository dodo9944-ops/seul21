<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 관련 서식, 법령, 지침, 가이드 자료를 다운로드하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
    /* ── Search Bar ── */
    .lib-search {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
    }
    .lib-search .form-input {
        max-width: 360px;
        height: 42px;
        padding-left: 40px;
        background-image: none;
    }
    .lib-search-wrap {
        position: relative;
        flex: 1;
        max-width: 360px;
    }
    .lib-search-wrap i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gray-400);
        font-size: 14px;
        pointer-events: none;
    }
    .lib-search-wrap .form-input {
        max-width: 100%;
    }

    /* ── Result Count ── */
    .lib-result-count {
        font-size: 14px;
        color: var(--gray-500);
        margin-bottom: 16px;
        font-weight: 500;
    }
    .lib-result-count strong {
        color: var(--gray-900);
        font-weight: 700;
    }

    /* ── Library List ── */
    .lib-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .lib-item {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px 24px;
        background: var(--white);
        border: 1px solid var(--gray-200);
        border-radius: var(--radius);
        transition: all var(--transition);
    }
    .lib-item:hover {
        border-color: var(--gray-300);
        box-shadow: var(--shadow-hover);
    }

    /* File icon */
    .lib-icon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 20px;
        color: var(--white);
        background: var(--brand-dark);
    }
    .lib-icon.hwp  { background: #2A7DE1; }
    .lib-icon.pdf  { background: #D6423A; }
    .lib-icon.xlsx { background: #1E8C5E; }

    /* Middle content */
    .lib-content {
        flex: 1;
        min-width: 0;
    }
    .lib-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--gray-900);
        margin-bottom: 4px;
        line-height: 1.4;
    }
    .lib-desc {
        font-size: 13px;
        color: var(--gray-500);
        line-height: 1.5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 8px;
    }
    .lib-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }

    /* Right meta */
    .lib-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        flex-shrink: 0;
        min-width: 120px;
    }
    .lib-meta-top {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .lib-date {
        font-size: 12px;
        color: var(--gray-400);
        white-space: nowrap;
    }
    .lib-downloads {
        font-size: 12px;
        color: var(--gray-400);
        white-space: nowrap;
    }
    .lib-downloads i {
        margin-right: 3px;
    }
    .btn-download {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 14px;
        font-size: 12px;
        font-weight: 600;
        color: var(--gold);
        background: transparent;
        border: 1.5px solid var(--gold);
        border-radius: 6px;
        cursor: pointer;
        transition: all var(--transition);
        font-family: var(--font);
        white-space: nowrap;
    }
    .btn-download:hover {
        background: var(--gold);
        color: var(--white);
    }

    .lib-cat-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
    }
    .lib-cat-주요뉴스 { background: rgba(20,38,68,0.08); color: var(--brand-navy); }
    .lib-cat-서식 { background: rgba(195,165,105,0.1); color: #8B7340; }
    .lib-cat-법령 { background: rgba(10,15,28,0.06); color: var(--brand-dark); font-weight:700; }
    .lib-cat-관련판례 { background: rgba(20,38,68,0.1); color: var(--brand-navy); }
    .lib-cat-지침 { background: rgba(195,165,105,0.12); color: #9A8250; }
    .lib-cat-가이드 { background: rgba(20,38,68,0.06); color: #3D5A80; }

    /* Responsive */
    @media (max-width: 768px) {
        .lib-item {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
        }
        .lib-meta {
            flex-direction: row;
            align-items: center;
            width: 100%;
            min-width: 0;
        }
        .lib-meta-top {
            flex: 1;
        }
        .lib-search-wrap {
            max-width: 100%;
        }
    }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="breadcrumb">
            <a href="../index.html">홈</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>자료실</span>
        </div>
        <h1>자료실</h1>
        <p>정비사업 실무에 필요한 법령·서식·지침·판례·가이드를 한곳에서 다운로드하세요</p>
    </div>
</div>

<div class="page-body">
    <div class="inner">
        <!-- Category Tabs -->
        <style>
            #categoryTabs { margin-bottom:24px; display:flex; gap:8px; flex-wrap:wrap; }
            #categoryTabs button {
                padding:10px 20px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
                border:1.5px solid var(--gray-200); background:var(--gray-50); color:var(--gray-500);
                transition: all 0.2s ease;
            }
            #categoryTabs button i { margin-right:5px; opacity:0.5; }
            #categoryTabs button.on {
                background:var(--brand-dark) !important; color:var(--gold) !important;
                border-color:var(--brand-dark) !important; font-weight:700;
            }
            #categoryTabs button.on i { opacity:1; }
            #categoryTabs button:not(.on):hover {
                background:#fff; border-color:rgba(20,38,68,0.3);
                color:var(--gray-700);
            }
            #categoryTabs button:not(.on):hover i { opacity:0.7; }
        </style>
        <div id="categoryTabs">
            <button class="on" data-cat="전체">전체</button>
            <button data-cat="법령"><i class="fa-solid fa-scale-balanced"></i>법령·조례</button>
            <button data-cat="관련판례"><i class="fa-solid fa-gavel"></i>판례·질의회신</button>
            <button data-cat="지침"><i class="fa-solid fa-clipboard-list"></i>지침·규정</button>
            <button data-cat="서식"><i class="fa-solid fa-file-pen"></i>서식·양식</button>
            <button data-cat="가이드"><i class="fa-solid fa-book-open"></i>가이드·매뉴얼</button>
            <button data-cat="주요뉴스"><i class="fa-solid fa-newspaper"></i>주요뉴스</button>
        </div>

        <!-- Search Bar -->
        <div class="lib-search">
            <div class="lib-search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="form-input" id="searchInput" placeholder="자료명을 검색하세요">
            </div>
        </div>

        <!-- Result Count -->
        <div class="lib-result-count" id="resultCount">총 <strong>0</strong>건</div>

        <!-- Library List -->
        <div class="lib-list" id="libList"></div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fa-solid fa-folder-open"></i>
            <h3>검색 결과가 없습니다</h3>
            <p>다른 검색어 또는 카테고리를 선택해주세요</p>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js"></script>
<script src="../assets/js/data-service.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(function() {
    // MOCK 데이터가 업데이트되었으면 localStorage 갱신
    if (typeof MOCK !== 'undefined' && MOCK.library) {
        var stored = JSON.parse(localStorage.getItem('rdc_library') || '[]');
        if (stored.length !== MOCK.library.length) {
            localStorage.setItem('rdc_library', JSON.stringify(MOCK.library));
        }
    }

    // 주요뉴스 7일 롤링: 7일 초과 뉴스 자동 제거
    var now = new Date();
    var sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
    var rawItems = DataService.getAll('library');
    var allItems = rawItems.filter(function(item) {
        if (item.category !== '주요뉴스') return true;
        if (!item.date) return false;
        var d = new Date(item.date);
        return d >= sevenDaysAgo;
    }).sort(function(a, b) {
        return (b.date || '').localeCompare(a.date || '');
    });

    let currentCat = '전체';
    let searchQuery = '';

    const iconMap = {
        hwp:  { icon: 'fa-file-lines', cls: 'hwp' },
        pdf:  { icon: 'fa-file-pdf',   cls: 'pdf' },
        xlsx: { icon: 'fa-file-excel', cls: 'xlsx' }
    };

    const catBadgeMap = {
        '주요뉴스': 'lib-cat-주요뉴스',
        '서식': 'lib-cat-서식',
        '법령': 'lib-cat-법령',
        '관련판례': 'lib-cat-관련판례',
        '지침': 'lib-cat-지침',
        '가이드': 'lib-cat-가이드'
    };

    function getFiltered() {
        let items = allItems;
        if (currentCat !== '전체') {
            items = items.filter(i => i.category === currentCat);
        }
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            items = items.filter(i => i.title.toLowerCase().includes(q));
        }
        return items;
    }

    function render() {
        const filtered = getFiltered();
        const list = document.getElementById('libList');
        const empty = document.getElementById('emptyState');
        const count = document.getElementById('resultCount');

        count.innerHTML = '총 <strong>' + filtered.length + '</strong>건';

        if (!filtered.length) {
            list.innerHTML = '';
            empty.style.display = 'flex';
            return;
        }
        empty.style.display = 'none';

        list.innerHTML = filtered.map(item => {
            const fi = iconMap[item.fileType] || iconMap.pdf;
            const catCls = catBadgeMap[item.category] || '';
            const tagsHtml = (item.tags || []).map(t => '<span class="tag">' + t + '</span>').join('');

            return '<div class="lib-item">' +
                '<div class="lib-icon ' + fi.cls + '">' +
                    '<i class="fa-solid ' + fi.icon + '"></i>' +
                '</div>' +
                '<div class="lib-content">' +
                    '<div class="lib-title">' + item.title + '</div>' +
                    '<div class="lib-desc">' + item.description + '</div>' +
                    '<div class="lib-tags">' + tagsHtml + '</div>' +
                '</div>' +
                '<div class="lib-meta">' +
                    '<div class="lib-meta-top">' +
                        '<span class="lib-cat-badge ' + catCls + '">' + item.category + '</span>' +
                        '<span class="lib-date">' + item.date + '</span>' +
                        '<span class="lib-downloads"><i class="fa-solid fa-download"></i>' + item.downloads + '</span>' +
                    '</div>' +
                    '<button class="btn-download" data-id="' + item.id + '">' +
                        '<i class="fa-solid fa-arrow-down"></i>' +
                        item.fileSize + ' 다운로드' +
                    '</button>' +
                '</div>' +
            '</div>';
        }).join('');
    }

    /* Tab click */
    document.getElementById('categoryTabs').addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        document.querySelectorAll('#categoryTabs button').forEach(function(b) { b.classList.remove('on'); });
        btn.classList.add('on');
        currentCat = btn.dataset.cat;
        render();
    });

    /* Search input */
    document.getElementById('searchInput').addEventListener('keyup', function(e) {
        searchQuery = e.target.value.trim();
        render();
    });

    // 다운로드 소스 매핑 (3단계: 외부공식링크 → 첨부파일 → 웹문서)
    var fileMap = {
        'lib1':  { ext:'../downloads/files/lib1_조합설립인가_신청서.pdf', web:'../downloads/form_association.html' },
        'lib2':  { ext:'../downloads/files/lib2_관리처분_변경인가_신청서.pdf', web:'../downloads/form_management.html' },
        'lib3':  { ext:'../downloads/files/lib3_총회_위임장.pdf', web:'../downloads/form_proxy.html' },
        'lib4':  { ext:'../downloads/files/lib4_도시정비법_개정요약.pdf', gov:'https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=259069', web:'../downloads/law_summary_2026.html', label:'법제처 원문' },
        'lib5':  { ext:'../downloads/files/lib5_서울시_가이드라인.pdf', gov:'https://news.seoul.go.kr/citybuild/archives/507738', web:'../downloads/guide_seoul_guidelines.html', label:'서울시 원문' },
        'lib6':  { ext:'../downloads/files/lib6_소규모주택정비법.pdf', gov:'https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=243625', web:'../downloads/guide_small_housing.html', label:'법제처 원문' },
        'lib7':  { ext:'../downloads/files/lib7_업무체크리스트.pdf', web:'../downloads/checklist_steps.html' },
        'lib8':  { ext:'../downloads/files/lib8_분담금_산정_가이드.pdf', web:'../downloads/guide_burden.html' },
        'lib9':  { ext:'../downloads/files/lib9_시공사_선정_해설.pdf', web:'../downloads/guide_contractor.html' },
        'lib10': { ext:'../downloads/files/lib10_감정평가_가이드.pdf', web:'../downloads/guide_appraisal.html' },
        'lib11': { ext:'../downloads/files/lib11_조합설립_완전가이드.pdf', web:'../downloads/guide_association.html' },
        'lib12': { ext:'../downloads/files/lib12_안전진단_지침.pdf', web:'../downloads/guide_safety_inspection.html' },
        'lib13': { ext:'../downloads/files/lib13_회계처리_지침.pdf', web:'../downloads/guide_accounting.html' },
        'lib17': { ext:'../downloads/files/lib17_시공자선정_지침.pdf', web:'../downloads/guide_contractor_selection.html' },
        'lib18': { ext:'../downloads/files/lib18_이주보상_지침.pdf', web:'../downloads/guide_relocation.html' },
        'lib21': { ext:'../downloads/files/lib21_추진위원회_운영규정.pdf', gov:'https://law.go.kr/%ED%96%89%EC%A0%95%EA%B7%9C%EC%B9%99/%EC%A0%95%EB%B9%84%EC%82%AC%EC%97%85%20%EC%A1%B0%ED%95%A9%EC%84%A4%EB%A6%BD%EC%B6%94%EC%A7%84%EC%9C%84%EC%9B%90%ED%9A%8C%20%EC%9A%B4%EC%98%81%EA%B7%9C%EC%A0%95', web:'../downloads/guide_committee_rules.html', label:'법제처 원문' },
        'lib22': { ext:'../downloads/files/lib22_서울시_의사진행_표준운영규정.pdf', gov:'https://cleanup.seoul.go.kr', label:'정비사업몽땅' },
        'lib23': { ext:'../downloads/files/lib23_서울시_정비사업_실무매뉴얼.pdf', gov:'https://news.seoul.go.kr/citybuild/', label:'서울시 도시재생' },
        'lib30': { ext:'../downloads/files/lib30_도시정비법_질의회신_사례집.pdf' },
        'lib31': { ext:'../downloads/files/lib31_서울시_도시정비법령_질의회신_2024.pdf' },
        'lib33': { ext:'../downloads/files/lib33_경기도_정비사업_질의회신_매뉴얼.pdf' },
        'lib34': { ext:'../downloads/files/lib34_서울시_도시정비_조례.pdf', gov:'https://cleanup.seoul.go.kr', label:'정비사업몽땅' },
        'lib40': { ext:'../downloads/files/lib40_서울시_도시정비조례_2024개정.pdf' },
        'lib41': { ext:'../downloads/files/lib41_도시정비법_질의회신_판례집.pdf' },
        'lib42': { ext:'../downloads/files/lib42_제주도_재건축재개발_업무편람_2025.pdf' },
        'lib43': { ext:'../downloads/files/lib43_해석례로읽는_건축법_2024.pdf' },
        'lib44': { ext:'../downloads/files/lib44_해석례로읽는_건축법_2023.pdf' },
        'lib45': { ext:'../downloads/files/lib45_서울시_공공지원_정비사업_표준정관_2024.pdf' },
        'lib46': { ext:'../downloads/files/lib46_건설공사_표준시장단가_2025상반기.pdf' },
        'lib48': { ext:'../downloads/files/lib48_서울시_정비사업_사업성개선_기본계획재정비_2024.pdf' },
        'lib49': { ext:'../downloads/files/lib49_서울시_공공건축물_공사비_가이드라인_2024.pdf' },
        'lib50': { ext:'../downloads/files/lib50_LH_2025_업무보고.pdf' },
        'lib53': { ext:'../downloads/files/lib53_서울시_공사비_가이드라인_2022.pdf' },
        'lib54': { ext:'../downloads/files/lib54_마포구_공사비_가이드라인.pdf' },
        'lib55': { ext:'../downloads/files/lib55_재건축재개발_조세제도_연구보고서.pdf' },
        'lib56': { ext:'../downloads/files/lib56_대법원판례_2025상반기_민사.pdf' },
        'news0329': { web:'../downloads/news_20260329.html' },
        'news0330': { web:'../downloads/news_20260330.html' },
        'news0331': { web:'../downloads/news_20260331.html' },
        'news0401': { web:'../downloads/news_20260401.html' },
        'news0402': { web:'../downloads/news_20260402.html' },
        'news0403': { web:'../downloads/news_20260403.html' },
        'news0404': { web:'../downloads/news_20260404.html' },
    };

    // 첨부파일 존재 확인
    var fileCache = {};
    function checkFile(url, cb) {
        if (fileCache[url] !== undefined) return cb(fileCache[url]);
        var x = new XMLHttpRequest();
        x.open('HEAD', url, true);
        x.onload = function() { fileCache[url] = x.status === 200; cb(fileCache[url]); };
        x.onerror = function() { fileCache[url] = false; cb(false); };
        x.send();
    }

    // 다운로드 클릭 처리 (3단계 우선순위)
    document.getElementById('libList').addEventListener('click', function(e) {
        var btn = e.target.closest('.btn-download');
        if (!btn) return;
        var id = btn.dataset.id;
        var m = fileMap[id];
        if (!m) { App.toast('파일 준비 중입니다.', 'info'); return; }

        // 1순위: 첨부파일 직접 다운로드
        if (m.ext) {
            checkFile(m.ext, function(ok) {
                if (ok) {
                    var a = document.createElement('a'); a.href = m.ext; a.download = '';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    App.toast('파일 다운로드 시작', 'success');
                } else if (m.gov) {
                    window.open(m.gov, '_blank');
                    App.toast((m.label || '공식 사이트') + '로 이동합니다', 'info');
                } else {
                    window.open(m.web, '_blank');
                    App.toast('웹 문서로 열립니다 (Ctrl+P로 PDF 저장 가능)', 'info');
                }
            });
        }
        // 2순위: 공식 외부 링크
        else if (m.gov) {
            window.open(m.web, '_blank');
            setTimeout(function() {
                if (confirm((m.label || '공식 사이트') + '에서 원문을 확인하시겠습니까?')) {
                    window.open(m.gov, '_blank');
                }
            }, 500);
        }
        // 3순위: 웹 문서
        else {
            window.open(m.web, '_blank');
            App.toast('웹 문서로 열립니다 (Ctrl+P로 PDF 저장 가능)', 'info');
        }

        var item = allItems.find(function(i) { return i.id === id; });
        if (item) { item.downloads = (item.downloads || 0) + 1; }
        render();
    });

    render();
})();
</script>
</body>
</html>
