<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0A0F1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 관련 서식, 법령, 지침, 가이드 자료를 다운로드하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
    /* ================================================================
       자료실 — 정비사업 전문 아카이브 (Premium Redesign)
       ================================================================ */

    /* === Hero === */
    .lib-hero{padding:68px 0 60px;background:linear-gradient(135deg,#070B15 0%,var(--brand-dark) 40%,var(--brand-navy) 100%);position:relative;overflow:hidden}
    .lib-hero::before{content:'';position:absolute;top:-40%;right:-15%;width:500px;height:500px;background:radial-gradient(circle,rgba(195,165,105,.06) 0%,transparent 70%);pointer-events:none}
    .lib-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(195,165,105,.3),transparent)}
    .lib-hero h1{font-size:36px;font-weight:900;color:#fff;margin-bottom:14px;padding-left:18px;border-left:3px solid var(--gold)}
    .lib-hero .hero-tag{font-size:17px;font-weight:600;color:var(--gold);margin-bottom:8px;letter-spacing:-.2px}
    .lib-hero .hero-sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.7}
    .lib-hero .hero-stats{display:flex;gap:36px;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06)}
    .lib-hero .hs{display:flex;flex-direction:column;gap:2px}
    .lib-hero .hs strong{font-size:22px;font-weight:800;color:var(--gold);line-height:1}
    .lib-hero .hs span{font-size:12px;color:rgba(255,255,255,.4);font-weight:500}
    @media(max-width:768px){.lib-hero{padding:44px 0 36px}.lib-hero h1{font-size:26px}.lib-hero .hero-stats{gap:24px;flex-wrap:wrap}}

    /* === Category Tabs === */
    .cat-wrap{margin-bottom:28px;position:sticky;top:104px;z-index:100;background:var(--white);padding-top:16px;padding-bottom:4px;margin-top:-16px;transition:box-shadow .2s}
    .cat-wrap.stuck{box-shadow:0 2px 12px rgba(0,0,0,.06)}
    @media(max-width:768px){.cat-wrap{top:72px}}
    .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:4px;background:var(--gray-50);border-radius:14px;border:1px solid var(--gray-100)}
    .cat-tab{display:inline-flex;align-items:center;gap:7px;padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--gray-500);transition:all .25s;font-family:var(--font);position:relative}
    .cat-tab i{font-size:13px;opacity:.45;transition:opacity .25s}
    .cat-tab .cnt{min-width:22px;height:20px;padding:0 7px;border-radius:10px;font-size:10.5px;font-weight:700;background:var(--gray-200);color:var(--gray-500);display:inline-flex;align-items:center;justify-content:center;transition:all .25s}
    .cat-tab.on{background:var(--brand-dark);color:var(--gold);box-shadow:0 2px 8px rgba(10,15,28,.15)}
    .cat-tab.on i{opacity:1}
    .cat-tab.on .cnt{background:rgba(195,165,105,.2);color:var(--gold)}
    .cat-tab:not(.on):hover{background:#fff;color:var(--gray-800);box-shadow:0 1px 4px rgba(0,0,0,.04)}
    .cat-tab:not(.on):hover i{opacity:.7}

    /* === Control Bar === */
    .ctrl-bar{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding:16px 24px;background:#fff;border-radius:14px;border:1px solid var(--gray-200);box-shadow:0 2px 8px rgba(0,0,0,.03);flex-wrap:wrap}
    .ctrl-search{position:relative;flex:1;min-width:240px;max-width:520px}
    .ctrl-search i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:15px;pointer-events:none}
    .ctrl-search input{width:100%;height:46px;padding:0 16px 0 44px;border:1.5px solid var(--gray-200);border-radius:12px;font-size:14px;font-weight:500;color:var(--gray-800);background:var(--gray-50);font-family:var(--font);transition:all .25s}
    .ctrl-search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(195,165,105,.1);background:#fff}
    .ctrl-sort{display:flex;align-items:center;gap:8px;margin-left:auto}
    .ctrl-sort label{font-size:12px;font-weight:600;color:var(--gray-400);white-space:nowrap}
    .ctrl-sort select{height:40px;padding:0 30px 0 12px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:13px;font-weight:500;color:var(--gray-700);background:#fff;cursor:pointer;appearance:auto;font-family:var(--font);transition:border-color .2s}
    .ctrl-sort select:focus{border-color:var(--gold);outline:none}
    .ctrl-count{font-size:14px;color:var(--gray-500);font-weight:500;white-space:nowrap}
    .ctrl-count strong{color:var(--brand-dark);font-weight:700}
    @media(max-width:640px){.ctrl-bar{flex-direction:column;align-items:stretch;gap:12px;padding:16px}.ctrl-search{max-width:100%}.ctrl-sort{margin-left:0;justify-content:flex-end}}

    /* === Popular Section === */
    .pop-sec{margin-bottom:36px}
    .pop-sec .pop-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .pop-sec .pop-head .ph-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--brand-dark),var(--brand-navy));display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold)}
    .pop-sec .pop-head h3{font-size:16px;font-weight:800;color:var(--gray-900);letter-spacing:-.3px}
    .pop-sec .pop-head span{font-size:12px;color:var(--gray-400);font-weight:500}
    .pop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:900px){.pop-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:540px){.pop-grid{grid-template-columns:1fr}}
    .pop-card{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;background:#fff;border:1px solid var(--gray-200);border-radius:12px;cursor:pointer;transition:all .25s;position:relative}
    .pop-card:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(195,165,105,.1);transform:translateY(-2px)}
    .pop-card .pop-rank{position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:6px;background:var(--brand-dark);color:var(--gold);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
    .pop-card .pop-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:#fff}
    .pop-card .pop-icon.pdf{background:#D6423A}
    .pop-card .pop-icon.hwp{background:#2A7DE1}
    .pop-card .pop-icon.web{background:var(--brand-dark)}
    .pop-card .pop-body{flex:1;min-width:0}
    .pop-card .pop-title{font-size:13.5px;font-weight:700;color:var(--gray-900);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .pop-card .pop-info{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--gray-400)}
    .pop-card .pop-info i{font-size:10px;color:var(--gold)}

    /* === Document List === */
    .lib-list{display:flex;flex-direction:column;gap:12px}
    .lib-item{display:flex;align-items:flex-start;gap:20px;padding:22px 26px;background:#fff;border:1.5px solid var(--gray-150,#eaedf0);border-radius:14px;transition:all .25s;position:relative}
    .lib-item:hover{border-color:rgba(195,165,105,.35);box-shadow:0 6px 24px rgba(0,0,0,.06);transform:translateY(-1px)}
    .lib-item.pinned{border-left:3.5px solid var(--gold);background:linear-gradient(90deg,rgba(195,165,105,.02),#fff 60%)}

    /* File icon */
    .lib-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;color:#fff;position:relative}
    .lib-icon.hwp{background:linear-gradient(135deg,#2A7DE1,#1B5FBF)}
    .lib-icon.pdf{background:linear-gradient(135deg,#D6423A,#B5332B)}
    .lib-icon.xlsx{background:linear-gradient(135deg,#1E8C5E,#166B48)}
    .lib-icon.web{background:linear-gradient(135deg,var(--brand-dark),var(--brand-navy))}
    .lib-icon .ft-label{position:absolute;bottom:-3px;right:-3px;background:#fff;border:1px solid var(--gray-200);border-radius:4px;font-size:8px;font-weight:800;color:var(--gray-600);padding:1px 4px;text-transform:uppercase;line-height:1}

    /* Content */
    .lib-content{flex:1;min-width:0}
    .lib-title{font-size:15.5px;font-weight:700;color:var(--gray-900);margin-bottom:5px;line-height:1.45;cursor:pointer;transition:color .2s;letter-spacing:-.2px}
    .lib-title:hover{color:var(--gold)}
    .lib-desc{font-size:13px;color:var(--gray-500);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .lib-meta-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

    /* Badge system */
    .lb{display:inline-flex;align-items:center;padding:3px 9px;border-radius:5px;font-size:10.5px;font-weight:600;line-height:1.3;letter-spacing:.1px}
    .lb-cat{background:rgba(10,15,28,.06);color:var(--brand-dark);border:1px solid rgba(10,15,28,.08)}
    .lb-src{background:rgba(195,165,105,.08);color:#8B7340;border:1px solid rgba(195,165,105,.12)}
    .lb-new{background:#E8F5E9;color:#2E7D32;border:1px solid #C8E6C9;font-weight:700}
    .lb-hot{background:rgba(195,165,105,.1);color:#8B7340;border:1px solid rgba(195,165,105,.15)}
    .lb-hot i{font-size:9px;margin-right:3px}
    .lb-date{font-size:11px;color:var(--gray-400);font-weight:500;padding-left:4px}
    .lb-dl{font-size:11px;color:var(--gray-400);font-weight:500;display:inline-flex;align-items:center;gap:3px}
    .lb-dl i{font-size:9px;color:var(--gray-300)}

    /* Right action */
    .lib-action{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;min-width:130px}
    .lib-size{font-size:12px;color:var(--gray-400);font-weight:500}
    .btn-dl{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 18px;font-size:12.5px;font-weight:700;color:var(--brand-dark);background:#fff;border:1.5px solid var(--brand-dark);border-radius:9px;cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
    .btn-dl:hover{background:var(--brand-dark);color:var(--gold);box-shadow:0 4px 12px rgba(10,15,28,.15)}
    .btn-dl i{font-size:12px;transition:transform .2s}
    .btn-dl:hover i{transform:translateY(1px)}

    /* Empty */
    .lib-empty{text-align:center;padding:64px 20px}
    .lib-empty i{font-size:52px;color:var(--gray-200);margin-bottom:20px}
    .lib-empty h3{font-size:18px;font-weight:700;color:var(--gray-600);margin-bottom:8px}
    .lib-empty p{font-size:14px;color:var(--gray-400)}

    /* === Pagination === */
    .pager-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:40px;padding-top:24px;border-top:1px solid var(--gray-100)}
    .pager{display:flex;align-items:center;gap:4px}
    .pager button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gray-200);border-radius:10px;background:#fff;color:var(--gray-600);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .pager button:hover{border-color:var(--gold);color:var(--brand-dark);background:rgba(195,165,105,.04)}
    .pager button.active{background:var(--brand-dark);color:var(--gold);border-color:var(--brand-dark);box-shadow:0 2px 8px rgba(10,15,28,.12)}
    .pager button.arr{color:var(--gray-400);font-size:13px}
    .pager button:disabled{opacity:.25;cursor:default;pointer-events:none}
    .pager-per{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-400)}
    .pager-per select{height:32px;padding:0 24px 0 8px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px;font-family:var(--font);color:var(--gray-600);cursor:pointer;appearance:auto}

    /* === Responsive === */
    @media(max-width:768px){
        .lib-item{flex-direction:column;align-items:stretch;gap:14px;padding:18px 20px}
        .lib-action{flex-direction:row;align-items:center;width:100%;min-width:0;justify-content:space-between}
        .pager-wrap{flex-direction:column;gap:12px}
    }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
    <div class="inner">
        <div class="hero-text">
            <div class="breadcrumb" style="margin-bottom:16px"><a href="../index.html">홈</a><i class="fa-solid fa-chevron-right"></i><span style="color:var(--gold)">정비사업</span></div>
            <div class="hero-label">PROFESSIONAL ARCHIVE</div>
            <h1>정비사업 <em>실무 자료</em>를<br>한곳에서 검색하세요</h1>
            <p class="hero-sub">법령·판례·지침·서식·가이드 — 정비사업에 필요한 공식 자료를 체계적으로 제공합니다</p>
        </div>

    </div>
</div>

<div class="page-body"><div class="inner">

    <div class="cat-wrap"><div class="cat-tabs" id="catTabs"></div></div>

    <div class="ctrl-bar">
        <div class="ctrl-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="자료명, 키워드, 법령명, 판례번호로 검색하세요">
        </div>
        <div class="ctrl-sort">
            <label>정렬</label>
            <select id="sortSelect">
                <option value="date">최신순</option>
                <option value="downloads">다운로드순</option>
                <option value="title">이름순</option>
            </select>
        </div>
        <div class="ctrl-count" id="resultCount"></div>

        <div class="pager" id="pager"></div>
        <div class="pager-per">
            <span>페이지당</span>
            <select id="perSelect"><option value="10">10개</option><option value="20">20개</option><option value="50">50개</option></select>
        </div>
    </div>

</div></div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260407"></script>
<script src="../assets/js/data-service.js?v=20260407"></script>
<script src="../assets/js/common.js?v=20260407"></script>
<script>
(function(){
if(typeof MOCK!=='undefined'&&MOCK.library){var s=JSON.parse(localStorage.getItem('rdc_library')||'[]');if(s.length!==MOCK.library.length)localStorage.setItem('rdc_library',JSON.stringify(MOCK.library))}
var now=new Date(),sevenAgo=new Date(now.getTime()-7*864e5);
var allItems=DataService.getAll('library').filter(function(i){if(i.category!=='주요뉴스')return true;return i.date&&new Date(i.date)>=sevenAgo});

var PER=10,curPage=1,curCat='전체',curSort='date',searchQ='';

var iconMap={hwp:{icon:'fa-file-lines',cls:'hwp'},pdf:{icon:'fa-file-pdf',cls:'pdf'},xlsx:{icon:'fa-file-excel',cls:'xlsx'}};
function getIcon(ft){return iconMap[ft]||{icon:'fa-file',cls:'web'}}
function isNew(d){return d&&(now-new Date(d))<7*864e5}
function isHot(dl){return dl>=200}

function srcBadge(item){
    var t=item.title||'',d=item.description||'';
    if(d.indexOf('[서울시')>=0||t.indexOf('서울시')>=0)return'서울시';
    if(d.indexOf('[국토부')>=0||d.indexOf('[국토교통부')>=0)return'국토교통부';
    if(d.indexOf('[대법원')>=0)return'대법원';
    if(d.indexOf('[LH')>=0)return'LH';
    if(d.indexOf('[경기도')>=0)return'경기도';
    if(d.indexOf('[제주도')>=0)return'제주도';
    if(d.indexOf('[건축규제')>=0)return'건축규제혁신센터';
    if(d.indexOf('[마포구')>=0)return'마포구';
    if(d.indexOf('[한국공인')>=0)return'한국공인회계사회';
    return null}

var catDefs=[
    {key:'전체',icon:'',label:'전체'},
    {key:'법령',icon:'fa-scale-balanced',label:'법령·조례'},
    {key:'관련판례',icon:'fa-gavel',label:'판례·질의회신'},
    {key:'지침',icon:'fa-clipboard-list',label:'지침·규정'},
    {key:'서식',icon:'fa-file-pen',label:'서식·양식'},
    {key:'가이드',icon:'fa-book-open',label:'가이드·매뉴얼'},
    {key:'주요뉴스',icon:'fa-newspaper',label:'주요뉴스'}];
function getCatCounts(){var c={};catDefs.forEach(function(d){c[d.key]=0});allItems.forEach(function(i){c[i.category]=(c[i.category]||0)+1;c['전체']++});return c}

/* Hero stats */
!function(){var cc=getCatCounts();
document.getElementById('heroStats').innerHTML=
'<div class="hs"><strong>'+cc['전체']+'</strong><span>전체 자료</span></div>'+
'<div class="hs"><strong>'+cc['법령']+'</strong><span>법령·조례</span></div>'+
'<div class="hs"><strong>'+cc['관련판례']+'</strong><span>판례·질의회신</span></div>'+
'<div class="hs"><strong>'+cc['서식']+'</strong><span>서식·양식</span></div>'+
'<div class="hs"><strong>'+cc['가이드']+'</strong><span>가이드</span></div>'}();

/* Tabs */
function renderTabs(){var cc=getCatCounts();
document.getElementById('catTabs').innerHTML=catDefs.map(function(d){
var ic=d.icon?'<i class="fa-solid '+d.icon+'"></i> ':'';
return'<button class="cat-tab'+(curCat===d.key?' on':'')+'" data-cat="'+d.key+'">'+ic+d.label+'<span class="cnt">'+cc[d.key]+'</span></button>'}).join('')}

/* Popular section */
function renderPop(){
var popular=allItems.filter(function(i){return i.downloads>=80}).sort(function(a,b){return b.downloads-a.downloads}).slice(0,6);
var el=document.getElementById('popSec');
if(!popular.length){el.style.display='none';return}
el.style.display='';
var html='<div class="pop-head"><div class="ph-icon"><i class="fa-solid fa-fire"></i></div><h3>인기 자료</h3><span>다운로드가 많은 실무 추천 자료</span></div><div class="pop-grid">';
popular.forEach(function(i,idx){
var fi=getIcon(i.fileType);
html+='<div class="pop-card" data-id="'+i.id+'"><div class="pop-rank">'+(idx+1)+'</div>'+
'<div class="pop-icon '+fi.cls+'"><i class="fa-solid '+fi.icon+'"></i></div>'+
'<div class="pop-body"><div class="pop-title">'+i.title+'</div>'+
'<div class="pop-info"><i class="fa-solid fa-download"></i> '+(i.downloads||0)+'회'+
'<span style="margin:0 6px;color:var(--gray-200)">·</span>'+i.fileSize+'</div></div></div>'});
html+='</div>';el.innerHTML=html}

/* Filter + Sort */
function getFiltered(){
var items=allItems;
if(curCat!=='전체')items=items.filter(function(i){return i.category===curCat});
if(searchQ){var q=searchQ.toLowerCase();items=items.filter(function(i){
return(i.title||'').toLowerCase().indexOf(q)>=0||(i.description||'').toLowerCase().indexOf(q)>=0||
(i.tags||[]).some(function(t){return t.toLowerCase().indexOf(q)>=0})})}
items.sort(function(a,b){
if(curSort==='downloads')return(b.downloads||0)-(a.downloads||0);
if(curSort==='title')return(a.title||'').localeCompare(b.title||'');
return(b.date||'').localeCompare(a.date||'')});
return items}

/* Render list */
function render(){
var items=getFiltered(),total=items.length,pages=Math.ceil(total/PER);
if(curPage>pages)curPage=1;
var start=(curPage-1)*PER,slice=items.slice(start,start+PER);
document.getElementById('resultCount').innerHTML='총 <strong>'+total+'</strong>건';
var list=document.getElementById('libList'),empty=document.getElementById('emptyState');
if(!slice.length){list.innerHTML='';empty.style.display='flex';document.getElementById('pagerWrap').style.display='none';return}
empty.style.display='none';document.getElementById('pagerWrap').style.display='';

list.innerHTML=slice.map(function(item){
var fi=getIcon(item.fileType),src=srcBadge(item);
var badges='<span class="lb lb-cat">'+item.category+'</span>';
if(src)badges+='<span class="lb lb-src">'+src+'</span>';
if(isNew(item.date))badges+='<span class="lb lb-new">NEW</span>';
if(isHot(item.downloads))badges+='<span class="lb lb-hot"><i class="fa-solid fa-fire"></i>인기</span>';
badges+='<span class="lb-date">'+item.date+'</span>';
badges+='<span class="lb-dl"><i class="fa-solid fa-download"></i>'+(item.downloads||0)+'</span>';

var pinCls=isHot(item.downloads)?' pinned':'';
var ftLabel=item.fileType==='pdf'?'PDF':item.fileType==='hwp'?'HWP':item.fileType==='xlsx'?'XLS':'WEB';

return'<div class="lib-item'+pinCls+'">'+
'<div class="lib-icon '+fi.cls+'"><i class="fa-solid '+fi.icon+'"></i><span class="ft-label">'+ftLabel+'</span></div>'+
'<div class="lib-content">'+
    '<div class="lib-title" data-id="'+item.id+'">'+item.title+'</div>'+
    '<div class="lib-desc">'+item.description+'</div>'+
    '<div class="lib-meta-row">'+badges+'</div>'+
'</div>'+
'<div class="lib-action">'+
    '<span class="lib-size">'+item.fileSize+'</span>'+
    '<button class="btn-dl" data-id="'+item.id+'"><i class="fa-solid fa-arrow-down"></i> '+ftLabel+' 다운로드</button>'+
'</div></div>'}).join('');

/* Pager */
var pg=document.getElementById('pager');
if(pages<=1){pg.innerHTML='';return}
var h='<button class="arr" '+(curPage===1?'disabled':'')+' onclick="LIB.page('+(curPage-1)+')"><i class="fa-solid fa-chevron-left"></i></button>';
for(var i=1;i<=pages;i++)h+='<button'+(i===curPage?' class="active"':'')+' onclick="LIB.page('+i+')">'+i+'</button>';
h+='<button class="arr" '+(curPage===pages?'disabled':'')+' onclick="LIB.page('+(curPage+1)+')"><i class="fa-solid fa-chevron-right"></i></button>';
pg.innerHTML=h}

var fileCache={};
function checkFile(url,cb){if(fileCache[url]!==undefined)return cb(fileCache[url]);var x=new XMLHttpRequest();x.open('HEAD',url,true);x.onload=function(){fileCache[url]=x.status===200;cb(fileCache[url])};x.onerror=function(){fileCache[url]=false;cb(false)};x.send()}
function handleDownload(id){
var m=fileMap[id];if(!m){App.toast('파일 준비 중입니다.','info');return}
if(m.ext){checkFile(m.ext,function(ok){
if(ok){var a=document.createElement('a');a.href=m.ext;a.download='';document.body.appendChild(a);a.click();document.body.removeChild(a);App.toast('파일 다운로드 시작','success')}
else if(m.gov){window.open(m.gov,'_blank');App.toast((m.label||'공식 사이트')+'로 이동합니다','info')}
else if(m.web){window.open(m.web,'_blank');App.toast('웹 문서로 열립니다','info')}})}
else if(m.gov){if(m.web)window.open(m.web,'_blank');setTimeout(function(){if(confirm((m.label||'공식 사이트')+'에서 원문을 확인하시겠습니까?'))window.open(m.gov,'_blank')},500)}
else if(m.web){window.open(m.web,'_blank');App.toast('웹 문서로 열립니다','info')}
var item=allItems.find(function(i){return i.id===id});if(item){item.downloads=(item.downloads||0)+1}render()}
