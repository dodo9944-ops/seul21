<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 — (주)세울엔지니어링</title>
    <meta name="description" content="재개발·재건축 관련 서식, 법령, 지침, 가이드 자료를 다운로드하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
    /* === Hero === */
    .lib-hero{padding:64px 0 56px;background:linear-gradient(135deg,#070B15 0%,var(--brand-dark) 40%,var(--brand-navy) 100%);position:relative;overflow:hidden}
    .lib-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(195,165,105,.3),transparent)}
    .lib-hero h1{font-size:36px;font-weight:900;color:#fff;margin-bottom:14px;padding-left:18px;border-left:3px solid var(--gold)}
    .lib-hero .hero-tag{font-size:17px;font-weight:600;color:var(--gold);margin-bottom:8px}
    .lib-hero .hero-sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.6}
    .lib-hero .hero-stats{display:flex;gap:32px;margin-top:20px}
    .lib-hero .hs{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.45)}
    .lib-hero .hs strong{font-size:18px;font-weight:800;color:var(--gold)}
    @media(max-width:768px){.lib-hero{padding:40px 0 32px}.lib-hero h1{font-size:26px}.lib-hero .hero-stats{gap:20px;flex-wrap:wrap}}

    /* === Category Tabs === */
    .cat-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
    .cat-tab{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-200);background:var(--gray-50);color:var(--gray-500);transition:all .2s;font-family:var(--font)}
    .cat-tab i{font-size:12px;opacity:.5;transition:opacity .2s}
    .cat-tab .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;background:var(--gray-200);color:var(--gray-500);margin-left:2px;transition:all .2s}
    .cat-tab.on{background:var(--brand-dark);color:var(--gold);border-color:var(--brand-dark);font-weight:700}
    .cat-tab.on i{opacity:1}
    .cat-tab.on .cnt{background:rgba(195,165,105,.25);color:var(--gold)}
    .cat-tab:not(.on):hover{background:#fff;border-color:rgba(20,38,68,.3);color:var(--gray-700)}
    .cat-tab:not(.on):hover i{opacity:.7}

    /* === Control Bar (Search + Sort) === */
    .ctrl-bar{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:14px 20px;background:var(--gray-50);border-radius:14px;border:1px solid var(--gray-100);flex-wrap:wrap}
    .ctrl-search{position:relative;flex:1;min-width:200px;max-width:480px}
    .ctrl-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:14px;pointer-events:none}
    .ctrl-search input{width:100%;height:42px;padding:0 14px 0 40px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:13.5px;font-weight:500;color:var(--gray-800);background:#fff;font-family:var(--font);transition:border-color .2s}
    .ctrl-search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(195,165,105,.1)}
    .ctrl-sort{display:flex;align-items:center;gap:6px;margin-left:auto}
    .ctrl-sort label{font-size:12px;font-weight:600;color:var(--gray-400);white-space:nowrap}
    .ctrl-sort select{height:36px;padding:0 28px 0 10px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:12.5px;font-weight:500;color:var(--gray-700);background:#fff;cursor:pointer;appearance:auto;font-family:var(--font)}
    .ctrl-count{font-size:13px;color:var(--gray-500);font-weight:500;white-space:nowrap}
    .ctrl-count strong{color:var(--brand-dark);font-weight:700}
    @media(max-width:640px){.ctrl-bar{flex-direction:column;align-items:stretch;gap:10px}.ctrl-search{max-width:100%}.ctrl-sort{margin-left:0;justify-content:flex-end}}

    /* === Quick Sections (추천/최신/인기) === */
    .quick-sec{margin-bottom:32px;padding:20px 24px;background:var(--gray-50);border-radius:14px;border:1px solid var(--gray-100)}
    .quick-sec .qs-title{font-size:14px;font-weight:700;color:var(--gray-900);margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .quick-sec .qs-title i{color:var(--gold);font-size:13px}
    .quick-chips{display:flex;gap:8px;flex-wrap:wrap}
    .quick-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#fff;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;font-weight:500;color:var(--gray-700);cursor:pointer;transition:all .2s}
    .quick-chip:hover{border-color:var(--gold);color:var(--brand-dark);background:rgba(195,165,105,.04)}
    .quick-chip .qc-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
    .quick-chip .qc-icon.pdf{background:#D6423A}
    .quick-chip .qc-icon.hwp{background:#2A7DE1}
    .quick-chip .qc-meta{font-size:11px;color:var(--gray-400);margin-left:auto}

    /* === Document List === */
    .lib-list{display:flex;flex-direction:column;gap:10px}
    .lib-item{display:flex;align-items:center;gap:18px;padding:18px 22px;background:#fff;border:1px solid var(--gray-200);border-radius:12px;transition:all .2s}
    .lib-item:hover{border-color:var(--gray-300);box-shadow:0 4px 16px rgba(0,0,0,.05)}
    .lib-item.pinned{border-left:3px solid var(--gold);background:rgba(195,165,105,.02)}

    /* File icon */
    .lib-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:#fff}
    .lib-icon.hwp{background:#2A7DE1}
    .lib-icon.pdf{background:#D6423A}
    .lib-icon.xlsx{background:#1E8C5E}
    .lib-icon.web{background:var(--brand-dark)}

    /* Content */
    .lib-content{flex:1;min-width:0}
    .lib-title{font-size:14.5px;font-weight:700;color:var(--gray-900);margin-bottom:3px;line-height:1.4;cursor:pointer;transition:color .2s}
    .lib-title:hover{color:var(--gold)}
    .lib-desc{font-size:12.5px;color:var(--gray-500);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
    .lib-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .lib-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:600;line-height:1.4}
    .lib-badge-cat{background:rgba(10,15,28,.06);color:var(--brand-dark)}
    .lib-badge-src{background:rgba(195,165,105,.1);color:#8B7340}
    .lib-badge-new{background:#E8F5E9;color:#2E7D32;font-weight:700}
    .lib-badge-hot{background:rgba(195,165,105,.12);color:#8B7340}
    .lib-date{font-size:11px;color:var(--gray-400)}

    /* Right meta */
    .lib-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;min-width:110px}
    .lib-meta-info{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--gray-400)}
    .lib-meta-info i{font-size:10px}
    .btn-dl{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 14px;font-size:11.5px;font-weight:600;color:var(--gold);background:transparent;border:1.5px solid var(--gold);border-radius:7px;cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
    .btn-dl:hover{background:var(--gold);color:#fff}
    .btn-dl .ftype{font-weight:700;text-transform:uppercase}

    /* Empty */
    .lib-empty{text-align:center;padding:56px 20px}
    .lib-empty i{font-size:48px;color:var(--gray-300);margin-bottom:16px}
    .lib-empty h3{font-size:18px;font-weight:700;color:var(--gray-600);margin-bottom:8px}
    .lib-empty p{font-size:14px;color:var(--gray-400)}

    /* Pagination */
    .pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:32px}
    .pager button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gray-200);border-radius:8px;background:#fff;color:var(--gray-600);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .pager button:hover{border-color:var(--gold);color:var(--brand-dark)}
    .pager button.active{background:var(--brand-dark);color:var(--gold);border-color:var(--brand-dark)}
    .pager button:disabled{opacity:.3;cursor:default;pointer-events:none}

    /* Responsive */
    @media(max-width:768px){
        .lib-item{flex-direction:column;align-items:flex-start;gap:12px;padding:16px}
        .lib-meta{flex-direction:row;align-items:center;width:100%;min-width:0;justify-content:space-between}
    }
    </style>
</head>
<body>
<div id="site-header"></div>

<div class="lib-hero">
    <div class="inner">
        <div class="breadcrumb"><a href="../index.html">홈</a><i class="fa-solid fa-chevron-right"></i><span>자료실</span></div>
        <h1>자료실</h1>
        <p class="hero-tag">정비사업 실무 전문 아카이브</p>
        <p class="hero-sub">법령·판례·지침·서식·가이드 — 정비사업 실무에 필요한 자료를 한곳에서 검색하고 다운로드하세요</p>
        <div class="hero-stats" id="heroStats"></div>
    </div>
</div>

<div class="page-body"><div class="inner">

    <!-- Category Tabs -->
    <div class="cat-tabs" id="catTabs"></div>

    <!-- Control Bar -->
    <div class="ctrl-bar">
        <div class="ctrl-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="자료명, 키워드, 법령명, 판례번호로 검색하세요">
        </div>
        <div class="ctrl-sort">
            <label>정렬</label>
            <select id="sortSelect">
                <option value="date">최신순</option>
                <option value="downloads">다운로드순</option>
                <option value="title">이름순</option>
            </select>
        </div>
        <div class="ctrl-count" id="resultCount"></div>
    </div>

    <!-- Quick Section: 실무 추천자료 -->
    <div class="quick-sec" id="quickSec"></div>

    <!-- Library List -->
    <div class="lib-list" id="libList"></div>

    <!-- Empty State -->
    <div class="lib-empty" id="emptyState" style="display:none">
        <i class="fa-solid fa-folder-open"></i>
        <h3>검색 결과가 없습니다</h3>
        <p>다른 검색어 또는 카테고리를 선택해주세요</p>
    </div>

    <!-- Pagination -->
    <div class="pager" id="pager"></div>

</div></div>

<div id="site-footer"></div>
<script src="../assets/data/mock-data.js?v=20260405"></script>
<script src="../assets/js/data-service.js?v=20260405"></script>
<script src="../assets/js/common.js?v=20260405"></script>
<script>
(function(){
/* Data init */
if(typeof MOCK!=='undefined'&&MOCK.library){
    var s=JSON.parse(localStorage.getItem('rdc_library')||'[]');
    if(s.length!==MOCK.library.length)localStorage.setItem('rdc_library',JSON.stringify(MOCK.library));
}
var now=new Date(),sevenAgo=new Date(now.getTime()-7*864e5);
var allItems=DataService.getAll('library').filter(function(i){
    if(i.category!=='주요뉴스')return true;
    return i.date&&new Date(i.date)>=sevenAgo;
});

var PER=10,curPage=1,curCat='전체',curSort='date',searchQ='';

/* Helpers */
var iconMap={hwp:{icon:'fa-file-lines',cls:'hwp'},pdf:{icon:'fa-file-pdf',cls:'pdf'},xlsx:{icon:'fa-file-excel',cls:'xlsx'}};
function getIcon(ft){return iconMap[ft]||{icon:'fa-file',cls:'web'}}
function isNew(d){if(!d)return false;var diff=now-new Date(d);return diff<7*864e5}
function isHot(dl){return dl>=200}

/* Source badge */
function srcBadge(item){
    var t=item.title||'',d=item.description||'';
    if(d.indexOf('[서울시')>=0||t.indexOf('서울시')>=0)return'서울시';
    if(d.indexOf('[국토부')>=0||d.indexOf('[국토교통부')>=0)return'국토교통부';
    if(d.indexOf('[대법원')>=0)return'대법원';
    if(d.indexOf('[LH')>=0)return'LH';
    if(d.indexOf('[경기도')>=0)return'경기도';
    if(d.indexOf('[제주도')>=0)return'제주도';
    if(d.indexOf('[건축규제')>=0)return'건축규제혁신센터';
    if(d.indexOf('[마포구')>=0)return'마포구';
    if(d.indexOf('[한국공인')>=0)return'한국공인회계사회';
    return null;
}

/* Category counts */
var catDefs=[
    {key:'전체',icon:'',label:'전체'},
    {key:'법령',icon:'fa-scale-balanced',label:'법령·조례'},
    {key:'관련판례',icon:'fa-gavel',label:'판례·질의회신'},
    {key:'지침',icon:'fa-clipboard-list',label:'지침·규정'},
    {key:'서식',icon:'fa-file-pen',label:'서식·양식'},
    {key:'가이드',icon:'fa-book-open',label:'가이드·매뉴얼'},
    {key:'주요뉴스',icon:'fa-newspaper',label:'주요뉴스'}
];
function getCatCounts(){
    var c={};catDefs.forEach(function(d){c[d.key]=0});
    allItems.forEach(function(i){c[i.category]=(c[i.category]||0)+1;c['전체']++});
    return c;
}

/* Hero stats */
!function(){
    var cc=getCatCounts();
    document.getElementById('heroStats').innerHTML=
        '<div class="hs"><strong>'+cc['전체']+'</strong>건 전체자료</div>'+
        '<div class="hs"><strong>'+cc['법령']+'</strong>건 법령·조례</div>'+
        '<div class="hs"><strong>'+cc['서식']+'</strong>건 서식·양식</div>'+
        '<div class="hs"><strong>'+cc['가이드']+'</strong>건 가이드</div>';
}();

/* Category tabs */
function renderTabs(){
    var cc=getCatCounts();
    document.getElementById('catTabs').innerHTML=catDefs.map(function(d){
        var iconHtml=d.icon?'<i class="fa-solid '+d.icon+'"></i> ':'';
        return'<button class="cat-tab'+(curCat===d.key?' on':'')+'" data-cat="'+d.key+'">'+iconHtml+d.label+'<span class="cnt">'+cc[d.key]+'</span></button>';
    }).join('');
}

/* Quick section: 추천 + 인기 자료 */
function renderQuick(){
    var popular=allItems.filter(function(i){return i.downloads>=100}).sort(function(a,b){return b.downloads-a.downloads}).slice(0,6);
    if(!popular.length){document.getElementById('quickSec').style.display='none';return}
    document.getElementById('quickSec').style.display='';
    var html='<div class="qs-title"><i class="fa-solid fa-fire"></i> 많이 다운로드한 자료</div><div class="quick-chips">';
    popular.forEach(function(i){
        var fi=getIcon(i.fileType);
        html+='<div class="quick-chip" data-id="'+i.id+'"><div class="qc-icon '+fi.cls+'"><i class="fa-solid '+fi.icon+'"></i></div>'+i.title+'<span class="qc-meta">'+i.downloads+'회</span></div>';
    });
    html+='</div>';
    document.getElementById('quickSec').innerHTML=html;
}

/* Get filtered + sorted items */
function getFiltered(){
    var items=allItems;
    if(curCat!=='전체')items=items.filter(function(i){return i.category===curCat});
    if(searchQ){var q=searchQ.toLowerCase();items=items.filter(function(i){
        return(i.title||'').toLowerCase().indexOf(q)>=0||(i.description||'').toLowerCase().indexOf(q)>=0||
        (i.tags||[]).some(function(t){return t.toLowerCase().indexOf(q)>=0})});}
    items.sort(function(a,b){
        if(curSort==='downloads')return(b.downloads||0)-(a.downloads||0);
        if(curSort==='title')return(a.title||'').localeCompare(b.title||'');
        return(b.date||'').localeCompare(a.date||'');
    });
    return items;
}

/* Render list */
function render(){
    var items=getFiltered();
    var total=items.length,pages=Math.ceil(total/PER);
    if(curPage>pages)curPage=1;
    var start=(curPage-1)*PER,slice=items.slice(start,start+PER);

    document.getElementById('resultCount').innerHTML='총 <strong>'+total+'</strong>건';
    var list=document.getElementById('libList'),empty=document.getElementById('emptyState');

    if(!slice.length){list.innerHTML='';empty.style.display='flex';document.getElementById('pager').innerHTML='';return}
    empty.style.display='none';

    list.innerHTML=slice.map(function(item){
        var fi=getIcon(item.fileType);
        var src=srcBadge(item);
        var badges='<span class="lib-badge lib-badge-cat">'+item.category+'</span>';
        if(src)badges+='<span class="lib-badge lib-badge-src">'+src+'</span>';
        if(isNew(item.date))badges+='<span class="lib-badge lib-badge-new">NEW</span>';
        if(isHot(item.downloads))badges+='<span class="lib-badge lib-badge-hot"><i class="fa-solid fa-fire" style="font-size:9px;margin-right:2px"></i>인기</span>';

        var pinCls=isHot(item.downloads)?' pinned':'';

        return'<div class="lib-item'+pinCls+'">'+
            '<div class="lib-icon '+fi.cls+'"><i class="fa-solid '+fi.icon+'"></i></div>'+
            '<div class="lib-content">'+
                '<div class="lib-title" data-id="'+item.id+'">'+item.title+'</div>'+
                '<div class="lib-desc">'+item.description+'</div>'+
                '<div class="lib-badges">'+badges+'<span class="lib-date">'+item.date+'</span></div>'+
            '</div>'+
            '<div class="lib-meta">'+
                '<div class="lib-meta-info">'+
                    '<span><i class="fa-solid fa-download"></i> '+(item.downloads||0)+'</span>'+
                    '<span><i class="fa-solid fa-file"></i> '+item.fileSize+'</span>'+
                '</div>'+
                '<button class="btn-dl" data-id="'+item.id+'">'+
                    '<span class="ftype">'+item.fileType+'</span> · '+item.fileSize+' <i class="fa-solid fa-arrow-down"></i>'+
                '</button>'+
            '</div>'+
        '</div>';
    }).join('');

    /* Pager */
    var pg=document.getElementById('pager');
    if(pages<=1){pg.innerHTML='';return}
    var h='<button '+(curPage===1?'disabled':'')+' onclick="LIB.page('+(curPage-1)+')"><i class="fa-solid fa-chevron-left"></i></button>';
    for(var i=1;i<=pages;i++)h+='<button'+(i===curPage?' class="active"':'')+' onclick="LIB.page('+i+')">'+i+'</button>';
    h+='<button '+(curPage===pages?'disabled':'')+' onclick="LIB.page('+(curPage+1)+')"><i class="fa-solid fa-chevron-right"></i></button>';
    pg.innerHTML=h;
}

/* Events */
document.getElementById('catTabs').addEventListener('click',function(e){
    var btn=e.target.closest('.cat-tab');if(!btn)return;
    curCat=btn.dataset.cat;curPage=1;renderTabs();render();
});
document.getElementById('searchInput').addEventListener('input',function(){
    searchQ=this.value.trim();curPage=1;render();
});
document.getElementById('sortSelect').addEventListener('change',function(){
    curSort=this.value;curPage=1;render();
});
document.getElementById('quickSec').addEventListener('click',function(e){
    var chip=e.target.closest('.quick-chip');if(!chip)return;
    handleDownload(chip.dataset.id);
});
document.getElementById('libList').addEventListener('click',function(e){
    var btn=e.target.closest('.btn-dl')||e.target.closest('.lib-title');
    if(btn)handleDownload(btn.dataset.id);
});

/* URL param */
var urlCat=new URLSearchParams(location.search).get('cat');
if(urlCat){curCat=urlCat}

/* Download handler */
var fileMap={
    'lib1':{ext:'../downloads/files/lib1_조합설립인가_신청서.pdf',web:'../downloads/form_association.html'},
    'lib2':{ext:'../downloads/files/lib2_관리처분_변경인가_신청서.pdf',web:'../downloads/form_management.html'},
    'lib3':{ext:'../downloads/files/lib3_총회_위임장.pdf',web:'../downloads/form_proxy.html'},

var fileCache={};
function checkFile(url,cb){
    if(fileCache[url]!==undefined)return cb(fileCache[url]);
    var x=new XMLHttpRequest();x.open('HEAD',url,true);
    x.onload=function(){fileCache[url]=x.status===200;cb(fileCache[url])};
    x.onerror=function(){fileCache[url]=false;cb(false)};x.send();
}
function handleDownload(id){
    var m=fileMap[id];
    if(!m){App.toast('파일 준비 중입니다.','info');return}
    if(m.ext){
        checkFile(m.ext,function(ok){
            if(ok){var a=document.createElement('a');a.href=m.ext;a.download='';document.body.appendChild(a);a.click();document.body.removeChild(a);App.toast('파일 다운로드 시작','success')}
            else if(m.gov){window.open(m.gov,'_blank');App.toast((m.label||'공식 사이트')+'로 이동합니다','info')}
            else if(m.web){window.open(m.web,'_blank');App.toast('웹 문서로 열립니다','info')}
        });
    }else if(m.gov){
        if(m.web)window.open(m.web,'_blank');
        setTimeout(function(){if(confirm((m.label||'공식 사이트')+'에서 원문을 확인하시겠습니까?'))window.open(m.gov,'_blank')},500);
    }else if(m.web){window.open(m.web,'_blank');App.toast('웹 문서로 열립니다','info')}
    var item=allItems.find(function(i){return i.id===id});
    if(item){item.downloads=(item.downloads||0)+1}
    render();
}

/* Global */
window.LIB={page:function(n){curPage=n;render();window.scrollTo({top:document.querySelector('.ctrl-bar').offsetTop-80,behavior:'smooth'})}};

/* Init */
renderTabs();renderQuick();render();
