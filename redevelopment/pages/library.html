<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 — (주)빛세움</title>
    <meta name="description" content="재개발·재건축 관련 서식, 법령, 지침, 가이드 자료를 다운로드하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260830i">
    <link rel="stylesheet" href="../assets/css/download-view.css?v=20260830b">
    <style>
    /* ================================================================
       자료실 — 정비사업 전문 아카이브 (Premium Redesign)
       ================================================================ */

    /* === 자료실 히어로 — 업무실적 기본 .uni-hero 와 완전 동일 (2026-04-19) ===
       .uni-hero.lib-compact override 100% 제거. 카드/폰트/패딩/flex 전부 기본 규칙 상속. */

    /* === 소식받기 버튼 — 히어로 최하단 중앙 배치, 콤팩트 === */
    .lib-alimtalk-wrap{display:flex;justify-content:center;margin-top:28px;position:relative;z-index:3}
    .lib-alimtalk-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(184,134,11,.1);border:1.5px solid rgba(184,134,11,.35);border-radius:8px;color:#B8860B;font-size:12px;font-weight:700;text-decoration:none;transition:all .2s;font-family:var(--font)}
    .lib-alimtalk-btn:hover{background:rgba(184,134,11,.2);border-color:rgba(184,134,11,.5)}
    .lib-alimtalk-btn i{font-size:12px}
    @media(max-width:600px){.lib-alimtalk-wrap{margin-top:20px}.lib-alimtalk-btn{font-size:11px;padding:6px 14px;gap:5px}.lib-alimtalk-btn i{font-size:11px}}

    /* === Page Body (히어로 바로 아래 시작) === */
    .page-body.lib-page{padding-top:40px}
    .page-body.lib-page,
    .page-body.lib-page > .inner{overflow:hidden}
    .lib-item{min-width:0;max-width:100%}

    /* === 전체자료 타이틀 — 바로 위 '주요뉴스'(.pop-head h3)와 완전히 동일한 규격으로 통일 === */
    .lib-all-title{margin-bottom:32px}
    .lib-all-title .section-title{font-size:24px;font-weight:800;color:var(--gray-900);padding-left:16px;letter-spacing:normal;font-family:var(--font)}
    .lib-all-title .section-title::before{left:0;top:4px;width:3px;height:22px;border-radius:2px}

    /* === Control Bar === */
    .ctrl-bar{display:flex;align-items:center;gap:16px;margin-bottom:48px;padding:16px 24px;background:#fff;border-radius:14px;border:1px solid var(--gray-200);box-shadow:0 2px 8px rgba(0,0,0,.03);flex-wrap:wrap;box-sizing:border-box}
    /* html,body{overflow-x:hidden}(전역) 때문에 position:sticky가 무효화되어
       업무실적(portfolio.html)과 동일하게 스크롤 감지 후 position:fixed로 전환하는 방식 사용 */
    .ctrl-bar.lib-stuck{position:fixed;z-index:50;margin-bottom:0}
    .ctrl-sort{display:flex;align-items:center;gap:8px;margin-left:auto}
    .ctrl-sort label{font-size:12px;font-weight:600;color:var(--gray-400);white-space:nowrap}
    .ctrl-sort select{height:40px;padding:0 30px 0 12px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:13px;font-weight:500;color:var(--gray-700);background:#fff;cursor:pointer;appearance:auto;font-family:var(--font);transition:border-color .2s}
    .ctrl-sort select:focus{border-color:var(--gold);outline:none}
    .ctrl-count{font-size:14px;color:var(--gray-500);font-weight:500;white-space:nowrap}
    .ctrl-count strong{color:var(--brand-dark);font-weight:700}
    /* 카테고리 탭 — 언더라인 강조 스타일 (전체자료 디자인 통일, #ctrlNav 범위로만 한정) */
    #ctrlNav{gap:0}
    #ctrlNav button,#ctrlNav a{padding:4px 20px;font-size:14px;font-weight:500;color:var(--gray-700,#444);background:none;border:none;border-radius:0;position:relative}
    #ctrlNav button:first-child,#ctrlNav a:first-child{padding-left:0}
    #ctrlNav button:not(:last-child),#ctrlNav a:not(:last-child){border-right:1px solid var(--gray-200)}
    #ctrlNav button:hover,#ctrlNav a:hover{background:none;color:var(--gray-900)}
    #ctrlNav button.on{color:var(--gold);font-weight:700}
    #ctrlNav button.on::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:20px;height:2px;border-radius:1px;background:var(--gold)}
    @media(max-width:640px){.ctrl-bar{flex-direction:column;align-items:stretch;gap:12px;padding:16px}.ctrl-sort{margin-left:0;justify-content:flex-end}#ctrlNav{flex-wrap:wrap;row-gap:10px}}

    /* === Popular Section === */
    .pop-sec{margin-bottom:36px}
    .pop-sec .pop-head{display:flex;align-items:center;gap:24px;margin-bottom:32px}
    .pop-sec .pop-head h3{font-size:24px;font-weight:800;color:var(--gray-900);padding-left:16px;position:relative}
    .pop-sec .pop-head h3::before{content:'';position:absolute;left:0;top:4px;width:3px;height:22px;border-radius:2px;background:linear-gradient(to bottom,var(--gold),rgba(184,134,11,.3))}
    .pop-sec .pop-head span{font-size:12px;color:var(--gray-400);font-weight:500}
    .pop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:900px){.pop-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:540px){.pop-grid{grid-template-columns:1fr}}
    .pop-card{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;background:#fff;border:1px solid var(--gray-200);border-radius:12px;cursor:pointer;transition:all .25s;position:relative}
    .pop-card:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(184,134,11,.1);transform:translateY(-2px)}
    .pop-card .pop-rank{position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:6px;background:#FFFFFF;color:var(--gold);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
    .pop-card .pop-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:#0A0F1C}
    .pop-card .pop-icon.pdf{background:#D6423A}
    .pop-card .pop-icon.hwp{background:#2A7DE1}
    .pop-card .pop-icon.web{background:#FFFFFF}
    .pop-card .pop-body{flex:1;min-width:0}
    .pop-card .pop-title{font-size:14px;font-weight:800;color:var(--gray-900);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .pop-card .pop-info{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--gray-500);font-weight:600}
    .pop-card .pop-info i{font-size:10px;color:var(--gold)}

    /* === Document List === */
    .lib-list{display:flex;flex-direction:column;gap:12px}
    .lib-item{display:flex;align-items:flex-start;gap:20px;padding:22px 26px;background:#fff;border:1.5px solid var(--gray-150,#eaedf0);border-radius:14px;transition:all .25s;position:relative}
    .lib-item:hover{border-color:rgba(184,134,11,.35);box-shadow:0 6px 24px rgba(0,0,0,.06);transform:translateY(-1px)}
    .lib-item.pinned{border-left:3.5px solid var(--gold);background:linear-gradient(90deg,rgba(184,134,11,.02),#fff 60%)}

    /* File icon */
    .lib-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;color:#0A0F1C;position:relative}
    .lib-icon.hwp{background:linear-gradient(135deg,#2A7DE1,#1B5FBF);color:#fff}
    .lib-icon.pdf{background:linear-gradient(135deg,#D6423A,#B5332B);color:#fff}
    .lib-icon.xlsx{background:linear-gradient(135deg,#1E8C5E,#166B48);color:#fff}
    .lib-icon.web{background:linear-gradient(135deg,#FFFFFF,#FFF3C4)}
    .lib-icon .ft-label{position:absolute;bottom:-3px;right:-3px;background:#fff;border:1px solid var(--gray-200);border-radius:4px;font-size:8px;font-weight:800;color:var(--gray-600);padding:1px 4px;text-transform:uppercase;line-height:1}

    /* Content */
    .lib-content{flex:1;min-width:0;max-width:100%}
    .lib-title{font-size:15.5px;font-weight:700;color:var(--gray-900);margin-bottom:5px;line-height:1.45;cursor:pointer;transition:color .2s;letter-spacing:-.2px;word-break:break-word;overflow-wrap:anywhere}
    .lib-title:hover{color:var(--gold)}
    .lib-desc{font-size:13px;color:var(--gray-500);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;overflow-wrap:anywhere}
    .lib-meta-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}

    /* Badge system */
    .lb{display:inline-flex;align-items:center;padding:3px 9px;border-radius:5px;font-size:10.5px;font-weight:600;line-height:1.3;letter-spacing:.1px}
    .lb-cat{background:rgba(255,255,255,.06);color:var(--brand-dark);border:1px solid rgba(10,15,28,.08)}
    .lb-src{background:rgba(184,134,11,.08);color:#8B7340;border:1px solid rgba(184,134,11,.12)}
    .lb-new{background:#E8F5E9;color:#2E7D32;border:1px solid #C8E6C9;font-weight:700}
    .lb-hot{background:rgba(184,134,11,.1);color:#8B7340;border:1px solid rgba(184,134,11,.15)}
    .lb-hot i{font-size:9px;margin-right:3px}
    .lb-date{font-size:11px;color:var(--gray-400);font-weight:500;padding-left:4px}
    .lb-dl{font-size:11px;color:var(--gray-400);font-weight:500;display:inline-flex;align-items:center;gap:3px}
    .lb-dl i{font-size:9px;color:var(--gray-300)}

    /* Right action */
    .lib-action{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;min-width:130px}
    .lib-size{font-size:12px;color:var(--gray-400);font-weight:500}
    .btn-dl{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 18px;font-size:12.5px;font-weight:700;color:var(--brand-dark);background:#fff;border:1.5px solid var(--brand-dark);border-radius:9px;cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
    .btn-dl:hover{background:#FFFFFF;color:var(--gold);box-shadow:0 4px 12px rgba(10,15,28,.15)}
    .btn-dl i{font-size:12px;transition:transform .2s}
    .btn-dl:hover i{transform:translateY(1px)}

    /* Empty */
    .lib-empty{text-align:center;padding:64px 20px}
    .lib-empty i{font-size:52px;color:var(--gray-200);margin-bottom:20px}
    .lib-empty h3{font-size:18px;font-weight:700;color:var(--gray-600);margin-bottom:8px}
    .lib-empty p{font-size:14px;color:var(--gray-400)}

    /* === Pagination === */
    .pager-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:40px;padding-top:24px;border-top:1px solid var(--gray-100)}
    .pager{display:flex;align-items:center;gap:4px}
    .pager button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gray-200);border-radius:10px;background:#fff;color:var(--gray-600);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s}
    .pager button:hover{border-color:var(--gold);color:var(--brand-dark);background:rgba(184,134,11,.04)}
    .pager button.active{background:#FFFFFF;color:var(--gold);border-color:var(--brand-dark);box-shadow:0 2px 8px rgba(10,15,28,.12)}
    .pager button.arr{color:var(--gray-400);font-size:13px}
    .pager button:disabled{opacity:.25;cursor:default;pointer-events:none}
    .pager-per{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-400)}
    .pager-per select{height:32px;padding:0 24px 0 8px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px;font-family:var(--font);color:var(--gray-600);cursor:pointer;appearance:auto}

    /* === Responsive === */
    @media(max-width:768px){
        .lib-item{flex-direction:column;align-items:stretch;gap:14px;padding:18px 20px}
        .lib-action{flex-direction:row;align-items:center;width:100%;min-width:0;justify-content:space-between}
        .pager-wrap{flex-direction:column;gap:12px}
    }
    
    /* === Unified Hero (3안 패밀리) === */
    .uni-hero {
        background: linear-gradient(135deg, #FFFFFF 0%, #FFF3C4 40%, #FFFFFF 100%);
        position: relative; overflow: hidden; padding: 32px 0 12px; min-height: 360px;
    }
    .uni-hero .hero-bg-photo { position: absolute; top: 0; right: 0; width: 58%; height: 100%; z-index: 0; }
    .uni-hero .hero-bg-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; filter: contrast(1.03) saturate(0.95); }
    .uni-hero .hero-bg-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,253,247,1.00) 0%, rgba(255,253,247,0.99) 18%, rgba(255,249,232,0.96) 28%, rgba(255,247,225,0.88) 36%, rgba(255,247,225,0.70) 43%, rgba(255,247,225,0.48) 49%, rgba(255,247,225,0.28) 55%, rgba(255,247,225,0.12) 61%, rgba(255,247,225,0.04) 66%, rgba(255,247,225,0.00) 72%); z-index: 1; }
    .uni-hero .hero-light-wave { position: absolute; left: 0; bottom: -9%; width: 55%; height: 53%; overflow: hidden; pointer-events: none; z-index: 1; opacity: 1; -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 67%, transparent 100%); mask-image: linear-gradient(90deg, #000 0%, #000 67%, transparent 100%); }
    .uni-hero .hero-light-wave::before { content: ''; position: absolute; left: 0; bottom: 0; width: 73%; height: 73%; background: radial-gradient(ellipse at 17% 100%, rgba(255,196,0,.41) 0%, rgba(255,196,0,.19) 28%, rgba(255,196,0,.07) 50%, transparent 72%); filter: blur(2px); }
    .uni-hero .hero-light-wave .wave-line { position: absolute; border-radius: 50%; border-top: 1.2px solid transparent; transform-origin: center; filter: drop-shadow(0 0 5px rgba(255,196,0,.5)) drop-shadow(0 0 14px rgba(255,196,0,.26)); -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 10%, #000 28%, rgba(0,0,0,.55) 46%, #000 62%, rgba(0,0,0,.30) 82%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 10%, #000 28%, rgba(0,0,0,.55) 46%, #000 62%, rgba(0,0,0,.30) 82%, transparent 100%); }
    .uni-hero .hero-light-wave .wave-line:nth-child(1) { left:-12%; bottom:-8%;  width:900px; height:235px; transform:rotate(-7deg);              border-top-width: 1.55px; border-top-color: rgba(255,196,0,.63); }
    .uni-hero .hero-light-wave .wave-line:nth-child(2) { left:-9%;  bottom:-2%;  width:820px; height:214px; transform:rotate(-5.5deg);            border-top-width: 1.35px; border-top-color: rgba(255,208,50,.55); }
    .uni-hero .hero-light-wave .wave-line:nth-child(3) { left:-16%; bottom:-12%; width:740px; height:193px; transform:rotate(-4deg);              border-top-width: 1.2px;  border-top-color: rgba(255,218,80,.47); }
    .uni-hero .hero-light-wave .wave-line:nth-child(4) { left:-6%;  bottom:5%;   width:660px; height:172px; transform:rotate(-10deg) scaleY(.94); border-top-width: 1.05px; border-top-color: rgba(255,196,0,.39); }
    .uni-hero .hero-light-wave .wave-line:nth-child(5) { left:-19%; bottom:-16%; width:580px; height:151px; transform:rotate(-2.5deg);            border-top-width: .95px;  border-top-color: rgba(255,230,120,.31); }
    .uni-hero .hero-light-wave .wave-line:nth-child(6) { left:-4%;  bottom:1%;   width:500px; height:130px; transform:rotate(-12deg);             border-top-width: .85px;  border-top-color: rgba(255,239,155,.23); }
    .uni-hero .hero-light-wave .wave-line:nth-child(7) { left:-14%; bottom:-5%;  width:430px; height:112px; transform:rotate(-1deg);              border-top-width: .8px;   border-top-color: rgba(255,247,185,.16); }
    @media (max-width: 1024px) { .uni-hero .hero-light-wave .wave-line:nth-child(n+6) { display: none; } }
    @media (max-width: 600px) { .uni-hero .hero-light-wave { opacity: .40; } .uni-hero .hero-light-wave .wave-line:nth-child(n+4) { display: none; } }
    .uni-hero .hero-bg-photo::before { content: ''; position: absolute; top: 0; bottom: 0; left: 22%; width: 56%; pointer-events: none; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.16) 52%, rgba(255,255,255,0.18) 62%, rgba(255,255,255,0.08) 80%, rgba(255,255,255,0) 100%); filter: blur(28px); z-index: 2; }
    .uni-hero::before {
        content: ''; position: absolute; inset: 0;
        background-image:
            radial-gradient(circle at 20% 50%, rgba(184,134,11,0.04) 0%, transparent 50%),
            radial-gradient(circle at 80% 30%, rgba(184,134,11,0.03) 0%, transparent 40%);
        pointer-events: none; z-index: 1;
    }
    .uni-hero::after {
        content: ''; position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(184,134,11,0.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(184,134,11,0.015) 1px, transparent 1px);
        background-size: 60px 60px; pointer-events: none; z-index: 1;
    }
    .uni-hero .inner { position: relative; z-index: 2; display: flex; align-items: flex-start; gap: 48px; }
    .uni-hero .uh-text { flex: 1; min-width: 0; }
    .uni-hero .uh-bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(10,15,28,0.4); margin-bottom: 13px; }
    .uni-hero .uh-bc a { color: rgba(10,15,28,0.4); transition: color 0.2s; }
    .uni-hero .uh-bc a:hover { color: #B8860B; }
    .uni-hero .uh-bc span { color: #B8860B; font-weight: 600; }
    .uni-hero .uh-bc i { font-size: 10px; }
    .uni-hero .uh-label { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #B8860B; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
    .uni-hero .uh-label::before { content: ''; width: 24px; height: 1px; background: #B8860B; }
    .uni-hero .uh-text h1 { font-size: 38px; font-weight: 900; color: #171C26; line-height: 1.35; letter-spacing: -1px; margin-bottom: 16px; }
    .uni-hero .uh-text h1 em { font-style: normal; color: #C58B00; }
    .uni-hero .uh-sub { font-size: 16px; color: #565C66; line-height: 1.7; max-width: 480px; }
    .uni-hero .uh-stats { display: flex; gap: 28px; }
    .uni-hero .uh-stat { display: flex; flex-direction: column; gap: 2px; }
    .uni-hero .uh-stat strong { font-size: 22px; font-weight: 800; color: #B8860B; line-height: 1; }
    .uni-hero .uh-stat span { font-size: 11px; color: rgba(10,15,28,0.4); font-weight: 500; }
    .uni-hero .uh-visual { flex-shrink: 0; align-self: center; width: 360px; position: relative; z-index: 2; }
    .uni-hero .uh-photo { display: none; }
    .uni-hero .uh-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .uni-hero .uh-card { display: block; width: 174px; height: 130px; box-sizing: border-box; overflow: hidden; background: rgba(24,28,34,.78); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 22px 18px; transition: all 0.3s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,.10); cursor: pointer; position: relative; z-index: 5; text-decoration: none; color: inherit; }
    .uni-hero .uh-card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.16); }
    .uni-hero .uh-card.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184,134,11,.5), 0 12px 30px rgba(0,0,0,.16); }
    .uni-hero .uh-ci { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,196,0,.15); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
    .uni-hero .uh-ci i { font-size: 15px; color: #FFC400; }

(function(){

var now=new Date(),oneYearAgo=new Date(now.getTime()-365*864e5);
var allItems=DataService.getAll('library').filter(function(i){if(i.category!=='주요뉴스')return true;return i.date&&new Date(i.date)>=oneYearAgo});

var PER=10,curPage=1,curCat='주요뉴스',curSort='date',searchQ='';

var iconMap={hwp:{icon:'fa-file-lines',cls:'hwp'},pdf:{icon:'fa-file-pdf',cls:'pdf'},xlsx:{icon:'fa-file-excel',cls:'xlsx'}};
function getIcon(ft){return iconMap[ft]||{icon:'fa-file',cls:'web'}}
function isNew(d){return d&&(now-new Date(d))<7*864e5}
function isHot(dl){return dl>=200}

function srcBadge(item){
    var t=item.title||'',d=item.description||'';
    if(d.indexOf('[서울시')>=0||t.indexOf('서울시')>=0)return'서울시';
    if(d.indexOf('[국토부')>=0||d.indexOf('[국토교통부')>=0)return'국토교통부';
    if(d.indexOf('[대법원')>=0)return'대법원';
    if(d.indexOf('[LH')>=0)return'LH';
    if(d.indexOf('[경기도')>=0)return'경기도';
    if(d.indexOf('[제주도')>=0)return'제주도';
    if(d.indexOf('[건축규제')>=0)return'건축규제혁신센터';
    if(d.indexOf('[마포구')>=0)return'마포구';
    if(d.indexOf('[한국공인')>=0)return'한국공인회계사회';
    return null}

var catDefs=[
    {key:'주요뉴스',keys:['주요뉴스','칼럼','정책','일반','사례'],icon:'fa-newspaper',label:'주요뉴스'},
    {key:'법령',keys:['법령','법령·조례','관련판례','지침','판례·질의회신'],icon:'fa-scale-balanced',label:'관계법령'},

function getCatCounts(){var c={};catDefs.forEach(function(d){c[d.key]=0});allItems.forEach(function(i){catDefs.forEach(function(d){if(d.keys.indexOf(i.category)>=0)c[d.key]++})});return c}

/* Tabs */
function renderTabs(){
document.querySelectorAll('#heroCards .uh-card').forEach(function(el){el.classList.toggle('on',el.dataset.cat===curCat)});

}

/* Popular section */
/* Filter + Sort */
function getFiltered(){
var items=allItems;
if(curCat!=='전체'){
var curDef=catDefs.find(function(d){return d.key===curCat});var curKeys=curDef?curDef.keys:[curCat];items=items.filter(function(i){return curKeys.indexOf(i.category)>=0});
}
if(searchQ){var q=searchQ.toLowerCase();items=items.filter(function(i){
return(i.title||'').toLowerCase().indexOf(q)>=0||(i.description||'').toLowerCase().indexOf(q)>=0||
(i.tags||[]).some(function(t){return t.toLowerCase().indexOf(q)>=0})})}
items.sort(function(a,b){
if(curSort==='downloads')return(b.downloads||0)-(a.downloads||0);
if(curSort==='title')return(a.title||'').localeCompare(b.title||'');
return(b.date||'').localeCompare(a.date||'')});
return items}

/* 뉴스 로컬 조회수 추적 (정적 사이트 — 브라우저 localStorage 기준) */
function getNewsViews(){try{return JSON.parse(localStorage.getItem('seul_lib_views')||'{}')}catch(e){return{}}}
function addNewsView(id){var v=getNewsViews();v[id]=(v[id]||0)+1;try{localStorage.setItem('seul_lib_views',JSON.stringify(v))}catch(e){}return v[id]}
function newsUrl(item,id){var dateStr=(item.date||'').replace(/-/g,'');var suffix=id.replace(/^news/,'');return'../downloads/news_'+dateStr+(suffix.match(/[a-z]$/)?suffix.slice(-1):'')+'.html'}
function libItemUrl(id){var m=fileMap[id];if(m){if(m.web)return m.web;if(m.ext)return m.ext;}var item=allItems.find(function(x){return x.id===id});if(item&&item.category==='주요뉴스')return newsUrl(item,id);return null;}
function openNewsPopup(id){var url=libItemUrl(id);if(url){addNewsView(id);window.open(url,'_blank','width=920,height=860,scrollbars=yes,resizable=yes');renderFeatured();}else{handleDownload(id);}}

/* 인기 자료 — 카테고리별 (커뮤니티 인기글과 동일 컨셉) */
function renderFeatured(){
  var fb=document.getElementById('libFeatured');if(!fb)return;
  var items=allItems.slice();
  if(curCat!=='전체'){
  var d=catDefs.find(function(x){return x.key===curCat});var ks=d?d.keys:[curCat];items=items.filter(function(i){return ks.indexOf(i.category)>=0});
  }
  var vmap=getNewsViews();
  items.sort(function(a,b){var va=vmap[a.id]||0,vb=vmap[b.id]||0;if(vb!==va)return vb-va;return(a.date||'').localeCompare(b.date||'')});
  var top=items.slice(0,3);
  if(!top.length){fb.style.display='none';return}
  fb.style.display='';
  var nameMap={'주요뉴스':'주요뉴스','법령':'관계법령','서식가이드':'서식 매뉴얼'};
  var title=nameMap[curCat]||'인기 자료';
  var sub='열람순 · 인기순';
  var html='<div class="pop-head"><h3>'+title+'</h3><span>'+sub+'</span></div><div class="pop-grid">';
  top.forEach(function(item,idx){
    var fi=getIcon(item.fileType);var vc=vmap[item.id]||0;
    html+='<div class="pop-card" onclick="handleDownload(\''+item.id+'\')"><div class="pop-icon '+fi.cls+'"><i class="fa-solid '+fi.icon+'"></i></div><div class="pop-body"><div class="pop-title">'+item.title+'</div><div class="pop-info"><span><i class="fa-solid fa-eye"></i> '+vc+'</span><span><i class="fa-solid fa-calendar"></i> '+item.date+'</span></div></div></div>';
  });
  html+='</div>';
  fb.innerHTML=html;
}

/* Render list */
function render(){
renderFeatured();
var items=getFiltered(),total=items.length,pages=Math.ceil(total/PER);
if(curPage>pages)curPage=1;
var start=(curPage-1)*PER,slice=items.slice(start,start+PER);
document.getElementById('resultCount').innerHTML='총 <strong>'+total+'</strong>건';
var list=document.getElementById('libList'),empty=document.getElementById('emptyState');
if(!slice.length){list.innerHTML='';empty.style.display='flex';document.getElementById('pagerWrap').style.display='none';return}
empty.style.display='none';document.getElementById('pagerWrap').style.display='';

list.innerHTML=slice.map(function(item){
var fi=getIcon(item.fileType),src=srcBadge(item);
var badges='<span class="lb lb-cat">'+item.category+'</span>';
if(src)badges+='<span class="lb lb-src">'+src+'</span>';
if(isNew(item.date))badges+='<span class="lb lb-new">NEW</span>';
if(isHot(item.downloads))badges+='<span class="lb lb-hot"><i class="fa-solid fa-fire"></i>인기</span>';
badges+='<span class="lb-date">'+item.date+'</span>';
badges+='<span class="lb-dl"><i class="fa-solid fa-download"></i>'+(item.downloads||0)+'</span>';

var pinCls=isHot(item.downloads)?' pinned':'';
var isWeb=item.fileType==='web';
var ftLabel=item.fileType==='pdf'?'PDF':item.fileType==='hwp'?'HWP':item.fileType==='xlsx'?'XLS':'WEB';
var btnIcon=isWeb?'fa-newspaper':'fa-arrow-down';
var btnText=isWeb?'뉴스보기':ftLabel+' 다운로드';

return'<div class="lib-item'+pinCls+'">'+'<div class="lib-icon '+fi.cls+'"><i class="fa-solid '+fi.icon+'"></i><span class="ft-label">'+(isWeb?'NEWS':ftLabel)+'</span></div>'+'<div class="lib-content">'+'    <div class="lib-title" data-id="'+item.id+'">'+item.title+'</div>'+'    <div class="lib-desc">'+item.description+'</div>'+'    <div class="lib-meta-row">'+badges+'</div>'+'</div>'+'<div class="lib-action">'+'    <span class="lib-size">'+item.fileSize+'</span>'+'    <button class="btn-dl" data-id="'+item.id+'"><i class="fa-solid '+btnIcon+'"></i> '+btnText+'</button>'+'</div></div>'}).join('');

/* Pager */
var pg=document.getElementById('pager');
if(pages<=1){pg.innerHTML='';return}
var blk=10,bStart=Math.floor((curPage-1)/blk)*blk+1,bEnd=Math.min(bStart+blk-1,pages);
var bPrev=Math.max(1,bStart-blk),bNext=bEnd+1;
var h='<button class="arr" '+(bStart===1?'disabled':'')+' onclick="LIB.page('+bPrev+')"><i class="fa-solid fa-chevron-left"></i></button>';
for(var i=bStart;i<=bEnd;i++)h+='<button'+(i===curPage?' class="active"':'')+' onclick="LIB.page('+i+')">'+i+'</button>';
h+='<button class="arr" '+(bEnd===pages?'disabled':'')+' onclick="LIB.page('+bNext+')"><i class="fa-solid fa-chevron-right"></i></button>';
pg.innerHTML=h}

if(urlCat&&validCats.indexOf(urlCat)>=0){curCat=urlCat}

/* 상단 카테고리 메뉴바 스크롤 고정 — portfolio.html 상단 키맵 메뉴와 동일 방식 (position:fixed 전환) */
(function(){
var ctrlWrap=document.getElementById('ctrlBarWrap'),ctrlPh=document.getElementById('ctrlBarPlaceholder');
if(!ctrlWrap||!ctrlPh)return;
var naturalTop=0,leftPx=0,widthPx=0,ticking=false;
function headerHeight(){var hw=document.querySelector('.header-wrap');return hw?hw.offsetHeight:0}
function measure(){
var wasStuck=ctrlWrap.classList.contains('lib-stuck');
if(wasStuck){ctrlWrap.classList.remove('lib-stuck');ctrlWrap.style.top='';ctrlWrap.style.left='';ctrlWrap.style.width='';ctrlPh.style.display='none'}
var rect=ctrlWrap.getBoundingClientRect();
naturalTop=rect.top+window.scrollY;leftPx=rect.left;widthPx=rect.width;
if(wasStuck)apply(true);
}
function apply(force){
var stick=force||window.scrollY>=naturalTop-headerHeight();
if(stick&&!ctrlWrap.classList.contains('lib-stuck')){
ctrlPh.style.height=ctrlWrap.offsetHeight+'px';
ctrlPh.style.marginBottom=getComputedStyle(ctrlWrap).marginBottom;
ctrlPh.style.display='block';
ctrlWrap.classList.add('lib-stuck');
ctrlWrap.style.top=headerHeight()+'px';
ctrlWrap.style.left=leftPx+'px';
ctrlWrap.style.width=widthPx+'px';
}else if(!stick&&ctrlWrap.classList.contains('lib-stuck')){
ctrlWrap.classList.remove('lib-stuck');
ctrlWrap.style.top='';ctrlWrap.style.left='';ctrlWrap.style.width='';
ctrlPh.style.display='none';
}else if(stick){
ctrlWrap.style.top=headerHeight()+'px';
ctrlWrap.style.left=leftPx+'px';
ctrlWrap.style.width=widthPx+'px';
}
}
function onScroll(){if(ticking)return;ticking=true;requestAnimationFrame(function(){apply(false);ticking=false})}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){measure();apply(false)});
document.addEventListener('DOMContentLoaded',function(){measure();apply(false)});
window.addEventListener('load',function(){measure();apply(false)});
measure();apply(false);
})();

function handleDownload(id){
addNewsView(id);
var item=allItems.find(function(i){return i.id===id});
var m=fileMap[id];
if(m&&m.web){
NewsDetailModal.open(m.web,{category:item?item.category:'',title:item?item.title:''});
if(item)item.downloads=(item.downloads||0)+1;render();return}
if(!m){
if(item&&item.category==='주요뉴스'){var dateStr=(item.date||'').replace(/-/g,'');var suffix=id.replace(/^news/,'');var tryUrl='../downloads/news_'+dateStr+(suffix.match(/[a-z]$/)?suffix.slice(-1):'')+'.html';NewsDetailModal.open(tryUrl,{category:item.category,title:item.title});item.downloads=(item.downloads||0)+1;render();return}
if(item&&item.category==='칼럼'){var dateStr=(item.date||'').replace(/-/g,'').substring(0,8);var suffix=id.replace(/^col/,'');var tryUrl='../downloads/col_'+dateStr+(suffix.match(/[a-z]$/)?suffix.slice(-1):'')+'.html';location.href=tryUrl;return}
App.toast('파일 준비 중입니다.','정보');return}
if(m.ext){var a=document.createElement('a');a.href=m.ext;a.download=m.ext.split('/').pop();document.body.appendChild(a);a.click();document.body.removeChild(a);App.toast('파일 다운로드 시작','success')}
else if(m.gov){window.open(m.gov,'_blank');App.toast((m.label||'공식 사이트')+'로 이동합니다','info')}
if(item){item.downloads=(item.downloads||0)+1}render()}

window.handleDownload=handleDownload;window.openNewsPopup=openNewsPopup;
window.LIB={page:function(n){curPage=n;render();window.scrollTo({top:document.querySelector('.ctrl-bar').offsetTop-80,behavior:'smooth'})}};

renderTabs();render();
var urlId=new URLSearchParams(location.search).get('id');
if(urlId){handleDownload(urlId)}
})();
