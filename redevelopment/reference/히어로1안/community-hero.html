<style>
/* === Unified Hero (about-hero 기준) === */
.uni-hero {
    background: linear-gradient(160deg, #FFFFFF 0%, #FFF3C4 50%, #FFFFFF 100%);
    position: relative; overflow: hidden; padding: 72px 0 64px;
}
.uni-hero::before {
    content: ''; position: absolute; inset: 0;
    background-image:
        radial-gradient(circle at 20% 50%, rgba(184,134,11,0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 30%, rgba(184,134,11,0.03) 0%, transparent 40%);
    pointer-events: none;
}
.uni-hero::after {
    content: ''; position: absolute; inset: 0;
    background-image:
        linear-gradient(rgba(184,134,11,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(184,134,11,0.015) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none;
}
.uni-hero .inner { position: relative; z-index: 1; display: flex; align-items: center; gap: 56px; }
.uni-hero .uh-text { flex: 1; min-width: 0; }

.uni-hero .uh-bc a { color: rgba(10,15,28,0.4); transition: color 0.2s; }
.uni-hero .uh-bc a:hover { color: #B8860B; }
.uni-hero .uh-bc span { color: #B8860B; font-weight: 600; }
.uni-hero .uh-bc i { font-size: 10px; }
.uni-hero .uh-label { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: #B8860B; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
.uni-hero .uh-label::before { content: ''; width: 24px; height: 1px; background: #B8860B; }
.uni-hero .uh-text h1 { font-size: 36px; font-weight: 900; color: #0A0F1C; line-height: 1.35; letter-spacing: -1px; margin-bottom: 14px; }

.uni-hero .uh-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; flex-shrink: 0; width: 380px; }

.uni-hero .uh-ci i { font-size: 14px; color: #B8860B; }
.uni-hero .uh-card h4 { font-size: 13.5px; font-weight: 700; color: #0A0F1C; margin-bottom: 3px; }
.uni-hero .uh-card p { font-size: 11px; color: rgba(10,15,28,0.4); line-height: 1.5; }
@media (max-width: 1024px) { .uni-hero .inner { flex-direction: column; gap: 36px; } .uni-hero .uh-cards { width: 100%; max-width: 400px; } }
@media (max-width: 600px) { .uni-hero { padding: 52px 0 44px; } .uni-hero .uh-text h1 { font-size: 26px; } .uni-hero .uh-sub { font-size: 13px; } .uni-hero .uh-cards { grid-template-columns: 1fr; width: 100%; } }
</style>
