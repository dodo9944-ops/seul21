            </div>
            <div class="admin-topbar-right">

            </div>
        </div>

        <div class="admin-content">
            <!-- Table Header -->
            <div class="admin-table-header">
                <h3>일정 목록</h3>
                <div class="admin-table-actions">
                    <div class="admin-search">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="일정명 검색...">
                    </div>
                    <button class="btn btn-accent btn-sm" id="btnNew"><i class="fa-solid fa-plus"></i> 신규 등록</button>
                </div>
            </div>

            <!-- Table -->
            <div class="admin-tbl-wrap">

                            <th>관련 구역</th>

            <!-- Form Panel -->
            <div class="admin-form-panel" id="formPanel" style="display:none; margin-top:24px;">
                <h3 id="formTitle">일정 등록</h3>
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">일정명 *</label>
                        <input type="text" id="fTitle" class="form-control" placeholder="예: 한남3구역 조합원 총회">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">날짜 *</label>
                        <input type="date" id="fDate" class="form-control">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">관련 구역</label>
                        <input type="text" id="fArea" class="form-control" placeholder="예: 한남3구역">
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">설명</label>
                    <textarea id="fDescription" class="form-control" rows="3" placeholder="일정 설명을 입력하세요" style="width:100%;resize:vertical;"></textarea>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-outline btn-sm" id="btnCancel">취소</button>
                    <button class="btn btn-accent btn-sm" id="btnSave"><i class="fa-solid fa-check"></i> 저장</button>
                </div>

<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260902s"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    AdminGuard.watchForm('#formPanel');

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    function render(keyword='') {
        const items = DataService.getAll('schedule');
        const filtered = keyword ? items.filter(s => s.title.includes(keyword)) : items;
        // Sort by date ascending
        filtered.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = filtered.map(s => {
            const today = new Date().toISOString().slice(0, 10);
            const isPast = s.date < today;
            const isToday = s.date === today;
            const dateClass = isToday ? 'status-active' : isPast ? 'status-inactive' : 'status-completed';
            const dateLabel = isToday ? '오늘' : isPast ? '지남' : '예정';
            return `
            <tr>
                <td>${s.id}</td>
                <td class="name">${s.title}</td>
                <td>${s.date} <span class="status ${dateClass}">${dateLabel}</span></td>
                <td>${s.area || '-'}</td>
                <td>${s.description || '-'}</td>
                <td class="actions">
                    <button title="수정" onclick="editItem('${s.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="danger" title="삭제" onclick="deleteItem('${s.id}','${s.title}')"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>`;
        }).join('');
    }

    window.deleteItem = function(id, name) {
        if (!confirm(`"${name}" 일정을 삭제하시겠습니까?`)) return;
        DataService.remove('schedule', id);
        render(document.getElementById('searchInput').value);
        toast('삭제되었습니다.', 'success');
    };

    window.editItem = function(id) {
        const s = DataService.getById('schedule', id);
        if (!s) return;
        document.getElementById('formTitle').textContent = '일정 수정';
        document.getElementById('editId').value = id;
        document.getElementById('fTitle').value = s.title || '';
        document.getElementById('fDate').value = s.date || '';
        document.getElementById('fArea').value = s.area || '';
        document.getElementById('fDescription').value = s.description || '';
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('btnNew').addEventListener('click', () => {
        document.getElementById('formTitle').textContent = '일정 등록';
        document.getElementById('editId').value = '';
        document.getElementById('fTitle').value = '';
        document.getElementById('fDate').value = '';
        document.getElementById('fArea').value = '';
        document.getElementById('fDescription').value = '';
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('formPanel').style.display = 'none';
    });

    document.getElementById('btnSave').addEventListener('click', () => {
        const title = document.getElementById('fTitle').value.trim();
        const date = document.getElementById('fDate').value;
        if (!title) { toast('일정명을 입력하세요.', 'error'); return; }
        if (!date) { toast('날짜를 선택하세요.', 'error'); return; }
        const data = {
            title,
            date,
            area: document.getElementById('fArea').value.trim(),
            description: document.getElementById('fDescription').value.trim()
        };
        const editId = document.getElementById('editId').value;
        if (editId) {
            DataService.update('schedule', editId, data);
            toast('일정이 수정되었습니다.', 'success');
        } else {
            data.id = DataService._genId('s');
            DataService.create('schedule', data);
            toast('일정이 등록되었습니다.', 'success');
        }
        AdminGuard.markClean();
        document.getElementById('formPanel').style.display = 'none';
        render(document.getElementById('searchInput').value);
    });

    document.getElementById('searchInput').addEventListener('input', function() {
        render(this.value.trim());
    });

    render();
})();
</script>
</body>
