        <nav class="admin-nav">

            <div class="admin-nav-group">

            </div>

                <div class="admin-nav-group-title">알림 서비스</div>

            </div>
            <div class="admin-nav-group">
                <div class="admin-nav-group-title">사이트 관리</div>
                <a href="banners.html"><i class="fa-solid fa-images"></i> 배너 관리</a>
                <a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> 일정 관리</a>

            </div>
            <div class="admin-nav-group">
                <div class="admin-nav-group-title">설정</div>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> 사이트 설정</a>

            <a href="../index.html" target="_blank"><i class="fa-solid fa-external-link-alt"></i> 사이트 보기</a>
        </div>
    </aside>
    <div class="admin-sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-main">
        <div class="admin-topbar">
            <div class="admin-topbar-left">
                <button class="admin-mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
                <h2>뉴스 관리</h2>
            </div>
            <div class="admin-topbar-right">
                <div class="admin-user"><span>안녕하세요, <strong id="adminName"></strong>님</span></div>
                <button class="btn btn-sm btn-outline" id="adminLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
            </div>
        </div>

        <div class="admin-content">
            <!-- Table Header -->
            <div class="admin-table-header">
                <h3>뉴스 목록</h3>
                <div class="admin-table-actions">
                    <div class="admin-search">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="제목 검색...">
                    </div>
                    <button class="btn btn-accent btn-sm" id="btnNew"><i class="fa-solid fa-plus"></i> 신규 등록</button>
                </div>
            </div>

            <!-- Table -->
            <div class="admin-tbl-wrap">
                <table class="admin-tbl">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>제목</th>
                            <th>카테고리</th>
                            <th>작성자</th>
                            <th>날짜</th>
                            <th>조회수</th>
                            <th>Featured</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Form Panel -->
            <div class="admin-form-panel" id="formPanel" style="display:none; margin-top:24px;">
                <h3 id="formTitle">뉴스 등록</h3>
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">제목 *</label>
                        <input type="text" id="fTitle" class="form-control" placeholder="뉴스 제목을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">카테고리 *</label>
                        <select id="fCategory" class="form-control">
                            <option value="정책">정책</option>
                            <option value="시장분석">시장분석</option>
                            <option value="분석">분석</option>
                            <option value="개발호재">개발호재</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">작성자 *</label>
                        <input type="text" id="fAuthor" class="form-control" placeholder="예: 김기자">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">태그 (쉼표 구분)</label>
                        <input type="text" id="fTags" class="form-control" placeholder="예: 정비사업,특별법">
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">요약</label>
                    <textarea id="fSummary" class="form-control" rows="2" placeholder="뉴스 요약을 입력하세요" style="width:100%;resize:vertical;"></textarea>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">본문 *</label>
                    <textarea id="fContent" class="form-control" rows="8" placeholder="뉴스 본문을 입력하세요" style="width:100%;resize:vertical;"></textarea>
                </div>
                <div class="form-group" style="margin-top:12px;">
                    <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray-700);cursor:pointer;">
                        <input type="checkbox" id="fFeatured"> Featured (메인 노출)
                    </label>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-outline btn-sm" id="btnCancel">취소</button>
                    <button class="btn btn-accent btn-sm" id="btnSave"><i class="fa-solid fa-check"></i> 저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js"></script>
<script src="../assets/js/data-service.js"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    const categoryMap = {
        '정책': 'status-active',
        '시장분석': 'status-pending',
        '분석': 'status-completed',
        '개발호재': 'status-inactive'
    };

    function render(keyword='') {
        const items = DataService.getAll('news');
        const filtered = keyword ? items.filter(a => a.title.includes(keyword)) : items;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = filtered.map(a => `
            <tr>
                <td>${a.id}</td>
                <td class="name">${a.title}</td>
                <td><span class="status ${categoryMap[a.category]||'status-inactive'}">${a.category}</span></td>
                <td>${a.author}</td>
                <td>${a.date}</td>
                <td>${(a.views||0).toLocaleString()}</td>
                <td>
                    <label class="toggle">
                        <input type="checkbox" ${a.featured?'checked':''} onchange="toggleFeatured('${a.id}', this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </td>
                <td class="actions">
                    <button title="수정" onclick="editItem('${a.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="danger" title="삭제" onclick="deleteItem('${a.id}','${a.title.replace(/'/g,"\\'")}')"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.toggleFeatured = function(id, val) {
        DataService.update('news', id, { featured: val });
        toast(val ? '메인 노출 활성화' : '메인 노출 비활성화', 'success');
    };

    window.deleteItem = function(id, title) {
        if (!confirm(`"${title}" 뉴스를 삭제하시겠습니까?`)) return;
        DataService.remove('news', id);
        render(document.getElementById('searchInput').value);
        toast('삭제되었습니다.', 'success');
    };

    window.editItem = function(id) {
        const a = DataService.getById('news', id);
        if (!a) return;
        document.getElementById('formTitle').textContent = '뉴스 수정';
        document.getElementById('editId').value = id;
        document.getElementById('fTitle').value = a.title || '';
        document.getElementById('fCategory').value = a.category || '정책';
        document.getElementById('fAuthor').value = a.author || '';
        document.getElementById('fTags').value = (a.tags||[]).join(',');
        document.getElementById('fSummary').value = a.summary || '';
        document.getElementById('fContent').value = a.content || '';
        document.getElementById('fFeatured').checked = !!a.featured;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('btnNew').addEventListener('click', () => {
        document.getElementById('formTitle').textContent = '뉴스 등록';
        document.getElementById('editId').value = '';
        document.querySelectorAll('#formPanel input:not([type=hidden]):not([type=checkbox]), #formPanel textarea').forEach(el => el.value = '');
        document.querySelectorAll('#formPanel select').forEach(el => el.selectedIndex = 0);
        document.getElementById('fFeatured').checked = false;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('formPanel').style.display = 'none';
    });

    document.getElementById('btnSave').addEventListener('click', () => {
        const title = document.getElementById('fTitle').value.trim();
        const content = document.getElementById('fContent').value.trim();
        if (!title) { toast('제목을 입력하세요.', 'error'); return; }
        if (!content) { toast('본문을 입력하세요.', 'error'); return; }
        const data = {
            title,
            category: document.getElementById('fCategory').value,
            author: document.getElementById('fAuthor').value.trim(),
            summary: document.getElementById('fSummary').value.trim(),
            content,
            tags: document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
            featured: document.getElementById('fFeatured').checked
        };
        const editId = document.getElementById('editId').value;
        if (editId) {
            DataService.update('news', editId, data);
            toast('뉴스가 수정되었습니다.', 'success');
        } else {
            data.id = DataService._genId('n');
            data.date = new Date().toISOString().slice(0,10);
            data.views = 0;
            data.image = '';
            DataService.create('news', data);
            toast('뉴스가 등록되었습니다.', 'success');
        }
        document.getElementById('formPanel').style.display = 'none';
        render(document.getElementById('searchInput').value);
    });

    document.getElementById('searchInput').addEventListener('input', function() {
        render(this.value.trim());
    });

    render();
})();
</script>
</body>
</html>
