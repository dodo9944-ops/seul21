    <div class="admin-main">

                <h2>자료실 관리</h2>

            <div class="admin-topbar-right">
                <div class="admin-user"><span>안녕하세요, <strong id="adminName"></strong>님</span></div>
                <button class="btn btn-sm btn-outline" id="adminLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
            </div>
        </div>

        <div class="admin-content">
            <!-- Table Header -->
            <div class="admin-table-header">
                <h3>자료실 전체 목록</h3>
                <div class="admin-table-actions">
                    <div class="admin-search">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="제목 검색...">
                    </div>
                    <button class="btn btn-accent btn-sm" id="btnNew"><i class="fa-solid fa-plus"></i> 신규 등록</button>
                </div>
            </div>

            <!-- Table -->
            <div class="admin-tbl-wrap">
                <table class="admin-tbl">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>제목</th>
                            <th>카테고리</th>
                            <th>유형</th>
                            <th>날짜</th>
                            <th>다운로드</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Form Panel -->
            <div class="admin-form-panel" id="formPanel" style="display:none; margin-top:24px;">
                <h3 id="formTitle">자료 수정</h3>
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">제목 *</label>
                        <input type="text" id="fTitle" class="form-control" placeholder="자료 제목">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">카테고리 *</label>
                        <select id="fCategory" class="form-control">
                            <option value="주요뉴스">주요뉴스</option>
                            <option value="법령">법령</option>
                            <option value="법령·조례">법령·조례</option>
                            <option value="관련판례">관련판례</option>
                            <option value="지침">지침</option>
                            <option value="판례·질의회신">판례·질의회신</option>
                            <option value="서식">서식</option>
                            <option value="가이드">가이드</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">파일유형</label>
                        <select id="fFileType" class="form-control">
                            <option value="pdf">PDF</option>
                            <option value="web">웹문서</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">날짜</label>
                        <input type="date" id="fDate" class="form-control">
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">태그 (쉼표 구분)</label>
                        <input type="text" id="fTags" class="form-control" placeholder="예: 정비사업,법령,2026">
                    </div>
                </div>
                <div style="margin-top:16px;padding:16px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;">
                    <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--gray-900);margin-bottom:8px;"><i class="fa-solid fa-paperclip" style="color:var(--accent)"></i> 첨부파일</label>
                    <div id="currentFile" style="font-size:12px;color:var(--gray-600);margin-bottom:10px;padding:8px 12px;background:var(--white);border-radius:6px;border:1px solid var(--gray-200);"></div>
                    <input type="file" id="fFile" accept=".pdf,.hwp,.docx,.xlsx,.zip,.jpg,.png" style="font-size:12px;width:100%;margin-bottom:6px;">
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button type="button" class="btn btn-outline btn-xs" onclick="clearFile()" style="font-size:11px;"><i class="fa-solid fa-xmark"></i> 파일 초기화</button>
                        <span style="font-size:10px;color:var(--gray-400);">PDF, HWP, DOCX, XLSX, ZIP, JPG, PNG (최대 10MB)</span>
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">설명</label>
                    <textarea id="fContent" class="form-control" rows="3" placeholder="자료 설명을 입력하세요" style="width:100%;resize:vertical;"></textarea>
                </div>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-outline btn-sm" id="btnCancel">취소</button>
                    <button class="btn btn-accent btn-sm" id="btnSave"><i class="fa-solid fa-check"></i> 저장</button>
                </div>
            </div>

<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260724c"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    AdminGuard.watchForm('#formPanel');

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    const categoryMap = {
        '주요뉴스': 'status-active',
        '법령': 'status-completed', '법령·조례': 'status-completed',
        '관련판례': 'status-pending', '지침': 'status-pending', '판례·질의회신': 'status-pending',
        '서식': 'status-inactive', '가이드': 'status-inactive'
    };

    // MOCK.library 데이터 사용 (실제 자료실 데이터)
    var libItems = (typeof MOCK !== 'undefined' && MOCK.library) ? MOCK.library : [];
    var statEl = document.getElementById('searchInput');
    if(statEl) statEl.placeholder = '자료 제목 검색... (총 ' + libItems.length + '건)';

    function render(keyword='') {
        var items = libItems.slice();
        if (keyword) items = items.filter(a => (a.title||'').includes(keyword));
        items.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = items.map(a => `
            <tr>
                <td style="font-size:11px;color:var(--gray-400)">${a.id}</td>
                <td class="name" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.title}</td>
                <td><span class="status ${categoryMap[a.category]||'status-inactive'}">${a.category}</span></td>
                <td style="font-size:11px">${a.fileType||''}</td>
                <td style="font-size:11px">${a.date||''}</td>
                <td style="font-size:11px">${a.downloads||0}</td>
                <td class="actions">
                    <button title="수정" onclick="editLib('${a.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button title="보기" onclick="viewLib('${a.id}')"><i class="fa-solid fa-eye"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.viewLib = function(id) {
        var item = libItems.find(function(x){return x.id===id});
        if(!item) return;
        alert('ID: ' + item.id + '\n제목: ' + item.title + '\n카테고리: ' + item.category + '\n유형: ' + (item.fileType||'') + '\n날짜: ' + item.date + '\n다운로드: ' + (item.downloads||0) + '\n태그: ' + (item.tags||[]).join(', ') + '\n\n설명:\n' + (item.description||''));
    };

    window.editLib = function(id) {
        var item = libItems.find(function(x){return x.id===id});
        if(!item) return;
        document.getElementById('editId').value = id;
        document.getElementById('fTitle').value = item.title || '';
        document.getElementById('fCategory').value = item.category || '주요뉴스';
        document.getElementById('fFileType').value = item.fileType || 'pdf';
        document.getElementById('fDate').value = item.date || '';
        document.getElementById('fTags').value = (item.tags||[]).join(', ');
        document.getElementById('fContent').value = item.description || '';
        // 현재 첨부파일 표시
        var curFile = item.fileSize ? (item.fileType==='pdf' ? 'PDF 파일 ('+item.fileSize+')' : '웹문서') : '파일 없음';
        document.getElementById('currentFile').innerHTML = '<i class="fa-solid fa-paperclip"></i> 현재: <strong>' + curFile + '</strong>';
        document.getElementById('fFile').value = '';
        document.getElementById('formTitle').textContent = '자료 수정 — ' + id;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({behavior:'smooth'});
    };

    window.toggleFeatured = function(id, val) {
        toast(val ? '메인 노출 활성화' : '메인 노출 비활성화', 'success');
    };

    window.clearFile = function(){ document.getElementById('fFile').value=''; document.getElementById('currentFile').textContent='파일 없음'; };

    document.getElementById('btnNew').addEventListener('click', () => {
        document.getElementById('formTitle').textContent = '자료 신규 등록';
        document.getElementById('editId').value = '';
        document.querySelectorAll('#formPanel input:not([type=hidden]), #formPanel textarea').forEach(el => el.value = '');
        document.querySelectorAll('#formPanel select').forEach(el => el.selectedIndex = 0);
        document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
        document.getElementById('currentFile').textContent = '파일 없음';
        document.getElementById('fFile').value = '';
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('formPanel').style.display = 'none';
    });

    document.getElementById('btnSave').addEventListener('click', () => {
        var title = document.getElementById('fTitle').value.trim();
        if (!title) { toast('제목을 입력하세요.', 'error'); return; }
        var editId = document.getElementById('editId').value;
        var cat = document.getElementById('fCategory').value;
        var ft = document.getElementById('fFileType').value;
        var dt = document.getElementById('fDate').value;
        var tags = document.getElementById('fTags').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
        var desc = document.getElementById('fContent').value.trim();
        var fileInput = document.getElementById('fFile');
        var newFile = fileInput.files && fileInput.files[0];

        var saveBtn = document.getElementById('btnSave');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...';
        var fSize = newFile ? (newFile.size/1024).toFixed(0)+'KB' : '';

        var itemData = { id: editId || ('lib_'+Date.now().toString(36)), title:title, category:cat, fileType:ft, date:dt, tags:tags, description:desc, fileSize: fSize || '', downloads:0 };
        var apiAction = editId ? 'update' : 'add';

        // 로컬 즉시 반영
        if (editId) {
            var idx = libItems.findIndex(function(x){return x.id===editId});
            if (idx>=0) { Object.assign(libItems[idx], {title:title,category:cat,fileType:ft,date:dt,tags:tags,description:desc}); if(fSize) libItems[idx].fileSize=fSize; }
        } else {
            libItems.unshift(itemData);
        }

        // API로 GitHub에 영구 저장 + 라이브 배포
        fetch('/api/library', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:apiAction, item:itemData})
        }).then(function(r){return r.json()}).then(function(d){
            saveBtn.disabled=false;
            saveBtn.innerHTML='<i class="fa-solid fa-check"></i> 저장';
            AdminGuard.markClean();
            if(d.ok){
                toast(apiAction==='add'?'자료가 등록되어 라이브에 반영되었습니다.':'자료가 수정되어 라이브에 반영되었습니다.','success');
            } else {
                toast('로컬 반영 완료. 라이브 반영 실패: '+(d.error||''), 'error');
            }
        }).catch(function(e){
            saveBtn.disabled=false;
            saveBtn.innerHTML='<i class="fa-solid fa-check"></i> 저장';
            toast('로컬 반영 완료. 서버 연결 실패.', 'error');
        });

        document.getElementById('formPanel').style.display = 'none';
        render(document.getElementById('searchInput').value);
    });

    document.getElementById('searchInput').addEventListener('input', function() {
        render(this.value.trim());
    });

    render();
})();
</script>
</body>
