    <div class="admin-main">

                <button class="admin-mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
                <h2>배너 관리</h2>
            </div>
            <div class="admin-topbar-right">
                <div class="admin-user"><span>안녕하세요, <strong id="adminName"></strong>님</span></div>
                <button class="btn btn-sm btn-outline" id="adminLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
            </div>
        </div>

        <div class="admin-content">
            <!-- Table Header -->
            <div class="admin-table-header">
                <h3>배너 목록</h3>
                <div class="admin-table-actions">
                    <button class="btn btn-accent btn-sm" id="btnNew"><i class="fa-solid fa-plus"></i> 신규 등록</button>
                </div>
            </div>

            <!-- Table -->
            <div class="admin-tbl-wrap">
                <table class="admin-tbl">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>제목</th>
                            <th>부제</th>
                            <th>유형</th>
                            <th>순서</th>
                            <th>활성</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Form Panel -->
            <div class="admin-form-panel" id="formPanel" style="display:none; margin-top:24px;">
                <h3 id="formTitle">배너 등록</h3>
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">제목 *</label>
                        <input type="text" id="fTitle" class="form-control" placeholder="배너 제목">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">부제</label>
                        <input type="text" id="fSubtitle" class="form-control" placeholder="배너 부제목">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">링크 URL</label>
                        <input type="text" id="fLink" class="form-control" placeholder="/pages/example.html">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">유형 *</label>
                        <select id="fType" class="form-control">
                            <option value="hero">Hero (메인)</option>
                            <option value="side">Side (사이드)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">순서</label>
                        <input type="number" id="fOrder" class="form-control" placeholder="1" min="1">
                    </div>
                    <div class="form-group" style="display:flex;align-items:flex-end;">
                        <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray-700);cursor:pointer;">
                            <input type="checkbox" id="fActive" checked> 활성화
                        </label>
                    </div>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-outline btn-sm" id="btnCancel">취소</button>
                    <button class="btn btn-accent btn-sm" id="btnSave"><i class="fa-solid fa-check"></i> 저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260820a"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    AdminGuard.watchForm('#formPanel');

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    function render() {
        const items = DataService.getAll('banners');
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = items.map(b => `
            <tr>
                <td>${b.id}</td>
                <td class="name">${b.title}</td>
                <td>${b.subtitle || '-'}</td>
                <td><span class="status ${b.type==='hero'?'status-active':'status-pending'}">${b.type==='hero'?'Hero':'Side'}</span></td>
                <td>
                    <input type="number" value="${b.order||1}" min="1" style="width:60px;padding:4px 8px;border:1px solid var(--gray-300);border-radius:6px;text-align:center;"
                        onchange="changeOrder('${b.id}', this.value)">
                </td>
                <td>
                    <label class="toggle">
                        <input type="checkbox" ${b.active?'checked':''} onchange="toggleActive('${b.id}', this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </td>
                <td class="actions">
                    <button title="수정" onclick="editItem('${b.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="danger" title="삭제" onclick="deleteItem('${b.id}','${b.title}')"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.changeOrder = function(id, val) {
        DataService.update('banners', id, { order: Number(val) });
        toast('순서가 변경되었습니다.', 'success');
    };

    window.toggleActive = function(id, val) {
        DataService.update('banners', id, { active: val });
        toast(val ? '배너 활성화' : '배너 비활성화', 'success');
    };

    window.deleteItem = function(id, name) {
        if (!confirm(`"${name}" 배너를 삭제하시겠습니까?`)) return;
        DataService.remove('banners', id);
        render();
        toast('삭제되었습니다.', 'success');
    };

    window.editItem = function(id) {
        const b = DataService.getById('banners', id);
        if (!b) return;
        document.getElementById('formTitle').textContent = '배너 수정';
        document.getElementById('editId').value = id;
        document.getElementById('fTitle').value = b.title || '';
        document.getElementById('fSubtitle').value = b.subtitle || '';
        document.getElementById('fLink').value = b.link || '';
        document.getElementById('fType').value = b.type || 'hero';
        document.getElementById('fOrder').value = b.order || 1;
        document.getElementById('fActive').checked = b.active !== false;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('btnNew').addEventListener('click', () => {
        document.getElementById('formTitle').textContent = '배너 등록';
        document.getElementById('editId').value = '';
        document.getElementById('fTitle').value = '';
        document.getElementById('fSubtitle').value = '';
        document.getElementById('fLink').value = '';
        document.getElementById('fType').selectedIndex = 0;
        document.getElementById('fOrder').value = '';
        document.getElementById('fActive').checked = true;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('formPanel').style.display = 'none';
    });

    document.getElementById('btnSave').addEventListener('click', () => {
        const title = document.getElementById('fTitle').value.trim();
        if (!title) { toast('제목을 입력하세요.', 'error'); return; }
        const data = {
            title,
            subtitle: document.getElementById('fSubtitle').value.trim(),
            link: document.getElementById('fLink').value.trim(),
            type: document.getElementById('fType').value,
            order: Number(document.getElementById('fOrder').value) || 1,
            active: document.getElementById('fActive').checked
        };
        const editId = document.getElementById('editId').value;
        if (editId) {
            DataService.update('banners', editId, data);
            toast('배너가 수정되었습니다.', 'success');
        } else {
            data.id = DataService._genId('b');
            DataService.create('banners', data);
            toast('배너가 등록되었습니다.', 'success');
        }
        AdminGuard.markClean();
        document.getElementById('formPanel').style.display = 'none';
        render();
    });

    render();
})();
</script>
</body>
</html>
