<body>

        </div>
        <nav class="admin-nav">

                <div class="admin-nav-group-title">대시보드</div>
                <a href="index.html"><i class="fa-solid fa-gauge-high"></i> 대시보드</a>

            </div>
            <div class="admin-nav-group">

                <a href="members.html"><i class="fa-solid fa-users"></i> 회원 관리</a>

                <a href="settings.html"><i class="fa-solid fa-gear"></i> 사이트 설정</a>
                <a href="seo.html"><i class="fa-solid fa-magnifying-glass-chart"></i> SEO 관리</a>

            <a href="../index.html" target="_blank"><i class="fa-solid fa-external-link-alt"></i> 사이트 보기</a>
        </div>
    </aside>
    <div class="admin-sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-main">
        <div class="admin-topbar">
            <div class="admin-topbar-left">
                <button class="admin-mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
                <h2>매물 관리</h2>
            </div>
            <div class="admin-topbar-right">
                <div class="admin-user"><span>안녕하세요, <strong id="adminName"></strong>님</span></div>
                <button class="btn btn-sm btn-outline" id="adminLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
            </div>
        </div>

        <div class="admin-content">
            <!-- Table Header -->
            <div class="admin-table-header">
                <h3>매물 목록</h3>
                <div class="admin-table-actions">
                    <div class="admin-search">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="매물명 검색...">
                    </div>
                    <button class="btn btn-accent btn-sm" id="btnNew"><i class="fa-solid fa-plus"></i> 신규 등록</button>
                </div>
            </div>

            <!-- Table -->
            <div class="admin-tbl-wrap">
                <table class="admin-tbl">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>매물명</th>
                            <th>유형</th>
                            <th>지역</th>
                            <th>가격</th>
                            <th>상태</th>
                            <th>Featured</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Form Panel -->
            <div class="admin-form-panel" id="formPanel" style="display:none; margin-top:24px;">
                <h3 id="formTitle">매물 등록</h3>
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">구역 *</label>
                        <select id="fAreaId" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">유형 *</label>
                        <select id="fType" class="form-control">
                            <option value="입주권">입주권</option>
                            <option value="분양권">분양권</option>
                            <option value="토지">토지</option>
                            <option value="매매">매매</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">지역</label>
                        <input type="text" id="fDistrict" class="form-control" placeholder="예: 용산구">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">가격 (만원)</label>
                        <input type="number" id="fPrice" class="form-control" placeholder="예: 125000">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">가격 표시 *</label>
                        <input type="text" id="fPriceText" class="form-control" placeholder="예: 12억 5,000만">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">면적 (㎡)</label>
                        <input type="number" id="fSize" class="form-control" placeholder="예: 84">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">면적 유형</label>
                        <input type="text" id="fSizeType" class="form-control" placeholder="예: 전용 84㎡">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">프리미엄 (만원)</label>
                        <input type="number" id="fPremium" class="form-control" placeholder="예: 58000">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">태그 (쉼표 구분)</label>
                        <input type="text" id="fTags" class="form-control" placeholder="예: 관리처분인가,한강뷰">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">상태 *</label>
                        <select id="fStatus" class="form-control">
                            <option value="매물">매물</option>
                            <option value="거래완료">거래완료</option>
                            <option value="비공개">비공개</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">설명</label>
                    <textarea id="fDescription" class="form-control" rows="3" placeholder="매물 설명을 입력하세요" style="width:100%;resize:vertical;"></textarea>
                </div>
                <div class="form-group" style="margin-top:12px;">
                    <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray-700);cursor:pointer;">
                        <input type="checkbox" id="fFeatured"> Featured (메인 노출)
                    </label>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-outline btn-sm" id="btnCancel">취소</button>
                    <button class="btn btn-accent btn-sm" id="btnSave"><i class="fa-solid fa-check"></i> 저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260829z"></script>
<script src="../assets/data/areas-data.js?v=20260411"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    AdminGuard.watchForm('#formPanel');

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    // Populate area select
    function loadAreaOptions() {
        const areas = (typeof MOCK!=='undefined'&&MOCK.areas)?MOCK.areas:DataService.getAll('areas');
        const sel = document.getElementById('fAreaId');
        sel.innerHTML = '<option value="">-- 구역 선택 --</option>' + areas.map(a => '<option value="' + a.id + '">' + a.name + '</option>').join('');
    }
    loadAreaOptions();

    const statusMap = {
        '매물': 'status-active',
        '거래완료': 'status-completed',
        '비공개': 'status-inactive'
    };

    function render(keyword='') {
        const items = DataService.getAll('listings');
        const filtered = keyword ? items.filter(a => a.areaName.includes(keyword)) : items;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = filtered.map(a => `
            <tr>
                <td>${a.id}</td>
                <td class="name">${a.areaName}</td>
                <td>${a.type}</td>
                <td>${a.district}</td>
                <td>${a.priceText}</td>
                <td><span class="status ${statusMap[a.status]||'status-inactive'}">${a.status}</span></td>
                <td>
                    <label class="toggle">
                        <input type="checkbox" ${a.featured?'checked':''} onchange="toggleFeatured('${a.id}', this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </td>
                <td class="actions">
                    <button title="수정" onclick="editItem('${a.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="danger" title="삭제" onclick="deleteItem('${a.id}','${a.areaName}')"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.toggleFeatured = function(id, val) {
        DataService.update('listings', id, { featured: val });
        toast(val ? '메인 노출 활성화' : '메인 노출 비활성화', 'success');
    };

    window.deleteItem = function(id, name) {
        if (!confirm(`"${name}" 매물을 삭제하시겠습니까?`)) return;
        DataService.remove('listings', id);
        render(document.getElementById('searchInput').value);
        toast('삭제되었습니다.', 'success');
    };

    window.editItem = function(id) {
        const a = DataService.getById('listings', id);
        if (!a) return;
        document.getElementById('formTitle').textContent = '매물 수정';
        document.getElementById('editId').value = id;
        document.getElementById('fAreaId').value = a.areaId || '';
        document.getElementById('fType').value = a.type || '입주권';
        document.getElementById('fDistrict').value = a.district || '';
        document.getElementById('fPrice').value = a.price || '';
        document.getElementById('fPriceText').value = a.priceText || '';
        document.getElementById('fSize').value = a.size || '';
        document.getElementById('fSizeType').value = a.sizeType || '';
        document.getElementById('fPremium').value = a.premium || '';
        document.getElementById('fTags').value = (a.tags||[]).join(',');
        document.getElementById('fStatus').value = a.status || '매물';
        document.getElementById('fDescription').value = a.description || '';
        document.getElementById('fFeatured').checked = !!a.featured;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('btnNew').addEventListener('click', () => {
        document.getElementById('formTitle').textContent = '매물 등록';
        document.getElementById('editId').value = '';
        document.querySelectorAll('#formPanel input:not([type=hidden]):not([type=checkbox]), #formPanel textarea').forEach(el => el.value = '');
        document.querySelectorAll('#formPanel select').forEach(el => el.selectedIndex = 0);
        document.getElementById('fFeatured').checked = false;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('formPanel').style.display = 'none';
    });

    document.getElementById('btnSave').addEventListener('click', () => {
        const areaId = document.getElementById('fAreaId').value;
        const priceText = document.getElementById('fPriceText').value.trim();
        if (!areaId) { toast('구역을 선택하세요.', 'error'); return; }
        if (!priceText) { toast('가격 표시를 입력하세요.', 'error'); return; }

        const area = DataService.getById('areas', areaId);
        const data = {
            areaId,
            areaName: area ? area.name : '',
            type: document.getElementById('fType').value,
            district: document.getElementById('fDistrict').value.trim(),
            price: Number(document.getElementById('fPrice').value) || 0,
            priceText,
            size: Number(document.getElementById('fSize').value) || 0,
            sizeType: document.getElementById('fSizeType').value.trim(),
            premium: Number(document.getElementById('fPremium').value) || 0,
            tags: document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
            status: document.getElementById('fStatus').value,
            description: document.getElementById('fDescription').value.trim(),
            featured: document.getElementById('fFeatured').checked
        };
        const editId = document.getElementById('editId').value;
        if (editId) {
            DataService.update('listings', editId, data);
            toast('매물이 수정되었습니다.', 'success');
        } else {
            data.id = DataService._genId('l');
            data.createdAt = new Date().toISOString().slice(0,10);
            DataService.create('listings', data);
            toast('매물이 등록되었습니다.', 'success');
        }
        AdminGuard.markClean();
        document.getElementById('formPanel').style.display = 'none';
        render(document.getElementById('searchInput').value);
    });

    document.getElementById('searchInput').addEventListener('input', function() {
        render(this.value.trim());
    });

    render();
})();
</script>
</body>
</html>
