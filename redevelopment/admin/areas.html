    <div class="admin-main">
        <div class="admin-topbar">
            <div class="admin-topbar-left">
                <button class="admin-mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
                <h2>구역 관리</h2>
            </div>
            <div class="admin-topbar-right">
                <div class="admin-user"><span>안녕하세요, <strong id="adminName"></strong>님</span></div>
                <button class="btn btn-sm btn-outline" id="adminLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
            </div>
        </div>

        <div class="admin-content">
            <!-- Table Header -->
            <div class="admin-table-header">
                <h3>구역 목록</h3>
                <div class="admin-table-actions">
                    <div class="admin-search">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="구역명 검색...">
                    </div>
                    <button class="btn btn-accent btn-sm" id="btnNew"><i class="fa-solid fa-plus"></i> 신규 등록</button>
                </div>
            </div>

            <!-- Table -->
            <div class="admin-tbl-wrap">
                <table class="admin-tbl">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>구역명</th>
                            <th>유형</th>
                            <th>지역</th>
                            <th>사업단계</th>
                            <th>프리미엄</th>
                            <th>비례율</th>
                            <th>노출</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Form Panel -->
            <div class="admin-form-panel" id="formPanel" style="display:none; margin-top:24px;">
                <h3 id="formTitle">구역 등록</h3>
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">구역명 *</label>
                        <input type="text" id="fName" class="form-control" placeholder="예: 한남3구역">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">유형 *</label>
                        <select id="fType" class="form-control">
                            <option value="재개발">재개발</option>
                            <option value="재건축">재건축</option>
                            <option value="도시정비">도시정비</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">구</label>
                        <input type="text" id="fDistrict" class="form-control" placeholder="예: 용산구">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">동</label>
                        <input type="text" id="fDong" class="form-control" placeholder="예: 한남동">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">사업단계 *</label>
                        <select id="fStage" class="form-control">
                            <option value="정비구역지정">정비구역지정</option>
                            <option value="조합설립인가">조합설립인가</option>
                            <option value="사업시행인가">사업시행인가</option>
                            <option value="관리처분인가">관리처분인가</option>
                            <option value="착공">착공</option>
                            <option value="입주예정">입주예정</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">프리미엄 (만원/3.3㎡)</label>
                        <input type="number" id="fPremium" class="form-control" placeholder="예: 5800">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">변동 (만원)</label>
                        <input type="number" id="fChange" class="form-control" placeholder="예: 200">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">비례율 (%)</label>
                        <input type="number" id="fRatio" class="form-control" placeholder="예: 112">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">총세대수</label>
                        <input type="number" id="fHouseholds" class="form-control" placeholder="예: 5200">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">총면적 (㎡)</label>
                        <input type="number" id="fArea" class="form-control" placeholder="예: 128000">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">시공사</label>
                        <input type="text" id="fDeveloper" class="form-control" placeholder="예: 현대건설">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">태그 (쉼표 구분)</label>
                        <input type="text" id="fTags" class="form-control" placeholder="예: 한강뷰,역세권">
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">설명</label>
                    <textarea id="fDescription" class="form-control" rows="3" placeholder="구역 설명을 입력하세요" style="width:100%;resize:vertical;"></textarea>
                </div>
                <div class="form-group" style="margin-top:12px;">
                    <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray-700);cursor:pointer;">
                        <input type="checkbox" id="fFeatured"> Featured (메인 노출)
                    </label>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-outline btn-sm" id="btnCancel">취소</button>
                    <button class="btn btn-accent btn-sm" id="btnSave"><i class="fa-solid fa-check"></i> 저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260419f"></script>
<script src="../assets/data/areas-data.js?v=20260411"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    AdminGuard.watchForm('#formPanel');

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    const stageMap = {
        '정비구역지정': 'status-pending',
        '조합설립인가': 'status-pending',
        '사업시행인가': 'status-active',
        '관리처분인가': 'status-completed',
        '착공': 'status-active',
        '입주예정': 'status-completed'
    };

    function render(keyword='') {
        const items = (typeof MOCK!=='undefined'&&MOCK.areas)?MOCK.areas:DataService.getAll('areas');
        const filtered = keyword ? items.filter(a => a.name.includes(keyword)) : items;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = filtered.map(a => `
            <tr>
                <td>${a.id}</td>
                <td class="name">${a.name}</td>
                <td>${a.type}</td>
                <td>${a.district} ${a.dong||''}</td>
                <td><span class="status ${stageMap[a.stage]||'status-inactive'}">${a.stage}</span></td>
                <td>${a.premium ? a.premium.toLocaleString()+'만' : '-'}</td>
                <td>${a.ratio ? a.ratio+'%' : '-'}</td>
                <td>
                    <label class="toggle">
                        <input type="checkbox" ${a.featured?'checked':''} onchange="toggleFeatured('${a.id}', this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </td>
                <td class="actions">
                    <button title="수정" onclick="editItem('${a.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="danger" title="삭제" onclick="deleteItem('${a.id}','${a.name}')"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.toggleFeatured = function(id, val) {
        DataService.update('areas', id, { featured: val });
        toast(val ? '메인 노출 활성화' : '메인 노출 비활성화', 'success');
    };

    window.deleteItem = function(id, name) {
        if (!confirm(`"${name}" 구역을 삭제하시겠습니까?`)) return;
        DataService.remove('areas', id);
        render(document.getElementById('searchInput').value);
        toast('삭제되었습니다.', 'success');
    };

    window.editItem = function(id) {
        const a = DataService.getById('areas', id);
        if (!a) return;
        document.getElementById('formTitle').textContent = '구역 수정';
        document.getElementById('editId').value = id;
        document.getElementById('fName').value = a.name || '';
        document.getElementById('fType').value = a.type || '재개발';
        document.getElementById('fDistrict').value = a.district || '';
        document.getElementById('fDong').value = a.dong || '';
        document.getElementById('fStage').value = a.stage || '정비구역지정';
        document.getElementById('fPremium').value = a.premium || '';
        document.getElementById('fChange').value = a.change || '';
        document.getElementById('fRatio').value = a.ratio || '';
        document.getElementById('fHouseholds').value = a.totalHouseholds || '';
        document.getElementById('fArea').value = a.totalArea || '';
        document.getElementById('fDeveloper').value = a.developer || '';
        document.getElementById('fTags').value = (a.tags||[]).join(',');
        document.getElementById('fDescription').value = a.description || '';
        document.getElementById('fFeatured').checked = !!a.featured;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('btnNew').addEventListener('click', () => {
        document.getElementById('formTitle').textContent = '구역 등록';
        document.getElementById('editId').value = '';
        document.querySelectorAll('#formPanel input:not([type=hidden]):not([type=checkbox]), #formPanel textarea').forEach(el => el.value = '');
        document.querySelectorAll('#formPanel select').forEach(el => el.selectedIndex = 0);
        document.getElementById('fFeatured').checked = false;
        document.getElementById('formPanel').style.display = 'block';
        document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('formPanel').style.display = 'none';
    });

    document.getElementById('btnSave').addEventListener('click', () => {
        const name = document.getElementById('fName').value.trim();
        if (!name) { toast('구역명을 입력하세요.', 'error'); return; }
        const data = {
            name,
            type: document.getElementById('fType').value,
            district: document.getElementById('fDistrict').value.trim(),
            dong: document.getElementById('fDong').value.trim(),
            stage: document.getElementById('fStage').value,
            premium: Number(document.getElementById('fPremium').value) || 0,
            change: Number(document.getElementById('fChange').value) || 0,
            changeDir: Number(document.getElementById('fChange').value) > 0 ? 'up' : Number(document.getElementById('fChange').value) < 0 ? 'down' : 'flat',
            ratio: Number(document.getElementById('fRatio').value) || 0,
            totalHouseholds: Number(document.getElementById('fHouseholds').value) || 0,
            totalArea: Number(document.getElementById('fArea').value) || 0,
            developer: document.getElementById('fDeveloper').value.trim(),
            tags: document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
            description: document.getElementById('fDescription').value.trim(),
            featured: document.getElementById('fFeatured').checked
        };
        const editId = document.getElementById('editId').value;
        if (editId) {
            DataService.update('areas', editId, data);
            toast('구역이 수정되었습니다.', 'success');
        } else {
            data.id = DataService._genId('a');
            DataService.create('areas', data);
            toast('구역이 등록되었습니다.', 'success');
        }
        AdminGuard.markClean();
        document.getElementById('formPanel').style.display = 'none';
        render(document.getElementById('searchInput').value);
    });

    document.getElementById('searchInput').addEventListener('input', function() {
        render(this.value.trim());
    });

    render();
})();
</script>
</body>
