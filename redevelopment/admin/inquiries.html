    <div class="admin-main">
        <div class="admin-topbar">
            <div class="admin-topbar-left">
                <button class="admin-mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
                <h2>문의 관리</h2>
            </div>
            <div class="admin-topbar-right">
                <div class="admin-user"><span>안녕하세요, <strong id="adminName"></strong>님</span></div>
                <button class="btn btn-sm btn-outline" id="adminLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
            </div>
        </div>

        <div class="admin-content">
            <!-- Table Header -->
            <div class="admin-table-header">
                <h3>문의 목록</h3>
                <div class="admin-table-actions">
                    <div class="admin-search" style="display:flex;align-items:center;gap:8px;">
                        <select id="statusFilter" class="form-control" style="width:auto;padding:6px 12px;font-size:13px;">
                            <option value="">전체</option>
                            <option value="접수">접수</option>
                            <option value="처리중">처리중</option>
                            <option value="답변완료">답변완료</option>
                        </select>
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="제목 검색...">
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="admin-tbl-wrap">
                <table class="admin-tbl">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>제목</th>
                            <th>이름</th>
                            <th>유형</th>
                            <th>상태</th>
                            <th>날짜</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Detail / Answer Panel -->
            <div class="admin-form-panel" id="detailPanel" style="display:none; margin-top:24px;">
                <h3 id="detailTitle">문의 상세</h3>
                <input type="hidden" id="editId">
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
                    <div style="font-size:13px;"><strong>이름:</strong> <span id="detailName"></span></div>
                    <div style="font-size:13px;"><strong>이메일:</strong> <span id="detailEmail"></span></div>
                    <div style="font-size:13px;"><strong>전화:</strong> <span id="detailPhone"></span></div>
                    <div style="font-size:13px;"><strong>유형:</strong> <span id="detailType"></span></div>
                    <div style="font-size:13px;"><strong>날짜:</strong> <span id="detailDate"></span></div>
                    <div style="font-size:13px;"><strong>상태:</strong> <span id="detailStatus"></span></div>
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">문의 내용</label>
                    <div id="detailContent" style="padding:16px;background:var(--gray-50);border-radius:8px;font-size:14px;line-height:1.8;white-space:pre-wrap;"></div>
                </div>
                <div class="form-group">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">상태 변경</label>
                    <select id="fStatus" class="form-control" style="width:200px;">
                        <option value="접수">접수</option>
                        <option value="처리중">처리중</option>
                        <option value="답변완료">답변완료</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">답변</label>
                    <textarea id="fAnswer" class="form-control" rows="5" placeholder="답변을 입력하세요" style="width:100%;resize:vertical;"></textarea>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-outline btn-sm" id="btnCloseDetail">닫기</button>
                    <button class="btn btn-accent btn-sm" id="btnSaveAnswer"><i class="fa-solid fa-check"></i> 저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260420b"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    AdminGuard.watchForm('#detailPanel');

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    const statusMap = {
        '접수': 'status-pending',
        '처리중': 'status-active',
        '답변완료': 'status-completed'
    };

    // 실시간 API 데이터 로드
    var liveData = [];
    function loadLive() {
        fetch('/api/inquiries',{headers:{'x-admin-key':'admin123'}}).then(r=>r.json()).then(d=>{
            if(d.inquiries) { liveData=d.inquiries; render(); }
        }).catch(()=>{});
    }
    loadLive();

    function render() {
        const keyword = document.getElementById('searchInput').value.trim();
        const statusVal = document.getElementById('statusFilter').value;
        let items = liveData.length ? liveData : DataService.getAll('inquiries');
        if (statusVal) items = items.filter(a => a.status === statusVal);
        if (keyword) items = items.filter(a => (a.title||'').includes(keyword));
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = items.map(a => `
            <tr style="cursor:pointer;" onclick="viewItem('${a.id}')">
                <td>${a.id}</td>
                <td class="name">${a.title}</td>
                <td>${a.name}</td>
                <td>${a.type}</td>
                <td><span class="status ${statusMap[a.status]||'status-inactive'}">${a.status}</span></td>
                <td>${a.date}</td>
                <td class="actions">
                    <button title="상세보기" onclick="event.stopPropagation();viewItem('${a.id}')"><i class="fa-solid fa-eye"></i></button>
                    <button class="danger" title="삭제" onclick="event.stopPropagation();deleteItem('${a.id}','${a.title.replace(/'/g,"\\'")}')"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.viewItem = function(id) {
        const a = liveData.find(x=>x.id===id) || DataService.getById('inquiries', id);
        if (!a) return;
        document.getElementById('editId').value = id;
        document.getElementById('detailTitle').textContent = a.title;
        document.getElementById('detailName').textContent = a.name || '';
        document.getElementById('detailEmail').textContent = a.email || '';
        document.getElementById('detailPhone').textContent = a.phone || '';
        document.getElementById('detailType').textContent = a.type || '';
        document.getElementById('detailDate').textContent = a.date || '';
        document.getElementById('detailStatus').textContent = a.status || '';
        document.getElementById('detailContent').textContent = a.content || '';
        document.getElementById('fStatus').value = a.status || '접수';
        document.getElementById('fAnswer').value = a.answer || '';
        document.getElementById('detailPanel').style.display = 'block';
        document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
    };

    window.deleteItem = function(id, title) {
        if (!confirm(`"${title}" 문의를 삭제하시겠습니까?`)) return;
        DataService.remove('inquiries', id);
        render();
        document.getElementById('detailPanel').style.display = 'none';
        toast('삭제되었습니다.', 'success');
    };

    document.getElementById('btnCloseDetail').addEventListener('click', () => {
        document.getElementById('detailPanel').style.display = 'none';
    });

    document.getElementById('btnSaveAnswer').addEventListener('click', () => {
        const id = document.getElementById('editId').value;
        if (!id) return;
        const status = document.getElementById('fStatus').value;
        const answer = document.getElementById('fAnswer').value.trim();
        const data = { status, answer };
        if (status === '답변완료' && answer) {
            data.answeredAt = new Date().toISOString().slice(0,10);
        }
        DataService.update('inquiries', id, data);
        AdminGuard.markClean();
        document.getElementById('detailPanel').style.display = 'none';
        render();
        toast('문의가 업데이트되었습니다.', 'success');
    });

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);

    render();
})();
</script>
</body>
</html>
