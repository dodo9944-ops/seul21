<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260618d"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    const statusMap = {
        '활성': 'status-active',
        '휴면': 'status-pending',
        '탈퇴': 'status-inactive'
    };

    // 실시간 API 데이터 로드
    var liveMembers = [];
    fetch('/api/members',{headers:{'x-admin-key':'admin123'}}).then(r=>r.json()).then(d=>{
        if(d.members){liveMembers=d.members;render();}
    }).catch(()=>{});

    function render(keyword='') {
        const items = liveMembers.length ? liveMembers : DataService.getAll('members');
        const filtered = keyword ? items.filter(m => (m.name||'').includes(keyword) || (m.email||'').includes(keyword) || (m.phone||'').includes(keyword)) : items;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = filtered.map(m => `
            <tr>
                <td>${m.id}</td>
                <td class="name">${m.name}</td>
                <td>${m.email}</td>
                <td>${m.phone || '-'}</td>
                <td>${m.role === 'admin' ? '<span class="status status-active">관리자</span>' : '<span class="status status-pending">일반</span>'}</td>
                <td>${m.joinDate || '-'}</td>
                <td><span class="status ${statusMap[m.status]||'status-inactive'}">${m.status}</span></td>
                <td class="actions">
                    <select onchange="changeStatus('${m.id}', this.value)" style="padding:4px 8px;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;cursor:pointer;">
                        <option value="활성" ${m.status==='활성'?'selected':''}>활성</option>
                        <option value="휴면" ${m.status==='휴면'?'selected':''}>휴면</option>
                        <option value="탈퇴" ${m.status==='탈퇴'?'selected':''}>탈퇴</option>
                    </select>
                </td>
            </tr>
        `).join('');
    }

    window.changeStatus = function(id, status) {
        DataService.update('members', id, { status });
        render(document.getElementById('searchInput').value);
        toast('회원 상태가 "' + status + '"(으)로 변경되었습니다.', 'success');
    };

    document.getElementById('searchInput').addEventListener('input', function() {
        render(this.value.trim());
    });

    render();
})();
</script>
