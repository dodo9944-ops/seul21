<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림톡 관리 — 세울엔지니어링 관리자</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260509e">
    <style>
    .admin-wrap{display:flex;min-height:100vh;background:var(--gray-50)}
    .admin-sidebar{width:220px;background:#0A0F1C;color:#fff;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100}
    .admin-sidebar .logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
    .admin-sidebar .logo a{color:#fff;font-size:16px;font-weight:700;text-decoration:none}
    .admin-sidebar .logo span{display:block;font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
    .admin-nav{padding:16px 0}
    .admin-nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.7);font-size:13px;font-weight:500;transition:all .2s;text-decoration:none}
    .admin-nav a:hover,.admin-nav a.active{background:rgba(255,255,255,.08);color:#fff}
    .admin-nav a i{width:16px;text-align:center;font-size:13px}
    .admin-main{margin-left:220px;flex:1;padding:24px}
    .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .admin-title{font-size:22px;font-weight:800;color:var(--gray-900)}
    .admin-card{background:#fff;border-radius:12px;border:1px solid var(--gray-200);padding:24px;margin-bottom:20px}
    .admin-card h3{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--gray-100)}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
    .form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--gray-300);border-radius:8px;font-size:14px;color:var(--gray-900);outline:none;transition:border-color .2s;font-family:inherit}
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--gold)}
    .form-group textarea{height:120px;resize:vertical}
    .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-primary:hover{background:var(--gold);color:var(--navy)}
    .btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-secondary:hover{border-color:var(--gold);color:var(--gray-900)}
    .template-list{display:grid;gap:12px}
    .template-item{border:1px solid var(--gray-200);border-radius:8px;padding:16px;cursor:pointer;transition:all .2s}
    .template-item:hover{border-color:var(--gold);background:rgba(195,165,105,.04)}
    .template-item.selected{border-color:var(--gold);background:rgba(195,165,105,.08)}
    .template-item h4{font-size:14px;font-weight:700;color:var(--gray-900);margin-bottom:6px}
    .template-item p{font-size:13px;color:var(--gray-600);line-height:1.5}
    .send-log{display:grid;gap:8px}
    .log-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px}
    .log-item .status{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
    .log-item .status.success{background:#d1fae5;color:#065f46}
    .log-item .status.fail{background:#fee2e2;color:#991b1b}
    @media(max-width:768px){.admin-sidebar{transform:translateX(-100%)}.admin-main{margin-left:0}}
    </style>
</head>
<body>
<div class="admin-wrap">
    <aside class="admin-sidebar">
        <div class="logo">
            <a href="index.html"><i class="fa-solid fa-shield-halved"></i> 세울 관리자</a>
            <span>SEUL Admin Panel</span>
        </div>
        <nav class="admin-nav">
            <a href="index.html"><i class="fa-solid fa-gauge"></i> 대시보드</a>
            <a href="members.html"><i class="fa-solid fa-users"></i> 회원 관리</a>
            <a href="community.html"><i class="fa-solid fa-comments"></i> 커뮤니티</a>
            <a href="inquiries.html"><i class="fa-solid fa-envelope"></i> 문의 관리</a>
            <a href="news.html"><i class="fa-solid fa-newspaper"></i> 뉴스 관리</a>
            <a href="areas.html"><i class="fa-solid fa-map-location-dot"></i> 구역 관리</a>
            <a href="listings.html"><i class="fa-solid fa-building"></i> 매물 관리</a>
            <a href="columns.html"><i class="fa-solid fa-pen-nib"></i> 칼럼 관리</a>
            <a href="banners.html"><i class="fa-solid fa-image"></i> 배너 관리</a>
            <a href="schedule.html"><i class="fa-solid fa-calendar"></i> 일정 관리</a>
            <a href="alimtalk.html" class="active"><i class="fa-solid fa-bell"></i> 알림톡 관리</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> 사이트 설정</a>
            <a href="seo.html"><i class="fa-solid fa-magnifying-glass"></i> SEO 관리</a>
            <a href="menus.html"><i class="fa-solid fa-bars"></i> 메뉴 관리</a>
            <a href="send-report.html"><i class="fa-solid fa-paper-plane"></i> 보고 발송</a>
        </nav>
    </aside>
    <main class="admin-main">
        <div class="admin-header">
            <h1 class="admin-title">알림톡 관리</h1>
            <div style="display:flex;gap:8px">
                <button class="btn-secondary" onclick="location.href='../pages/contact.html'" ><i class="fa-solid fa-arrow-up-right-from-square"></i> 고객센터 보기</button>
            </div>
        </div>

        <div class="admin-card">
            <h3><i class="fa-solid fa-paper-plane" style="color:var(--gold)"></i> 알림톡 발송</h3>
            <div class="form-group">
                <label>발송 대상</label>
                <select id="targetType">
                    <option value="all">전체 회원</option>
                    <option value="member">특정 회원</option>
                    <option value="phone">전화번호 직접 입력</option>
                </select>
            </div>
            <div class="form-group" id="memberSelectWrap" style="display:none">
                <label>회원 선택</label>
                <select id="memberSelect"></select>
            </div>
            <div class="form-group" id="phoneInputWrap" style="display:none">
                <label>전화번호</label>
                <input type="text" id="phoneInput" placeholder="010-0000-0000">
            </div>
            <div class="form-group">
                <label>템플릿 선택</label>
                <select id="templateSelect" onchange="onTemplateChange()">
                    <option value="">-- 템플릿 선택 --</option>
                    <option value="welcome">회원가입 환영</option>
                    <option value="inquiry">문의 접수 안내</option>
                    <option value="reply">답변 완료 안내</option>
                    <option value="news">주요 뉴스 알림</option>
                    <option value="custom">직접 작성</option>
                </select>
            </div>
            <div class="form-group">
                <label>메시지 내용</label>
                <textarea id="msgContent" placeholder="메시지를 입력하세요..."></textarea>
            </div>
            <button class="btn-primary" onclick="sendAlimtalk()"><i class="fa-solid fa-paper-plane"></i> 발송</button>
        </div>

        <div class="admin-card">
            <h3><i class="fa-solid fa-list" style="color:var(--gold)"></i> 발송 기록</h3>
            <div class="send-log" id="sendLog">
                <div style="text-align:center;padding:40px;color:var(--gray-400)">
                    <i class="fa-solid fa-bell-slash" style="font-size:32px;margin-bottom:8px"></i>
                    <p>발송 기록이 없습니다</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../assets/data/mock-data.js?v=20260509x"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function(){
    // Auth check
    var u=sessionStorage.getItem('seul_admin');
    if(!u){location.href='login.html';return;}
    
    var members=[];
    var sendHistory=JSON.parse(localStorage.getItem('alimtalk_history')||'[]');
    
    function init(){
        loadMembers();
        renderHistory();
        document.getElementById('targetType').addEventListener('change',function(){
            var v=this.value;
            document.getElementById('memberSelectWrap').style.display=v==='member'?'':'none';
            document.getElementById('phoneInputWrap').style.display=v==='phone'?'':'none';
        });
    }
    
    function loadMembers(){
        if(typeof DataService!=='undefined'){
            members=DataService.getMembers()||[];
            var sel=document.getElementById('memberSelect');
            sel.innerHTML=members.map(function(m){
                return '<option value="'+m.phone+'">'+m.name+' ('+m.phone+')</option>';
            }).join('');
        }
    }
    
    function onTemplateChange(){
        var t=document.getElementById('templateSelect').value;
        var msg=document.getElementById('msgContent');
        var templates={
            welcome:'안녕하세요! 세울엔지니어링 회원가입을 환영합니다.\n\n정비사업 전문가와 함께하는 더 스마트한 재개발·재건축 정보를 받아보세요.\n\n세울엔지니어링 바로가기: https://seul21.com',
            inquiry:'고객님의 문의가 접수되었습니다.\n\n담당자가 확인 후 영업일 기준 1-2일 내 답변 드리겠습니다.\n\n문의 확인: https://seul21.com/pages/mypage.html',
            reply:'고객님의 문의에 답변이 등록되었습니다.\n\n마이페이지에서 확인하실 수 있습니다.\n\n답변 확인: https://seul21.com/pages/mypage.html',
            news:'[세울엔지니어링] 오늘의 정비사업 주요 뉴스\n\n최신 재개발·재건축 소식을 자료실에서 확인하세요.\n\n자료실: https://seul21.com/pages/library.html',
            custom:''
        };
        msg.value=templates[t]||'';
    }
    window.onTemplateChange=onTemplateChange;
    
    function sendAlimtalk(){
        var target=document.getElementById('targetType').value;
        var content=document.getElementById('msgContent').value.trim();
        if(!content){alert('메시지를 입력하세요.');return;}
        
        var recipients=[];
        if(target==='all'){
            recipients=members.map(function(m){return m.phone;});
        } else if(target==='member'){
            recipients=[document.getElementById('memberSelect').value];
        } else {
            recipients=[document.getElementById('phoneInput').value.trim()];
        }
        
        if(!recipients.length||!recipients[0]){alert('발송 대상을 선택하세요.');return;}
        
        // Telegram API를 통한 알림톡 발송 시뮬레이션
        var logItem={
            id:Date.now(),
            time:new Date().toLocaleString('ko-KR'),
            recipients:recipients.length,
            content:content.substring(0,50)+'...',
            status:'success'
        };
        
        sendHistory.unshift(logItem);
        localStorage.setItem('alimtalk_history',JSON.stringify(sendHistory));
        renderHistory();
        
        alert('알림톡 발송 완료!\n대상: '+recipients.length+'명');
        document.getElementById('msgContent').value='';
    }
    window.sendAlimtalk=sendAlimtalk;
    
    function renderHistory(){
        var log=document.getElementById('sendLog');
        if(!sendHistory.length){
            log.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-400)"><i class="fa-solid fa-bell-slash" style="font-size:32px;margin-bottom:8px"></i><p>발송 기록이 없습니다</p></div>';
            return;
        }
        log.innerHTML=sendHistory.slice(0,20).map(function(h){
            return '<div class="log-item"><span class="status '+h.status+'">'+(h.status==='success'?'성공':'실패')+'</span><span style="color:var(--gray-500);font-size:12px">'+h.time+'</span><span style="flex:1">'+h.content+'</span><span style="color:var(--gray-500)">'+h.recipients+'명</span></div>';
        }).join('');
    }
    
    init();
}());
</script>
</body>
</html>
