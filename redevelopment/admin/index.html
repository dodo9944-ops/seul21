<script src="../assets/data/mock-data.js?v=20260413"></script>
<script src="../assets/data/areas-data.js?v=20260411"></script>
<script src="../assets/js/data-service.js"></script>
<script>
(function() {
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName() || '관리자';
    document.getElementById('adminLogoutBtn').addEventListener('click', function() {
        DataService.adminLogout(); location.href = 'login.html';
    });

    // Sidebar toggle
    var sidebar = document.getElementById('adminSidebar');
    var overlay = document.getElementById('sidebarOverlay');
    document.getElementById('mobileToggle').addEventListener('click', function() {
        sidebar.classList.add('open'); overlay.classList.add('open');
    });
    overlay.addEventListener('click', function() {
        sidebar.classList.remove('open'); overlay.classList.remove('open');
    });

    // Deploy button
    document.getElementById('deployBtn').addEventListener('click', function() {
        var btn = this;
        if (!confirm('즉시 배포를 실행하시겠습니까?')) return;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 배포 중...';
        fetch('/api/deploy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: '관리자 수동 배포' })
        }).then(function(r) { return r.json(); })
        .then(function(d) {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> 완료';
            btn.style.background = '#059669';
            setTimeout(function() {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-rocket"></i> <span>즉시 배포</span>';
                btn.style.background = '';
            }, 3000);
        }).catch(function() {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-rocket"></i> <span>즉시 배포</span>';
            alert('배포 요청 실패');
        });
    });

    // KPI
    var stats = DataService.getDashboardStats();
    document.getElementById('kpiMembers').textContent = stats.totalMembers.toLocaleString();
    document.getElementById('kpiPending').textContent = stats.pendingInquiries.toLocaleString();

    var communityCount = 0;
    try { communityCount = DataService.getAll('community').length; } catch(e) {}
    document.getElementById('kpiCommunity').textContent = communityCount;

    var libCount = 0;
    try { libCount = (MOCK && MOCK.library) ? MOCK.library.length : 0; } catch(e) {}
    document.getElementById('kpiLibrary').textContent = libCount;

    var pendingBadge = document.getElementById('pendingCount');
    if (stats.pendingInquiries > 0) pendingBadge.textContent = stats.pendingInquiries;

    // Recent Inquiries
    var inquiries = DataService.getAll('inquiries');
    var iqEl = document.getElementById('recentInquiries');
    if (inquiries.length === 0) {
        iqEl.innerHTML = '<p style="font-size:13px;color:var(--gray-400);text-align:center;padding:16px 0">문의가 없습니다.</p>';
    } else {
        var iqHtml = '';
        inquiries.sort(function(a,b){return(b.date||'').localeCompare(a.date||'')});
        inquiries.slice(0,4).forEach(function(iq) {
            var statusCls = iq.status === '답변완료' ? 'completed' : iq.status === '처리중' ? 'active' : 'pending';
            var statusLabel = iq.status || '접수';
            iqHtml += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100)">' +
                '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (iq.title||iq.type||'문의') + '</div>' +
                '<div style="font-size:11px;color:var(--gray-400)">' + (iq.name||'') + ' · ' + (iq.date||'').slice(0,10) + '</div></div>' +
                '<span class="status status-' + statusCls + '" style="flex-shrink:0;margin-left:8px">' + statusLabel + '</span></div>';
        });
        iqEl.innerHTML = iqHtml;
    }

    // Recent Community
    var community = DataService.getAll('community');
    var cmEl = document.getElementById('recentCommunity');
    if (community.length === 0) {
        cmEl.innerHTML = '<p style="font-size:13px;color:var(--gray-400);text-align:center;padding:16px 0">게시글이 없습니다.</p>';
    } else {
        var cmHtml = '';
        community.sort(function(a,b){return(b.date||'').localeCompare(a.date||'')});
        community.slice(0,4).forEach(function(c) {
            cmHtml += '<div style="padding:10px 0;border-bottom:1px solid var(--gray-100)">' +
                '<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (c.title||'제목 없음') + '</div>' +
                '<div style="font-size:11px;color:var(--gray-400)">' + (c.author||'') + ' · ' + (c.date||'').slice(0,10) + ' · ' + (c.category||'') + '</div></div>';
        });
        cmEl.innerHTML = cmHtml;
    }
})();
</script>
