<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260829l"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    // GNB menu items (from common.js?v=20260829i
    const gnbMenus = [
        { order: 1, name: '구역 정보', url: '/pages/areas.html', active: true },
        { order: 2, name: '매물 정보', url: '/pages/listings.html', active: true },
        { order: 3, name: '뉴스', url: '/pages/news.html', active: true },
        { order: 4, name: '칼럼', url: '/pages/columns.html', active: true },
        { order: 5, name: '커뮤니티', url: '/pages/community.html', active: true },
        { order: 6, name: '비례율 계산기', url: '/pages/calculator.html', active: true },
        { order: 7, name: '법률·세금', url: '/pages/legal-guide.html', active: true },
        { order: 8, name: '상담 문의', url: '/pages/contact.html', active: true }
    ];

    const footerMenus = [
        { order: 1, name: '회사 소개', url: '#', active: true },
        { order: 2, name: '이용약관', url: '#', active: true },
        { order: 3, name: '개인정보처리방침', url: '#', active: true },
        { order: 4, name: '구역 정보', url: '/pages/areas.html', active: true },
        { order: 5, name: '매물 정보', url: '/pages/listings.html', active: true },
        { order: 6, name: '뉴스', url: '/pages/news.html', active: true },
        { order: 7, name: '상담 문의', url: '/pages/contact.html', active: true }
    ];

    function renderTable(items, tbodyId) {
        const tbody = document.getElementById(tbodyId);
        tbody.innerHTML = items.map(m => `
            <tr>
                <td>
                    <input type="number" value="${m.order}" min="1" style="width:60px;padding:4px 8px;border:1px solid var(--gray-300);border-radius:6px;text-align:center;" readonly>
                </td>
                <td class="name">${m.name}</td>
                <td><code style="background:var(--gray-100);padding:2px 8px;border-radius:4px;font-size:12px;">${m.url}</code></td>
                <td>
                    <label class="toggle">
                        <input type="checkbox" ${m.active?'checked':''} disabled>
                        <span class="toggle-slider"></span>
                    </label>
                </td>
            </tr>
        `).join('');
    }

    renderTable(gnbMenus, 'gnbBody');
    renderTable(footerMenus, 'footerBody');
})();
</script>
