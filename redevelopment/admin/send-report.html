<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>처리보고 발송 — 세울엔지니어링</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f6f8;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:16px;padding:40px;max-width:600px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
h1{font-size:20px;font-weight:800;color:#0A0F1C;margin-bottom:8px}
.sub{font-size:13px;color:#888;margin-bottom:24px}
.report{background:#f8f9fa;border:1px solid #e5e7eb;border-radius:10px;padding:16px;font-size:12.5px;color:#444;line-height:1.8;max-height:400px;overflow-y:auto;margin-bottom:24px;white-space:pre-line}
.btn{width:100%;padding:14px;background:#0A0F1C;color:#C3A569;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn:hover{background:#142644}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.result{margin-top:16px;padding:12px;border-radius:8px;font-size:13px;font-weight:600;display:none}
.result.ok{display:block;background:rgba(30,140,94,0.08);color:#1E8C5E}
.result.err{display:block;background:rgba(214,66,58,0.08);color:#D6423A}
</style>
</head>
<body>
<div class="card">
    <h1>텔레그램 처리보고 발송</h1>
    <div class="sub">아래 내용이 텔레그램으로 전송됩니다.</div>
    <div class="report" id="preview"></div>
    <button class="btn" id="sendBtn" onclick="sendReport()">텔레그램 발송</button>
    <div class="result" id="result"></div>
</div>
<script>
var reportText = '\ud83d\udccb <b>[\uc138\uc6b8\uc5d4\uc9c0\ub2c8\uc5b4\ub9c1 \u2014 \ud648\ud398\uc774\uc9c0 \uc5c5\ub370\uc774\ud2b8 \ubcf4\uace0]</b>\n' +
'\ud83d\udcc5 2026\ub144 4\uc6d4 11\uc77c\n\n' +
'\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\n' +
'<b>1. \ub0b4 \uc704\uce58 \ud30c\uc545 \ud398\uc774\uc9c0 \uc2e0\uc124</b>\n' +
'\u2022 Leaflet.js + OpenStreetMap \uc778\ud130\ub799\ud2f0\ube0c \uc9c0\ub3c4\n' +
'\u2022 GPS \ud604\uc7ac \uc704\uce58 \uac10\uc9c0 + 10\uac1c \uad6c\uc5ed \ub9c8\ucee4 + \uac70\ub9ac\uc21c \uc815\ub82c\n' +
'\ud83d\udd17 https://seul21.com/pages/location.html\n\n' +
'<b>2. \uc790\ub8cc\uc2e4 \ud22c\uc790\uc815\ubcf4 \uce74\ud14c\uace0\ub9ac \uc2e0\uc124</b>\n' +
'\u2022 \ud22c\uc790\uc815\ubcf4 \ud0ed + \uac00\ub77d\ud604\ub3005\ucc28 \ub124\uc774\ubc84\ubd80\ub3d9\uc0b0 \ub9e4\ubb3c \uc0c1\uc138\ud398\uc774\uc9c0\n' +
'\u2022 \ub9e4\ub9e4 6\uac74 / \uc804\uc138 4\uac74 / \uc2e4\uac70\ub798\uac00 / \uc785\uc9c0\ubd84\uc11d / \ud22c\uc790\ud3ec\uc778\ud2b8\n' +
'\ud83d\udd17 https://seul21.com/pages/library.html?cat=\ud22c\uc790\uc815\ubcf4\n\n' +
'<b>3. \ud22c\uc790\uc815\ubcf4 \ud68c\uc6d0\uc804\uc6a9 \ucc98\ub9ac</b>\n' +
'\u2022 \ube44\ub85c\uadf8\uc778 \u2192 \ub85c\uadf8\uc778 \ud398\uc774\uc9c0 \uc774\ub3d9\n' +
'\u2022 \ub85c\uadf8\uc778 \uc0c1\ud0dc \u2192 \ud22c\uc790\uc815\ubcf4 \ud0ed \ud544\ud130\n' +
'\u2022 \ud68c\uc6d0\uc804\uc6a9 \uc7a0\uae08 \uc544\uc774\ucf58 \ud45c\uc2dc\n\n' +
'<b>4. \ud68c\uc0ac\uc18c\uac1c \uc0ac\uc5c5\ubd84\uc57c \uba54\ub274 \ud1b5\uc77c</b>\n' +
'\u2022 about.html \uce74\ub4dc\uba85+\ub9c1\ud06c \uba54\ub274 \uad6c\uc870\uc640 \ub3d9\uc77c\ud558\uac8c \ubcc0\uacbd\n' +
'\u2022 \uac01 \uce74\ub4dc \ud074\ub9ad \u2192 \ud574\ub2f9 \uc11c\ube44\uc2a4 \uc0c1\uc138 \ud398\uc774\uc9c0 \uc774\ub3d9\n\n' +
'<b>5. \uc0ac\uc5c5\ubd84\uc57c \ubc95\ub839\ubc84\ud2bc \uc0ad\uc81c</b>\n' +
'\u2022 6\uac1c \uce74\ub4dc \ud558\ub2e8 \ubc95\ub839 \ubc84\ud2bc \uc804\uccb4 \uc0ad\uc81c\n' +
'\u2022 Vercel CDN \uce90\uc2dc \ubb38\uc81c \ubc1c\uacac \u2192 \ub8e8\ud2b8 \uacbd\ub85c(/) \uce90\uc2dc \ud5e4\ub354 \ub204\ub77d \uc218\uc815\n' +
'\u2022 home.html \ub9ac\ub77c\uc774\ud2b8\ub85c CDN \uce90\uc2dc \uc644\uc804 \uc6b0\ud68c\n\n' +
'<b>6. \uc678\ubd80\uc790\uc0b0 \uc218\uc9d1\uae08\uc9c0 \uc815\ucc45 + \ud2b9\ubcc4\uaddc\uc815 \uc2e0\uc124</b>\n' +
'\u2022 CLAUDE.md\uc5d0 \uc678\ubd80 URL \ub2e4\uc6b4\ub85c\ub4dc \uae08\uc9c0 \uc815\ucc45 \ucd94\uac00\n' +
'\u2022 \uc0ad\uc81c\u00b7\ubcc0\uacbd \uc791\uc5c5 1\ud68c \uc644\uacb0 \uc758\ubb34 \ud2b9\ubcc4\uaddc\uc815 \uc2e0\uc124\n\n' +
'<b>7. \ubc84\uadf8 \ubc1c\uacac \ubc0f \uc218\uc815</b>\n' +
'\u2022 \ud22c\uc790\uc815\ubcf4 \ud074\ub9ad \uacbd\ub85c \uc624\ub958 (register \u2192 login)\n' +
'\u2022 vercel.json \ub8e8\ud2b8 \uacbd\ub85c(/) \uce90\uc2dc \ud5e4\ub354 \ub204\ub77d \ubc1c\uacac \u2192 \uc218\uc815\n\n' +
'\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n' +
'\u2705 \uac80\uc218 \uc804\ud56d\ubaa9 \ud1b5\uacfc\n' +
'\ud83d\udd27 \ubc84\uadf8\uc218\uc815 2\uac74\n' +
'\ud83d\ude80 master \ubc30\ud3ec \uc644\ub8cc\n' +
'\ud83c\udf10 https://seul21.com';

document.getElementById('preview').textContent = reportText.replace(/<\/?b>/g,'').replace(/\u2022/g, '  •');

function sendReport() {
    var btn = document.getElementById('sendBtn');
    var result = document.getElementById('result');
    btn.disabled = true;
    btn.textContent = '발송 중...';
    result.className = 'result';

    fetch('/api/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: reportText })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.ok) {
            result.className = 'result ok';
            result.textContent = '텔레그램 발송 완료!';
        } else {
            result.className = 'result err';
            result.textContent = '발송 실패: ' + (data.error || JSON.stringify(data));
        }
        btn.textContent = '발송 완료';
    })
    .catch(function(e) {
        result.className = 'result err';
        result.textContent = '네트워크 오류: ' + e.message;
        btn.disabled = false;
        btn.textContent = '다시 시도';
    });
}
</script>
</body>
</html>
