<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=20260823b"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    const categoryMap = {
        '질문': 'status-pending',
        '정보': 'status-active',
        '후기': 'status-completed',
        '분석': 'status-active',
        '칼럼': 'status-inactive'
    };

    // 실시간 API 데이터 로드
    var livePosts = [];
    fetch('/api/community').then(r=>r.json()).then(d=>{
        if(d.posts){livePosts=d.posts;render();}
    }).catch(()=>{});

    function render(keyword='') {
        const items = livePosts.length ? livePosts : DataService.getAll('community');
        const filtered = keyword ? items.filter(a => (a.title||'').includes(keyword) || (a.author||'').includes(keyword)) : items;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = filtered.map(a => `
            <tr>
                <td>${a.id}</td>
                <td class="name">${a.title}</td>
                <td><span class="status ${categoryMap[a.category]||'status-inactive'}">${a.category}</span></td>
                <td>${a.author}</td>
                <td>${a.date}</td>
                <td>${(a.views||0).toLocaleString()}</td>
                <td>${a.comments||0}</td>
                <td class="actions">
                    <button title="보기" onclick="viewItem('${a.id}')"><i class="fa-solid fa-eye"></i></button>
                    <button class="danger" title="삭제" onclick="deleteItem('${a.id}','${a.title.replace(/'/g,"\\'")}')"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.viewItem = function(id) {
        const a = DataService.getById('community', id);
        if (!a) return;
        document.getElementById('detailTitle').textContent = a.title;
        document.getElementById('detailMeta').textContent = `${a.category} | ${a.author} | ${a.date} | 조회 ${a.views} | 댓글 ${a.comments} | 좋아요 ${a.likes||0}`;
        document.getElementById('detailContent').textContent = a.content || '';
        document.getElementById('detailPanel').style.display = 'block';
        document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
    };

    window.deleteItem = function(id, title) {
        if (!confirm(`"${title}" 게시글을 삭제하시겠습니까?`)) return;
        DataService.remove('community', id);
        render(document.getElementById('searchInput').value);
        document.getElementById('detailPanel').style.display = 'none';
        toast('삭제되었습니다.', 'success');
    };

    document.getElementById('btnCloseDetail').addEventListener('click', () => {
        document.getElementById('detailPanel').style.display = 'none';
    });

    document.getElementById('searchInput').addEventListener('input', function() {
        render(this.value.trim());
    });

    render();
})();
</script>
