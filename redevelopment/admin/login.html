<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 — (주)빛세움</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css?v=20260905s">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div class="admin-login-wrap">
    <div class="admin-login-box">
        <h1>빛세움</h1>
        <p class="subtitle">관리자 로그인</p>

        <form id="loginForm" autocomplete="off">
            <div class="form-group" style="margin-bottom:16px;">
                <label for="username" style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">아이디</label>
                <input type="text" id="username" placeholder="아이디를 입력하세요" autocomplete="username"
                       style="width:100%;height:46px;padding:0 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;color:var(--gray-900);outline:none;transition:border-color var(--transition);"
                       onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--gray-200)'">
            </div>
            <div class="form-group" style="margin-bottom:24px;">
                <label for="password" style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password"
                       style="width:100%;height:46px;padding:0 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;color:var(--gray-900);outline:none;transition:border-color var(--transition);"
                       onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--gray-200)'">
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:13px;">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--gray-600);">
                    <input type="checkbox" id="rememberMe" style="width:16px;height:16px;accent-color:var(--accent);"> 로그인 상태 유지
                </label>
            </div>

            <div id="loginError" style="display:none;background:#FDECEA;color:var(--red);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;text-align:center;">
                <i class="fa-solid fa-triangle-exclamation"></i> 아이디 또는 비밀번호가 올바르지 않습니다.
            </div>

            <button type="submit" class="btn btn-accent btn-lg" style="width:100%;">
                <i class="fa-solid fa-right-to-bracket"></i> 로그인
            </button>
        </form>

        <div style="text-align:center;margin-top:24px;">
            <a href="../index.html" style="font-size:13px;color:var(--gray-500);transition:color var(--transition);"
               onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--gray-500)'">
                <i class="fa-solid fa-arrow-left"></i> 퍼블릭 사이트로 돌아가기
            </a>
        </div>
    </div>
</div>

<script src="../assets/data/mock-data.js?v=20260905d"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // 이미 로그인 상태면 대시보드로 이동
    if (DataService.isAdminLoggedIn()) {
        location.href = 'index.html';
        return;
    }

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        errorEl.style.display = 'none';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            errorEl.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
            errorEl.style.display = 'block';
            return;
        }

        const remember = document.getElementById('rememberMe').checked;
        const success = DataService.adminLogin(username, password, remember);

        if (success) {
            location.href = 'index.html';
        } else {
            errorEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> 아이디 또는 비밀번호가 올바르지 않습니다.';
            errorEl.style.display = 'block';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    });
})();
</script>
</body>
</html>
