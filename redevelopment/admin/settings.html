    <div class="admin-main">

                <button class="admin-mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
                <h2>사이트 설정</h2>
            </div>
            <div class="admin-topbar-right">
                <div class="admin-user"><span>안녕하세요, <strong id="adminName"></strong>님</span></div>

            </div>
        </div>

        <div class="admin-content">
            <div class="admin-form-panel">
                <h3><i class="fa-solid fa-building"></i> 기본 정보</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">사이트명</label>
                        <input type="text" id="fSiteName" class="form-control" placeholder="사이트명">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">대표</label>
                        <input type="text" id="fCeo" class="form-control" placeholder="대표자명">
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">사이트 설명</label>
                    <input type="text" id="fSiteDescription" class="form-control" placeholder="사이트 설명">
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">키워드 (쉼표 구분)</label>
                    <input type="text" id="fSiteKeywords" class="form-control" placeholder="재개발,재건축,도시정비...">
                </div>
            </div>

            <div class="admin-form-panel" style="margin-top:24px;">
                <h3><i class="fa-solid fa-phone"></i> 연락처 정보</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">대표전화</label>
                        <input type="text" id="fContactPhone" class="form-control" placeholder="010-2230-9210">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">이메일</label>
                        <input type="email" id="fContactEmail" class="form-control" placeholder="info@example.com">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">사업자번호</label>
                        <input type="text" id="fBusinessNumber" class="form-control" placeholder="474-81-02756">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">영업시간</label>
                        <input type="text" id="fWorkingHours" class="form-control" placeholder="평일 09:00 – 18:00">
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">주소</label>
                    <input type="text" id="fAddress" class="form-control" placeholder="경기도 하남시 감일백제로 70, 204동 1104호">
                </div>
            </div>

            <div class="admin-form-panel" style="margin-top:24px;">
                <h3><i class="fa-solid fa-toggle-on"></i> 사이트 운영</h3>
                <div style="display:flex; gap:32px; flex-wrap:wrap;">
                    <div class="form-group">
                        <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray-700);cursor:pointer;">
                            <input type="checkbox" id="fMaintenanceMode"> 점검 모드 (사이트 점검 중 표시)
                        </label>
                    </div>
                    <div class="form-group">
                        <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray-700);cursor:pointer;">
                            <input type="checkbox" id="fPopupEnabled"> 팝업 활성화
                        </label>
                    </div>
                </div>
            </div>

            <div class="admin-form-panel" style="margin-top:24px;">
                <h3><i class="fa-solid fa-window-restore"></i> 팝업 설정</h3>

                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">팝업 제목</label>

                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">팝업 내용</label>
                    <textarea id="fPopupContent" class="form-control" rows="4" placeholder="팝업에 표시할 내용을 입력하세요" style="width:100%;resize:vertical;"></textarea>
                </div>
            </div>

            <div style="margin-top:24px; text-align:right;">

<div class="toast-container" id="toastContainer"></div>
<script src="../assets/data/mock-data.js?v=feat0614b"></script>
<script src="../assets/js/data-service.js?v=20260418q"></script>
<script>
(function() {
    // Auth check
    if (!DataService.isAdminLoggedIn()) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = DataService.getAdminName();
    document.getElementById('adminLogoutBtn').addEventListener('click', () => { DataService.adminLogout(); location.href = 'login.html'; });
    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    });

    AdminGuard.watchForm('.admin-content');

    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fa-solid fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    // Load settings
    function loadSettings() {
        const s = DataService.getSettings();
        document.getElementById('fSiteName').value = s.siteName || '';
        document.getElementById('fSiteDescription').value = s.siteDescription || '';
        document.getElementById('fSiteKeywords').value = s.siteKeywords || '';
        document.getElementById('fContactPhone').value = s.contactPhone || '';
        document.getElementById('fContactEmail').value = s.contactEmail || '';
        document.getElementById('fAddress').value = s.address || '';
        document.getElementById('fBusinessNumber').value = s.businessNumber || '';
        document.getElementById('fCeo').value = s.ceo || '';
        document.getElementById('fWorkingHours').value = s.workingHours || '';
        document.getElementById('fMaintenanceMode').checked = !!s.maintenanceMode;
        document.getElementById('fPopupEnabled').checked = !!s.popupEnabled;
        document.getElementById('fPopupTitle').value = s.popupTitle || '';
        document.getElementById('fPopupContent').value = s.popupContent || '';
    }

    document.getElementById('btnSave').addEventListener('click', () => {
        const data = {
            siteName: document.getElementById('fSiteName').value.trim(),
            siteDescription: document.getElementById('fSiteDescription').value.trim(),
            siteKeywords: document.getElementById('fSiteKeywords').value.trim(),
            contactPhone: document.getElementById('fContactPhone').value.trim(),
            contactEmail: document.getElementById('fContactEmail').value.trim(),
            address: document.getElementById('fAddress').value.trim(),
            businessNumber: document.getElementById('fBusinessNumber').value.trim(),
            ceo: document.getElementById('fCeo').value.trim(),
            workingHours: document.getElementById('fWorkingHours').value.trim(),
            maintenanceMode: document.getElementById('fMaintenanceMode').checked,
            popupEnabled: document.getElementById('fPopupEnabled').checked,
            popupTitle: document.getElementById('fPopupTitle').value.trim(),
            popupContent: document.getElementById('fPopupContent').value.trim()
        };
        DataService.updateSettings(data);
        AdminGuard.markClean();
        toast('설정이 저장되었습니다.', 'success');
    });

    loadSettings();
})();
</script>
</body>
